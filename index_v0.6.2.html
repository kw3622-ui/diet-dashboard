  <link rel="manifest" href="manifest.json">

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      -webkit-tap-highlight-color: transparent;

    }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-nav { padding-bottom: 148px; }
    /* v0.4.3 홈 루틴 칩: 체크하면 줄을 긋고 잠깐 보여 준 뒤 서서히 사라진다 */
    .rt-strike { position: relative; }
    .rt-strike::after { content: ''; position: absolute; left: 0; right: 0; top: 52%; height: 1.5px; background: currentColor; transform-origin: left; animation: rtStrike .25s ease-out both; }
    @keyframes rtStrike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .rt-chip { transition: opacity .3s ease, transform .3s ease, max-width .3s ease, padding .3s ease, margin .3s ease, background-color .2s ease; max-width: 22rem; }
    .rt-chip-fade { opacity: 0; transform: scale(.85); max-width: 0 !important; padding-left: 0 !important; padding-right: 0 !important; border-width: 0 !important; margin-right: -0.375rem; }
    /* 루틴 탭 줄: 줄 높이가 접히며 사라진다 */
    .rt-row { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease, opacity .3s ease; }
    .rt-row-inner { min-height: 0; overflow: hidden; }
    .rt-row-fade { grid-template-rows: 0fr; opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .rt-chip, .rt-progress, .rt-row { transition: none !important; }
      .rt-strike::after { animation: none; }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =====================================================================
    // ★ Supabase 설정 (구글 앱스스크립트 + 시트 + 드라이브를 대체)
    // =====================================================================
    const SUPABASE_URL = 'https://nppkwxwzbyhfwsmdudge.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wcGt3eHd6YnloZndzbWR1ZGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTQ4OTYsImV4cCI6MjEwMzgzMDg5Nn0.QhIoiK5G7jC_VU9hrVpXNVw3AD8NdlmVq-1jgkR5kh4';
    const FUNCTIONS_URL = SUPABASE_URL + '/functions/v1/diet-ai';
    const EMAIL_DOMAIN = '@dietapp.local'; // 계정명만으로 가입/로그인하기 위한 내부용 더미 이메일 도메인
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ★ v0.3.7 본인 섭취량 버튼. 서버(diet-ai_v0.0.12.ts)의 PORTION_SHARES와 같아야 한다.
    const PORTION_SHARES = [0.5, 1, 1.5, 2];
    const portionShareLabel = (share) => share === 0.5 ? '반 인분' : share >= 2 ? '2인분 이상' : `${share}인분`;

    // logs 테이블 행 -> 기존 화면 코드가 기대하는 모양으로 변환
    const mapLogRow = (row) => ({
      id: row.id,
      date: row.log_date,
      time: String(row.log_time || '').slice(0, 5),
      category: row.category,
      foodName: row.food_name,
      ingredients: row.ingredients || [],
      analysis: row.analysis,
      imageUrl: (row.image_urls || []).join(','),
      rawInput: JSON.stringify(row.raw_input || {}),
      isAlcohol: !!row.is_alcohol,
      followupQuestion: row.followup_question || null,
      followupAnswer: row.followup_answer || null,
      exerciseMeta: row.exercise_meta || row.exerciseMeta || null,
      portionCheck: row.portion_check || row.portionCheck || null,
      supplementInfo: row.supplement_info || row.supplementInfo || null,
      healthTags: (row.food_health_tags || row.healthTags || []).map(tag => ({
        foodIndex: tag.food_index ?? tag.foodIndex ?? 0,
        foodName: tag.food_name ?? tag.foodName ?? '',
        tagKey: tag.tag_key ?? tag.tagKey ?? '',
        tagLabel: tag.tag_label ?? tag.tagLabel ?? '',
        diseaseKey: tag.disease_key ?? tag.diseaseKey ?? 'general',
        polarity: tag.polarity || 'neutral',
        confidence: Number(tag.confidence ?? 0),
        evidence: tag.evidence || '',
      })),
    });

    // ★ v0.3.6 운동 부위 균형. 서버 diet-ai_v0.0.11.ts의 computeExerciseBalance와 같은 규칙:
    // 큰 부위는 최근 30일, 세부 부위 비중은 전체 기록, 최근 2일 안에 한 부위는 추천에서 제외.
    const EXERCISE_PARTS = [
      { key: 'chest', label: '가슴', subs: [['upper_chest', '윗가슴'], ['mid_chest', '중간가슴'], ['lower_chest', '밑가슴']] },
      { key: 'back', label: '등', subs: [['lat', '넓이'], ['mid_back', '두께'], ['lower_back', '허리']] },
      { key: 'shoulder', label: '어깨', subs: [['front_delt', '전면'], ['side_delt', '측면'], ['rear_delt', '후면']] },
      { key: 'arm', label: '팔', subs: [['biceps', '이두'], ['triceps', '삼두']] },
      { key: 'legs', label: '하체', subs: [['quads', '앞허벅지'], ['hamstrings', '뒷허벅지'], ['glutes', '엉덩이'], ['calves', '종아리']] },
      { key: 'core', label: '코어', subs: [['abs', '복부'], ['obliques', '옆구리']] },
    ];
    const RECOMMENDABLE_EXERCISE_PARTS = ['chest', 'back', 'shoulder', 'legs'];
    const EXERCISE_BALANCE_DAYS = 30;
    const EXERCISE_RECOVERY_DAYS = 2;
    const EXERCISE_CARDIO_DAYS_TARGET = 8;
    const EXERCISE_SUB_MIN_SESSIONS = 3;

    const computeExerciseBalance = (rows, referenceDate) => {
      const shift = (dateStr, delta) => { const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + delta); return formatDate(d); };
      const windowStart = shift(referenceDate, -(EXERCISE_BALANCE_DAYS - 1));
      const recoveryStart = shift(referenceDate, -EXERCISE_RECOVERY_DAYS);
      const parts = Object.fromEntries(EXERCISE_PARTS.map(p => [p.key, { dates: new Set(), last: null, recent: false, sessions: 0, subs: {} }]));
      const cardioDates = new Set();
      let cardioMinutes = 0, classifiedLogs = 0;

      rows.forEach(row => {
        const date = row.log_date;
        const inWindow = date >= windowStart && date <= referenceDate;
        const partsInLog = new Set();
        const subsInLog = {};
        let known = false;
        (row.exercise_meta?.items || []).forEach(item => {
          if (item?.kind === 'cardio') {
            known = true;
            if (inWindow) { cardioDates.add(date); if (Number(item.minutes) > 0) cardioMinutes += Number(item.minutes); }
          }
          (item?.targets || []).forEach(target => {
            const [part, sub] = String(target).split('.');
            if (!parts[part]) return;
            known = true;
            partsInLog.add(part);
            if (sub) (subsInLog[part] = subsInLog[part] || new Set()).add(sub);
          });
        });
        if (known) classifiedLogs += 1;
        partsInLog.forEach(part => {
          const p = parts[part];
          if (inWindow) p.dates.add(date);
          if (!p.last || date > p.last) p.last = date;
          if (date >= recoveryStart && date <= referenceDate) p.recent = true;
        });
        Object.entries(subsInLog).forEach(([part, subs]) => {
          const p = parts[part];
          p.sessions += 1;
          subs.forEach(sub => {
            const s = p.subs[sub] = p.subs[sub] || { count: 0, last: '' };
            s.count += 1;
            if (date > s.last) s.last = date;
          });
        });
      });

      const daysAgo = (date) => date ? Math.round((parseDate(referenceDate) - parseDate(date)) / 86400000) : null;
      const summary = EXERCISE_PARTS.map(def => {
        const p = parts[def.key];
        const subs = def.subs.map(([sub, label]) => ({ sub, label, count: p.subs[sub]?.count || 0, last: p.subs[sub]?.last || '' }));
        let lacking = null;
        if (p.sessions >= EXERCISE_SUB_MIN_SESSIONS) {
          const max = Math.max(...subs.map(s => s.count));
          lacking = subs
            .filter(s => s.count <= Math.floor(p.sessions * 0.2) && max - s.count >= 2)
            .sort((a, b) => a.count - b.count || a.last.localeCompare(b.last))[0] || null;
        }
        return { ...def, days: p.dates.size, lastDate: p.last, daysAgo: daysAgo(p.last), recent: p.recent, sessions: p.sessions, subs, lacking };
      });
      const recommendOrder = summary
        .filter(p => RECOMMENDABLE_EXERCISE_PARTS.includes(p.key) && !p.recent)
        .sort((a, b) => a.days - b.days || (a.lastDate || '').localeCompare(b.lastDate || ''));
      return {
        referenceDate, classifiedLogs, summary,
        recommended: recommendOrder[0] || null,
        cardioDays: cardioDates.size, cardioMinutes, cardioNeeded: cardioDates.size < EXERCISE_CARDIO_DAYS_TARGET,
      };
    };

    // ★ v0.5.0 운동 기록의 세트별 무게·횟수와 유산소 숫자(서버 diet-ai v0.0.21이 exercise_meta에 저장)를 종목마다 한 줄로 만든다.
    const formatExerciseSet = (s) => {
      const unit = s?.unit === 'lb' ? 'lb' : 'kg';
      const hasW = s?.weight != null, hasR = s?.reps != null, hasS = s?.seconds != null;
      if (hasW && hasR) return `${s.weight}${unit}×${s.reps}`;
      if (hasW && hasS) return `${s.weight}${unit}·${s.seconds}초`;
      if (hasW) return `${s.weight}${unit}`;
      if (hasR) return `${s.reps}회`;
      if (hasS) return `${s.seconds}초`;
      return '';
    };
    const formatPace = (sec) => `${Math.floor(sec / 60)}'${String(Math.round(sec % 60)).padStart(2, '0')}"/km`;
    const exerciseDetailLines = (meta) => (meta?.items || []).map(item => {
      const sets = (Array.isArray(item?.sets) ? item.sets : []).map(formatExerciseSet).filter(Boolean);
      const cardio = [
        item?.distanceKm != null ? `${item.distanceKm}km` : '',
        item?.paceSecPerKm != null ? formatPace(item.paceSecPerKm) : '',
        item?.avgHeartRate != null ? `${item.avgHeartRate}bpm` : '',
      ].filter(Boolean);
      if (cardio.length && item?.minutes != null) cardio.splice(1, 0, `${item.minutes}분`);
      return { name: item?.name || '', text: sets.length ? sets.join(' · ') : cardio.join(' · ') };
    }).filter(line => line.name && line.text);

    // ★ v0.5.1 운동 종목 사전(exercise_library_v1.json). 종목 이름을 누르면 설명을 보여준다.
    // 기록 이름의 ": 총 3세트", "26회", 띄어쓰기 차이는 무시하고 이름·별칭으로 찾는다.
    const EXERCISE_LIBRARY_URL = 'exercise_library_v1.json';
    const normalizeExerciseKey = (name) => String(name || '').split(':')[0].replace(/\(.*$/, '')
      .replace(/(\s*(총\s*)?\d+(\.\d+)?\s*(세트|회|kg|km|분)\s*(수행)?)+\s*$/, '')
      .toLowerCase().replace(/[\s·\-_]/g, '');
    const buildExerciseIndex = (library) => {
      const index = new Map();
      (library?.exercises || []).forEach(entry => [entry.name, ...(entry.aliases || [])].forEach(n => {
        const key = normalizeExerciseKey(n);
        if (key && !index.has(key)) index.set(key, entry);
      }));
      return index;
    };
    let exerciseLibraryPromise = null;
    const loadExerciseLibrary = () => {
      if (!exerciseLibraryPromise) {
        exerciseLibraryPromise = fetch(EXERCISE_LIBRARY_URL, { cache: 'no-cache' })
          .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
          .then(library => ({ library, index: buildExerciseIndex(library) }))
          .catch(() => { exerciseLibraryPromise = null; return null; }); // 사전을 못 불러와도 기록 화면은 그대로 보인다
      }
      return exerciseLibraryPromise;
    };
    const exerciseTargetLabels = (targets) => (targets || []).map(t => {
      const [part, sub] = String(t).split('.');
      const def = EXERCISE_PARTS.find(p => p.key === part);
      if (!def) return null;
      const subLabel = sub ? (def.subs.find(([k]) => k === sub) || [])[1] : null;
      return subLabel ? `${def.label} · ${subLabel}` : def.label;
    }).filter(Boolean);
    // 운동 카드의 종목 줄: 숫자가 있거나 사전 설명이 있는 종목만 보여준다.
    const exerciseCardLines = (meta, index) => {
      const numbers = new Map(exerciseDetailLines(meta).map(line => [line.name, line.text]));
      return (meta?.items || []).map(item => {
        const name = item?.name || '';
        const info = index ? (index.get(normalizeExerciseKey(name)) || null) : null;
        return { name, text: numbers.get(name) || '', info };
      }).filter(line => line.name && (line.text || line.info));
    };

    // ★ v0.5.2 장소 설정(profiles.workout_places): 장소마다 할 수 있는 근력 종목 키 목록과 집 장비.
    // 사전에 있는 종목은 사전 key, 없는 종목은 'custom:이름'으로 저장한다.
    const WORKOUT_PLACES = [
      { key: 'company', label: '회사', icon: '🏢' },
      { key: 'apartment', label: '아파트', icon: '🏘️' },
      { key: 'home', label: '집', icon: '🏠' },
    ];
    const HOME_EQUIPMENT_OPTIONS = [['pullup_bar', '문틀 철봉'], ['dumbbell', '덤벨'], ['band', '고무 밴드'], ['kettlebell', '케틀벨'], ['ab_wheel', '복근 롤러']];
    // ★ v0.5.3 기록에서 찾은 새 운동을 직접 추가할 때 고르는 장비(유산소 기구·도구 없음 제외)
    const CUSTOM_EQUIPMENT = ['barbell', 'dumbbell', 'machine', 'cable', 'smith', 'bodyweight', 'pullup_bar', 'band', 'kettlebell', 'parallel_bars', 'ab_wheel'];
    const MAX_CUSTOM_EXERCISES = 50;
    const isValidTarget = (t) => {
      const [part, sub] = String(t || '').split('.');
      const def = EXERCISE_PARTS.find(p => p.key === part);
      return !!def && !!sub && def.subs.some(([k]) => k === sub);
    };
    const PLACE_CHOICES = [['both', '둘 다'], ['company', '회사'], ['apartment', '아파트'], ['none', '안 함']];
    // 여러 운동을 묶은 이름은 종목이 아니다.
    const GENERIC_EXERCISE_KEYS = new Set(['근력운동', '웨이트트레이닝', '웨이트', '헬스', '운동', '근력', '근력훈련', '상체운동', '하체운동']);
    const MAX_PLACE_EXERCISES = 200;
    const REST_MIN_SEC = 30;
    const REST_MAX_SEC = 300;
    const emptyWorkoutPlaces = () => ({ version: 1, company: [], apartment: [], homeEquipment: [], setupDone: false });
    const sanitizeWorkoutPlaces = (raw) => {
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
      const keys = (v) => [...new Set((Array.isArray(v) ? v : []).filter(k => typeof k === 'string' && k.trim() && k.length <= 60))].slice(0, MAX_PLACE_EXERCISES);
      const homeEquipment = keys(raw.homeEquipment).filter(k => HOME_EQUIPMENT_OPTIONS.some(([o]) => o === k));
      const out = { version: 1, company: keys(raw.company), apartment: keys(raw.apartment), homeEquipment, setupDone: raw.setupDone === true };
      if (typeof raw.updatedAt === 'string') out.updatedAt = raw.updatedAt.slice(0, 40);
      // ★ v0.5.3 직접 추가한 종목 { 'custom:이름': {name, targets, equipment} }, '운동 아님'으로 숨긴 이름. 있을 때만 둔다.
      const custom = {};
      if (raw.customExercises && typeof raw.customExercises === 'object' && !Array.isArray(raw.customExercises)) {
        Object.entries(raw.customExercises).slice(0, MAX_CUSTOM_EXERCISES).forEach(([key, v]) => {
          if (!key.startsWith('custom:') || key.length > 60 || !v || typeof v !== 'object') return;
          const name = String(v.name || '').trim().slice(0, 40);
          if (!name) return;
          const targets = [...new Set((Array.isArray(v.targets) ? v.targets : []).filter(isValidTarget))].slice(0, 4);
          custom[key] = { name, targets, equipment: CUSTOM_EQUIPMENT.includes(v.equipment) ? v.equipment : 'bodyweight' };
        });
      }
      if (Object.keys(custom).length) out.customExercises = custom;
      // ★ v0.5.4 쉬는 시간 설정: 기본값(큰 종목·나머지)과 카운트다운 소리, 종목별로 정한 값. 있을 때만 둔다.
      const restSec = (v) => { const n = Math.round(Number(v)); return Number.isFinite(n) && n >= REST_MIN_SEC && n <= REST_MAX_SEC ? n : null; };
      if (raw.rest && typeof raw.rest === 'object' && !Array.isArray(raw.rest)) {
        const rest = {};
        if (restSec(raw.rest.big) != null) rest.big = restSec(raw.rest.big);
        if (restSec(raw.rest.small) != null) rest.small = restSec(raw.rest.small);
        if (raw.rest.sound === false) rest.sound = false;
        if (Object.keys(rest).length) out.rest = rest;
      }
      if (raw.restByKey && typeof raw.restByKey === 'object' && !Array.isArray(raw.restByKey)) {
        const byKey = {};
        Object.entries(raw.restByKey).slice(0, MAX_PLACE_EXERCISES).forEach(([k, v]) => { if (k.length <= 60 && restSec(v) != null) byKey[k] = restSec(v); });
        if (Object.keys(byKey).length) out.restByKey = byKey;
      }
      const ignored = keys(raw.ignored);
      if (ignored.length) out.ignored = ignored;
      return out;
    };
    // 직접 추가한 종목을 사전 항목 모양으로(설명·그림 없음).
    const customEntries = (places) => Object.entries(places?.customExercises || {}).map(([key, v]) => ({
      key, name: v.name, aliases: [], kind: 'strength', equipment: v.equipment, targets: v.targets, image: null, custom: true,
    }));
    const mergeCustomLibrary = (library, places) => library
      ? { ...library, exercises: [...(library.exercises || []), ...customEntries(places)] } : null;
    const customExerciseName = (name) => String(name || '').split(':')[0].replace(/\(.*$/, '')
      .replace(/(\s*(총\s*)?\d+(\.\d+)?\s*(세트|회|kg|km|분)\s*(수행)?)+\s*$/, '').trim().slice(0, 40);
    // 운동 기록에서 근력 종목을 모은다(기록 하나에 같은 종목은 한 번만 센다). 자주 한 순서.
    // exercise_meta가 없는 기록은 ingredients에서 사전에 있는 종목만 찾는다.
    const collectRecordedExercises = (logs, index, minUnknown = 2) => {
      const map = new Map();
      for (const log of logs || []) {
        const date = String(log?.log_date || log?.date || '');
        const metaItems = Array.isArray(log?.exercise_meta?.items) ? log.exercise_meta.items : [];
        const named = metaItems.length
          ? metaItems.map(it => ({ name: it?.name, strength: it?.kind !== 'cardio' }))
          : (Array.isArray(log?.ingredients) ? log.ingredients : []).map(name => ({ name, strength: false }));
        const seen = new Set();
        for (const { name, strength } of named) {
          const norm = normalizeExerciseKey(name);
          if (!norm || GENERIC_EXERCISE_KEYS.has(norm)) continue;
          const entry = index ? index.get(norm) || null : null;
          if (entry ? entry.kind !== 'strength' : !strength) continue;
          const display = entry ? entry.name : customExerciseName(name);
          if (!display) continue;
          const key = entry ? entry.key : 'custom:' + display;
          const dedupe = entry ? key : 'custom:' + norm;
          if (seen.has(dedupe)) continue;
          seen.add(dedupe);
          const cur = map.get(dedupe) || { key, name: display, entry, count: 0, lastDate: '' };
          cur.count += 1;
          if (date > cur.lastDate) cur.lastDate = date;
          map.set(dedupe, cur);
        }
      }
      // 사전에 없는 이름은 두 번 이상 나온 것만(한 번뿐인 이름은 대개 "해당 없음", "최고 중량" 같은 설명 조각)
      return [...map.values()].filter(r => r.entry || r.count >= minUnknown).sort((a, b) => b.count - a.count || b.lastDate.localeCompare(a.lastDate) || a.name.localeCompare(b.name));
    };
    // ★ v0.5.3 기록에서 찾은 새 운동: 사전에도 직접 추가 목록에도 없는 근력 이름(한 번 나온 것도).
    // 설명 조각처럼 보이는 이름과 '운동 아님'으로 숨긴 이름은 뺀다.
    // "코어 근육을 활용한 균형 잡기"처럼 조사·꾸밈말이 들어간 문장도 뺀다.
    const NOT_EXERCISE_RE = /(해당\s*없|최고|최대|중량$|세션|적용|시간|합계|총계|기록|휴식|없음|[을를의](\s|$)|위한|통한|이용한|활용한)/;
    const discoverExercises = (logs, index, places) => {
      const ignored = new Set(places?.ignored || []);
      return collectRecordedExercises(logs, index, 1)
        .filter(r => !r.entry && r.name.length <= 20 && !NOT_EXERCISE_RE.test(r.name) && !ignored.has(r.key));
    };

    // ★ v0.5.4 헬스 기록 도우미 ─────────────────────────────────────────────
    // 입력 방식: 무게×횟수(weight) / 횟수만(reps, 맨몸·철봉) / 초(hold, 버티기)
    const HOLD_EXERCISE_KEYS = new Set(['plank', 'side-plank', 'wall-sit', 'dead-hang']);
    const REPS_ONLY_KEYS = new Set(['captains-chair-leg-raise']);
    const REPS_ONLY_EQUIPMENT = ['bodyweight', 'pullup_bar', 'parallel_bars', 'band', 'ab_wheel'];
    const exerciseInputKind = (entry) => {
      if (!entry) return 'weight';
      if (HOLD_EXERCISE_KEYS.has(entry.key)) return 'hold';
      if (entry.key === 'weighted-pull-up') return 'weight';
      if (REPS_ONLY_KEYS.has(entry.key)) return 'reps'; // 기구 틀을 쓰지만 몸무게로 하는 종목
      return REPS_ONLY_EQUIPMENT.includes(entry.equipment) ? 'reps' : 'weight';
    };
    // 쉬는 시간: 큰 종목 80초, 나머지 60초(사용자 결정 2026-11-25)
    const BIG_LIFT_RE = /(squat|deadlift|bench-press|incline-press|decline|row|press|lunge|hip-thrust|rack-pull|good-morning|pull-up|chin-up|dips|step-up|split)/;
    const SMALL_LIFT_RE = /(upright-row|calf|pushdown|kickback|raise|curl|fly|face-pull|shrug|crunch)/;
    const REST_DEFAULT_BIG = 80;
    const REST_DEFAULT_SMALL = 60;
    const isBigLift = (entry) => { const key = String(entry?.key || ''); return BIG_LIFT_RE.test(key) && !SMALL_LIFT_RE.test(key); };
    // 순서: 종목별로 정한 값 → 설정의 큰 종목/나머지 기본값 → 80/60
    const restSecondsFor = (entry, places) => {
      const own = places?.restByKey?.[entry?.key];
      if (own) return own;
      return isBigLift(entry) ? (places?.rest?.big || REST_DEFAULT_BIG) : (places?.rest?.small || REST_DEFAULT_SMALL);
    };
    const restSoundOn = (places) => places?.rest?.sound !== false;
    const WEIGHT_STEP = 2.5;
    const roundWeight = (w) => Math.round(Number(w) * 4) / 4;
    // 기록에서 종목별 세트 이력(최근 것 먼저). exercise_meta의 세트 숫자가 있는 기록만.
    const libraryKeyMap = (index) => new Map([...(index ? index.values() : [])].map(e => [e.key, e]));
    const exerciseSetHistory = (logs, index) => {
      const history = new Map();
      const keyMap = libraryKeyMap(index);
      for (const log of logs || []) {
        const items = Array.isArray(log?.exercise_meta?.items) ? log.exercise_meta.items : [];
        const date = String(log?.log_date || log?.date || '');
        const location = log?.exercise_meta?.location || null;
        const seen = new Set();
        for (const item of items) {
          if (!Array.isArray(item?.sets) || !item.sets.length) continue;
          const entry = (item.key && keyMap.get(item.key)) || (index ? index.get(normalizeExerciseKey(item.name)) : null);
          if (!entry || seen.has(entry.key)) continue;
          seen.add(entry.key);
          const list = history.get(entry.key) || [];
          list.push({
            date, time: String(log?.log_time || ''), location,
            sets: item.sets.map(s => ({ weight: s.weight ?? null, reps: s.reps ?? null, seconds: s.seconds ?? null })),
            // ★ v0.5.5 무게 올리기 판단용: 탭 기록인지, 평가, 실패 세트, 계획 세트 수
            coach: log?.exercise_meta?.detailSource === 'coach', rating: log?.exercise_meta?.session?.rating || null,
            failed: item.sets.some(s => s.failed), plannedSets: Number.isInteger(item.plannedSets) ? item.plannedSets : null,
          });
          history.set(entry.key, list);
        }
      }
      history.forEach(list => list.sort((a, b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)));
      return history;
    };
    // 지난번 기록: 바벨·덤벨·맨몸은 장소와 상관없이 가장 최근, 머신·케이블은 같은 장소를 먼저.
    const pickLastSets = (history, entry, location) => {
      const list = history?.get(entry?.key) || [];
      if (!list.length) return null;
      if (['machine', 'cable', 'smith'].includes(entry.equipment)) return list.find(h => h.location === location) || list[0];
      return list[0];
    };
    // ★ 미리 채울 세트: 무게·횟수는 가장 최근 기록, 세트 수는 그 종목 최근 3번 중 가장 많이 한 수.
    // 몇 세트만 한 날이 가장 최근이어도 다음 기본 세트 수가 줄지 않게 한다. 모자란 세트는 최근 기록의 마지막 세트로 채운다.
    const PLANNED_SET_LOOKBACK = 3;
    const plannedSetsFrom = (history, entry, location) => {
      const last = pickLastSets(history, entry, location);
      if (!last || !last.sets.length) return last;
      const list = history?.get(entry?.key) || [];
      const target = Math.max(last.sets.length, ...list.slice(0, PLANNED_SET_LOOKBACK).map(h => h.sets.length));
      const sets = [...last.sets];
      while (sets.length < target) sets.push({ ...last.sets[last.sets.length - 1] });
      return { ...last, sets };
    };
    const emptySet = () => ({ weight: null, reps: null, seconds: null, done: false, failed: false });
    const makeSessionItem = (entry, last, places) => ({
      key: entry.key, name: entry.name, equipment: entry.equipment, targets: entry.targets || [],
      input: exerciseInputKind(entry), restSec: restSecondsFor(entry, places),
      last: last ? { date: last.date, location: last.location } : null,
      lastBest: last ? Math.max(0, ...last.sets.map(s => Number(s.weight) || 0)) || null : null,
      sets: last && last.sets.length
        ? last.sets.map(s => ({ ...emptySet(), weight: s.weight, reps: s.reps, seconds: s.seconds }))
        : [emptySet(), emptySet(), emptySet()],
    });
    // 최근 근력 운동 몇 번(빠른 시작 "최근 운동 그대로"): 날짜, 큰 부위 이름, 종목 key
    const recentWorkoutSessions = (logs, index, limit = 3) => {
      const out = [];
      const keyMap = libraryKeyMap(index);
      const sorted = [...(logs || [])].sort((a, b) => `${b.log_date} ${b.log_time || ''}`.localeCompare(`${a.log_date} ${a.log_time || ''}`));
      for (const log of sorted) {
        const items = Array.isArray(log?.exercise_meta?.items) ? log.exercise_meta.items : [];
        const keys = [];
        items.forEach(item => {
          const entry = index ? index.get(normalizeExerciseKey(item?.name)) : null;
          if (entry && entry.kind === 'strength' && !keys.includes(entry.key)) keys.push(entry.key);
        });
        if (!keys.length) continue;
        const parts = [];
        keys.forEach(k => {
          const entry = keyMap.get(k);
          const label = EXERCISE_PARTS.find(p => p.key === String(entry?.targets?.[0] || '').split('.')[0])?.label;
          if (label && !parts.includes(label)) parts.push(label);
        });
        out.push({ date: String(log.log_date), keys, parts });
        if (out.length >= limit) break;
      }
      return out;
    };
    // ★ v0.5.4 "최근 운동 그대로" 버튼: 부위별(팔은 이두·삼두로 나눔)과 전신.
    // - 부위: 그 부위를 2종목 이상 한 가장 최근 날의 그 부위 종목만(없으면 1종목이라도 한 가장 최근 날)
    // - 전신: 큰 부위를 4곳 이상 한 가장 최근 날의 종목 전체
    // 종목은 첫 번째 부위로 나눈다(부위별 묶음과 같은 기준).
    const SHORTCUT_GROUPS = [
      { key: 'chest', label: '가슴' }, { key: 'back', label: '등' }, { key: 'shoulder', label: '어깨' },
      { key: 'biceps', label: '이두' }, { key: 'triceps', label: '삼두' }, { key: 'legs', label: '하체' }, { key: 'core', label: '코어' },
    ];
    const FULL_BODY_MIN_PARTS = 4;
    const shortcutGroupOf = (entry) => {
      const [part, sub] = String(entry?.targets?.[0] || '').split('.');
      if (part === 'arm') return sub === 'triceps' ? 'triceps' : 'biceps';
      return SHORTCUT_GROUPS.some(g => g.key === part) ? part : null;
    };
    const recentWorkoutShortcuts = (logs, index) => {
      const sessions = recentWorkoutSessions(logs, index, Infinity);
      const keyMap = libraryKeyMap(index);
      const parts = SHORTCUT_GROUPS.map(g => {
        const withKeys = sessions.map(s => ({ date: s.date, keys: s.keys.filter(k => shortcutGroupOf(keyMap.get(k)) === g.key) })).filter(s => s.keys.length);
        const pick = withKeys.find(s => s.keys.length >= 2) || withKeys[0];
        return pick ? { key: g.key, label: g.label, date: pick.date, keys: pick.keys } : null;
      }).filter(Boolean);
      const full = sessions.find(s => s.parts.length >= FULL_BODY_MIN_PARTS) || null;
      return { parts, full };
    };
    const formatSessionSet = (item, s) => {
      if (item.input === 'hold') return s.seconds != null ? `${s.seconds}초` : '';
      if (item.input === 'reps') return s.reps != null ? `${s.weight ? s.weight + 'kg×' : ''}${s.reps}회` : '';
      if (s.weight == null && s.reps == null) return '';
      return `${s.weight ?? 0}kg×${s.reps ?? 0}`;
    };
    const setHasValue = (item, s) => item.input === 'hold' ? s.seconds != null : (item.input === 'reps' ? s.reps != null : (s.weight != null && s.reps != null));
    // 진행 중인 운동 → logs 한 줄. 체크한(done) 세트만 저장한다. 칼로리는 다루지 않는다.
    const WORKOUT_PLACE_LABELS = { company: '회사', apartment: '아파트', home: '집' };
    const buildWorkoutLog = (session, endedAtMs) => {
      const items = (session.items || []).map(item => ({ ...item, doneSets: item.sets.filter(s => s.done && setHasValue(item, s)) }))
        .filter(item => item.doneSets.length);
      const startedMs = Date.parse(session.startedAt) || endedAtMs;
      const minutes = Math.max(1, Math.round((endedAtMs - startedMs) / 60000));
      const parts = [];
      items.forEach(item => {
        const label = EXERCISE_PARTS.find(p => p.key === String(item.targets?.[0] || '').split('.')[0])?.label;
        if (label && !parts.includes(label)) parts.push(label);
      });
      const place = WORKOUT_PLACE_LABELS[session.location] || '';
      const setCount = items.reduce((n, item) => n + item.doneSets.length, 0);
      const heaviest = items.filter(i => i.input === 'weight').map(item => {
        const best = item.doneSets.reduce((b, s) => (Number(s.weight) || 0) > (Number(b?.weight) || 0) ? s : b, null);
        return best ? { item, best } : null;
      }).filter(Boolean).sort((a, b) => (Number(b.best.weight) || 0) - (Number(a.best.weight) || 0))[0];
      let bestText = '';
      if (heaviest) {
        const prev = Number(heaviest.item.lastBest);
        const diff = Number.isFinite(prev) && prev > 0 ? roundWeight(Number(heaviest.best.weight) - prev) : null;
        const diffText = diff == null ? '' : (diff === 0 ? ' (지난번과 같음)' : ` (지난번 ${diff > 0 ? '+' : ''}${diff}kg)`);
        bestText = ` · ${heaviest.item.name} 최고 ${heaviest.best.weight}kg×${heaviest.best.reps}${diffText}`;
      }
      const ratingText = { easy: ' · 쉬웠어요', ok: ' · 적당했어요', hard: ' · 힘들었어요' }[session.rating] || '';
      return {
        category: '운동',
        log_date: session.date,
        log_time: `${session.time}:00`,
        food_name: [place, parts.join('·'), `${minutes}분`].filter(Boolean).join(' · ').replace(/ · (\d+분)$/, ' $1'),
        ingredients: items.map(item => `${item.name}: ${item.doneSets.map(s => formatSessionSet(item, s)).join(', ')}`),
        analysis: `${parts.join('·') || '근력'} ${items.length}종목 ${setCount}세트${bestText}${ratingText}`,
        is_alcohol: false,
        raw_input: { type: 'coach', naturalText: '' },
        exercise_meta: {
          version: 2, detailVersion: 2, detailSource: 'coach', location: session.location || null,
          session: {
            startedAt: session.startedAt, endedAt: new Date(endedAtMs).toISOString(), minutes, rating: session.rating || null,
            failedSets: items.reduce((n, item) => n + item.doneSets.filter(s => s.failed).length, 0),
            skippedToday: (session.skippedToday || []).slice(0, 30),
            ...(session.plan ? { plan: session.plan } : {}),
          },
          items: items.map(item => ({
            name: item.name, key: item.key, kind: 'strength', targets: item.targets, source: 'coach', equipment: item.equipment, input: item.input,
            // 계획했던 세트 수(체크 안 한 세트 포함). 일부러 덜 한 날을 다음 무게 판단에서 '실패'로 보지 않게 쓴다.
            plannedSets: item.sets.length,
            sets: item.doneSets.map(s => ({ weight: item.input === 'hold' ? null : (s.weight ?? null), unit: 'kg', reps: item.input === 'hold' ? null : (s.reps ?? null), seconds: item.input === 'hold' ? (s.seconds ?? null) : null, ...(s.failed ? { failed: true } : {}) })),
          })),
        },
      };
    };
    // 탭에서 저장한 기록을 다시 고칠 때: 저장된 세트를 모두 '했음'으로 불러온다.
    const sessionFromLog = (log, byKey) => {
      const meta = log?.exerciseMeta || log?.exercise_meta || {};
      return {
        version: 1, stage: 'run', editLogId: log.id, location: meta.location || 'company',
        startedAt: meta.session?.startedAt || new Date().toISOString(), editEndedAt: meta.session?.endedAt || null,
        date: log.date || log.log_date, time: String(log.time || log.log_time || '').slice(0, 5), rating: meta.session?.rating || null,
        skippedToday: [], rest: null,
        items: (meta.items || []).map(item => {
          const entry = byKey?.get(item.key) || null;
          return {
            key: item.key || ('custom:' + item.name), name: item.name, equipment: item.equipment || entry?.equipment || 'machine',
            targets: item.targets || entry?.targets || [], input: item.input || exerciseInputKind(entry), restSec: restSecondsFor(entry || { key: item.key }), last: null,
            sets: (item.sets || []).map(s => ({ weight: s.weight ?? null, reps: s.reps ?? null, seconds: s.seconds ?? null, done: true, failed: !!s.failed })),
          };
        }),
      };
    };
    const isCoachLog = (log) => (log?.exerciseMeta || log?.exercise_meta)?.detailSource === 'coach';

    // ★ v0.5.5 헬스 추천(규칙만, AI 없음) ─────────────────────────────────────
    const BIG_RECOVERY_GROUPS = ['chest', 'back', 'legs'];
    const RECOVERY_HOURS = { big: 48, small: 24, extra: 24 };
    const HEAVY_DAY_SETS = 8;
    const PAIR_GROUP = { chest: 'triceps', triceps: 'chest', back: 'biceps', biceps: 'back', legs: 'shoulder', shoulder: 'core', core: 'shoulder' };
    const PAIR_MIN_MINUTES = 60;
    // 시간: 기본 40분, −10/+10분으로 20~120분(사용자 결정 2026-11-26)
    const RECO_DEFAULT_MINUTES = 40;
    const RECO_MINUTES_STEP = 10;
    const RECO_MIN_MINUTES = 20;
    const RECO_MAX_MINUTES = 120;
    const CARDIO_WEEKLY_GOAL_MIN = 90;
    const SUPPLEMENT_WINDOW_DAYS = 28;
    const logDateTimeMs = (log) => {
      const t = String(log?.log_time || '12:00').slice(0, 5) || '12:00';
      return Date.parse(`${log?.log_date}T${t}:00`);
    };
    const dayDiff = (fromDate, toDate) => Math.round((Date.parse(toDate + 'T00:00:00') - Date.parse(fromDate + 'T00:00:00')) / 86400000);
    // 부위 상태: 마지막으로 한 때, 며칠 전, 회복 중인지. 큰 부위 48시간·작은 부위 24시간, 그날 8세트 이상이거나 '힘들었어요'면 24시간 더.
    const recoveryStatus = (logs, index, nowMs, today) => {
      const keyMap = libraryKeyMap(index);
      const last = {};
      for (const log of logs || []) {
        const items = Array.isArray(log?.exercise_meta?.items) ? log.exercise_meta.items : [];
        const perGroup = {};
        items.forEach(item => {
          const entry = (item?.key && keyMap.get(item.key)) || (index ? index.get(normalizeExerciseKey(item?.name)) : null);
          if (!entry || entry.kind !== 'strength') return;
          const g = shortcutGroupOf(entry);
          if (!g) return;
          perGroup[g] = (perGroup[g] || 0) + (Array.isArray(item.sets) && item.sets.length ? item.sets.length : 3);
        });
        const at = logDateTimeMs(log);
        Object.entries(perGroup).forEach(([g, sets]) => {
          if (!last[g] || at > last[g].at) last[g] = { at, date: String(log.log_date), sets, hard: log?.exercise_meta?.session?.rating === 'hard' };
        });
      }
      return SHORTCUT_GROUPS.map(g => {
        const l = last[g.key];
        if (!l) return { key: g.key, label: g.label, date: null, days: null, ready: true };
        const limit = (BIG_RECOVERY_GROUPS.includes(g.key) ? RECOVERY_HOURS.big : RECOVERY_HOURS.small) + (l.sets >= HEAVY_DAY_SETS || l.hard ? RECOVERY_HOURS.extra : 0);
        const hours = (nowMs - l.at) / 3600000;
        return { key: g.key, label: g.label, date: l.date, days: dayDiff(l.date, today), ready: hours >= limit, readyInHours: Math.max(0, Math.ceil(limit - hours)) };
      });
    };
    // 어제까지 며칠 연속 운동했는지(오늘 제외)
    const consecutiveWorkoutDays = (logs, today) => {
      const days = new Set((logs || []).map(l => String(l.log_date)));
      let n = 0;
      for (let i = 1; i <= 14; i++) {
        const d = new Date(Date.parse(today + 'T00:00:00') - i * 86400000);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (!days.has(key)) break;
        n++;
      }
      return n;
    };
    // 오늘 할 부위: 준비된 부위 중 가장 오래 안 한 한 곳(안 한 적 없는 부위는 맨 뒤). 60분 이상이면 짝 부위를 더한다.
    const chooseFocusGroups = (status, minutes) => {
      const score = (s) => s.days == null ? -1 : s.days;
      const ready = status.filter(s => s.ready && s.days != null).sort((a, b) => score(b) - score(a));
      const pool = ready.length ? ready : [...status].filter(s => s.days != null).sort((a, b) => (a.readyInHours || 0) - (b.readyInHours || 0));
      const first = pool[0]?.key || 'chest';
      const groups = [first];
      if (minutes >= PAIR_MIN_MINUTES) {
        const pair = PAIR_GROUP[first];
        if (pair && status.find(s => s.key === pair)?.ready === true) groups.push(pair);
      }
      const longRested = status.filter(s => s.ready && s.days != null && s.days >= 5);
      return { groups, fullBodyCandidate: longRested.length >= 4 };
    };
    // 무게 올림 단계: 바벨·스미스 2.5kg, 덤벨(한 손) 회사 2kg·아파트 1kg, 머신·케이블 5kg, 케틀벨 4kg
    const weightStepFor = (entry, location) => {
      if (entry?.equipment === 'dumbbell') return location === 'apartment' ? 1 : 2;
      if (['machine', 'cable'].includes(entry?.equipment)) return 5;
      if (entry?.equipment === 'kettlebell') return 4;
      return 2.5;
    };
    const roundToStep = (w, step) => Math.max(0, Math.round(Number(w) / step) * step);
    // 오늘 세트 기본값과 이유: 올림(up) / 유지(hold) / 낮춤(down) / 처음(new)
    const progressSets = (history, entry, location, { alcohol = false } = {}) => {
      const planned = plannedSetsFrom(history, entry, location);
      if (!planned || !planned.sets.length) return { sets: null, change: 'new', reason: '처음 하는 종목' };
      const list = history.get(entry.key) || [];
      const last = list[0];
      const input = exerciseInputKind(entry);
      let sets = planned.sets.map(s => ({ ...s }));
      let change = 'hold'; let reason = '지난번 그대로';
      const hardTwice = list.length >= 2 && list[0].rating === 'hard' && list[1].rating === 'hard';
      if (alcohol) { change = 'hold'; reason = '어제 음주 · 무게 유지, 세트 1개 줄임'; }
      else if (hardTwice) { change = 'down'; reason = '"힘들었어요" 두 번 연속 · 약 10% 낮춤'; }
      else if (!last.coach) { reason = '지난번 그대로(예전 기록이라 평가 없음)'; }
      else if (last.failed) { reason = '지난번 실패 세트가 있어 유지'; }
      else if (last.plannedSets != null && last.sets.length < last.plannedSets) { reason = '지난번 덜 해서 유지'; }
      else if (last.rating === 'hard') { reason = '지난번 힘들었어요 · 유지'; }
      else { change = 'up'; reason = '지난번 다 성공'; }
      if (change === 'up') {
        if (input === 'weight') { const step = weightStepFor(entry, location); sets = sets.map(s => ({ ...s, weight: roundWeight((Number(s.weight) || 0) + step) })); reason += ` · +${step}kg`; }
        else if (input === 'reps') { sets = sets.map(s => ({ ...s, reps: (Number(s.reps) || 0) + 1 })); reason += ' · +1회'; }
        else { sets = sets.map(s => ({ ...s, seconds: (Number(s.seconds) || 0) + 5 })); reason += ' · +5초'; }
      }
      if (change === 'down' && input === 'weight') {
        const step = weightStepFor(entry, location);
        sets = sets.map(s => ({ ...s, weight: roundToStep((Number(s.weight) || 0) * 0.9, step) }));
      }
      if (alcohol && sets.length > 1) sets = sets.slice(0, -1);
      return { sets, change, reason };
    };
    // 부위 종목 고르기: 그 장소 목록에서, 최근 8주에 자주 한 순 → 큰 종목 먼저 → 세부 부위가 겹치지 않게.
    const pickGroupExercises = (group, placeKeys, keyMap, history, exclude, today) => {
      const freq = (key) => (history.get(key) || []).filter(h => dayDiff(h.date, today) <= 56).length;
      const cands = placeKeys.filter(k => !exclude.includes(k) && shortcutGroupOf(keyMap.get(k)) === group)
        .map(k => ({ key: k, entry: keyMap.get(k), freq: freq(k) }))
        .sort((a, b) => b.freq - a.freq || (isBigLift(b.entry) ? 1 : 0) - (isBigLift(a.entry) ? 1 : 0) || a.entry.name.localeCompare(b.entry.name));
      // 최근에 한 종목 안에서만 세부 부위를 고르게 섞고, 8주간 안 한 종목은 맨 뒤에 둔다.
      const usedSubs = new Set(); const first = []; const rest = []; const unused = [];
      cands.forEach(c => {
        if (!c.freq) { unused.push(c.key); return; }
        const sub = c.entry.targets?.[0];
        if (!usedSubs.has(sub)) { usedSubs.add(sub); first.push(c.key); } else rest.push(c.key);
      });
      return [...first, ...rest, ...unused];
    };
    const estimateItemMinutes = (setCount, restSec) => setCount * (1 + restSec / 60);
    // 최근 4주 0~1회인 세부 부위 하나와 그 장소에서 할 종목(바벨·덤벨 먼저)
    const supplementSuggestion = (logs, index, placeKeys, keyMap, today, exclude) => {
      const counts = {};
      (logs || []).filter(l => dayDiff(String(l.log_date), today) <= SUPPLEMENT_WINDOW_DAYS).forEach(log => {
        const items = Array.isArray(log?.exercise_meta?.items) ? log.exercise_meta.items : [];
        const seen = new Set();
        items.forEach(item => {
          const entry = (item?.key && keyMap.get(item.key)) || (index ? index.get(normalizeExerciseKey(item?.name)) : null);
          (entry?.targets || item?.targets || []).forEach(t => { if (String(t).includes('.') && !seen.has(t)) { seen.add(t); counts[t] = (counts[t] || 0) + 1; } });
        });
      });
      const subs = EXERCISE_PARTS.flatMap(p => p.subs.map(([k, label]) => ({ target: `${p.key}.${k}`, label: `${p.label}·${label}`, count: counts[`${p.key}.${k}`] || 0 })))
        .filter(s => s.count <= 1).sort((a, b) => a.count - b.count);
      const pref = (e) => ['dumbbell', 'barbell'].includes(e.equipment) ? 0 : 1;
      for (const s of subs) {
        const key = placeKeys.filter(k => !exclude.includes(k) && (keyMap.get(k)?.targets || []).includes(s.target))
          .sort((a, b) => pref(keyMap.get(a)) - pref(keyMap.get(b)))[0];
        if (key) return { key, target: s.target, label: s.label, count: s.count };
      }
      return null;
    };
    // 이번 주(월~일) 유산소 분
    const weeklyCardioMinutes = (logs, today) => {
      const d = new Date(Date.parse(today + 'T00:00:00'));
      const monday = new Date(d.getTime() - ((d.getDay() + 6) % 7) * 86400000);
      const mondayStr = `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')}`;
      let minutes = 0;
      (logs || []).filter(l => String(l.log_date) >= mondayStr && String(l.log_date) <= today).forEach(log => {
        (log?.exercise_meta?.items || []).forEach(item => { if (item?.kind === 'cardio' && Number(item.minutes) > 0) minutes += Number(item.minutes); });
      });
      return Math.round(minutes);
    };
    // 오늘의 추천 전체. yesterday = { alcohol, lateNight }
    // ★ v0.5.6 한 줄 입력을 규칙으로 먼저 읽는다(AI 없이). 하나도 못 읽으면 matched=false → 화면이 AI에게 묻는다.
    // 아프다는 말이 붙은 구절의 부위는 '뺄 부위(avoid)', 나머지 부위는 오늘 할 부위(groups).
    const WORKOUT_TEXT_PARTS = [
      [/가슴|흉근|벤치/, ['chest']], [/등(?!산)|광배|턱걸이|풀업|로우|허리/, ['back']], [/어깨|삼각근/, ['shoulder']],
      [/이두/, ['biceps']], [/삼두/, ['triceps']], [/팔(?!꿈)|팔뚝/, ['biceps', 'triceps']],
      [/하체|다리|허벅지|엉덩이|종아리|스쿼트|무릎/, ['legs']], [/코어|복근|옆구리|뱃살|배(?!고)/, ['core']],
    ];
    const WORKOUT_PAIN_RE = /(아파(?!트)|아프|아픈|아픔|통증|불편|다쳐|다친|삐끗|결려|결림|쑤셔|저려)/;
    const parseWorkoutText = (text) => {
      const t = String(text || '').trim().slice(0, 100);
      const out = { groups: [], avoid: [] };
      if (!t) return { ...out, matched: false };
      const hour = /(한|1)\s*시간\s*(반)?/.exec(t);
      const min = /(\d{2,3})\s*분/.exec(t);
      let minutes = null;
      if (min) minutes = Number(min[1]);
      else if (hour) minutes = hour[2] ? 90 : 60;
      if (minutes != null) out.minutes = Math.min(RECO_MAX_MINUTES, Math.max(RECO_MIN_MINUTES, Math.round(minutes / 10) * 10));
      if (/(피곤|힘들|졸려|졸리|지쳐|지침|몸이\s*무거|숙취|잠을?\s*못|컨디션\s*(안|별로|나빠|나쁨))/.test(t)) out.condition = 'tired';
      else if (/(컨디션\s*(좋|최고)|쌩쌩|가뿐|개운)/.test(t)) out.condition = 'good';
      if (/회사/.test(t)) out.place = 'company';
      else if (/아파트/.test(t)) out.place = 'apartment';
      t.split(/[,.!?·]|그리고|데\s|지만|고\s/).forEach(clause => {
        const pain = WORKOUT_PAIN_RE.test(clause);
        WORKOUT_TEXT_PARTS.forEach(([re, groups]) => {
          if (!re.test(clause)) return;
          groups.forEach(g => { const list = pain ? out.avoid : out.groups; if (!list.includes(g)) list.push(g); });
        });
      });
      out.groups = out.groups.filter(g => !out.avoid.includes(g));
      const matched = out.minutes != null || !!out.condition || !!out.place || out.groups.length > 0 || out.avoid.length > 0;
      return { ...out, matched };
    };
    // ★ v0.5.6 종목 부위가 뺄 부위에 걸리는지(첫 번째 부위뿐 아니라 쓰는 부위 전부를 본다)
    const targetGroupOf = (t) => { const [part, sub] = String(t || '').split('.'); return part === 'arm' ? (sub === 'triceps' ? 'triceps' : 'biceps') : part; };
    const touchesAvoided = (entry, avoid) => !!avoid?.length && (entry?.targets || []).some(t => avoid.includes(targetGroupOf(t)));
    const placesKeyEntries = (places, location, keyMap) => Object.fromEntries((places?.[location] || []).filter(k => keyMap.has(k)).map(k => [k, true]));
    const buildRecommendation = ({ logs, index, places, location, minutes = RECO_DEFAULT_MINUTES, condition = 'normal', groups: forcedGroups = null, yesterday = {}, nowMs, today, skip = [], avoid = [] }) => {
      const keyMap = libraryKeyMap(index);
      const history = exerciseSetHistory(logs, index);
      const status = recoveryStatus(logs, index, nowMs, today);
      const focus = chooseFocusGroups(status.filter(st => !avoid.includes(st.key)), minutes);
      const groups = (forcedGroups && forcedGroups.length ? forcedGroups : focus.groups).filter(g => !avoid.includes(g));
      const avoidKeys = Object.keys(placesKeyEntries(places, location, keyMap)).filter(k => touchesAvoided(keyMap.get(k), avoid));
      const placeKeys = places?.[location] || [];
      const tired = condition === 'tired';
      // 피곤하면 세트를 1개씩 줄이고 시간도 25% 덜 쓴다(종목이 늘어나지 않게).
      const budget = tired ? minutes * 0.75 : minutes;
      const items = [];
      let used = 0;
      const queues = groups.map(g => pickGroupExercises(g, placeKeys, keyMap, history, [...skip, ...avoidKeys], today));
      // 첫 부위 2개 : 짝 부위 1개 비율로 번갈아 채운다
      const order = [];
      for (let round = 0; round < 12; round++) {
        queues.forEach((q, gi) => { const take = gi === 0 ? 2 : 1; for (let t = 0; t < take; t++) { const k = q.shift(); if (k) order.push(k); } });
      }
      for (const key of order) {
        const entry = keyMap.get(key);
        const p = progressSets(history, entry, location, { alcohol: !!yesterday.alcohol });
        let sets = p.sets || [emptySet(), emptySet(), emptySet()].map(s => ({ weight: s.weight, reps: s.reps, seconds: s.seconds }));
        if (tired && sets.length > 2) sets = sets.slice(0, -1);
        const restSec = restSecondsFor(entry, places);
        const cost = estimateItemMinutes(sets.length, restSec);
        if (items.length >= 1 && used + cost > budget) break;
        used += cost;
        items.push({ key, sets, change: p.change, reason: p.reason + (tired && p.sets && p.sets.length > 2 ? ' · 피곤해서 세트 1개 줄임' : '') });
      }
      const supplement = supplementSuggestion(logs, index, placeKeys, keyMap, today, [...items.map(i => i.key), ...avoidKeys]);
      let supplementItem = null;
      if (supplement) {
        const entry = keyMap.get(supplement.key);
        const p = progressSets(history, entry, location, { alcohol: !!yesterday.alcohol });
        supplementItem = { key: supplement.key, sets: (p.sets || [emptySet(), emptySet()]).slice(0, 3), change: p.change, reason: `편식 보충 · ${supplement.label} 4주간 ${supplement.count}회`, supplement: true };
      }
      return {
        status, groups, autoGroups: focus.groups, fullBodyCandidate: focus.fullBodyCandidate,
        restSuggest: consecutiveWorkoutDays(logs, today) >= 3,
        items, supplement: supplementItem, minutesPlanned: Math.round(used),
        cardio: { minutes: weeklyCardioMinutes(logs, today), goal: CARDIO_WEEKLY_GOAL_MIN },
        alcohol: !!yesterday.alcohol, lateNight: !!yesterday.lateNight, avoid: [...avoid],
      };
    };
    // 처음 설정에서 고른 값을 장소 목록으로. 기록에 없는 종목(직접 추가한 것)은 그대로 둔다.
    const applyPlaceChoices = (places, records, choices) => {
      const base = places || emptyWorkoutPlaces();
      const recordKeys = new Set(records.map(r => r.key));
      const pick = (place) => records.filter(r => [place, 'both'].includes(choices[r.key] || 'both')).map(r => r.key);
      return {
        ...base,
        company: [...base.company.filter(k => !recordKeys.has(k)), ...pick('company')],
        apartment: [...base.apartment.filter(k => !recordKeys.has(k)), ...pick('apartment')],
        setupDone: true,
      };
    };
    const choiceFromPlaces = (places, key) => {
      const inCompany = !!places?.company?.includes(key);
      const inApartment = !!places?.apartment?.includes(key);
      return inCompany && inApartment ? 'both' : (inCompany ? 'company' : (inApartment ? 'apartment' : 'none'));
    };
    // 집: 맨몸 종목 + 고른 장비로 하는 종목.
    const homeExercisesFor = (library, equipment) => (library?.exercises || []).filter(e =>
      e.kind === 'strength' && (e.equipment === 'bodyweight' || (equipment || []).includes(e.equipment)));
    const placeExerciseName = (key, byKey) => byKey?.get(key)?.name || (String(key).startsWith('custom:') ? String(key).slice(7) : key);
    // 사전 검색: 이름·별칭에 들어 있으면(띄어쓰기 무시) 근력 종목만.
    const searchExerciseLibrary = (library, query, exclude, target) => {
      const q = String(query || '').toLowerCase().replace(/[\s·\-_]/g, '');
      return (library?.exercises || []).filter(e => e.kind === 'strength' && !(exclude || []).includes(e.key)
        && (!q || [e.name, ...(e.aliases || [])].some(n => String(n).toLowerCase().replace(/[\s·\-_]/g, '').includes(q)))
        && (!target || (e.targets || []).includes(target)));
    };
    // 부위별 묶음: 종목의 첫 번째 부위로 묶는다(가슴·등·어깨·팔·하체·코어, 사전에 없으면 기타). 빈 묶음은 뺀다.
    const groupExercisesByPart = (items, entryOf) => {
      const groups = [...EXERCISE_PARTS.map(p => ({ key: p.key, label: p.label, items: [] })), { key: 'other', label: '기타', items: [] }];
      (items || []).forEach(item => {
        const part = String(entryOf(item)?.targets?.[0] || '').split('.')[0];
        (groups.find(g => g.key === part) || groups[groups.length - 1]).items.push(item);
      });
      return groups.filter(g => g.items.length);
    };
    // 이름 옆에 붙이는 짧은 부위: 세부 부위가 있으면 세부(윗가슴), 없으면 큰 부위(하체).
    const shortTargetLabels = (entry) => [...new Set((entry?.targets || []).map(t => {
      const [part, sub] = String(t).split('.');
      const def = EXERCISE_PARTS.find(p => p.key === part);
      if (!def) return null;
      return (sub && (def.subs.find(([k]) => k === sub) || [])[1]) || def.label;
    }).filter(Boolean))];
    // 이 종목들로는 쓰지 않는 세부 부위(편식 보충 추천에 필요한 종목이 장소에 있는지 미리 알려준다).
    const missingSubParts = (entries) => {
      const covered = new Set((entries || []).flatMap(e => e?.targets || []));
      return EXERCISE_PARTS.flatMap(p => p.subs.filter(([k]) => !covered.has(`${p.key}.${k}`))
        .map(([k, label]) => ({ target: `${p.key}.${k}`, part: p.label, label })));
    };

    // ★ v0.3.8 항목별 근거(entries)도 함께 모아 카드에서 펼쳐 볼 수 있게 한다.
    const summarizeHealthTags = (items) => {
      const groups = new Map();
      (items || []).forEach(item => (item.healthTags || []).forEach(tag => {
        if (!tag.tagLabel || !['helpful', 'caution'].includes(tag.polarity)) return;
        const key = `${tag.diseaseKey}:${tag.polarity}`;
        const current = groups.get(key) || { key, label: tag.tagLabel, polarity: tag.polarity, count: 0, foods: new Set(), entries: [] };
        current.count += 1;
        if (tag.foodName) current.foods.add(tag.foodName);
        current.entries.push({ logId: item.id, date: item.date, time: item.time, category: item.category, foodName: tag.foodName || item.foodName || '', evidence: tag.evidence || '' });
        groups.set(key, current);
      }));
      groups.forEach(group => group.entries.sort((a, b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)));
      return [...groups.values()].sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
    };

    const conditionKeyForLabel = (label) => {
      const text = String(label || '').trim();
      const known = [
        ['gout', ['통풍']], ['hypertension', ['고혈압', '혈압']], ['diabetes', ['당뇨', '혈당']],
        ['dyslipidemia', ['고지혈증', '이상지질혈증', '콜레스테롤']], ['kidney', ['신장', '콩팥']], ['liver', ['지방간', '간질환', '간 건강']]
      ];
      const found = known.find(([, words]) => words.some(word => text.includes(word)));
      return found ? found[0] : text.toLocaleLowerCase('ko-KR').replace(/\s+/g, '').slice(0, 80);
    };

    const parseProfileConditions = (value) => {
      const text = String(value || '').trim();
      if (!text) return [];
      const pieces = text.split(/[,/·;\n]+/).map(item => item.trim()).filter(Boolean);
      if (pieces.length > 1) return [...new Map(pieces.map(label => [conditionKeyForLabel(label), label])).values()];
      const known = [
        ['통풍', ['통풍']], ['고혈압', ['고혈압']], ['혈당', ['당뇨', '혈당']],
        ['고지혈증', ['고지혈증', '이상지질혈증', '콜레스테롤']], ['신장', ['신장', '콩팥']], ['지방간', ['지방간', '간질환']]
      ];
      const matched = known.filter(([, words]) => words.some(word => text.includes(word))).map(([label]) => label);
      return matched.length > 1 ? matched : [text];
    };

    const mapConditionReport = (row) => ({
      id: row.id,
      conditionKey: row.condition_key ?? row.conditionKey ?? '',
      conditionLabel: row.condition_label ?? row.conditionLabel ?? '',
      windowStart: row.window_start ?? row.windowStart ?? '',
      windowEnd: row.window_end ?? row.windowEnd ?? '',
      status: row.status || 'insufficient',
      reportData: row.report_data ?? row.reportData ?? {},
      snapshot: row.snapshot || {},
      createdAt: row.created_at ?? row.createdAt ?? new Date().toISOString(),
      previousCreatedAt: row.previousCreatedAt || null,
    });

    // 페이지를 처음 열 때, 기기 시계가 서버 시각보다 살짝 느린 경우 방금 발급된 로그인 토큰이
    // "미래에 발급된 것"처럼 보여 PostgREST가 요청을 거부하는 경우가 있음 ("JWT issued at future").
    // 새로고침하면 사라지는 일시적인 현상이라, 이 에러를 감지하면 잠깐 기다렸다가 조용히 한 번 재시도한다.
    const isClockSkewAuthError = (msg) => !!msg && /jwt issued at future/i.test(msg);
    const withAuthRetry = async (queryFn) => {
      let result = await queryFn();
      if (result.error && isClockSkewAuthError(result.error.message)) {
        await new Promise((resolve) => setTimeout(resolve, 1500));
        result = await queryFn();
      }
      return result;
    };

    // Gemini 호출은 API 키를 숨기기 위해 Supabase Edge Function(diet-ai)을 통해서만 수행
    const callAI = async (action, payload, signal) => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error('로그인이 필요합니다.');
      const res = await fetch(FUNCTIONS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ action, payload }),
        signal,
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data && data.error) || 'AI 요청에 실패했습니다.');
      return data;
    };

    const translateAuthError = (msg) => {
      if (!msg) return '오류가 발생했습니다.';
      if (msg.includes('already registered') || msg.includes('already exists') || msg.includes('duplicate')) return '이미 사용 중인 계정명입니다.';
      if (msg.includes('Invalid login credentials')) return '계정명 또는 비밀번호가 올바르지 않습니다.';
      if (msg.includes('Password should be at least') || msg.includes('at least 6')) return '비밀번호는 6자 이상이어야 합니다.';
      return msg;
    };

    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const fileName = file.name ? file.name.toLowerCase() : '';
        if (fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic') {
          reject(new Error("아이폰의 HEIC(고효율) 사진은 카메라로 직접 찍거나 화면 캡처 후 올려주세요!"));
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            let width = img.width, height = img.height;
            if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.onerror = () => reject(new Error("이미지 처리 실패"));
          img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error("파일 읽기 실패"));
      });
    };

    // v0.0.1: 글자 영역을 눌러도 날짜/시간 선택창을 즉시 연다.
    // 기본 클릭 동작은 막지 않아 기존 선택 아이콘과 미지원 브라우저 동작을 유지한다.
    const openDateTimePicker = (event) => {
      const input = event.currentTarget;
      if (typeof input.showPicker !== 'function') return;
      try {
        input.showPicker();
      } catch (error) {
        // 브라우저가 선택창 호출을 제한하면 기본 입력 동작을 유지한다.
      }
    };

    const formatDate = (d) => { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

    // ★ 백업/내보내기용 CSV 필드 이스케이프 (콤마·따옴표·줄바꿈 포함 시 큰따옴표로 감싸고 내부 따옴표는 두 번씩)
    const escapeCsvField = (val) => {
      const str = val === null || val === undefined ? '' : String(val);
      if (/[",\n\r]/.test(str)) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    };

    const parseDate = (dateStr) => {
      if (!dateStr) return new Date();
      if (dateStr.includes('T')) return new Date(dateStr);
      const [y, m, d] = dateStr.split('-');
      return new Date(y, m - 1, d);
    };

    const getDayStr = (dateStr) => {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return days[parseDate(dateStr).getDay()];
    };

    const getKoreanWeekLabel = (dateStr) => {
      const d = parseDate(dateStr);
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const date = d.getDate();
      const firstDay = new Date(year, month - 1, 1).getDay();
      const week = Math.ceil((date + firstDay) / 7);

      const weekNames = ['첫', '둘', '셋', '넷', '다섯', '여섯'];
      const weekName = weekNames[week - 1] || week;

      return `${year}년 ${month}월 ${weekName}째주`;
    };

    const getWeekString = (dateStr) => {
      const d = parseDate(dateStr);
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    };

    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };

    const getDefaultCategoryByTime = () => {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 11) return '아침식사';
      if (hour >= 11 && hour < 15) return '점심식사';
      if (hour >= 15 && hour < 17) return '간식';
      if (hour >= 17 && hour < 21) return '저녁식사';
      return '야식';
    };

    // ★ [버그수정] 안드로이드 크롬에서 카메라/갤러리(네이티브 파일 선택) 앱을 다녀오면
    // 브라우저가 내부적으로 들고 있는 뷰포트 치수가 갱신되지 않아 터치 좌표가 실제 화면과 어긋나는 현상 방지용.
    // 모달이 닫혀 body 스크롤이 풀린 직후(overflow: unset 반영 이후) 스크롤을 1px 움직였다 되돌려서
    // 브라우저가 레이아웃/뷰포트를 강제로 다시 계산하도록 만든다.
    const nudgeViewportRepaint = () => {
      setTimeout(() => {
        const y = window.scrollY;
        window.scrollTo(window.scrollX, y + 1);
        requestAnimationFrame(() => window.scrollTo(window.scrollX, y));
      }, 80);
    };

    const getWeekRange = (dateStr) => {
      const d = parseDate(dateStr);
      const day = d.getDay();
      const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
      const start = new Date(d); start.setDate(diffToMonday);
      const end = new Date(start); end.setDate(start.getDate() + 6);
      return { start: formatDate(start), end: formatDate(end), label: getKoreanWeekLabel(dateStr) };
    };

    const getMonthRange = (dateStr) => {
      const d = parseDate(dateStr);
      const start = new Date(d.getFullYear(), d.getMonth(), 1);
      const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      return { start: formatDate(start), end: formatDate(end), label: `${d.getFullYear()}년 ${d.getMonth() + 1}월` };
    };

    const defaultCategories = ['아침식사', '점심식사', '저녁식사', '간식', '야식', '건강식품', '운동'];
    // ★ v0.4.4 건강식품(영양제·발효효소·유산균 등): 식사·간식으로 세지 않는다. 서버(diet-ai_v0.0.19)와 같은 이름.
    const SUPPLEMENT_CATEGORY = '건강식품';
    const isSupplementLog = (log) => log?.category === SUPPLEMENT_CATEGORY;
    const mealSlotDefinitions = [
      { key: 'breakfast', category: '아침식사', label: '아침', icon: '🌅', anchorTime: '08:00', minTime: '05:00', maxTime: '11:30' },
      { key: 'lunch', category: '점심식사', label: '점심', icon: '☀️', anchorTime: '13:00', minTime: '10:30', maxTime: '16:30' },
      { key: 'dinner', category: '저녁식사', label: '저녁', icon: '🌙', anchorTime: '19:00', minTime: '16:00', maxTime: '23:30' },
    ];
    const mealSlotByCategory = Object.fromEntries(mealSlotDefinitions.map(slot => [slot.category, slot.key]));
    const mealSlotByCategoryDetail = Object.fromEntries(mealSlotDefinitions.map(slot => [slot.category, slot]));
    const timeToMinutes = (value) => {
      const [hour, minute] = String(value || '').split(':').map(Number);
      return Number.isFinite(hour) && Number.isFinite(minute) ? hour * 60 + minute : null;
    };
    const isTimeWithinMealRange = (category, time) => {
      const slot = mealSlotByCategoryDetail[category];
      const value = timeToMinutes(time);
      if (!slot || value === null) return true;
      return value >= timeToMinutes(slot.minTime) && value <= timeToMinutes(slot.maxTime);
    };
    const getMealTimeWarning = (category, time) => {
      const slot = mealSlotByCategoryDetail[category];
      if (!slot || !time || isTimeWithinMealRange(category, time)) return null;
      return {
        ...slot,
        message: `${slot.label} 식사 시간이 ${time}로 되어 있습니다. 이 시간이 맞는지 확인해주세요.`
      };
    };
    const getDraftTitle = (category, type) => {
      if (type === 'biometrics') return '🩺 생체 기록';
      const titles = {
        '아침식사': '🌅 아침 기록',
        '점심식사': '☀️ 점심 기록',
        '저녁식사': '🌙 저녁 기록',
        '간식': '🍪 간식 기록',
        '야식': '🌃 야식 기록',
        '운동': '🏃 운동 기록',
        '건강식품': '💊 건강식품 기록',
      };
      return titles[category] || '📝 건강 기록';
    };
    const getRecordTimeLabel = (category) => category === '운동' ? '운동 시작 시각' : (category === '생체기록' ? '측정 시각' : '섭취 시각');

    // 음주 기록이 없는 날을 금주로 계산한다. 오늘은 포함하고 미래 날짜는 제외한다.
    function getAlcoholGoalProgress(start, end, today, logs, periodTarget) {
      if (!start || !end || start > end) return { days: 0, alcoholFree: 0, target: 0 };
      const dayNumber = (date) => Date.parse(date + 'T00:00:00Z') / 86400000;
      const periodDays = dayNumber(end) - dayNumber(start) + 1;
      const until = end < today ? end : today;
      const days = Math.max(0, dayNumber(until) - dayNumber(start) + 1);
      const alcoholDays = new Set(logs.filter(log =>
        log.isAlcohol && log.date >= start && log.date <= until
      ).map(log => log.date)).size;
      const goal = Number(periodTarget) || 0;
      return {
        days,
        alcoholFree: Math.max(0, days - alcoholDays),
        target: goal
      };
    }

    function averageBiometrics(rows) {
      const sums = { bpSys: 0, bpDia: 0, sugar: 0, weight: 0, sleep: 0 };
      const counts = { bpSys: 0, bpDia: 0, sugar: 0, weight: 0, sleep: 0 };
      const fields = { bpSys: 'bp_sys', bpDia: 'bp_dia', sugar: 'sugar', weight: 'weight', sleep: 'sleep_hours' };

      rows.forEach(row => {
        let raw = row.raw_input ?? row.rawInput ?? {};
        if (typeof raw === 'string') {
          try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
        }
        const bio = raw.biometrics || {};
        Object.entries(fields).forEach(([key, field]) => {
          const rawValue = bio[field];
          const value = Number(rawValue);
          if (rawValue !== null && rawValue !== undefined && rawValue !== '' && Number.isFinite(value) && value > 0) {
            sums[key] += value;
            counts[key]++;
          }
        });
      });

      const averages = {};
      Object.keys(fields).forEach(key => {
        averages[key] = counts[key] ? sums[key] / counts[key] : null;
      });
      ['bpSys', 'bpDia', 'sugar'].forEach(key => {
        if (averages[key] !== null) averages[key] = Math.round(averages[key]);
      });
      return averages;
    }

    function buildLatestBiometrics(rows) {
      const fields = ['bp_sys', 'bp_dia', 'sugar', 'weight', 'sleep_hours', 'pulse'];
      const latest = {};
      const dates = {};

      (rows || []).forEach(row => {
        let raw = row.raw_input ?? row.rawInput ?? {};
        if (typeof raw === 'string') {
          try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
        }
        const bio = raw.biometrics || {};
        fields.forEach(field => {
          const rawValue = bio[field];
          const value = Number(rawValue);
          if (latest[field] === undefined && rawValue !== null && rawValue !== undefined && rawValue !== '' && Number.isFinite(value) && value > 0) {
            latest[field] = value;
            dates[field] = row.log_date ?? row.date ?? null;
          }
        });
        if (dates.bp === undefined && Number(bio.bp_sys) > 0 && Number(bio.bp_dia) > 0) {
          dates.bp = row.log_date ?? row.date ?? null;
        }
      });

      return Object.keys(latest).length ? { ...latest, dates } : null;
    }

    // ★ v0.4.4 건강식품 궁합: AI에 맡기지 않고, 교과서에 나오는 몇 가지만 정해 둔다. 목록에 없는 조합은 아무 말도 하지 않는다.
    const SUPPLEMENT_NUTRIENTS = {
      calcium: { label: '칼슘', words: ['칼슘', 'calcium'] },
      iron: { label: '철분', words: ['철분', '헴철', 'iron'] },
      vitaminC: { label: '비타민 C', words: ['비타민c', 'vitaminc', '아스코르브'] },
      zinc: { label: '아연', words: ['아연', 'zinc'] },
      omega3: { label: '오메가3', words: ['오메가3', '오메가-3', 'omega3', 'omega-3', '크릴오일', 'epa', 'dha'] },
      vitaminD: { label: '비타민 D', words: ['비타민d', 'vitamind'] },
      vitaminE: { label: '비타민 E', words: ['비타민e', 'vitamine'] },
      vitaminK: { label: '비타민 K', words: ['비타민k', 'vitamink'] },
    };
    const SUPPLEMENT_PAIR_RULES = [
      { a: 'calcium', b: 'iron', kind: 'caution', spacing: true, text: '칼슘과 철분은 같이 먹으면 서로 흡수가 떨어질 수 있어요. 2시간쯤 간격을 두는 게 일반적이에요.' },
      { a: 'zinc', b: 'iron', kind: 'caution', spacing: true, text: '아연과 철분을 많이 같이 먹으면 서로 흡수를 방해할 수 있어요. 시간 간격을 두는 게 좋아요.' },
      { a: 'iron', b: 'vitaminC', kind: 'good', spacing: false, text: '철분은 비타민 C와 함께 먹으면 흡수가 잘돼요.' },
    ];
    function supplementNutrientsOf(log) {
      const text = [log?.foodName, ...(Array.isArray(log?.ingredients) ? log.ingredients : [])].join(' ').toLowerCase().replace(/\s+/g, '');
      return Object.keys(SUPPLEMENT_NUTRIENTS).filter(key => SUPPLEMENT_NUTRIENTS[key].words.some(w => text.includes(w)));
    }
    const minutesOfTime = (t) => { const [h, m] = String(t || '').split(':').map(Number); return Number.isFinite(h) ? h * 60 + (m || 0) : null; };
    // 이 기록과 같은 날 건강식품 기록(자기 자신 포함) 사이에서 목록에 있는 조합을 찾는다.
    function supplementPairNotes(log, dayLogs) {
      if (!isSupplementLog(log)) return [];
      const mine = supplementNutrientsOf(log);
      if (!mine.length) return [];
      const others = (dayLogs || []).filter(l => isSupplementLog(l) && l.date === log.date);
      const notes = [];
      SUPPLEMENT_PAIR_RULES.forEach(rule => {
        [[rule.a, rule.b], [rule.b, rule.a]].forEach(([x, y]) => {
          if (!mine.includes(x) || notes.some(n => n.rule === rule)) return;
          const partner = others.find(l => supplementNutrientsOf(l).includes(y));
          if (!partner) return;
          const gap = partner.id === log.id ? 0 : Math.abs((minutesOfTime(partner.time) ?? 0) - (minutesOfTime(log.time) ?? 0));
          if (rule.spacing && gap >= 120) {
            notes.push({ rule, kind: 'ok', text: `${SUPPLEMENT_NUTRIENTS[x].label}과 ${SUPPLEMENT_NUTRIENTS[y].label}을 2시간 넘게 간격을 두고 드셨어요 👍` });
          } else {
            notes.push({ rule, kind: rule.kind, text: rule.text });
          }
        });
      });
      return notes;
    }

    // 건강식품 기록 아래: 포장 표시 기능성, 궁합 목록, 접어 둔 AI 참고.
    // ★ v0.5.1 종목 설명 창: 부위·장비, 시작/끝 자세 그림(1초마다 번갈아), 하는 법, 조심할 점, 쉬운/어려운 버전
    function ExerciseInfoSheet({ entry, library, onClose }) {

        return () => clearInterval(timer);
      }, [entry?.key]);
      if (!entry) return null;
      const parts = exerciseTargetLabels(entry.targets);
      const equipment = library?.equipmentLabels?.[entry.equipment];
      const youtube = `https://www.youtube.com/results?search_query=${encodeURIComponent(entry.name + ' 자세')}`;
      return (
        <div className="fixed inset-0 z-[110] bg-black/50 flex items-end sm:items-center justify-center" onClick={onClose} data-exercise-info>
          <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex items-start justify-between gap-3 mb-2">
              <h2 className="text-lg font-bold text-gray-800 leading-snug">{entry.name}</h2>

            <div className="flex flex-wrap gap-1.5 mb-3">
              {equipment && <span className="text-[11px] font-bold px-2 py-1 rounded-lg bg-gray-100 text-gray-600">{equipment}</span>}
              {parts.map(p => <span key={p} className="text-[11px] font-bold px-2 py-1 rounded-lg bg-green-50 text-green-700">{p}</span>)}
            </div>
            {entry.image && !imageFailed && (
              <figure className="mb-3">
                <img src={`${library?.imageBase || ''}${entry.image}/${frame}.jpg`} alt={`${entry.name} ${frame === 0 ? '시작' : '끝'} 자세`}
                  onError={() => setImageFailed(true)} className="w-full h-48 object-contain rounded-2xl bg-gray-50" />
                <figcaption className="text-[10px] text-gray-400 mt-1">{frame === 0 ? '시작 자세' : '끝 자세'} · {library?.imageCredit}</figcaption>

            <p className="text-sm text-gray-700 leading-relaxed mb-4">{entry.summary}</p>
            <h3 className="text-xs font-bold text-gray-500 mb-1.5">하는 법</h3>
            <ol className="list-decimal pl-5 space-y-1 text-sm text-gray-700 leading-relaxed mb-4">
              {(entry.steps || []).map((s, i) => <li key={i}>{s}</li>)}
            </ol>
            {(entry.mistakes || []).length > 0 && (
              <>
                <h3 className="text-xs font-bold text-amber-700 mb-1.5">이것만 조심</h3>
                <ul className="list-disc pl-5 space-y-1 text-sm text-gray-700 leading-relaxed mb-4">
                  {entry.mistakes.map((s, i) => <li key={i}>{s}</li>)}

            {(entry.easier || entry.harder) && (
              <div className="grid grid-cols-2 gap-2 mb-4 text-xs">

                <div className="bg-gray-50 rounded-xl p-3"><p className="font-bold text-gray-500 mb-1">더 어렵게</p><p className="text-gray-700">{entry.harder || '-'}</p></div>
              </div>
            )}
            <a href={youtube} target="_blank" rel="noopener noreferrer" className="block text-center text-sm font-bold text-red-600 bg-red-50 rounded-xl py-3">▶ 유튜브에서 자세 영상 찾기</a>
            {entry.review && <p className="text-[11px] text-amber-700 mt-3 leading-relaxed">이 설명은 아직 확인 중이에요. 실제로 한 운동과 다르면 알려주세요.</p>}
          </div>
        </div>
      );
    }

    function SupplementInfoBox({ log, dayLogs }) {
      const [open, setOpen] = useState(false);
      if (!isSupplementLog(log)) return null;
      const info = log.supplementInfo || {};
      const notes = supplementPairNotes(log, dayLogs);
      return (
        <div className="mt-2 space-y-1.5" data-supplement-info>
          {info.labelClaim && (
            <p className="text-xs bg-violet-50 text-violet-800 rounded-xl px-3 py-2 break-keep" data-supplement-label>
              📦 <b>포장 표시 기능성</b> · {info.labelClaim}
            </p>
          )}
          {notes.map((note, i) => (
            <p key={i} className={`text-xs rounded-xl px-3 py-2 break-keep ${note.kind === 'caution' ? 'bg-amber-50 text-amber-800' : 'bg-emerald-50 text-emerald-800'}`} data-supplement-pair>
              {note.kind === 'caution' ? '⚠️' : '🔗'} {note.text}
            </p>
          ))}
          {info.aiNote && (
            <div className="bg-gray-50 rounded-xl px-3 py-2" data-supplement-ai>
              <button type="button" onClick={() => setOpen(!open)} className="w-full text-left text-[11px] font-bold text-gray-500">
                🤖 AI 참고 · 확인 안 된 정보 {open ? '▲' : '▼'}
              </button>
              {open && (
                <div className="mt-1.5 space-y-1">
                  <p className="text-xs text-gray-600 leading-snug whitespace-pre-wrap break-keep">{info.aiNote}</p>
                  <p className="text-[11px] text-gray-400 break-keep">AI가 의학 근거를 바탕으로 쓰려고 했지만 틀릴 수 있어요. 드시는 약이 있으면 약사와 확인하세요.</p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ★ v0.4.4 복용 관리: 오래 먹는 건강식품·약을 등록하고 날짜·시간대별로 체크한다(체크에는 AI를 쓰지 않음).
    // 약(medicine)은 AI 설명·팁·궁합이 없고 AI 리포트에도 보내지 않는다.
    const INTAKE_SLOTS = [
      { key: 'morning', label: '아침', time: '08:00' },
      { key: 'lunch', label: '점심', time: '12:30' },
      { key: 'evening', label: '저녁', time: '19:00' },
      { key: 'bedtime', label: '자기 전', time: '22:00' },
    ];
    const intakeSlotLabel = (key) => (INTAKE_SLOTS.find(s => s.key === key) || INTAKE_SLOTS[0]).label;
    const intakeKindLabel = (kind) => kind === 'medicine' ? '복용약' : '건강식품';
    const intakeCheckKey = (itemId, date, slot) => `${itemId}|${date}|${slot}`;

    // 그 날짜에 먹는 항목인가(시작일~종료일, 복용 중단한 날까지).
    function isIntakeDue(item, date) {
      if (!item || !date) return false;
      if (item.start_date && date < item.start_date) return false;
      if (item.end_date && date > item.end_date) return false;
      if (item.stopped_at && date > formatDate(new Date(item.stopped_at))) return false;
      return true;
    }

    // 그날 체크할 줄: 약 먼저, 그다음 건강식품. 시간대 순서.
    function intakeDueRows(items, date) {
      const order = (k) => INTAKE_SLOTS.findIndex(s => s.key === k);
      const rows = [];
      (items || []).filter(item => isIntakeDue(item, date)).forEach(item => {
        [...(item.times || [])].sort((a, b) => order(a) - order(b)).forEach(slot => rows.push({ item, slot }));
      });
      return rows.sort((a, b) => (a.item.kind === b.item.kind ? 0 : a.item.kind === 'medicine' ? -1 : 1)
        || order(a.slot) - order(b.slot) || (a.item.sort_order || 0) - (b.item.sort_order || 0) || String(a.item.name).localeCompare(String(b.item.name)));
    }

    // 체크한 건강식품을 궁합 계산용 기록 모양으로(약은 넣지 않는다).
    function intakeSupplementLogs(items, checks, date) {
      const byId = Object.fromEntries((items || []).map(i => [i.id, i]));
      return Object.values(checks || {}).filter(c => c.check_date === date && byId[c.item_id]?.kind === 'supplement').map(c => ({
        id: 'intake-' + c.item_id + '-' + c.slot, date, time: String(c.taken_time || '').slice(0, 5),
        category: SUPPLEMENT_CATEGORY, foodName: byId[c.item_id].name, ingredients: [byId[c.item_id].name], fromIntake: true,
      }));
    }

    // 먹는 때 팁: 근거가 확실한 것만 앱에 정해 둔다. 목록에 없으면 아무것도 표시하지 않는다. 약에는 쓰지 않는다.
    const INTAKE_TIP_RULES = [
      { keys: ['omega3', 'vitaminD', 'vitaminE', 'vitaminK'], text: '식후에 (기름과 함께 먹으면 흡수가 잘돼요)' },
      { keys: ['iron'], text: '공복에 흡수가 잘되지만, 속이 불편하면 식후에' },
      { keys: ['calcium'], text: '한 번에 많이보다 나눠서' },
    ];
    function intakeTipsFor(item) {
      if (!item || item.kind !== 'supplement') return [];
      const found = supplementNutrientsOf({ foodName: item.name, ingredients: [] });
      return INTAKE_TIP_RULES.filter(rule => rule.keys.some(k => found.includes(k))).map(rule => rule.text);
    }

    // ★ v0.4.5 최근 n일 복용률. 오늘은 체크한 것만 셈(아직 시간이 안 된 것으로 깎지 않는다).
    // 앱에 등록하기 전 날짜(시작일을 앞으로 적어 둔 경우)는 체크할 수 없었으니 빼되, 그날 체크가 있으면 센다.
    const intakeRegisteredDate = (item) => item?.created_at ? formatDate(new Date(item.created_at)) : null;
    function intakeAdherence(items, checks, today, days = 30) {
      const perItem = {};
      let due = 0, done = 0;
      for (let i = days - 1; i >= 0; i--) {
        const d = parseDate(today); d.setDate(d.getDate() - i);
        const date = formatDate(d);
        intakeDueRows(items, date).forEach(({ item, slot }) => {
          const checked = Boolean(checks[intakeCheckKey(item.id, date, slot)]);
          if (date === today && !checked) return;
          const registered = intakeRegisteredDate(item);
          if (registered && date < registered && !checked) return;
          const p = perItem[item.id] || (perItem[item.id] = { due: 0, done: 0 });
          p.due++; due++;
          if (checked) { p.done++; done++; }
        });
      }
      const rate = (x) => x.due ? Math.round(x.done / x.due * 100) : null;
      Object.values(perItem).forEach(p => { p.rate = rate(p); });
      const byKind = (kind) => {
        const ids = (items || []).filter(i => i.kind === kind).map(i => i.id);
        const sum = ids.reduce((acc, id) => ({ due: acc.due + (perItem[id]?.due || 0), done: acc.done + (perItem[id]?.done || 0) }), { due: 0, done: 0 });
        return rate(sum);
      };
      return { due, done, rate: rate({ due, done }), perItem, medicine: byKind('medicine'), supplement: byKind('supplement') };
    }

    // ★ v0.4.7 기간(start~end) 복용 체크 수. 오늘 이후는 빼고, 오늘은 체크한 것만, 등록 전 날짜는 체크가 있을 때만 센다.
    function intakeRangeCounts(items, checks, start, end, today, kind) {
      const kindItems = (items || []).filter(i => i.kind === kind);
      let due = 0, done = 0;
      const last = end < today ? end : today;
      for (let d = parseDate(start); formatDate(d) <= last; d.setDate(d.getDate() + 1)) {
        const date = formatDate(d);
        intakeDueRows(kindItems, date).forEach(({ item, slot }) => {
          const checked = Boolean(checks[intakeCheckKey(item.id, date, slot)]);
          if (date === today && !checked) return;
          const registered = intakeRegisteredDate(item);
          if (registered && date < registered && !checked) return;
          due++; if (checked) done++;
        });
      }
      return { due, done, rate: due ? Math.round(done / due * 100) : null };
    }

    // ★ v0.4.5 루틴 "복용 체크를 다 하면 자동 완료": 루틴 시간대(아침·점심·저녁·자기 전)의 등록 항목을 모두 체크했으면 완료.
    // 그 밖의 시간대·언제든 루틴은 그날 전체. 그날 먹을 등록 항목이 없으면 사진·글 건강식품 기록이 있을 때 완료.
    function intakeRoutineAutoDone(routine, date, items, checks, hasSupplementLog) {
      if (!routine?.link_intake) return false;
      const rows = intakeDueRows(items, date);
      const slotRows = INTAKE_SLOTS.some(x => x.key === routine.time_slot) ? rows.filter(r => r.slot === routine.time_slot) : rows;
      if (slotRows.length) return slotRows.every(({ item, slot }) => Boolean(checks[intakeCheckKey(item.id, date, slot)]));
      return Boolean(hasSupplementLog);
    }

    // 홈: 루틴 칸 아래 한 줄. 오늘 복용 n/m과 아직 안 한 것.
    function HomeIntakeStrip({ items, checks, date, isToday, onOpen }) {
      const rows = intakeDueRows(items, date);
      if (!rows.length) return null;
      const done = rows.filter(({ item, slot }) => checks[intakeCheckKey(item.id, date, slot)]);
      // 남은 것은 시간대 순서로(약·건강식품 구분 없이)
      const slotOrder = (k) => INTAKE_SLOTS.findIndex(x => x.key === k);
      const left = rows.filter(r => !done.includes(r)).sort((a, b) => slotOrder(a.slot) - slotOrder(b.slot));
      const leftText = left.slice(0, 2).map(({ item, slot }) => `${item.name}(${intakeSlotLabel(slot)})`).join(', ') + (left.length > 2 ? ` +${left.length - 2}` : '');
      return (
        <button type="button" onClick={onOpen} className="w-full flex items-center gap-2 bg-white rounded-3xl px-4 py-2.5 shadow-sm border border-gray-100 text-left" data-home-intake>
          <span className="text-sm font-bold text-gray-800 whitespace-nowrap">💊 {isToday ? '오늘' : '이 날'} 복용 <span className="text-violet-600">{done.length}/{rows.length}</span></span>
          <span className="min-w-0 flex-1 truncate text-[11px] text-gray-400">{left.length ? `남은: ${leftText}` : '다 챙겼어요 🎉'}</span>
          <span className="text-xs font-bold text-violet-600 shrink-0">→</span>
        </button>
      );
    }

    // ★ v0.4.8 시간대가 끝나는 시각(이후에 체크하면 "늦게 체크"로 보고 시각을 확인하게 한다). 자기 전은 하루 끝까지.
    const INTAKE_SLOT_END_HOUR = { morning: 11, lunch: 15, evening: 21, bedtime: 24 };
    function isIntakeSlotPast(slot, isToday, now = new Date()) {
      if (!isToday) return true;
      return now.getHours() >= (INTAKE_SLOT_END_HOUR[slot] ?? 24);
    }
