      const goMain = () => { setView('main'); setQuery(''); setAdding(false); setPartFilter(null); setDraft(null); window.scrollTo(0, 0); };
      const openPlace = (key) => { setView(key); setQuery(''); setAdding(false); setPartFilter(null); window.scrollTo(0, 0); };
      const closeSearch = () => { setAdding(false); setQuery(''); setPartFilter(null); };
      const startSetup = async () => {
        setView('setup'); setRecords(null); setRecordsError(false); window.scrollTo(0, 0);
        setHomeEq(setupDone ? current.homeEquipment : ['pullup_bar']);
        try {
          const list = collectRecordedExercises(await loadRecords(), index);
          const init = {};
          // 목록을 이미 만들었으면(처음 설정을 안 거쳤어도) 지금 목록에서 시작한다.
          const hasLists = setupDone || current.company.length > 0 || current.apartment.length > 0;
          list.forEach(r => { init[r.key] = hasLists ? choiceFromPlaces(current, r.key) : 'both'; });
          setChoices(init);
          setRecords(list);
        } catch {
          setRecordsError(true);
          setRecords([]);
        }
      };
      const finishSetup = async () => {
        const next = { ...applyPlaceChoices(current, records || [], choices), homeEquipment: homeEq };
        if (await save(next)) goMain();
      };
      const nameButton = (key, name) => {
        const entry = byKey.get(key);
        if (entry?.custom) {
          // 직접 추가한 종목은 설명이 없어 유튜브 자세 검색만 연결한다.
          return (
            <span className="font-bold text-gray-800" data-custom-exercise>{name}
              <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(name + ' 자세')}`} target="_blank" rel="noopener noreferrer"
                className="ml-1 text-[11px] font-bold text-red-600" aria-label={`${name} 자세 영상 찾기`}>▶영상</a>
            </span>
          );
        }
        return entry ? (
          <button type="button" onClick={() => onShowInfo(entry)} data-exercise-name
            className="font-bold text-green-800 underline decoration-dotted underline-offset-2 text-left">{name} ⓘ</button>
        ) : <span className="font-bold text-gray-700">{name}</span>;
      };
      const shortDate = (d) => d ? `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}` : '';
      const targetsText = (entry) => {
        const labels = shortTargetLabels(entry);
        return labels.length ? <span className="text-[11px] text-gray-400 ml-1.5" data-targets>{labels.join('·')}</span> : null;
      };
      // 부위 묶음: 제목을 누르면 접고 편다(처음에는 모두 펼침).
      const partGroups = (scope, groups, renderItem) => groups.map(g => {
        const id = `${scope}:${g.key}`;
        const closed = collapsed.has(id);
        return (
          <div key={g.key} className="border-b border-gray-100 last:border-0 pb-2 last:pb-0" data-part-group={g.key}>
            <button type="button" onClick={() => setCollapsed(prev => { const next = new Set(prev); if (closed) next.delete(id); else next.add(id); return next; })}
              className="w-full flex items-center justify-between py-1.5 text-left" aria-expanded={!closed}>
              <span className="font-bold text-gray-800">{g.label} <span className="text-green-600 text-sm">{g.items.length}</span></span>
              <span className="text-xs text-gray-400">{closed ? '▸' : '▾'}</span>
            </button>
            {!closed && <div className="space-y-2 pt-1 pb-1">{g.items.map(renderItem)}</div>}
          </div>
        );
      });
      // 빈 부위 안내: 회사·아파트는 누르면 그 부위 종목 검색으로, 집은 안내만.
      const missingNotice = (entries, placeLabel, onPick) => {
        const missing = missingSubParts(entries);
        if (!missing.length) return null;
        return (
          <div className="bg-amber-50 rounded-2xl p-3" data-missing-parts>
            <p className="text-xs font-bold text-amber-800 mb-2">{placeLabel} 목록에 없는 부위 {missing.length}곳</p>
            <div className="flex flex-wrap gap-1.5">
              {missing.map(m => onPick ? (
                <button key={m.target} type="button" onClick={() => onPick(m.target)} data-missing-part={m.target}
                  className="text-xs font-bold text-amber-900 bg-white border border-amber-200 px-2 py-1 rounded-lg">{m.part}·{m.label} +</button>
              ) : (
                <span key={m.target} data-missing-part={m.target} className="text-xs font-bold text-amber-900 bg-white border border-amber-200 px-2 py-1 rounded-lg">{m.part}·{m.label}</span>
              ))}
            </div>
            <p className="text-[11px] text-amber-700 mt-2 leading-relaxed">{onPick
              ? '코치가 덜 한 부위를 채워 주려면 그 부위 운동이 이 장소에 있어야 해요. 눌러서 추가할 종목을 찾아보세요.'
              : '집에 기구를 더 고르면 채워질 수 있어요.'}</p>
          </div>
        );
      };
      const targetLabel = (target) => {
        const m = missingSubParts([]).find(x => x.target === target);
        return m ? `${m.part}·${m.label}` : '';
      };

      if (library && session) {
        return <WorkoutSession session={session} setSession={setSession} library={library} index={index} byKey={byKey} places={current}
          onSavePlaces={onSave} allLogs={allLogs} onShowInfo={onShowInfo} onSaveLog={onSaveLog} checkDuplicate={checkDuplicate} loadYesterday={loadYesterday} />;
      }

      if (!library) {
        return (
          <div className="p-4 animate-fade-in" data-workout-tab>
            <div className="bg-white rounded-3xl p-5 text-sm text-gray-500 text-center">종목 사전을 불러오는 중이에요. 인터넷 연결을 확인해 주세요.</div>
          </div>
        );
      }

      if (view === 'setup') {
        const list = records || [];
        return (
          <div className="p-4 space-y-4 animate-fade-in" data-workout-setup>
            <button type="button" onClick={goMain} className="text-sm font-bold text-gray-500">← 운동</button>
            <div className="bg-white rounded-3xl p-5 shadow-sm">
              <h2 className="font-bold text-lg text-gray-800 mb-1">어디서 한 운동인가요?</h2>
              <p className="text-xs text-gray-500 leading-relaxed">지금까지 기록한 근력 운동이에요. 두 곳 다 있으면 그대로 두고, 한 곳에만 있는 것만 바꾸세요. 하지 않을 운동은 '안 함'으로 두세요. 나중에 언제든 고칠 수 있어요.</p>
            </div>
            {records === null && <p className="text-sm text-blue-500 font-bold animate-pulse px-1">운동 기록을 불러오는 중입니다.</p>}
            {recordsError && <p className="text-sm text-red-500 font-bold px-1">운동 기록을 불러오지 못했어요. 장비만 고르고 종목은 나중에 추가해도 돼요.</p>}
            {records !== null && !recordsError && list.length === 0 && (
              <p className="text-sm text-gray-500 px-1">기록된 근력 운동이 아직 없어요. 장소별 화면에서 종목을 직접 추가할 수 있어요.</p>
            )}
            {list.length > 0 && (
              <div className="bg-white rounded-3xl p-4 shadow-sm space-y-2" data-setup-list>
                {partGroups('setup', groupExercisesByPart(list, r => r.entry), r => (
                  <div key={r.key} className="pb-2" data-setup-row={r.key}>
                    <div className="flex items-baseline justify-between gap-2 mb-1.5 text-sm">
                      <span className="min-w-0">{nameButton(r.key, r.name)}{targetsText(r.entry)}</span>
                      <span className="text-[11px] text-gray-400 whitespace-nowrap">{r.count}번 · 마지막 {shortDate(r.lastDate)}</span>
                    </div>
                    <div className="grid grid-cols-4 gap-1 bg-gray-50 p-1 rounded-xl">
                      {PLACE_CHOICES.map(([value, label]) => (
                        <button key={value} type="button" onClick={() => setChoices(c => ({ ...c, [r.key]: value }))}
                          className={`py-1.5 text-xs font-bold rounded-lg transition ${(choices[r.key] || 'both') === value ? (value === 'none' ? 'bg-gray-600 text-white' : 'bg-green-600 text-white') : 'text-gray-500'}`}>{label}</button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div className="bg-white rounded-3xl p-4 shadow-sm" data-setup-home>
              <h3 className="font-bold text-gray-800 mb-1">🏠 집에 있는 운동 기구</h3>
              <p className="text-xs text-gray-500 mb-3">맨몸 운동은 항상 들어가요. 있는 것만 고르세요.</p>
              <div className="flex flex-wrap gap-2">
                {HOME_EQUIPMENT_OPTIONS.map(([value, label]) => {
                  const on = homeEq.includes(value);
                  return (
                    <button key={value} type="button" onClick={() => setHomeEq(eq => on ? eq.filter(x => x !== value) : [...eq, value])}
                      className={`px-3 py-2 rounded-xl text-sm font-bold border transition ${on ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-500 border-gray-200'}`}>{on ? '✓ ' : ''}{label}</button>
                  );
                })}
              </div>
            </div>
            <button type="button" disabled={saving || records === null} onClick={finishSetup}
              className="w-full py-3.5 rounded-2xl bg-green-600 text-white font-bold disabled:opacity-50 active:scale-[0.98] transition">{saving ? '저장 중' : '이대로 저장'}</button>
          </div>
        );
      }

      const discovered = allLogs ? discoverExercises(allLogs, index, current) : [];
      if (view === 'discover') {
        const startDraft = (r) => setDraft({ key: r.key, name: r.name, targets: [], equipment: 'machine', place: 'both' });
        const toggleTarget = (t) => setDraft(d => ({ ...d, targets: d.targets.includes(t) ? d.targets.filter(x => x !== t) : [...d.targets, t].slice(0, 3) }));
        const saveDraft = async () => {
          const d = draft;
          const add = (list, on) => on && !list.includes(d.key) ? [...list, d.key] : list;
          const next = {
            ...current,
            customExercises: { ...(current.customExercises || {}), [d.key]: { name: d.name, targets: d.targets, equipment: d.equipment } },
            company: add(current.company, ['both', 'company'].includes(d.place)),
            apartment: add(current.apartment, ['both', 'apartment'].includes(d.place)),
          };
          if (await save(next)) setDraft(null);
        };
        const ignore = (r) => save({ ...current, ignored: [...(current.ignored || []), r.key] });
        const ignoredCount = (current.ignored || []).length;
        return (
          <div className="p-4 space-y-4 animate-fade-in" data-workout-discover>
            <button type="button" onClick={goMain} className="text-sm font-bold text-gray-500">← 운동</button>
            <div className="bg-white rounded-3xl p-5 shadow-sm">
              <h2 className="font-bold text-lg text-gray-800 mb-1">🔎 기록에서 찾은 새 운동</h2>
              <p className="text-xs text-gray-500 leading-relaxed">기록에는 있는데 종목 사전에 없는 이름이에요. 운동이면 부위만 골라 추가하고, 운동이 아니면 '운동 아님'을 누르세요.</p>
            </div>
            {allLogs === null && <p className="text-sm text-blue-500 font-bold animate-pulse px-1">운동 기록을 불러오는 중입니다.</p>}
            {allLogs !== null && discovered.length === 0 && (
              <p className="text-sm text-gray-500 px-1">새로 찾은 운동이 없어요. 기록한 운동이 모두 사전에 있어요.</p>
            )}
            {discovered.map(r => (
              <div key={r.key} className="bg-white rounded-3xl p-4 shadow-sm" data-discovered={r.key}>
                <div className="flex items-baseline justify-between gap-2">
                  <span className="font-bold text-gray-800">{r.name}</span>
                  <span className="text-[11px] text-gray-400 whitespace-nowrap">{r.count}번 · 마지막 {shortDate(r.lastDate)}</span>
                </div>
                {draft?.key !== r.key ? (
                  <div className="grid grid-cols-2 gap-2 mt-3">
                    <button type="button" onClick={() => startDraft(r)} className="py-2 rounded-xl bg-green-600 text-white text-sm font-bold">추가하기</button>
                    <button type="button" disabled={saving} onClick={() => ignore(r)} className="py-2 rounded-xl bg-gray-100 text-gray-600 text-sm font-bold disabled:opacity-50">운동 아님</button>
                  </div>
                ) : (
                  <div className="mt-3 space-y-3" data-discover-form>
                    <div>
                      <p className="text-xs font-bold text-gray-700 mb-1.5">주로 쓰는 부위 (1~3개, 처음 고른 것이 묶음 기준)</p>
                      <div className="space-y-1.5">
                        {EXERCISE_PARTS.map(p => (
                          <div key={p.key} className="flex flex-wrap items-center gap-1">
                            <span className="text-[11px] font-bold text-gray-400 w-8 shrink-0">{p.label}</span>
                            {p.subs.map(([sub, label]) => {
                              const t = `${p.key}.${sub}`;
                              const order = draft.targets.indexOf(t);
                              return (
                                <button key={t} type="button" onClick={() => toggleTarget(t)} data-target-chip={t}
                                  className={`px-2 py-1 rounded-lg text-xs font-bold border ${order >= 0 ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-600 border-gray-200'}`}>
                                  {order === 0 ? '① ' : ''}{label}
                                </button>
                              );
                            })}
                          </div>
                        ))}
                      </div>
                    </div>
                    <div>
                      <p className="text-xs font-bold text-gray-700 mb-1.5">장비</p>
                      <div className="flex flex-wrap gap-1">
                        {CUSTOM_EQUIPMENT.map(eq => (
                          <button key={eq} type="button" onClick={() => setDraft(d => ({ ...d, equipment: eq }))} data-equipment-chip={eq}
                            className={`px-2 py-1 rounded-lg text-xs font-bold border ${draft.equipment === eq ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-600 border-gray-200'}`}>{library.equipmentLabels?.[eq] || eq}</button>
                        ))}
                      </div>
                    </div>
                    <div>
                      <p className="text-xs font-bold text-gray-700 mb-1.5">할 수 있는 곳</p>
                      <div className="grid grid-cols-4 gap-1 bg-gray-50 p-1 rounded-xl">
                        {PLACE_CHOICES.map(([value, label]) => (
                          <button key={value} type="button" onClick={() => setDraft(d => ({ ...d, place: value }))}
                            className={`py-1.5 text-xs font-bold rounded-lg ${draft.place === value ? (value === 'none' ? 'bg-gray-600 text-white' : 'bg-green-600 text-white') : 'text-gray-500'}`}>{label}</button>
                        ))}
                      </div>
                      <p className="text-[11px] text-gray-400 mt-1">맨몸이나 집에 있는 기구로 하는 운동은 집 목록에도 자동으로 들어가요.</p>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <button type="button" onClick={() => setDraft(null)} className="py-2 rounded-xl bg-gray-100 text-gray-600 text-sm font-bold">취소</button>
                      <button type="button" disabled={saving || draft.targets.length === 0} onClick={saveDraft}
                        className="py-2 rounded-xl bg-green-600 text-white text-sm font-bold disabled:opacity-50">{saving ? '저장 중' : draft.targets.length ? '저장' : '부위를 골라 주세요'}</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
            {ignoredCount > 0 && (
              <button type="button" disabled={saving} onClick={() => save({ ...current, ignored: [] })} className="w-full text-sm font-bold text-gray-500 py-2 disabled:opacity-50">
                '운동 아님'으로 숨긴 이름 {ignoredCount}개 다시 보기
              </button>
            )}
          </div>
        );
      }

      if (view === 'company' || view === 'apartment') {
        const place = WORKOUT_PLACES.find(p => p.key === view);
        const keys = current[view];
        const other = view === 'company' ? 'apartment' : 'company';
        const results = adding ? searchExerciseLibrary(library, query, keys, partFilter).slice(0, 30) : [];
        const update = (nextKeys) => save({ ...current, [view]: nextKeys });
        const pickMissing = (target) => {
          setAdding(true); setQuery(''); setPartFilter(target);
          setTimeout(() => document.querySelector('[data-place-search]')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 50);
        };
        return (
          <div className="p-4 space-y-4 animate-fade-in" data-workout-place={view}>
            <button type="button" onClick={goMain} className="text-sm font-bold text-gray-500">← 운동</button>
            <div className="bg-white rounded-3xl p-5 shadow-sm">
              <h2 className="font-bold text-lg text-gray-800">{place.icon} {place.label}에서 할 수 있는 운동 <span className="text-green-600">{keys.length}</span></h2>
              <p className="text-xs text-gray-500 mt-1">여기 없는 기구는 빼고, 새로 생긴 기구는 추가하세요. 코치는 이 목록 안에서만 추천해요.</p>
            </div>
            {missingNotice(keys.map(k => byKey.get(k)).filter(Boolean), place.label, pickMissing)}
            <div className="bg-white rounded-3xl p-4 shadow-sm">
              {keys.length === 0 && <p className="text-sm text-gray-400 text-center py-4">아직 종목이 없어요.</p>}
              <div className="space-y-2">
                {partGroups(view, groupExercisesByPart(keys, k => byKey.get(k)), key => (
                  <div key={key} className="flex items-center justify-between gap-2 text-sm" data-place-exercise={key}>
                    <div className="min-w-0">{nameButton(key, placeExerciseName(key, byKey))}{targetsText(byKey.get(key))}</div>
                    <button type="button" disabled={saving} onClick={() => update(keys.filter(k => k !== key))}
                      aria-label={`${placeExerciseName(key, byKey)} 빼기`} className="shrink-0 text-xs font-bold text-gray-500 bg-gray-100 px-2.5 py-1.5 rounded-lg disabled:opacity-50">빼기</button>
                  </div>
                ))}
              </div>
            </div>
            {!adding ? (
              <div className="grid grid-cols-2 gap-2">
                <button type="button" onClick={() => setAdding(true)} className="py-3 rounded-2xl bg-green-600 text-white font-bold text-sm">+ 종목 추가</button>
                <button type="button" disabled={saving} onClick={() => update([...new Set([...keys, ...current[other]])])}
                  className="py-3 rounded-2xl bg-white border border-gray-200 text-gray-600 font-bold text-sm disabled:opacity-50">{WORKOUT_PLACES.find(p => p.key === other).label} 목록 합치기</button>
              </div>
            ) : (
              <div className="bg-white rounded-3xl p-4 shadow-sm" data-place-search>
                <div className="flex gap-2 mb-3">
                  <input value={query} onChange={e => setQuery(e.target.value)} placeholder="종목 이름 (예: 레그 컬, 풀다운)" autoFocus
                    className="flex-1 min-w-0 border border-gray-200 rounded-xl px-3 py-2 text-sm" />
                  <button type="button" onClick={closeSearch} className="text-sm font-bold text-gray-500 px-2">닫기</button>
                </div>
                {partFilter && (
                  <button type="button" onClick={() => setPartFilter(null)} data-part-filter={partFilter}
                    className="mb-3 text-xs font-bold text-amber-900 bg-amber-50 border border-amber-200 px-2 py-1 rounded-lg">{targetLabel(partFilter)} 운동만 보는 중 ✕</button>
                )}
                {results.length === 0 && <p className="text-xs text-gray-400 py-2">{partFilter ? '이 부위 종목은 모두 목록에 있거나 사전에 없어요.' : '찾는 종목이 사전에 없어요. 다른 이름으로 찾아보세요.'}</p>}
                <div className="space-y-2 max-h-80 overflow-y-auto">
                  {results.map(e => (
                    <div key={e.key} className="flex items-center justify-between gap-2 text-sm" data-search-result={e.key}>
                      <ExerciseThumb entry={e} library={library} />
                      <div className="min-w-0 flex-1">
                        {nameButton(e.key, e.name)}{targetsText(e)}
                        <span className="text-[11px] text-gray-400 ml-1.5">· {library.equipmentLabels?.[e.equipment]}</span>
                      </div>
                      <button type="button" disabled={saving} onClick={() => update([...keys, e.key])}
                        className="shrink-0 text-xs font-bold text-white bg-green-600 px-2.5 py-1.5 rounded-lg disabled:opacity-50">추가</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      }

      if (view === 'home') {
        const list = homeExercisesFor(library, current.homeEquipment);
        const toggle = (value) => save({ ...current, homeEquipment: current.homeEquipment.includes(value) ? current.homeEquipment.filter(x => x !== value) : [...current.homeEquipment, value] });
        return (
          <div className="p-4 space-y-4 animate-fade-in" data-workout-place="home">
            <button type="button" onClick={goMain} className="text-sm font-bold text-gray-500">← 운동</button>
            <div className="bg-white rounded-3xl p-5 shadow-sm">
              <h2 className="font-bold text-lg text-gray-800 mb-1">🏠 집에 있는 운동 기구</h2>
              <p className="text-xs text-gray-500 mb-3">맨몸 운동은 항상 들어가요. 고른 기구로 하는 운동이 아래 목록에 더해져요.</p>
              <div className="flex flex-wrap gap-2">
                {HOME_EQUIPMENT_OPTIONS.map(([value, label]) => {
                  const on = current.homeEquipment.includes(value);
                  return (
                    <button key={value} type="button" disabled={saving} onClick={() => toggle(value)}
                      className={`px-3 py-2 rounded-xl text-sm font-bold border transition disabled:opacity-50 ${on ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-500 border-gray-200'}`}>{on ? '✓ ' : ''}{label}</button>
                  );
                })}
              </div>
            </div>
            {missingNotice(list, '집', null)}
            <div className="bg-white rounded-3xl p-4 shadow-sm">
              <h3 className="font-bold text-gray-800 mb-2">집에서 할 수 있는 운동 <span className="text-green-600">{list.length}</span></h3>
              <div className="space-y-2">
                {partGroups('home', groupExercisesByPart(list, e => e), e => (
                  <div key={e.key} className="flex items-center justify-between gap-2 text-sm" data-home-exercise={e.key}>
                    <div className="min-w-0">{nameButton(e.key, e.name)}{targetsText(e)}</div>
                    <span className="text-[11px] text-gray-400 shrink-0">{library.equipmentLabels?.[e.equipment]}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      const placeSummary = (p) => {
        if (p.key === 'home') {
          const eq = current.homeEquipment.map(v => (HOME_EQUIPMENT_OPTIONS.find(([o]) => o === v) || [])[1]).filter(Boolean);
          const list = homeExercisesFor(library, current.homeEquipment);
          return `맨몸${eq.length ? ' + ' + eq.join(', ') : ''} · ${list.length}종목 · 빈 부위 ${missingSubParts(list).length}곳`;
        }
        const keys = current[p.key];
        return `${keys.length}종목${keys.length ? ` · 빈 부위 ${missingSubParts(keys.map(k => byKey.get(k)).filter(Boolean)).length}곳` : ''}`;
      };
      return (
        <div className="p-4 space-y-4 animate-fade-in" data-workout-tab>
          <button type="button" data-workout-start
            onClick={() => { let lastPlace = 'company'; try { lastPlace = localStorage.getItem('workoutLastPlace') === 'apartment' ? 'apartment' : 'company'; } catch { /* 기본 회사 */ } setSession({ version: 1, stage: 'pick', location: lastPlace, picked: [], items: [], skippedToday: [], rest: null, rating: null }); window.scrollTo(0, 0); }}
            className="w-full bg-gradient-to-br from-green-600 to-emerald-600 text-white rounded-3xl p-5 text-left shadow-md active:scale-[0.98] transition">
            <span className="block font-extrabold text-xl">🏋️ 운동 시작</span>
            <span className="block text-sm text-green-50 mt-1">종목을 고르면 지난번 무게가 미리 채워져요. 세트마다 ✓만 누르세요.</span>
          </button>
          <p className="text-xs text-gray-500 px-1 leading-relaxed">오늘 할 운동 추천은 다음 시험판에서 들어와요. 지금은 직접 고르거나 '최근 운동 그대로'를 쓰세요.</p>
          {!setupDone && !current.company.length && !current.apartment.length && (
            <button type="button" onClick={startSetup} className="w-full bg-green-600 text-white rounded-3xl p-5 text-left shadow-sm active:scale-[0.98] transition" data-workout-setup-start>
              <span className="block font-bold text-lg">처음 설정 시작 (1~2분)</span>
              <span className="block text-sm text-green-100 mt-1">지금까지 한 운동을 회사·아파트로 나누고, 집에 있는 기구를 골라요.</span>
            </button>
          )}
          {discovered.length > 0 && (
            <button type="button" onClick={() => { setDraft(null); setView('discover'); window.scrollTo(0, 0); }} data-discover-card
              className="w-full bg-amber-50 border border-amber-200 rounded-3xl p-4 text-left active:bg-amber-100">
              <span className="block font-bold text-amber-900">🔎 기록에서 찾은 새 운동 {discovered.length}개</span>
              <span className="block text-xs text-amber-800 mt-1">사전에 없는 이름이에요. 부위만 고르면 추가돼요. ›</span>
            </button>
          )}
          <div className="bg-white rounded-3xl p-4 shadow-sm space-y-2" data-workout-places>
            <h3 className="font-bold text-gray-800 px-1 mb-1">장소별 운동</h3>
            {WORKOUT_PLACES.map(p => (
              <button key={p.key} type="button" onClick={() => openPlace(p.key)} className="w-full flex items-center gap-3 bg-gray-50 rounded-2xl px-4 py-3 text-left active:bg-gray-100" data-place-card={p.key}>
                <span className="text-2xl">{p.icon}</span>
                <span className="flex-1 min-w-0">
                  <span className="block font-bold text-gray-800">{p.label}</span>
                  <span className="block text-xs text-gray-500 truncate">{placeSummary(p)}</span>
                </span>
                <span className="text-xs font-bold text-green-700 whitespace-nowrap">보기·고치기 ›</span>
              </button>
            ))}
          </div>
          <div className="bg-white rounded-3xl p-4 shadow-sm" data-workout-settings>
            <button type="button" onClick={() => setSettingsOpen(!settingsOpen)} className="w-full flex items-center justify-between" aria-expanded={settingsOpen}>
              <span className="font-bold text-gray-800">⚙️ 운동 설정</span>
              <span className="text-xs text-gray-500">쉬는 시간 {current.rest?.big || REST_DEFAULT_BIG}·{current.rest?.small || REST_DEFAULT_SMALL}초 · {restSoundOn(current) ? '🔔' : '🔕'} {settingsOpen ? '▾' : '▸'}</span>
            </button>
            {settingsOpen && (
              <div className="mt-3 space-y-3">
                {[['big', '큰 종목', '스쿼트·데드리프트·벤치·로우·프레스·풀업', REST_DEFAULT_BIG], ['small', '나머지 종목', '레이즈·컬·플라이·익스텐션 등', REST_DEFAULT_SMALL]].map(([k, label, hint, def]) => {
                  const value = current.rest?.[k] || def;
                  const setValue = (v) => save({ ...current, rest: { ...(current.rest || {}), [k]: Math.min(REST_MAX_SEC, Math.max(REST_MIN_SEC, v)) } });
                  return (
                    <div key={k} className="flex items-center justify-between gap-2" data-rest-default={k}>
                      <span className="min-w-0">
                        <span className="block text-sm font-bold text-gray-700">{label} 쉬는 시간</span>
                        <span className="block text-[11px] text-gray-400 truncate">{hint}</span>
                      </span>
                      <span className="flex items-center gap-1 shrink-0">

    // 루틴 탭

          )}
          {detail && !formFor && (
            <RoutineDetail routine={detail} today={today} getCheck={getCheck} isAutoDone={isAutoDone} stats={statsOf(detail)}
              onClose={() => setDetailId(null)} onEdit={() => setFormFor(detail)}
              onArchiveToggle={async () => { await onArchiveToggle(detail); setDetailId(null); }}
              onDelete={async () => { await onDelete(detail); setDetailId(null); }} />
          )}
        </div>

    }

    function App() {

      // ★ v0.3.10 최근 아침 기록 후보, 저장되지 않은 기록
      const [recentBreakfasts, setRecentBreakfasts] = useState([]);
      const [isRecentMealOpen, setIsRecentMealOpen] = useState(false);

      const [reanalyzingId, setReanalyzingId] = useState(null);

      const [isCompressing, setIsCompressing] = useState(false);
      const [lightboxImage, setLightboxImage] = useState(null); // ★ 타임라인 사진을 탭해서 원본 크기로 볼 때 사용
      const [exerciseLib, setExerciseLib] = useState(null); // ★ v0.5.1 종목 사전 { library, index }
      const [exerciseInfo, setExerciseInfo] = useState(null); // ★ v0.5.1 설명 창에 띄운 종목
      // ★ v0.5.4 진행 중인 운동. 폰에 저장해 새로고침·앱 종료 뒤에도 이어간다(사람마다 따로).
      const [workoutSession, setWorkoutSession] = useState(null);
      const workoutStoreKey = session?.user?.id ? 'workoutSession:' + session.user.id : null;
      const workoutLoadedRef = useRef(null);
      useEffect(() => {
        if (!workoutStoreKey || workoutLoadedRef.current === workoutStoreKey) return;
        workoutLoadedRef.current = workoutStoreKey;
        try { const saved = JSON.parse(localStorage.getItem(workoutStoreKey) || 'null'); setWorkoutSession(saved && saved.version === 1 ? saved : null); } catch { setWorkoutSession(null); }
      }, [workoutStoreKey]);
      useEffect(() => {
        if (!workoutStoreKey || workoutLoadedRef.current !== workoutStoreKey) return;
        try { if (workoutSession) localStorage.setItem(workoutStoreKey, JSON.stringify(workoutSession)); else localStorage.removeItem(workoutStoreKey); } catch { /* 저장 공간이 없어도 화면은 동작 */ }
      }, [workoutSession, workoutStoreKey]);
      // 쉬는 시간 카운트다운 소리 예약: 시작·±10초 때 다시 예약, 건너뛰기·끝내기·소리 끄기 때 취소.
      const workoutSoundOn = restSoundOn(profile?.workoutPlaces);
      const restEndsAt = workoutSession?.rest?.endsAt || null;
      useEffect(() => {
        if (!restEndsAt || !workoutSoundOn) { cancelRestSounds(); return; }
        scheduleRestSounds(restEndsAt);
      }, [restEndsAt, workoutSoundOn]);
      // 쉬는 시간이 끝나면 한 번 알린다(어느 탭에 있든).
      useEffect(() => {
        const rest = workoutSession?.rest;
        if (!rest || rest.notified) return;
        const markNotified = () => setWorkoutSession(s => s && s.rest ? { ...s, rest: { ...s.rest, notified: true } } : s);
        const wait = rest.endsAt - Date.now();
        if (wait <= 0) { if (wait > -5000) notifyRestDone(rest.endsAt, workoutSoundOn); markNotified(); return; }
        const id = setTimeout(() => { notifyRestDone(rest.endsAt, workoutSoundOn); markNotified(); }, wait);
        return () => clearTimeout(id);
      }, [workoutSession?.rest?.endsAt, workoutSession?.rest?.notified, workoutSoundOn]);
      // 운동하는 동안 화면이 꺼지지 않게(지원하는 기기만). 다른 앱에 갔다 오면 다시 요청한다.
      const workoutRunning = workoutSession?.stage === 'run' && !workoutSession?.editLogId;
      useEffect(() => {
        if (!workoutRunning || !('wakeLock' in navigator)) return;
        let lock = null; let alive = true;
        const request = async () => { try { if (document.visibilityState === 'visible') { lock = await navigator.wakeLock.request('screen'); if (!alive) lock.release(); } } catch { /* 지원 안 함 */ } };
        const onVisible = () => { if (document.visibilityState === 'visible') request(); };
        request();
        document.addEventListener('visibilitychange', onVisible);
        return () => { alive = false; document.removeEventListener('visibilitychange', onVisible); try { lock && lock.release(); } catch { /* 이미 풀림 */ } };
      }, [workoutRunning]);
      useEffect(() => { loadExerciseLibrary().then(setExerciseLib); }, []);
      // ★ 저장 직후 사용자가 스크롤하지 않고 방금 받은 AI 피드백을 확인하는 팝업
      const [feedbackPopupLog, setFeedbackPopupLog] = useState(null);

      // ★ 사진/한줄기록 분석에 대한 후속 질문 (기록당 1회) — 어느 기록의 입력창이 열려있는지, 입력값, 제출 중 여부

      const touchStartRef = useRef(null);
      const SWIPE_MIN_DISTANCE = 60;
      const handleContentTouchStart = (e) => {
        // 사진 미리보기/그래프처럼 자체적으로 가로 스크롤되는 영역에서 시작된 터치는 날짜 스와이프로 취급하지 않음
        if (e.target.closest && e.target.closest('.overflow-x-auto')) { touchStartRef.current = null; return; }
        const t = e.touches[0];
        touchStartRef.current = { x: t.clientX, y: t.clientY };
      };
      const handleContentTouchEnd = (e) => {
        if (!touchStartRef.current) return;
        if ((activeTab === 'analysis' && analysisView === 'longterm') || activeTab === 'routine' || activeTab === 'workout') { touchStartRef.current = null; return; }
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartRef.current.x;
        const dy = t.clientY - touchStartRef.current.y;
        touchStartRef.current = null;
        if (Math.abs(dx) < SWIPE_MIN_DISTANCE) return; // 너무 짧은 움직임은 무시
        if (Math.abs(dx) < Math.abs(dy) * 1.5) return; // 세로 스크롤과 헷갈리는 대각선 움직임은 무시
        if (dx < 0) changeDate(1); // 왼쪽으로 스와이프 -> 다음날/다음주/다음달
        else changeDate(-1); // 오른쪽으로 스와이프 -> 전날/전주/전달
      };

      // ★ AI 호출 취소/지연 안내용 — 진행 중인 fetch를 중단할 수 있는 컨트롤러와, 로딩이 시작된 이후 경과 초

      const pageTitle = PAGE_TITLES[activeTab] || PAGE_TITLES.home;
      useEffect(() => {

      }, [profile, showRoutines, activeTab]);

      const [aiReport, setAiReport] = useState("");
      const [isGeneratingReport, setIsGeneratingReport] = useState(false);

      // ★ v0.3.12 AI 일시 오류 안내 { message, retry }
      const [aiBusy, setAiBusy] = useState(null);
      const [showAiDetail, setShowAiDetail] = useState(false);
      const [askingLongTermKey, setAskingLongTermKey] = useState(null);
      const conditionLabels = parseProfileConditions(profile?.disease || '');

      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [accountError, setAccountError] = useState('');
      const [accountSaving, setAccountSaving] = useState(false);
      const [isExporting, setIsExporting] = useState(false);

      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [memberList, setMemberList] = useState([]);
      const [isLoadingMembers, setIsLoadingMembers] = useState(false);
      const [memberActionId, setMemberActionId] = useState(null);
      const [deleteMemberConfirmId, setDeleteMemberConfirmId] = useState(null);

      const [draft, setDraft] = useState({
        isOpen: false, isEditMode: false, editLogId: null, editDate: '', editTime: '',

        entrySource: 'general', timeAutoMessage: '', timeConfirmed: false,
        bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '', existingFoodName: '', existingIngredients: []
      });

      // ★ 자주 먹는 음식 (최근 30일 기록 기준 빈도순, 입력창 위 칩으로 표시)
      const [frequentFoods, setFrequentFoods] = useState([]);

      // ★ 목표 달성 현황용 가장 최근 생체 수치

      const naturalTextRef = useRef(null);

      const wakeLockRef = useRef(null);

      useEffect(() => {
        if (draft.isOpen || feedbackPopupLog || isPeriodGoalOpen) document.body.style.overflow = 'hidden';

        return () => { document.body.style.overflow = 'unset'; };
      }, [draft.isOpen, feedbackPopupLog, isPeriodGoalOpen]);

      const handleInputBlur = () => {
        setTimeout(() => window.scrollTo(window.scrollX, window.scrollY), 10);
      };

      useEffect(() => {
        const requestWakeLock = async () => {
          try { if ('wakeLock' in navigator) wakeLockRef.current = await navigator.wakeLock.request('screen'); }
          catch (err) { }
        };
        const releaseWakeLock = async () => {
          if (wakeLockRef.current !== null) { await wakeLockRef.current.release(); wakeLockRef.current = null; }
        };
        if (isAnalyzing || reanalyzingId || isGeneratingReport || isGeneratingDaily || isGeneratingConditionReport || isGeneratingHabit || isCompressing) requestWakeLock();
        else releaseWakeLock();
      }, [isAnalyzing, reanalyzingId, isGeneratingReport, isGeneratingDaily, isGeneratingConditionReport, isGeneratingHabit, isCompressing]);

      // ★ AI 응답 대기 시간 카운트 — 30초 넘게 걸리면 로딩 화면에 "계속 기다리기/취소" 안내를 띄우기 위함
      useEffect(() => {
        const isAiLoading = isAnalyzing || !!reanalyzingId || isGeneratingReport || isGeneratingDaily || isGeneratingConditionReport || isGeneratingHabit;
        if (!isAiLoading) { setLoadingElapsed(0); return; }
        setLoadingElapsed(0);
        const timer = setInterval(() => setLoadingElapsed(prev => prev + 1), 1000);
        return () => clearInterval(timer);
      }, [isAnalyzing, reanalyzingId, isGeneratingReport, isGeneratingDaily, isGeneratingConditionReport, isGeneratingHabit]);

      // ★ 로그인 세션 확인 + 유지 (한 번 로그인하면 계속 로그인 상태 유지)
      useEffect(() => {
        sb.auth.getSession().then(({ data }) => setSession(data.session));
        const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
        return () => sub.subscription.unsubscribe();
      }, []);

      // ★ 세션이 있으면 profiles 테이블에서 내 프로필 로드 (기존 localStorage 'dietProfile' 대체)
      useEffect(() => {
        if (!session) { setProfile(null); return; }
        withAuthRetry(() => sb.from('profiles').select('*').eq('id', session.user.id).single()).then(({ data, error }) => {
          if (!error && data) {
            setProfile({
              username: data.username, height: data.height, weight: data.weight, age: data.age,
              gender: data.gender, disease: data.disease || '', aiMode: data.ai_mode || 'normal',
              isApproved: !!data.is_approved, isAdmin: !!data.is_admin,
              goalExerciseWeekly: data.goal_exercise_weekly, goalAlcoholFreeWeekly: data.goal_alcohol_free_weekly,
              goalWeightKg: data.goal_weight_kg, goalBpSysMax: data.goal_bp_sys_max, goalBpDiaMax: data.goal_bp_dia_max,
              goalSugarMax: data.goal_sugar_max,
              showRoutines: data.show_routines !== false,
              intakePharmacistAck: !!data.intake_pharmacist_ack,
              workoutPlaces: sanitizeWorkoutPlaces(data.workout_places)
            });
          }
        });
      }, [session]);

      // ★ 자주 먹는 음식 계산 (최근 30일, 운동/생체기록 제외, 빈도순 상위 20개)
      // food_name은 AI가 매번 새로 지어내는 "메인 타이틀"이라 그대로 쓰면 안 되고,
      // 실제 개별 음식명은 ingredients 배열에 "음식명(재료들)" 형태로 들어있어 그 앞부분만 추출한다.
      const fetchFrequentFoods = async () => {
        const since = new Date(); since.setDate(since.getDate() - 30);
        const { data, error } = await sb.from('logs').select('ingredients, category').gte('log_date', formatDate(since));
        if (error || !data) return;
        const counts = {};
        data.forEach(row => {
          if (row.category === '운동' || row.category === '생체기록' || row.category === SUPPLEMENT_CATEGORY) return;
          (row.ingredients || []).forEach(item => {
            const raw = String(item || '');
            const name = (raw.includes('(') ? raw.slice(0, raw.indexOf('(')) : raw).trim();
            if (!name) return;
            counts[name] = (counts[name] || 0) + 1;
          });
        });
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([name]) => name);
        setFrequentFoods(sorted);
      };

      useEffect(() => {
        if (!session) { setFrequentFoods([]); return; }
        fetchFrequentFoods();
      }, [session]);

      // ★ 목표 달성 현황 계산용 데이터 (가장 최근 생체 수치)
      const fetchGoalStats = async () => {
        const rows = [];
        for (let offset = 0; offset < 100000; offset += 1000) {
          const { data, error } = await sb.from('logs').select('log_date, log_time, raw_input')
            .eq('category', '생체기록').order('log_date', { ascending: false }).order('log_time', { ascending: false })
            .range(offset, offset + 999);
          if (error || !data?.length) break;
          rows.push(...data);
          const latest = buildLatestBiometrics(rows);
          if (['bp_sys', 'bp_dia', 'sugar', 'weight'].every(field => latest?.[field] !== undefined) || data.length < 1000) break;
        }
        setLatestBiometrics(buildLatestBiometrics(rows));
      };

      useEffect(() => {
        if (!session) { setLatestBiometrics(null); return; }
        fetchGoalStats();
      }, [session]);

      // ★ 자주 먹는 음식 칩을 탭하면 입력창 끝에 이름만 삽입 (수량은 직접 이어서 입력)
      const insertFrequentFood = (name) => {
        setDraft(prev => {
          const trimmed = (prev.naturalText || '').trimEnd();
          const needsComma = trimmed.length > 0;
          const next = needsComma ? `${trimmed}, ${name} ` : `${name} `;
          return { ...prev, naturalText: next };
        });
        setTimeout(() => {
          if (naturalTextRef.current) {
            naturalTextRef.current.focus();
            const len = naturalTextRef.current.value.length;
            naturalTextRef.current.setSelectionRange(len, len);
          }
        }, 0);
      };

      useEffect(() => {
        if (!session) return;
        if (activeTab === 'home') {
          fetchLogs(currentDate);
        } else if (activeTab !== 'routine' && activeTab !== 'workout') {
          const range = statsMode === 'week' ? getWeekRange(currentDate) : getMonthRange(currentDate);
          setActiveRange(range);
          fetchPeriodLogs(range.start, range.end);
          fetchPeriodGoal(range, statsMode, activeTab === 'status');
          if (activeTab === 'status') fetchExerciseBalance(range.end);
        }
      }, [currentDate, activeTab, session, statsMode]);

      // ★ 운동 부위 균형: 선택한 기간의 마지막 날(오늘 이후면 오늘)을 기준으로 계산한다.
      // 세부 부위는 전체 기록을 보므로 기준일까지의 운동 기록을 모두 불러온다.
      const fetchExerciseBalance = async (rangeEnd) => {
        const today = formatDate(new Date());
        const referenceDate = rangeEnd && rangeEnd < today ? rangeEnd : today;
        const rows = [];
        for (let offset = 0; offset < 20000; offset += 1000) {
          const { data, error } = await withAuthRetry(() => sb.from('logs').select('log_date, exercise_meta')
            .eq('category', '운동').lte('log_date', referenceDate).not('exercise_meta', 'is', null)
            .order('log_date', { ascending: true }).range(offset, offset + 999));
          if (error) { setExerciseBalance(null); return; } // 보조 카드라 실패해도 화면 전체를 새로고침하지 않는다
          rows.push(...(data || []));
          if (!data || data.length < 1000) break;
        }
        const { count } = await sb.from('logs').select('id', { count: 'exact', head: true })
          .eq('category', '운동').is('exercise_meta', null);
        setUnclassifiedExerciseCount(count || 0);
        const unread = await sb.from('logs').select('id', { count: 'exact', head: true })
          .eq('category', '운동').not('exercise_meta', 'is', null).is('exercise_meta->>detailVersion', null);
        setUnreadExerciseDetailCount(unread.error ? 0 : (unread.count || 0));
        setExerciseBalance(computeExerciseBalance(rows, referenceDate));
      };

      // ★ v0.5.0 예전 운동 기록의 세트·유산소 숫자 읽기: 서버가 사진 있는 기록을 2건씩 읽으므로 남은 기록이 없을 때까지 반복한다.
      const handleReadExerciseDetails = async () => {
        if (isReadingExerciseDetails) return;
        setIsReadingExerciseDetails(true);
        try {
          for (let round = 0; round < 60; round++) {
            const res = await callAI('readExerciseDetails', {});
            setUnreadExerciseDetailCount(res.remaining || 0);
            if (!res.remaining || !res.processed) break;
          }
          await fetchExerciseBalance(activeRange.end);
        } catch (err) {
          handleAiFailure(err, handleReadExerciseDetails);
        } finally {
          setIsReadingExerciseDetails(false);
        }
      };

      // ★ 예전 운동 기록 분류: 서버가 40건씩 처리하므로 남은 기록이 없을 때까지 반복한다.
      const handleClassifyExercises = async () => {
        if (isClassifyingExercises) return;
        setIsClassifyingExercises(true);
        try {
          for (let round = 0; round < 25; round++) {
            const res = await callAI('classifyExercises', {});
            setUnclassifiedExerciseCount(res.remaining || 0);
            if (!res.remaining || !res.processed) break;
          }
          await fetchExerciseBalance(activeRange.end);
        } catch (err) {
          handleAiFailure(err, handleClassifyExercises);
        } finally {
          setIsClassifyingExercises(false);
        }
      };

      const fetchHabitReport = async () => {
        if (!session) return;
        const [latest, count] = await Promise.all([
          withAuthRetry(() => sb.from('habit_reports').select('*').order('created_at', { ascending: false }).limit(1)),
          withAuthRetry(() => sb.from('logs').select('id', { count: 'exact', head: true })),
        ]);
        if (latest.error) { setHabitReport(null); return; } // 카드만 비우고 페이지는 그대로 둔다
        setHabitReport((latest.data || [])[0] || null);
        setHabitRecordCount(count.error ? null : count.count);
      };

      useEffect(() => {
        if (session && activeTab === 'analysis' && analysisView === 'longterm') fetchHabitReport();
      }, [session, activeTab, analysisView]);

      const handleGenerateHabitReport = () => {
        if (isGeneratingHabit) return;
        setIsGeneratingHabit(true);
        const controller = new AbortController();
        abortControllerRef.current = controller;
        const timeoutId = setTimeout(() => {
          controller.abort();
          setIsGeneratingHabit(false);
          showAiBusy(AI_SLOW_MESSAGE, AI_SLOW_DETAIL, handleGenerateHabitReport);
        }, 90000);
        (async () => {
          try {
            const res = await callAI('habitReport', {}, controller.signal);
            clearTimeout(timeoutId);
            setHabitReport(res);
            setShowHabitDetail(false);
          } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') return;
            // 하루 1회 제한·기록 부족은 예상된 안내라 새로고침하지 않는다.
            if (/하루 1회|건 이상 쌓이면/.test(err.message || '')) showNotice(err.message);
            else handleAiFailure(err, handleGenerateHabitReport);
          } finally {
            setIsGeneratingHabit(false);
          }
        })();
      };

      const fetchConditionReports = async () => {
        if (!session) return;
        const { data, error } = await withAuthRetry(() =>
          sb.from('condition_reports').select('*').order('created_at', { ascending: false }).limit(50)
        );
        if (error) return reportFatalError(error);
        setConditionReports((data || []).map(mapConditionReport));
      };

      useEffect(() => {
        if (!conditionLabels.length) {
          setSelectedCondition('');
          setConditionReports([]);
          return;
        }
        if (!conditionLabels.includes(selectedCondition)) setSelectedCondition(conditionLabels[0]);
        if (session && activeTab === 'analysis' && analysisView === 'longterm') fetchConditionReports();
      }, [session, activeTab, analysisView, profile?.disease]);

      const fetchMealStatuses = async (date) => {
        const { data, error } = await withAuthRetry(() =>
          sb.from('meal_statuses').select('meal_slot, status').eq('status_date', date)
        );
        if (error) throw error;
        setMealStatuses(Object.fromEntries((data || []).map(row => [row.meal_slot, row.status])));
      };

      const fetchLogs = async (date) => {
        setIsFetching(true); setDailyReport(null);
        setMealStatuses({});
        const [{ data, error }, statusResult] = await Promise.all([
          withAuthRetry(() => sb.from('logs').select('*, food_health_tags(food_index,food_name,tag_key,tag_label,disease_key,polarity,confidence,evidence)').eq('log_date', date).order('log_time', { ascending: false })),
          fetchMealStatuses(date).then(() => null).catch(error => error),
        ]);
        if (error) reportFatalError(error); else setLogs((data || []).map(mapLogRow));
        if (statusResult) reportFatalError(statusResult);
        setIsFetching(false);
        const { data: dr } = await sb.from('daily_reports').select('*').eq('report_date', date).maybeSingle();
        if (dr) setDailyReport({ grade: dr.grade, comment: dr.comment });
      };

      const toggleMealSkipped = async (slotKey) => {
        if (!session || mealStatusSaving) return;
        const previous = { ...mealStatuses };
        const shouldClear = mealStatuses[slotKey] === 'skipped';
        setMealStatusSaving(slotKey);
        setMealStatuses(current => {
          const next = { ...current };
          if (shouldClear) delete next[slotKey]; else next[slotKey] = 'skipped';
          return next;
        });
        try {
          const query = shouldClear
            ? sb.from('meal_statuses').delete().eq('user_id', session.user.id).eq('status_date', currentDate).eq('meal_slot', slotKey)
            : sb.from('meal_statuses').upsert({
                user_id: session.user.id, status_date: currentDate, meal_slot: slotKey,
                status: 'skipped', confirmed_at: new Date().toISOString(), updated_at: new Date().toISOString(),
              }, { onConflict: 'user_id,status_date,meal_slot' });
          const { error } = await query;
          if (error) throw error;
          showNotice(shouldClear ? '미기록 상태로 되돌렸습니다.' : '안 먹음으로 기록했습니다.');
        } catch (error) {
          setMealStatuses(previous);
          reportFatalError(error);
        } finally {
          setMealStatusSaving(null);
        }
      };

      const clearMealStatusForCategory = async (category, date) => {
        const slotKey = mealSlotByCategory[category];
        if (!slotKey || !session) return;
        const { error } = await sb.from('meal_statuses').delete()
          .eq('user_id', session.user.id).eq('status_date', date).eq('meal_slot', slotKey);
        if (error) throw error;
        if (date === currentDate) setMealStatuses(current => {
          const next = { ...current }; delete next[slotKey]; return next;
        });
      };

      const fetchPeriodLogs = async (startStr, endStr) => {
        setIsFetching(true); setAiReport("");
        const { data, error } = await withAuthRetry(() =>
          sb.from('logs').select('*, food_health_tags(food_index,food_name,tag_key,tag_label,disease_key,polarity,confidence,evidence)').gte('log_date', startStr).lte('log_date', endStr).order('log_date', { ascending: false }).order('log_time', { ascending: false })
        );
        if (error) reportFatalError(error); else setPeriodLogs((data || []).map(mapLogRow));
        setIsFetching(false);
        const { data: pr } = await sb.from('period_reports').select('*').eq('period_start', startStr).eq('is_month', statsMode === 'month').maybeSingle();
        if (pr) setAiReport(pr.report_text);
        const { data: grades } = await sb.from('daily_reports').select('report_date, grade').gte('report_date', startStr).lte('report_date', endStr).order('report_date', { ascending: true });
        setPeriodGrades(grades || []);
      };

      const fetchPeriodGoal = async (range, mode, shouldPrompt = false) => {
        if (!session || !range?.start) return;
        setPeriodGoalLoading(true);
        const { data, error } = await withAuthRetry(() => sb.from('period_goals').select('*')
          .eq('period_type', mode).eq('period_start', range.start).maybeSingle());
        if (error) {
          reportFatalError(error);
          setPeriodGoal(null);
        } else {
          setPeriodGoal(data || null);
          const key = `${mode}:${range.start}`;
          const today = formatDate(new Date());
          const isCurrentPeriod = today >= range.start && today <= range.end;
          if (shouldPrompt && !data && isCurrentPeriod && !periodGoalPromptedRef.current.has(key)) {
            periodGoalPromptedRef.current.add(key);
            setIsPeriodGoalOpen(true);
          }
        }
        setPeriodGoalLoading(false);
      };

      const periodGoalDefaults = () => {
        const days = activeRange.start && activeRange.end
          ? Math.round((parseDate(activeRange.end) - parseDate(activeRange.start)) / 86400000) + 1 : 7;
        const monthlyFactor = statsMode === 'month' ? days / 7 : 1;
        return {
          exercise_target: profile?.goalExerciseWeekly ? Math.round(profile.goalExerciseWeekly * monthlyFactor) : '',
          alcohol_free_target: profile?.goalAlcoholFreeWeekly ? Math.min(days, Math.round(profile.goalAlcoholFreeWeekly * monthlyFactor)) : '',
          weight_target: profile?.goalWeightKg || '',
          bp_sys_target: profile?.goalBpSysMax || '',
          bp_dia_target: profile?.goalBpDiaMax || '',
          sugar_target: profile?.goalSugarMax || '',
        };
      };

      const savePeriodGoal = async (event) => {
        event.preventDefault();
        if (!session || periodGoalSaving) return;
        const form = new FormData(event.currentTarget);
        const numberOrNull = (name) => {
          const value = String(form.get(name) || '').trim();
          return value === '' ? null : Number(value);
        };
        const payload = {
          user_id: session.user.id, period_type: statsMode, period_start: activeRange.start,
          period_end: activeRange.end, status: 'active',
          exercise_target: numberOrNull('exerciseTarget'),
          alcohol_free_target: numberOrNull('alcoholFreeTarget'),
          weight_target: numberOrNull('weightTarget'),
          bp_sys_target: numberOrNull('bpSysTarget'),
          bp_dia_target: numberOrNull('bpDiaTarget'),
          sugar_target: numberOrNull('sugarTarget'),
          updated_at: new Date().toISOString(),
        };
        const values = [payload.exercise_target, payload.alcohol_free_target, payload.weight_target, payload.bp_sys_target, payload.bp_dia_target, payload.sugar_target];
        if (values.every(value => value === null)) {
          setSysError('목표를 하나 이상 입력하거나 설정 안 함을 선택해주세요.');
          return;
        }
        const periodDays = Math.round((parseDate(activeRange.end) - parseDate(activeRange.start)) / 86400000) + 1;
        if (payload.alcohol_free_target !== null && (!Number.isInteger(payload.alcohol_free_target) || payload.alcohol_free_target < 0 || payload.alcohol_free_target > periodDays)) {
          setSysError(`금주 목표는 0~${periodDays}일의 정수로 입력해주세요.`); return;
        }
        if (payload.exercise_target !== null && (!Number.isInteger(payload.exercise_target) || payload.exercise_target < 0 || payload.exercise_target > 200)) {
          setSysError('운동 목표는 0~200회의 정수로 입력해주세요.'); return;
        }
        setPeriodGoalSaving(true);
        const { data, error } = await sb.from('period_goals').upsert(payload, { onConflict: 'user_id,period_type,period_start' }).select().single();
        setPeriodGoalSaving(false);
        if (error) return reportFatalError(error);
        setPeriodGoal(data); setIsPeriodGoalOpen(false); showNotice(`${statsMode === 'month' ? '월간' : '주간'} 목표를 저장했습니다.`);
      };

      const skipPeriodGoal = async () => {
        if (!session || periodGoalSaving) return;
        setPeriodGoalSaving(true);
        const payload = {
          user_id: session.user.id, period_type: statsMode, period_start: activeRange.start,
          period_end: activeRange.end, status: 'skipped', exercise_target: null,
          alcohol_free_target: null, weight_target: null, bp_sys_target: null,
          bp_dia_target: null, sugar_target: null, updated_at: new Date().toISOString(),
        };
        const { data, error } = await sb.from('period_goals').upsert(payload, { onConflict: 'user_id,period_type,period_start' }).select().single();
        setPeriodGoalSaving(false);
        if (error) return reportFatalError(error);
        setPeriodGoal(data); setIsPeriodGoalOpen(false); showNotice('이 기간은 목표를 설정하지 않기로 저장했습니다.');
      };

      const changeDate = (direction) => {
        const d = parseDate(currentDate);
        if (activeTab === 'home') {
          d.setDate(d.getDate() + direction);
        } else {
          if (statsMode === 'week') d.setDate(d.getDate() + (direction * 7));
          else if (statsMode === 'month') d.setMonth(d.getMonth() + direction);
        }
        setCurrentDate(formatDate(d));
      };

      const handleDatePick = (e) => {
        if (!e.target.value) return;
        let val = e.target.value;
        if (val.includes('-W')) {
          const [year, week] = val.split('-W');
          const d = new Date(Date.UTC(year, 0, 1 + (Number(week) - 1) * 7));
          setCurrentDate(d.toISOString().split('T')[0]);
        } else if (activeTab !== 'home' && statsMode === 'month') {
          setCurrentDate(val + '-01');
        } else {
          setCurrentDate(val);
        }
      };

      // ★ v0.4.4 복용 관리. 체크는 "항목id|날짜|시간대" 키로 보관한다(보고 있는 날짜만 불러옴).
      const [intakeItems, setIntakeItems] = useState([]);
      const [intakeChecks, setIntakeChecks] = useState({});
      const [isIntakeSheetOpen, setIsIntakeSheetOpen] = useState(false);
      const [intakeManager, setIntakeManager] = useState(null); // { draft } 열려 있으면 객체
      const [intakeSaving, setIntakeSaving] = useState(false);
      const INTAKE_SAVE_FAILED = '복용 정보를 저장하지 못했어요. 잠시 후 다시 시도해 주세요.';

      useEffect(() => {
        if (!session) { setIntakeItems([]); return; }
        withAuthRetry(() => sb.from('intake_items').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true }))
          .then(({ data, error }) => { if (!error && data) setIntakeItems(data); });
      }, [session]);
      // 복용 체크는 최근 1년 치를 한 번에 불러온다(복용률·루틴 연결). 그보다 앞 날짜를 보면 그 날만 더 불러온다.
      const intakeSinceStr = (() => { const d = parseDate(formatDate(new Date())); d.setDate(d.getDate() - ROUTINE_LOOKBACK_DAYS); return formatDate(d); })();
      const mergeIntakeChecks = (rows) => setIntakeChecks(p => ({ ...p, ...Object.fromEntries(rows.map(c => [intakeCheckKey(c.item_id, c.check_date, c.slot), c])) }));
      useEffect(() => {
        if (!session) { setIntakeChecks({}); return; }
        (async () => {
          const rows = [];
          for (let from = 0; from < 20000; from += 1000) {
            const { data, error } = await withAuthRetry(() => sb.from('intake_checks').select('*').gte('check_date', intakeSinceStr)
              .order('check_date', { ascending: true }).range(from, from + 999));
            if (error) return;
            rows.push(...(data || []));
            if (!data || data.length < 1000) break;
          }
          mergeIntakeChecks(rows);
        })();
      }, [session]);
      useEffect(() => {
        if (!session || !currentDate || currentDate >= intakeSinceStr) return;
        withAuthRetry(() => sb.from('intake_checks').select('*').eq('check_date', currentDate))
          .then(({ data, error }) => { if (!error && data) mergeIntakeChecks(data); });
      }, [session, currentDate]);
      const intakeAdherenceNow = intakeAdherence(intakeItems, intakeChecks, formatDate(new Date()), 30);

      const intakeDayChecks = Object.values(intakeChecks).filter(c => c.check_date === currentDate);
      const intakeSupplementDayLogs = intakeSupplementLogs(intakeItems, intakeChecks, currentDate);
      const showIntakeAck = !profile?.intakePharmacistAck
        && intakeItems.some(i => i.kind === 'medicine' && isIntakeDue(i, currentDate))
        && intakeItems.some(i => i.kind === 'supplement' && isIntakeDue(i, currentDate));

      // ★ v0.4.8 체크: 늘 지금 시각(지난 날짜는 시간대 기본 시각). 여러 줄을 한꺼번에 저장하고, 쓴 시각을 돌려준다.
      const checkIntakeRows = async (targets) => {
        const isToday = currentDate === formatDate(new Date());
        const fresh = targets.filter(({ item, slot }) => !intakeChecks[intakeCheckKey(item.id, currentDate, slot)]);
        if (!fresh.length) return null;
        const slotTime = (slot) => INTAKE_SLOTS.find(x => x.key === slot)?.time || '08:00';
        const time = isToday ? getCurrentTimeStr() : slotTime(fresh[0].slot);
        const rowsToSave = fresh.map(({ item, slot }) => ({ user_id: session.user.id, item_id: item.id, check_date: currentDate, slot, taken_time: isToday ? time : slotTime(slot) }));
        const keys = rowsToSave.map(r => intakeCheckKey(r.item_id, r.check_date, r.slot));
        setIntakeChecks(p => ({ ...p, ...Object.fromEntries(rowsToSave.map((r, i) => [keys[i], r])) }));
        const { data, error } = await sb.from('intake_checks').upsert(rowsToSave, { onConflict: 'item_id,check_date,slot' }).select();
        if (error) {
          setIntakeChecks(p => { const n = { ...p }; keys.forEach(k => delete n[k]); return n; });
          showNotice(INTAKE_SAVE_FAILED);
          return null;
        }
        setIntakeChecks(p => ({ ...p, ...Object.fromEntries((data || []).map(c => [intakeCheckKey(c.item_id, c.check_date, c.slot), c])) }));
        return time;
      };
      const uncheckIntake = async (item, slot) => {
        const key = intakeCheckKey(item.id, currentDate, slot);
        const prev = intakeChecks[key];
        if (!prev) return;
        setIntakeChecks(p => { const n = { ...p }; delete n[key]; return n; });
        const { error } = await sb.from('intake_checks').delete().eq('item_id', item.id).eq('check_date', currentDate).eq('slot', slot);
        if (error) { setIntakeChecks(p => ({ ...p, [key]: prev })); showNotice(INTAKE_SAVE_FAILED); }
      };

      // ★ v0.4.7 체크한 줄의 먹은 시각 바꾸기(복용 창 시각 칸을 바꾸거나, 줄의 시각을 눌러 확인했을 때).
      const retimeIntakeChecks = async (targets, time) => {
        if (!/^\d{2}:\d{2}$/.test(time || '')) return;
        const changed = targets.map(({ item, slot }) => ({ item, slot, key: intakeCheckKey(item.id, currentDate, slot) }))
          .filter(t => intakeChecks[t.key] && String(intakeChecks[t.key].taken_time || '').slice(0, 5) !== time);
        if (!changed.length) return;
        const prev = Object.fromEntries(changed.map(t => [t.key, intakeChecks[t.key]]));
        setIntakeChecks(p => ({ ...p, ...Object.fromEntries(changed.map(t => [t.key, { ...p[t.key], taken_time: time }])) }));
        const results = await Promise.all(changed.map(t => sb.from('intake_checks').update({ taken_time: time })
          .eq('item_id', t.item.id).eq('check_date', currentDate).eq('slot', t.slot)));
        if (results.some(r => r.error)) { setIntakeChecks(p => ({ ...p, ...prev })); showNotice(INTAKE_SAVE_FAILED); }
      };

      // 등록·수정. 건강식품은 AI 참고가 없을 때(또는 새 포장 사진이 있을 때) 한 번만 서버에서 만든다. 약은 AI를 쓰지 않는다.
      const saveIntakeItem = async (draft, done) => {
        setIntakeSaving(true);
        try {
          const fields = {
            kind: draft.kind, name: draft.name.trim().slice(0, 60), dose: (draft.dose || '').trim().slice(0, 40),
            times: draft.times, note: (draft.note || '').trim().slice(0, 100),
            start_date: draft.start_date || currentDate, end_date: draft.end_date || null, updated_at: new Date().toISOString(),
          };
          if (draft.kind === 'supplement') {
            fields.label_claim = draft.label_claim || '';
            fields.ai_note = draft.ai_note || '';
          }
          const existing = draft.id ? intakeItems.find(i => i.id === draft.id) : null;
          // 이름이 바뀌면 전의 AI 참고는 맞지 않으므로 지운다.
          if (existing && existing.kind === 'supplement' && existing.name !== fields.name) { fields.label_claim = ''; fields.ai_note = ''; }
          const query = draft.id
            ? sb.from('intake_items').update(fields).eq('id', draft.id).select().single()
            : sb.from('intake_items').insert({ ...fields, user_id: session.user.id, sort_order: intakeItems.length }).select().single();
          const { data, error } = await query;
          if (error) throw error;
          setIntakeItems(p => draft.id ? p.map(i => i.id === data.id ? data : i) : [...p, data]);
          done && done();
          if (data.kind === 'supplement' && (!data.ai_note || (draft.photos || []).length)) {
            try {
              const info = await callAI('intakeInfo', { itemId: data.id, base64Images: draft.photos || [] });
              setIntakeItems(p => p.map(i => i.id === data.id ? { ...i, label_claim: info.labelClaim || '', ai_note: info.aiNote || '' } : i));
            } catch (err) {
              showNotice('등록은 됐어요. AI 참고 설명은 지금 만들지 못했어요.');
            }
          } else {
            showNotice('저장했어요.');
          }
        } catch (err) {
          console.error(err);
          showNotice(INTAKE_SAVE_FAILED);
        } finally {
          setIntakeSaving(false);
        }
      };
      const updateIntakeItem = async (item, fields) => {
        const prev = intakeItems;
        setIntakeItems(p => p.map(i => i.id === item.id ? { ...i, ...fields } : i));
        const { error } = await sb.from('intake_items').update({ ...fields, updated_at: new Date().toISOString() }).eq('id', item.id);
        if (error) { setIntakeItems(prev); showNotice(INTAKE_SAVE_FAILED); }
      };
      const stopIntakeItem = (item) => updateIntakeItem(item, { stopped_at: new Date().toISOString() });
      const resumeIntakeItem = (item) => updateIntakeItem(item, { stopped_at: null, ...(item.end_date && item.end_date < formatDate(new Date()) ? { end_date: null } : {}) });
      const deleteIntakeItem = async (item) => {
        const prev = intakeItems;
        setIntakeItems(p => p.filter(i => i.id !== item.id));
        const { error } = await sb.from('intake_items').delete().eq('id', item.id);
        if (error) { setIntakeItems(prev); showNotice(INTAKE_SAVE_FAILED); return; }
        setIntakeChecks(p => Object.fromEntries(Object.entries(p).filter(([, c]) => c.item_id !== item.id)));
      };
      const ackIntakePharmacist = async () => {
        setProfile(p => ({ ...p, intakePharmacistAck: true }));
        const { error } = await sb.from('profiles').update({ intake_pharmacist_ack: true }).eq('id', session.user.id);
        if (error) { setProfile(p => ({ ...p, intakePharmacistAck: false })); showNotice(INTAKE_SAVE_FAILED); }
      };
      // 사진·글로 기록한 건강식품을 복용 관리에 등록(이미 만든 포장 문구·AI 참고를 그대로 옮겨 AI를 다시 부르지 않는다).
      const openIntakeFromLog = (log) => {
        const first = String((Array.isArray(log.ingredients) && log.ingredients[0]) || log.foodName || '');
        const name = (first.includes('(') ? first.slice(0, first.indexOf('(')) : first).trim().slice(0, 60);
        const dose = first.includes('(') ? first.slice(first.indexOf('(') + 1).replace(/\)\s*$/, '').trim().slice(0, 40) : '';
        const slot = INTAKE_SLOTS.reduce((best, x) => (log.time >= x.time ? x.key : best), 'morning');
        setFeedbackPopupLog(null);
        setIntakeManager({ draft: { ...emptyIntakeDraft(currentDate), name, dose, times: [slot],
          label_claim: log.supplementInfo?.labelClaim || '', ai_note: log.supplementInfo?.aiNote || '' } });
      };

      // ★ 짧게 떴다 사라지는 성공 안내 배너
      // ★ v0.4.0 루틴. 체크는 "루틴id|날짜" 키로 보관한다.
      const [routines, setRoutines] = useState([]);
      const [routineChecks, setRoutineChecks] = useState({});
      const [routineExerciseTimes, setRoutineExerciseTimes] = useState({}); // 날짜 → 운동 기록 시각 목록
      const [routineSupplementDates, setRoutineSupplementDates] = useState({}); // 날짜 → 사진·글 건강식품 기록이 있음
      const [routinesLoading, setRoutinesLoading] = useState(false);
      const routineKey = (routineId, date) => `${routineId}|${date}`;
      const getRoutineCheck = (routineId, date) => routineChecks[routineKey(routineId, date)] || null;
      // 보고 있는 날짜는 화면에 불러온 기록(방금 저장·수정·삭제한 것 포함)을 쓴다.
      const exerciseTimesOn = (date) => date === currentDate
        ? logs.filter(l => l.category === '운동').map(l => l.time)
        : (routineExerciseTimes[date] || []);
      const isRoutineAutoDone = (routine, date) => {
        if (routine?.link_intake) {
          const hasSupplementLog = date === currentDate ? logs.some(isSupplementLog) : Boolean(routineSupplementDates[date]);
          if (intakeRoutineAutoDone(routine, date, intakeItems, intakeChecks, hasSupplementLog)) return true;
        }
        if (!routine?.link_exercise) return false;
        const linked = routines.filter(r => r.link_exercise && isRoutineDue(r, date)).sort(compareRoutines);
        return matchExerciseToRoutines(linked, exerciseTimesOn(date)).has(routine.id);
      };

      // ★ v0.6.0 주간 습관 점검(주 시작일 → 기록)
      const [habitReviews, setHabitReviews] = useState({});
      const [isHabitReviewOpen, setIsHabitReviewOpen] = useState(false);

      const fetchRoutineData = async () => {
        if (!session) return;
        setRoutinesLoading(true);
        const since = parseDate(formatDate(new Date()));
        since.setDate(since.getDate() - ROUTINE_LOOKBACK_DAYS);
        const sinceStr = formatDate(since);
        const pageAll = async (build) => {
          const rows = [];
          for (let from = 0; from < 20000; from += 1000) {
            const { data, error } = await withAuthRetry(() => build(from, from + 999));
            if (error) throw error;
            rows.push(...(data || []));
            if (!data || data.length < 1000) break;
          }
          return rows;
        };
        try {
          const [routineRows, checkRows, exerciseRows, supplementRows] = await Promise.all([
            pageAll((a, b) => sb.from('routines').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true }).range(a, b)),
            pageAll((a, b) => sb.from('routine_checks').select('*').gte('check_date', sinceStr).order('check_date', { ascending: true }).range(a, b)),
            pageAll((a, b) => sb.from('logs').select('log_date, log_time').eq('category', '운동').gte('log_date', sinceStr).order('log_date', { ascending: true }).range(a, b)),
            pageAll((a, b) => sb.from('logs').select('log_date').eq('category', SUPPLEMENT_CATEGORY).gte('log_date', sinceStr).order('log_date', { ascending: true }).range(a, b)),
          ]);
          setRoutineSupplementDates(Object.fromEntries(supplementRows.map(r => [r.log_date, true])));
          const { data: reviewRows } = await withAuthRetry(() => sb.from('habit_weekly_reviews').select('week_start, reviewed_at, ai_note').order('week_start', { ascending: false }).limit(20));
          setHabitReviews(Object.fromEntries((reviewRows || []).map(r => [r.week_start, r])));
          setRoutines(routineRows);
          setRoutineChecks(Object.fromEntries(checkRows.map(c => [routineKey(c.routine_id, c.check_date), c])));
          const times = {};
          exerciseRows.forEach(r => { (times[r.log_date] = times[r.log_date] || []).push(String(r.log_time || '').slice(0, 5)); });
          setRoutineExerciseTimes(times);
        } catch (err) {
          console.error(err); // 루틴만 비워 두고 다른 화면은 그대로 쓴다
        } finally {
          setRoutinesLoading(false);
        }
      };

      useEffect(() => { if (session) fetchRoutineData(); }, [session]);

      const ROUTINE_SAVE_FAILED = '루틴을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.';

      // 체크 저장(화면 먼저 바꾸고, 실패하면 되돌린다)
      const putRoutineCheck = async (routine, date, fields) => {
        const key = routineKey(routine.id, date);
        const prev = routineChecks[key] || null;
        const row = {
          user_id: session.user.id, routine_id: routine.id, check_date: date,
          status: prev?.status || 'progress', value: prev?.value || 0, bad_value: prev?.bad_value || 0, note: prev?.note || '',
          ...fields, updated_at: new Date().toISOString(),
        };
        setRoutineChecks(p => ({ ...p, [key]: row }));
        const { data, error } = await sb.from('routine_checks').upsert(row, { onConflict: 'routine_id,check_date' }).select().single();
        if (error) {
          setRoutineChecks(p => { const n = { ...p }; if (prev) n[key] = prev; else delete n[key]; return n; });
          showNotice(ROUTINE_SAVE_FAILED);
          return;
        }
        setRoutineChecks(p => ({ ...p, [key]: data }));
      };

      const deleteRoutineCheck = async (routine, date) => {
        const key = routineKey(routine.id, date);
        const prev = routineChecks[key] || null;
        if (!prev) return;
        setRoutineChecks(p => { const n = { ...p }; delete n[key]; return n; });
        const { error } = await sb.from('routine_checks').delete().eq('routine_id', routine.id).eq('check_date', date);
        if (error) { setRoutineChecks(p => ({ ...p, [key]: prev })); showNotice(ROUTINE_SAVE_FAILED); }
      };

      // 완료를 되돌릴 때 메모가 있거나, 지우면 운동 기록으로 다시 자동 완료되는 경우에는 "안 함" 체크를 남긴다.
      const undoRoutineCheck = (routine, date) => {
        const check = getRoutineCheck(routine.id, date);
        if (check?.note || isRoutineAutoDone(routine, date)) return putRoutineCheck(routine, date, { status: 'progress', value: 0 });
        return deleteRoutineCheck(routine, date);
      };

      const routineActions = {
        tap: (routine, date) => {
          const check = getRoutineCheck(routine.id, date);
          const state = routineDayState(routine, check, isRoutineAutoDone(routine, date));
          if (state === 'done' && !check) {
            showNotice('운동 기록으로 된 자동 완료를 풀었어요. 다시 자동으로 하려면 ⋯ → 체크 지우기를 누르세요.');
            return putRoutineCheck(routine, date, { status: 'progress', value: 0 });
          }
          if (state === 'skipped') {
            if (check?.note) return putRoutineCheck(routine, date, { status: isRoutineAutoDone(routine, date) ? 'done' : 'progress', value: 0 });
            return deleteRoutineCheck(routine, date);
          }
          if (state === 'done') return undoRoutineCheck(routine, date);
          if (routine.kind === 'count') {
            const value = (check?.value || 0) + (routine.step || 1);
            return putRoutineCheck(routine, date, { value, status: value >= routine.target ? 'done' : 'progress' });
          }
          return putRoutineCheck(routine, date, { status: 'done' });
        },
        toggleSkip: (routine, date) => {
          const check = getRoutineCheck(routine.id, date);
          if (check?.status === 'skipped') {
            // 건너뜀을 풀면 원래 상태로: 메모가 있으면 남기고, 운동 자동 완료 대상이면 완료로 돌아간다.
            if (check.note) return putRoutineCheck(routine, date, { status: isRoutineAutoDone(routine, date) ? 'done' : 'progress', value: 0 });
            return deleteRoutineCheck(routine, date);
          }
          return putRoutineCheck(routine, date, { status: 'skipped' });
        },
        setValue: (routine, date, value) => putRoutineCheck(routine, date, { value, status: value >= routine.target ? 'done' : 'progress' }),
        saveNote: (routine, date, note) => {
          const check = getRoutineCheck(routine.id, date);
          if (!check && !note) return;
          if (!note && check && check.status === 'progress' && !check.value) return deleteRoutineCheck(routine, date);
          // 자동 완료된 루틴에 메모만 남겨도 완료는 그대로 둔다.
          if (!check && isRoutineAutoDone(routine, date)) return putRoutineCheck(routine, date, { note, status: 'done' });
          return putRoutineCheck(routine, date, { note });
        },
        clear: (routine, date) => deleteRoutineCheck(routine, date),
        // ★ v0.6.0 짝 습관 고르기: done(했어요) / mini(조금이라도) / slipped(버릴 습관). 같은 것을 다시 고르면 취소.
        choose: (routine, date, choice) => {
          const check = getRoutineCheck(routine.id, date);
          if (routine.kind === 'count') {
            if (choice === 'slipped') return putRoutineCheck(routine, date, { bad_value: (check?.bad_value || 0) + 1, status: check?.status === 'skipped' ? 'progress' : (check?.status || 'progress') });
            const value = (check?.value || 0) + (routine.step || 1);
            return putRoutineCheck(routine, date, { value, status: value >= routine.target ? 'done' : (check?.status === 'skipped' ? 'progress' : (check?.status || 'progress')) });
          }
          const state = routineDayState(routine, check, isRoutineAutoDone(routine, date));
          const current = check?.status === 'mini' ? 'mini' : state === 'done' ? 'done' : check?.status === 'slipped' ? 'slipped' : null;
          if (current === choice) {
            if (choice === 'done' && !check) return putRoutineCheck(routine, date, { status: 'progress', value: 0 }); // 자동 완료를 직접 푼다
            return undoRoutineCheck(routine, date);
          }
          return putRoutineCheck(routine, date, { status: choice, value: 0 });
        },
        setBadValue: (routine, date, badValue) => putRoutineCheck(routine, date, { bad_value: badValue }),
      };

      // ★ v0.6.0 주간 점검: 일요일이면 이번 주, 아니면 지난주. 그 주를 아직 점검하지 않았으면 보여 준다.
      const habitReviewTarget = weeklyReviewTarget(formatDate(new Date()));
      const habitReviewDue = !routinesLoading && !habitReviews[habitReviewTarget.start]?.reviewed_at
        && weeklyReviewRoutines(routines, habitReviewTarget.end).length > 0 ? habitReviewTarget : null;
      const finishHabitReview = async () => {
        const row = { user_id: session.user.id, week_start: habitReviewTarget.start, reviewed_at: new Date().toISOString(), updated_at: new Date().toISOString() };
        const { data, error } = await sb.from('habit_weekly_reviews').upsert(row, { onConflict: 'user_id,week_start' }).select('week_start, reviewed_at, ai_note').single();
        if (error) { showNotice(ROUTINE_SAVE_FAILED); return; }
        setHabitReviews(p => ({ ...p, [data.week_start]: data }));
        setIsHabitReviewOpen(false);
        showNotice('이번 점검을 마쳤어요. 다음 주도 응원해요!');
      };
      // ★ v0.6.1 주간 한마디: 서버(diet-ai v0.0.26)가 그 주에 한 번만 만들고 저장한다.
      const askHabitNote = async (habits) => {
        try {
          const res = await callAI('habitWeeklyNote', { weekStart: habitReviewTarget.start, habits });
          if (!res?.note) return false;
          setHabitReviews(p => ({ ...p, [habitReviewTarget.start]: { ...(p[habitReviewTarget.start] || { week_start: habitReviewTarget.start }), ai_note: res.note } }));
          return true;
        } catch (err) {
          console.error(err);
          return false;
        }
      };

      const saveRoutine = async (existing, data) => {
        if (existing) {
          const { data: row, error } = await sb.from('routines').update({ ...data, updated_at: new Date().toISOString() }).eq('id', existing.id).select().single();
          if (error) { showNotice(ROUTINE_SAVE_FAILED); return false; }
          setRoutines(p => p.map(r => r.id === row.id ? row : r));
          return true;
        }
        const sortOrder = routines.reduce((m, r) => Math.max(m, r.sort_order || 0), 0) + 10;
        const { data: row, error } = await sb.from('routines').insert({ ...data, user_id: session.user.id, sort_order: sortOrder }).select().single();
        if (error) { showNotice(ROUTINE_SAVE_FAILED); return false; }
        setRoutines(p => [...p, row]);
        showNotice(`"${row.name}" 루틴을 추가했어요.`);
        return true;
      };

      const toggleRoutineArchive = async (routine) => {
        const archived_at = routine.archived_at ? null : new Date().toISOString();
        const { data: row, error } = await sb.from('routines').update({ archived_at, updated_at: new Date().toISOString() }).eq('id', routine.id).select().single();
        if (error) { showNotice(ROUTINE_SAVE_FAILED); return; }
        setRoutines(p => p.map(r => r.id === row.id ? row : r));
      };

      const deleteRoutine = async (routine) => {
        const { error } = await sb.from('routines').delete().eq('id', routine.id);
        if (error) { showNotice(ROUTINE_SAVE_FAILED); return; }
        setRoutines(p => p.filter(r => r.id !== routine.id));
        setRoutineChecks(p => Object.fromEntries(Object.entries(p).filter(([k]) => !k.startsWith(routine.id + '|'))));
      };

      // 순서는 같은 시간대 안, 정확한 시간이 없는 루틴끼리만 바꾼다.
      const moveRoutine = async (routine, direction) => {
        if (routine.time_of_day) { showNotice('정확한 시간이 있는 루틴은 시간 순서대로 보여요.'); return; }
        const group = routines.filter(r => !r.archived_at && !r.time_of_day && (r.time_slot || 'anytime') === (routine.time_slot || 'anytime')).sort(compareRoutines);
        const i = group.findIndex(r => r.id === routine.id), j = i + direction;
