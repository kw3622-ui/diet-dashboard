    // 홈 💊 복용 버튼: 오늘 체크 목록
    // ★ v0.4.8 시간대별 묶음. 체크는 늘 "지금"(지난 날짜는 시간대 기본 시각)으로 하고,
    // 체크한 직후 아래 알림에서 시각을 바로 고친다. 체크한 줄을 누르면 시각 바꾸기·이 시간대 모두·체크 취소 메뉴.
    function IntakeSheet({ items, checks, date, isToday, dayLogs, adherence, showAck, onAck, onCheck, onUncheck, onRetime, onOpenManager, onRecordOther, onClose }) {
      const [toast, setToast] = useState(null); // { slot, targets, time, late, editing, editTime }
      const [menuKey, setMenuKey] = useState(null);
      const [menuEdit, setMenuEdit] = useState(null); // 메뉴에서 고르는 시각
      const toastTimer = useRef(null);
      useEffect(() => () => clearTimeout(toastTimer.current), []);
      const validTime = (t) => /^\d{2}:\d{2}$/.test(t || '');
      const rows = intakeDueRows(items, date);
      const isChecked = ({ item, slot }) => Boolean(checks[intakeCheckKey(item.id, date, slot)]);
      const timeOf = ({ item, slot }) => String(checks[intakeCheckKey(item.id, date, slot)]?.taken_time || '').slice(0, 5);
      const groups = INTAKE_SLOTS.map(s => ({ ...s, rows: rows.filter(r => r.slot === s.key) })).filter(g => g.rows.length);
      const supplementLogs = [...(dayLogs || []).filter(isSupplementLog), ...intakeSupplementLogs(items, checks, date)];
      const pairNotes = [];
      supplementLogs.forEach(log => supplementPairNotes(log, supplementLogs).forEach(note => {
        if (!pairNotes.some(n => n.text === note.text)) pairNotes.push(note);
      }));

      const showToast = (next) => {
        clearTimeout(toastTimer.current);
        setToast(next);
        // 늦게 체크한 경우는 사용자가 닫을 때까지 둔다. 제때 체크한 경우만 잠깐 보였다 사라진다.
        if (next && !next.late) toastTimer.current = setTimeout(() => setToast(t => (t && !t.editing ? null : t)), 6000);
      };
      const check = async (targets, slot) => {
        setMenuKey(null);
        const time = await onCheck(targets);
        if (!time) return;
        showToast({ slot, targets, time, late: isIntakeSlotPast(slot, isToday), editing: false, editTime: time });
      };
      const applyToastTime = async () => {
        if (!toast || !validTime(toast.editTime)) return;
        await onRetime(toast.targets, toast.editTime);
        showToast({ ...toast, time: toast.editTime, late: false, editing: false });
      };

      const renderRow = (row) => {
        const { item, slot } = row;
        const key = item.id + '|' + slot;
        const checked = isChecked(row);
        const time = timeOf(row);
        const tips = intakeTipsFor(item);
        const open = menuKey === key;
        return (
          <div key={key} className={`rounded-2xl border transition ${checked ? 'bg-violet-50 border-violet-200' : 'bg-white border-gray-200'}`} data-intake-row>
            <button type="button" aria-label={`${item.name} ${intakeSlotLabel(slot)} ${checked ? '메뉴' : '체크'}`}
              onClick={() => { if (checked) { setMenuKey(open ? null : key); setMenuEdit(time); } else check([row], slot); }}
              className="w-full flex items-center gap-3 px-3 py-2.5 text-left active:scale-[0.99]">
              <span className={`w-6 h-6 rounded-full border-2 shrink-0 flex items-center justify-center text-xs font-bold ${checked ? 'bg-violet-500 border-violet-500 text-white' : 'border-violet-300'}`}>{checked ? '✓' : ''}</span>
              <span className="min-w-0 flex-1">
                <span className={`block text-sm font-bold break-keep ${checked ? 'text-violet-800' : 'text-gray-800'}`}>
                  {item.name}{item.dose && <span className="font-normal text-gray-500"> {item.dose}</span>}
                  <span className={`ml-1.5 align-middle text-[10px] font-bold px-1.5 py-0.5 rounded ${item.kind === 'medicine' ? 'bg-sky-50 text-sky-700' : 'bg-emerald-50 text-emerald-700'}`}>{item.kind === 'medicine' ? '💊 약' : '🌿 건강식품'}</span>
                </span>
                {item.note && <span className="block text-[11px] text-gray-400 break-keep">{item.note}</span>}
                {tips.map((tip, i) => <span key={i} className="block text-[11px] text-emerald-700 break-keep" data-intake-tip>🕗 {tip}</span>)}
              </span>
              {checked && <span className="shrink-0 text-xs font-bold text-violet-600" data-intake-row-time>{time}</span>}
            </button>
            {open && (
              <div className="px-3 pb-3 space-y-2" data-intake-row-menu>
                <div className="flex items-center gap-2">
                  <input type="time" value={menuEdit || ''} onChange={e => setMenuEdit(e.target.value)} aria-label={`${item.name} ${intakeSlotLabel(slot)} 먹은 시각`}
                    className="w-[7.5rem] text-sm font-bold text-violet-800 bg-white border border-violet-200 rounded-lg px-2 py-1.5" />
                  <button type="button" disabled={!validTime(menuEdit) || menuEdit === time}
                    onClick={async () => { await onRetime([row], menuEdit); setMenuKey(null); }}
                    className="text-xs font-bold px-3 py-2 rounded-lg bg-violet-600 text-white disabled:opacity-40">시각 바꾸기</button>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {groups.find(g => g.key === slot).rows.filter(r => isChecked(r) && r.item.id !== item.id).length > 0 && (
                    <button type="button" disabled={!validTime(menuEdit)}
                      onClick={async () => { await onRetime(groups.find(g => g.key === slot).rows.filter(isChecked), menuEdit); setMenuKey(null); }}
                      className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-white border border-violet-200 text-violet-700 disabled:opacity-40">{intakeSlotLabel(slot)} 체크한 것 모두 {menuEdit || time}으로</button>
                  )}
                  <button type="button" onClick={() => { setMenuKey(null); onUncheck(item, slot); }}
                    className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-white border border-gray-200 text-gray-500">체크 취소</button>
                </div>
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="fixed inset-0 z-[110] bg-black/50 flex items-end sm:items-center justify-center" onClick={onClose} data-intake-sheet>
          <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="overflow-y-auto no-scrollbar p-5 pb-3">
              <div className="flex items-start justify-between gap-3 mb-3">
                <div className="min-w-0">
                  <h2 className="text-lg font-bold text-gray-900">💊 {isToday ? '오늘' : `${Number(date.slice(5, 7))}/${Number(date.slice(8))}`} 복용</h2>
                  <p className="text-xs text-gray-400 break-keep">누르면 {isToday ? '지금 시각으로' : '시간대 기본 시각으로'} 체크돼요. 체크한 것을 누르면 시각을 고칠 수 있어요.</p>
                  {adherence?.rate != null && (
                    <p className="text-[11px] font-bold text-violet-600 mt-0.5" data-intake-adherence>
                      최근 30일 복용률 {adherence.rate}%{adherence.medicine != null && adherence.supplement != null ? ` (약 ${adherence.medicine}% · 건강식품 ${adherence.supplement}%)` : ''}
                    </p>
                  )}
                </div>
                <button type="button" onClick={onClose} aria-label="복용 창 닫기" className="w-9 h-9 shrink-0 rounded-full bg-gray-100 text-gray-500 font-bold">✕</button>
              </div>
              {showAck && (
                <div className="bg-amber-50 border border-amber-100 rounded-2xl p-3 mb-3" data-intake-ack>
                  <p className="text-xs text-amber-900 break-keep">등록하신 약과 건강식품을 같이 드셔도 되는지 약사에게 한 번 확인해 보세요. 앱은 약과의 궁합을 판단하지 않아요.</p>
                  <button type="button" onClick={onAck} className="mt-2 text-xs font-bold px-3 py-1.5 rounded-lg bg-amber-500 text-white">확인했어요</button>
                </div>
              )}
              {rows.length === 0 ? (
                <div className="bg-violet-50 rounded-2xl p-4 text-sm text-violet-900 break-keep mb-3">
                  매일 드시는 약이나 건강식품을 등록하면, 여기서 눌러서 체크만 하면 돼요.
                </div>
              ) : (
                <div className="space-y-4 mb-3">
                  {groups.map(g => {
                    const done = g.rows.filter(isChecked);
                    const left = g.rows.filter(r => !isChecked(r));
                    return (
                      <div key={g.key} className="space-y-1.5" data-intake-group={g.key}>
                        <div className="flex items-center justify-between gap-2">
                          <p className="text-sm font-bold text-gray-700">{g.label} <span className="text-xs text-violet-600">{done.length}/{g.rows.length}</span></p>
                          {left.length > 1 && (
                            <button type="button" onClick={() => check(left, g.key)} aria-label={`${g.label} 모두 먹음`}
                              className="text-xs font-bold px-3 py-1.5 rounded-lg bg-violet-600 text-white active:scale-95" data-intake-all>모두 먹음</button>
                          )}
                        </div>
                        {g.rows.map(renderRow)}
                      </div>
                    );
                  })}
                </div>
              )}
              {pairNotes.map((note, i) => (
                <p key={i} className={`text-xs rounded-xl px-3 py-2 mb-2 break-keep ${note.kind === 'caution' ? 'bg-amber-50 text-amber-800' : 'bg-emerald-50 text-emerald-800'}`} data-intake-pair>
                  {note.kind === 'caution' ? '⚠️' : '🔗'} {note.text}
                </p>
              ))}
              <div className="grid grid-cols-2 gap-2">
                <button type="button" onClick={onRecordOther} className="text-xs font-bold py-3 rounded-xl bg-violet-50 text-violet-700 border border-violet-100">+ 다른 건강식품 기록<br /><span className="font-normal">(사진/글)</span></button>
                <button type="button" onClick={onOpenManager} className="text-xs font-bold py-3 rounded-xl bg-gray-100 text-gray-600">⚙️ 등록·관리</button>
              </div>
            </div>
            {toast && (
              <div className={`border-t px-4 py-3 pb-safe ${toast.late ? 'bg-amber-50 border-amber-200' : 'bg-gray-900 border-gray-900'}`} data-intake-toast>
                {toast.editing ? (
                  <div className="flex items-center gap-2">
                    <span className={`text-xs font-bold ${toast.late ? 'text-amber-900' : 'text-white'}`}>{intakeSlotLabel(toast.slot)} {toast.targets.length}개 먹은 시각</span>
                    <input type="time" value={toast.editTime} onChange={e => setToast({ ...toast, editTime: e.target.value })} aria-label="방금 체크한 것 먹은 시각"
                      className="w-[7.5rem] text-sm font-bold text-violet-800 bg-white border border-violet-200 rounded-lg px-2 py-1" />
                    <button type="button" onClick={applyToastTime} disabled={!validTime(toast.editTime)} className="text-xs font-bold px-3 py-1.5 rounded-lg bg-violet-600 text-white disabled:opacity-40">적용</button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <div className="min-w-0 flex-1">
                      <p className={`text-xs font-bold break-keep ${toast.late ? 'text-amber-900' : 'text-white'}`}>✓ {intakeSlotLabel(toast.slot)} {toast.targets.length}개를 {toast.time}으로 체크했어요</p>
                      {toast.late && <p className="text-[11px] text-amber-800 break-keep">실제로 드신 시각이 다르면 바꿔 주세요.</p>}
                    </div>
                    <button type="button" onClick={() => { clearTimeout(toastTimer.current); setToast({ ...toast, editing: true }); }}
                      className={`shrink-0 text-xs font-bold px-3 py-1.5 rounded-lg ${toast.late ? 'bg-amber-500 text-white' : 'bg-white text-gray-900'}`}>시각 바꾸기</button>
                    <button type="button" onClick={() => showToast(null)} aria-label="알림 닫기" className={`shrink-0 w-7 h-7 rounded-full text-xs font-bold ${toast.late ? 'text-amber-700' : 'text-gray-300'}`}>✕</button>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function emptyIntakeDraft(today, kind = 'supplement') {
      return { id: null, kind, name: '', dose: '', times: ['morning'], note: '', start_date: today, end_date: '', label_claim: '', ai_note: '', photos: [] };
    }

    // 설정 → 복용 관리: 등록·수정·복용 중단·삭제
    function IntakeManager({ items, today, initialDraft, busy, adherence, onSave, onStop, onResume, onDelete, onClose }) {
      const [draft, setDraft] = useState(initialDraft || null);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [openNoteId, setOpenNoteId] = useState(null);
      const [showStopped, setShowStopped] = useState(false);
      const [photoError, setPhotoError] = useState('');
      const active = (items || []).filter(i => !i.stopped_at && (!i.end_date || i.end_date >= today));
      const stopped = (items || []).filter(i => !active.includes(i));
      const set = (fields) => setDraft(d => ({ ...d, ...fields }));
      const toggleTime = (key) => setDraft(d => {
        const has = d.times.includes(key);
        const times = has ? d.times.filter(t => t !== key) : [...d.times, key];
        return { ...d, times: times.length ? times : d.times };
      });
      const addPhotos = async (files) => {
        setPhotoError('');
        try {
          const list = await Promise.all([...files].slice(0, 3).map(compressImage));
          set({ photos: list });
        } catch (err) { setPhotoError(err.message); }
      };
      const renderItem = (item) => {
        const tips = intakeTipsFor(item);
        return (
          <div key={item.id} className="bg-white border border-gray-100 rounded-2xl p-3" data-intake-item>
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <p className="text-sm font-bold text-gray-800 break-keep">{item.name}{item.dose && <span className="font-normal text-gray-500"> {item.dose}</span>}</p>
                <p className="text-[11px] text-gray-400 break-keep">
                  {(item.times || []).map(intakeSlotLabel).join('·')}{item.note ? ` · ${item.note}` : ''} · {item.start_date}부터{item.end_date ? ` ${item.end_date}까지` : ''}
                  {item.stopped_at ? ` · ${formatDate(new Date(item.stopped_at))} 중단` : ''}
                </p>
                {tips.map((tip, i) => <p key={i} className="text-[11px] text-emerald-700 break-keep">🕗 {tip}</p>)}
                {adherence?.perItem?.[item.id]?.rate != null && (
                  <p className="text-[11px] font-bold text-violet-600" data-intake-item-rate>최근 30일 복용률 {adherence.perItem[item.id].rate}% ({adherence.perItem[item.id].done}/{adherence.perItem[item.id].due}회)</p>
                )}
              </div>
              <div className="flex gap-1 shrink-0">
                <button type="button" onClick={() => setDraft({ ...emptyIntakeDraft(today), ...item, end_date: item.end_date || '', photos: [] })} className="text-[11px] font-bold px-2 py-1 rounded-lg bg-gray-100 text-gray-600">수정</button>
                {item.stopped_at
                  ? <button type="button" onClick={() => onResume(item)} className="text-[11px] font-bold px-2 py-1 rounded-lg bg-violet-50 text-violet-700">다시 먹기</button>
                  : <button type="button" onClick={() => onStop(item)} className="text-[11px] font-bold px-2 py-1 rounded-lg bg-gray-100 text-gray-600">복용 중단</button>}
              </div>
            </div>
            {item.kind === 'supplement' && item.label_claim && (
              <p className="mt-1.5 text-xs bg-violet-50 text-violet-800 rounded-xl px-3 py-2 break-keep">📦 <b>포장 표시 기능성</b> · {item.label_claim}</p>
            )}
            {item.kind === 'supplement' && item.ai_note && (
              <div className="mt-1.5 bg-gray-50 rounded-xl px-3 py-2">
                <button type="button" onClick={() => setOpenNoteId(openNoteId === item.id ? null : item.id)} className="w-full text-left text-[11px] font-bold text-gray-500">
                  🤖 AI 참고 · 확인 안 된 정보 {openNoteId === item.id ? '▲' : '▼'}
                </button>
                {openNoteId === item.id && (
                  <div className="mt-1.5 space-y-1">
                    <p className="text-xs text-gray-600 leading-snug whitespace-pre-wrap break-keep">{item.ai_note}</p>
                    <p className="text-[11px] text-gray-400 break-keep">AI가 의학 근거를 바탕으로 쓰려고 했지만 틀릴 수 있어요. 드시는 약이 있으면 약사와 확인하세요.</p>
                  </div>
                )}
              </div>
            )}
            <div className="mt-1.5 text-right">
              {confirmDeleteId === item.id ? (
                <span className="text-[11px]">
                  <span className="text-red-600 font-bold mr-1">체크 기록까지 모두 지워져요. 삭제할까요?</span>
                  <button type="button" onClick={() => { setConfirmDeleteId(null); onDelete(item); }} className="font-bold px-2 py-1 rounded bg-red-500 text-white mr-1">삭제</button>
                  <button type="button" onClick={() => setConfirmDeleteId(null)} className="font-bold px-2 py-1 rounded bg-gray-100 text-gray-600">취소</button>
                </span>
              ) : (
                <button type="button" onClick={() => setConfirmDeleteId(item.id)} className="text-[11px] text-gray-400">삭제</button>
              )}
            </div>
          </div>
        );
      };
      const group = (kind) => active.filter(i => i.kind === kind);
      return (
        <div className="fixed inset-0 bg-gray-50 z-[105] overflow-y-auto overscroll-contain p-5 pb-24" data-intake-manager>
          <div className="max-w-lg mx-auto">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-bold text-gray-900">💊 복용 관리</h2>
              <button type="button" onClick={onClose} aria-label="복용 관리 닫기" className="w-9 h-9 rounded-full bg-white border border-gray-200 text-gray-500 font-bold">✕</button>
            </div>
            {draft ? (
              <form className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-4" data-intake-form
                onSubmit={e => { e.preventDefault(); if (draft.name.trim()) onSave(draft, () => setDraft(null)); }}>
                <div className="grid grid-cols-2 gap-2">
                  {['medicine', 'supplement'].map(kind => (
                    <button key={kind} type="button" disabled={Boolean(draft.id)} onClick={() => set({ kind })}
                      className={`py-2.5 rounded-xl text-sm font-bold ${draft.kind === kind ? 'bg-violet-600 text-white' : 'bg-gray-100 text-gray-600'} disabled:opacity-70`}>
                      {kind === 'medicine' ? '💊 복용약' : '🌿 건강식품'}
                    </button>
                  ))}
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-500 block mb-1">이름</label>
                  <input value={draft.name} maxLength={60} onChange={e => set({ name: e.target.value })} required
                    placeholder={draft.kind === 'medicine' ? '예: 혈압약, 통풍약' : '예: 오메가3, 유산균, 발효효소'} className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-500 block mb-1">1회 양 (선택)</label>
                  <input value={draft.dose} maxLength={40} onChange={e => set({ dose: e.target.value })} placeholder="예: 1알, 1포" className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-500 block mb-1">먹는 때 (여러 개 고를 수 있어요)</label>
                  <div className="flex flex-wrap gap-1.5">
                    {INTAKE_SLOTS.map(s => (
                      <button key={s.key} type="button" onClick={() => toggleTime(s.key)}
                        className={`px-3 py-1.5 rounded-full text-xs font-bold ${draft.times.includes(s.key) ? 'bg-violet-600 text-white' : 'bg-gray-100 text-gray-600'}`}>{s.label}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-500 block mb-1">복용 방법 메모 (선택)</label>
                  <input value={draft.note} maxLength={100} onChange={e => set({ note: e.target.value })}
                    placeholder={draft.kind === 'medicine' ? '처방대로 적어 두세요 (예: 아침 식후 1알)' : '예: 식후에'} className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs font-bold text-gray-500 block mb-1">시작일</label>
                    <input type="date" value={draft.start_date} onChange={e => set({ start_date: e.target.value || today })} className="w-full border p-2.5 rounded-xl bg-gray-50 outline-none text-sm" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-500 block mb-1">종료일 (선택)</label>
                    <input type="date" value={draft.end_date} min={draft.start_date} onChange={e => set({ end_date: e.target.value })} className="w-full border p-2.5 rounded-xl bg-gray-50 outline-none text-sm" />
                  </div>
                </div>
                {draft.kind === 'supplement' ? (
                  <div className="bg-violet-50 rounded-2xl p-3 space-y-1.5">
                    <p className="text-xs text-violet-900 break-keep">저장하면 AI가 한 번만 참고 설명을 만들어요. 포장 사진을 올리면 포장에 적힌 기능성 문구도 읽어요.</p>
                    <input type="file" accept="image/*" multiple onChange={e => addPhotos(e.target.files)} className="text-xs" aria-label="포장 사진" />
                    {draft.photos.length > 0 && <p className="text-[11px] text-violet-700">포장 사진 {draft.photos.length}장</p>}
                    {photoError && <p className="text-[11px] text-red-500">{photoError}</p>}
                  </div>
                ) : (
                  <p className="text-xs text-gray-500 bg-gray-50 rounded-2xl p-3 break-keep">약은 AI 설명을 만들지 않고, AI 리포트에도 보내지 않아요. 체크 기록만 남아요.</p>
                )}
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={() => setDraft(null)} className="py-3 rounded-xl bg-gray-100 text-gray-600 text-sm font-bold">취소</button>
                  <button type="submit" disabled={busy || !draft.name.trim()} className="py-3 rounded-xl bg-violet-600 text-white text-sm font-bold disabled:opacity-60">{busy ? '저장 중...' : '저장'}</button>
                </div>
              </form>
            ) : (
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={() => setDraft(emptyIntakeDraft(today, 'medicine'))} className="py-3 rounded-2xl bg-white border border-violet-200 text-violet-700 text-sm font-bold">+ 복용약 등록</button>
                  <button type="button" onClick={() => setDraft(emptyIntakeDraft(today, 'supplement'))} className="py-3 rounded-2xl bg-white border border-violet-200 text-violet-700 text-sm font-bold">+ 건강식품 등록</button>
                </div>
                {['medicine', 'supplement'].map(kind => (
                  <div key={kind} className="space-y-2">
                    <p className="text-xs font-bold text-gray-500">{intakeKindLabel(kind)} {group(kind).length}개</p>
                    {group(kind).length ? group(kind).map(renderItem) : <p className="text-xs text-gray-400">등록한 {intakeKindLabel(kind)}이 없어요.</p>}
                  </div>
                ))}
                {stopped.length > 0 && (
                  <div className="space-y-2">
                    <button type="button" onClick={() => setShowStopped(!showStopped)} className="text-xs font-bold text-gray-400">그만 먹은 것 {stopped.length}개 {showStopped ? '▲' : '▼'}</button>
                    {showStopped && stopped.map(renderItem)}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 오늘의 기록표는 AI가 만든 foodName 제목 대신 실제 음식 목록을 우선 표시한다.
    // 화면 폭에 맞는 만큼(최대 4개)만 보여주고, 나머지는 "외 N개"로 요약한다.
    function getRecordedFoodNames(log) {
      const names = (Array.isArray(log?.ingredients) ? log.ingredients : [])
        .map(item => String(item || '').split('(')[0].trim())
        .filter(Boolean);
      if (names.length) return names;
      let raw = log?.rawInput || {};
      if (typeof raw === 'string') {
        try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
      }
      const original = String(raw?.naturalText || raw?.memo || '').trim();
      return original ? [original] : (log?.foodName ? [String(log.foodName)] : []);
    }

    // ★ v0.3.10 기록을 다시 쓸 때 입력창에 넣을 글. 사용자가 쓴 원문을 우선하고,
    // 사진 기록은 AI가 정리한 음식 목록(+메모)을 글로 바꾼다.
    function getCopyText(log) {
      let raw = log?.rawInput || {};
      if (typeof raw === 'string') {
        try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
      }
      const text = String(raw?.naturalText || '').trim();
      const memo = String(raw?.memo || '').trim();
      if (text && raw?.type !== 'image') return memo ? `${text} (${memo})` : text;
      const names = (Array.isArray(log?.ingredients) ? log.ingredients : [])
        .map(item => String(item || '').split('(')[0].trim()).filter(Boolean).join(', ') || String(log?.foodName || '');
      return memo ? `${names} (${memo})` : names;
    }

    // 최근 기록(기준일 이전)을 날짜별로 합치고, 같은 내용은 하나로 묶어 최신순 limit개를 돌려준다.
    function buildRecentMealChoices(logs, referenceDate, limit = 3) {
      const byDate = new Map();
      (logs || []).filter(log => log.date < referenceDate).forEach(log => {
        const text = getCopyText(log);
        if (!text) return;
        byDate.set(log.date, [...(byDate.get(log.date) || []), { time: log.time || '', text }]);
      });
      const seen = new Set();
      const choices = [];
      [...byDate.entries()].sort((a, b) => b[0].localeCompare(a[0])).forEach(([date, items]) => {
        const text = items.sort((a, b) => a.time.localeCompare(b.time)).map(item => item.text).join(', ');
        const key = text.replace(/\s+/g, '').toLowerCase();
        if (choices.length >= limit || seen.has(key)) return;
        seen.add(key);
        const daysAgo = Math.round((parseDate(referenceDate) - parseDate(date)) / 86400000);
        choices.push({ date, text, label: daysAgo === 1 ? '어제' : daysAgo === 2 ? '그저께' : `${Number(date.slice(5, 7))}/${Number(date.slice(8, 10))}` });
      });
      return choices;
    }

    // ★ v0.3.10 저장 중 AI 오류·새로고침이 나도 입력 내용을 잃지 않도록 이 기기에 임시 보관한다.
    // ★ v0.3.12 AI가 잠깐 바쁘거나(서버가 다시 시도해도 실패) 인터넷이 잠깐 끊긴 오류. 새로고침해도 나아지지 않으므로
    // 새로고침 대신 안내하고 같은 요청을 다시 보낼 수 있게 한다. 로그인·권한·저장 오류는 기존처럼 새로고침한다.
    function isTemporaryAiError(err) {
      if (err?.name === 'AbortError') return false;
      const message = String(err?.message || err || '');
      return /^AI 분석 실패|AI 응답이 비어|AI 응답 포맷|Failed to fetch|NetworkError|Load failed|network error/i.test(message);
    }

    // ★ v0.3.13 일시 오류의 종류에 맞는 안내 문구. 원문은 "오류 전문 보기"로 따로 보여준다.
    function temporaryAiMessage(detail) {
      const text = String(detail || '');
      if (/HTTP 429|RESOURCE_EXHAUSTED|quota/i.test(text)) return 'AI 무료 사용 한도에 걸렸어요. 분당 한도라면 1분쯤 뒤에, 하루 한도라면 내일 다시 시도해 주세요.';
      if (/Failed to fetch|NetworkError|Load failed|network error/i.test(text)) return '인터넷 연결이 잠깐 끊겼어요. 연결을 확인하고 다시 시도해 주세요.';
      return 'AI가 잠시 바빠요. 잠시 후 다시 시도해 주세요.';
    }

    // ★ v0.3.12 오류로 새로고침될 때 보던 화면(탭·날짜·주간/월간)과 쓰던 질문을 잠깐 보관했다가 되살린다.
    // 10분이 지난 값은 쓰지 않는다(다음 날 앱을 열면 지금처럼 홈의 오늘에서 시작).
    const VIEW_STATE_KEY = 'viewStateBeforeReload';
    const VIEW_STATE_MAX_AGE_MS = 10 * 60 * 1000;
    function takeSavedViewState() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(VIEW_STATE_KEY) || 'null');
        sessionStorage.removeItem(VIEW_STATE_KEY);
        if (!saved || !(Date.now() - saved.savedAt < VIEW_STATE_MAX_AGE_MS)) return null;
        return {
          activeTab: ['home', 'routine', 'workout', 'status', 'analysis'].includes(saved.activeTab) ? saved.activeTab : null,
          currentDate: /^\d{4}-\d{2}-\d{2}$/.test(saved.currentDate || '') ? saved.currentDate : null,
          statsMode: ['week', 'month'].includes(saved.statsMode) ? saved.statsMode : null,
          longTermDrafts: saved.longTermDrafts && typeof saved.longTermDrafts === 'object' ? saved.longTermDrafts : {},
          followupDraft: typeof saved.followupDraft === 'string' ? saved.followupDraft.slice(0, 300) : '',
          openFollowupId: saved.openFollowupId || null,
        };
      } catch (error) { return null; }
    }

    const PENDING_ENTRY_KEY = 'pendingEntry';
    function savePendingEntry(entry) {
      try { localStorage.setItem(PENDING_ENTRY_KEY, JSON.stringify(entry)); return; } catch (error) { /* 사진 때문에 용량 초과일 수 있음 */ }
      try {
        const photos = entry.payload.base64Images || [];
        localStorage.setItem(PENDING_ENTRY_KEY, JSON.stringify({ ...entry, payload: { ...entry.payload, base64Images: [] }, photosDropped: photos.length > 0 }));
      } catch (error) { /* 보관하지 못해도 저장은 진행한다 */ }
    }
    function readPendingEntry(userId) {
      try {
        const entry = JSON.parse(localStorage.getItem(PENDING_ENTRY_KEY) || 'null');
        return entry && entry.payload && entry.userId === userId ? entry : null;
      } catch (error) { return null; }
    }
    function clearPendingEntry() {
      try { localStorage.removeItem(PENDING_ENTRY_KEY); } catch (error) { /* 무시 */ }
    }

    function MealRecordSummary({ matches }) {
      const lineRef = useRef(null);
      const allFoods = [...new Set((matches || []).flatMap(getRecordedFoodNames))];
      const [visibleCount, setVisibleCount] = useState(Math.min(4, Math.max(1, allFoods.length)));
      const firstTime = matches?.[0]?.time || '';
      const extraRecords = Math.max(0, (matches?.length || 0) - 1);
      const makeText = (count) => {
        const shown = allFoods.slice(0, count);
        const hidden = Math.max(0, allFoods.length - shown.length);
        return `${firstTime}${shown.length ? ` ${shown.join(' · ')}` : ''}${hidden ? ` 외 ${hidden}개` : ''}${extraRecords ? ` · +${extraRecords}회` : ''}`;
      };

      useEffect(() => {
        const node = lineRef.current;
        if (!node) return;
        const fit = () => {
          const style = getComputedStyle(node);
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          context.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
          const width = node.clientWidth;
          let count = Math.min(4, Math.max(1, allFoods.length));
          while (count > 1 && context.measureText(makeText(count)).width > width) count--;
          setVisibleCount(count);
        };
        fit();
        const observer = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(fit) : null;
        observer?.observe(node);
        window.addEventListener('resize', fit);
        return () => { observer?.disconnect(); window.removeEventListener('resize', fit); };
      }, [firstTime, extraRecords, allFoods.join('|')]);

      const fullText = `${firstTime} ${allFoods.join(' · ')}${extraRecords ? ` · 추가 기록 ${extraRecords}회` : ''}`.trim();
      return <p ref={lineRef} title={fullText} aria-label={fullText} className="text-xs text-gray-500 whitespace-nowrap overflow-hidden text-ellipsis">{makeText(visibleCount)}</p>;
    }

    // ★ v0.4.0 루틴(생활 습관). DB: routines, routine_checks (본인 것만). AI는 쓰지 않는다.
    const ROUTINE_SLOTS = [
      { key: 'morning', label: '아침', start: 5 },
      { key: 'late_morning', label: '오전', start: 9 },
      { key: 'lunch', label: '점심', start: 11 },
      { key: 'afternoon', label: '오후', start: 14 },
      { key: 'evening', label: '저녁', start: 18 },
      { key: 'bedtime', label: '자기 전', start: 21 },
      { key: 'anytime', label: '언제든', start: null },
    ];
    const ROUTINE_WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const ROUTINE_LOOKBACK_DAYS = 365;
    const routineSlotLabel = (key) => (ROUTINE_SLOTS.find(s => s.key === key) || ROUTINE_SLOTS[6]).label;
    const routineSlotIndex = (key) => Math.max(0, ROUTINE_SLOTS.findIndex(s => s.key === key));

    // 지금 시각이 속한 시간대(새벽 0~5시는 '자기 전'으로 본다).
    function currentRoutineSlot(now = new Date()) {
      const hour = now.getHours();
      if (hour < 5) return 'bedtime';
      let current = 'morning';
      ROUTINE_SLOTS.forEach(slot => { if (slot.start !== null && hour >= slot.start) current = slot.key; });
      return current;
    }

    function routineDaysBetween(fromDate, toDate) {
      return Math.round((parseDate(toDate) - parseDate(fromDate)) / 86400000);
    }

    function routineArchivedDate(routine) {
      return routine?.archived_at ? formatDate(new Date(routine.archived_at)) : null;
    }

    // 그 날짜에 해야 하는 루틴인가. 매월의 없는 날짜(예: 2월 31일)는 그 달 말일로 처리한다.
    function isRoutineDue(routine, date) {
      if (!routine || !date) return false;
      if (routine.start_date && date < routine.start_date) return false;
      const archived = routineArchivedDate(routine);
      if (archived && date > archived) return false;
      const d = parseDate(date);
      switch (routine.schedule_type) {
        case 'daily': return true;
        case 'weekly': return (routine.weekdays || []).map(Number).includes(d.getDay());
        case 'monthly': {
          const day = d.getDate();
          const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
          const days = (routine.month_days || []).map(Number);
          return days.includes(day) || (day === lastDay && days.some(x => x > lastDay));
        }
        case 'interval': {
          const n = Math.max(1, Number(routine.interval_days) || 1);
          const diff = routineDaysBetween(routine.start_date || date, date);
          return diff >= 0 && diff % n === 0;
        }
        default: return false;
      }
    }

    // done(완료) / skipped(건너뜀) / slipped(버릴 습관을 함, v0.6.0) / progress(횟수형 진행 중) / todo(아직).
    // mini(조금이라도 함)는 지킨 것으로 보아 done이다(어떤 기록인지는 check.status로 구분).
    // 운동 연결 루틴은 그 시간대의 운동 기록이 있으면 완료(autoDone). 단, 내가 직접 남긴 체크가 있으면 그것이 우선한다.
    function routineDayState(routine, check, autoDone) {
      if (check?.status === 'skipped') return 'skipped';
      if (check?.status === 'done' || check?.status === 'mini') return 'done';
      if (check?.status === 'slipped') return 'slipped';
      if (routine.kind === 'count' && (check?.value || 0) >= routine.target) return 'done';
      if (!check && (routine.link_exercise || routine.link_intake) && autoDone) return 'done';
      if (routine.kind === 'count' && (check?.bad_value || 0) > 0 && String(routine.bad_habit || '').trim()) return 'slipped';
      if (routine.kind === 'count' && (check?.value || 0) > 0) return 'progress';
      return 'todo';
    }

    // 운동 기록 시각이 속한 시간대(currentRoutineSlot과 같은 경계). 시각이 없으면 '언제든'.
    function routineSlotForTime(time) {
      const hour = parseInt(String(time || '').slice(0, 2), 10);
      return Number.isFinite(hour) ? currentRoutineSlot(new Date(2000, 0, 1, hour, 0)) : 'anytime';
    }

    // 운동 기록 하나는 연결된 루틴 하나만 완료한다. 같은 시간대 루틴을 먼저, 없으면 '언제든' 루틴에 붙인다.
    function matchExerciseToRoutines(linkedRoutines, times) {
      const matched = new Set();
      [...(times || [])].sort().forEach(time => {
        const slot = routineSlotForTime(time);
        const pick = linkedRoutines.find(r => !matched.has(r.id) && (r.time_slot || 'anytime') === slot)
          || linkedRoutines.find(r => !matched.has(r.id) && (r.time_slot || 'anytime') === 'anytime');
        if (pick) matched.add(pick.id);
      });
      return matched;
    }

    function describeRoutineSchedule(routine) {
      switch (routine.schedule_type) {
        case 'daily': return '매일';
        case 'weekly': return '매주 ' + [...(routine.weekdays || [])].map(Number).sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => ROUTINE_WEEKDAYS[d]).join('·');
        case 'monthly': return '매월 ' + [...(routine.month_days || [])].map(Number).sort((a, b) => a - b).join('·') + '일';
        case 'interval': return `${routine.interval_days}일마다`;
        default: return '';
      }
    }

    // 같은 시간대 안에서는 정확한 시간을 적은 것부터 이른 순, 그다음 내가 정한 순서.
    function compareRoutines(a, b) {
      return routineSlotIndex(a.time_slot) - routineSlotIndex(b.time_slot)
        || (a.time_of_day ? 0 : 1) - (b.time_of_day ? 0 : 1)
        || String(a.time_of_day || '').localeCompare(String(b.time_of_day || ''))
        || (a.sort_order || 0) - (b.sort_order || 0)
        || String(a.created_at || '').localeCompare(String(b.created_at || ''));
    }

    // 연속 일수·최고 연속·최근 30일 달성률·이번 주(월~일) 진행. 건너뛴 날은 연속을 끊지 않고 계산에서 뺀다.
    // 오늘 아직 안 한 루틴은 연속을 끊지 않는다(어제까지로 센다). 달성률·이번 주 진행에는 오늘 할 것도 포함한다.
    function computeRoutineStats(routine, getCheck, isAutoDone, today, lookbackDays = ROUTINE_LOOKBACK_DAYS) {
      const first = parseDate(today);
      first.setDate(first.getDate() - lookbackDays);
      const startDate = routine.start_date && routine.start_date > formatDate(first) ? routine.start_date : formatDate(first);
      const days = [];
      for (let d = parseDate(startDate); formatDate(d) <= today; d.setDate(d.getDate() + 1)) {
        const date = formatDate(d);
        if (!isRoutineDue(routine, date)) continue;
        days.push({ date, state: routineDayState(routine, getCheck(routine.id, date), isAutoDone(routine, date)) });
      }
      let current = 0;
      for (let i = days.length - 1; i >= 0; i--) {
        const { date, state } = days[i];
        if (state === 'done') current++;
        else if (state === 'skipped') continue;
        else if (date === today && state !== 'slipped') continue;
        else break;
      }
      let best = 0, run = 0, totalDone = 0;
      days.forEach(({ date, state }) => {
        if (state === 'done') { run++; totalDone++; best = Math.max(best, run); }
        else if (state !== 'skipped' && (date !== today || state === 'slipped')) run = 0;
      });
      const since30 = parseDate(today); since30.setDate(since30.getDate() - 29);
      const window = days.filter(d => d.date >= formatDate(since30) && d.state !== 'skipped');
      const score = window.length ? Math.round(window.filter(d => d.state === 'done').length / window.length * 100) : null;
      // 이번 주 월~일: 할 날이 아님(none) / 앞으로(future) / 오늘 아직(today) / 못 함(missed) / 완료 / 건너뜀
      const range = getWeekRange(today);
      const week = [];
      for (let d = parseDate(range.start); formatDate(d) <= range.end; d.setDate(d.getDate() + 1)) {
        const date = formatDate(d);
        if (!isRoutineDue(routine, date)) { week.push({ date, state: 'none' }); continue; }
        if (date > today) { week.push({ date, state: getCheck(routine.id, date)?.status === 'skipped' ? 'skipped' : 'future' }); continue; }
        const state = routineDayState(routine, getCheck(routine.id, date), isAutoDone(routine, date));
        week.push({ date, state: state === 'done' || state === 'skipped' || state === 'slipped' ? state : date === today ? 'today' : 'missed' });
      }
      const weekDue = week.filter(x => x.state !== 'none' && x.state !== 'skipped').length;
      const weekDone = week.filter(x => x.state === 'done').length;
      // 이번 주에 할 날이 없으면(매월·n일마다) 다음 할 날을 알려 준다.
      let nextDue = null;
      if (!weekDue && !routine.archived_at) {
        const d = parseDate(today);
        for (let i = 0; i < 400; i++) {
          d.setDate(d.getDate() + 1);
          if (isRoutineDue(routine, formatDate(d))) { nextDue = formatDate(d); break; }
        }
      }
      return { current, best, score, totalDone, week, weekDue, weekDone, nextDue };
    }

    // ★ v0.6.0 짝 습관: 하고 싶은 습관(루틴 이름) vs 버릴 습관. 버릴 습관이 비어 있으면 일반 루틴과 같다.
    // 하루 기록: done(했어요) / mini(조금이라도 = 지킴으로 셈) / slipped(버릴 습관을 함) / skipped(쉼).
    // 아래 계산은 모두 규칙이다(AI 아님). 이 구역에는 JSX를 넣지 않는다(예전 검사가 그대로 실행함).
    const isPairRoutine = (r) => Boolean(String(r?.bad_habit || '').trim());
    const addDaysStr = (dateStr, n) => { const d = parseDate(dateStr); d.setDate(d.getDate() + n); return formatDate(d); };

    // endDate까지 days일 동안의 기록 요약(할 날만). 짝 습관은 기록한 날 중 지킨 비율, 일반 루틴은 할 날 중 한 비율.
    function habitWindowSummary(routine, getCheck, isAutoDone, endDate, days = 14) {
      const pair = isPairRoutine(routine);
      const s = { pair, due: 0, done: 0, mini: 0, slipped: 0, skipped: 0, unrecorded: 0 };
      for (let i = days - 1; i >= 0; i--) {
        const date = addDaysStr(endDate, -i);
        if (!isRoutineDue(routine, date)) continue;
        const check = getCheck(routine.id, date);
        const state = routineDayState(routine, check, isAutoDone(routine, date));
        s.due++;
        if (state === 'skipped') s.skipped++;
        else if (state === 'done') { s.done++; if (check?.status === 'mini') s.mini++; }
        else if (state === 'slipped') s.slipped++;
        else s.unrecorded++;
      }
      s.counted = s.due - s.skipped;
      s.recorded = s.done + s.slipped;
      const base = pair ? s.recorded : s.counted;
      s.rate = base ? Math.round(s.done / base * 100) : null;
      return s;
    }

    // good(잘 지켜가는 것) / shaky(흔들리는 것) / sparse(기록이 부족한 것, 짝 습관만) / ok(무난) / few(할 날이 너무 적음)
    function classifyHabit(s) {
      if (!s || s.counted < 4) return 'few';
      if (s.pair && (s.recorded < 4 || s.recorded < s.counted * 0.5)) return 'sparse';
      if (!s.pair && s.done === 0) return 'sparse'; // 2주 동안 한 번도 기록이 없으면 쓰지 않는 루틴일 수 있다
      if (s.rate >= 70) return 'good';
      if (s.rate <= 40) return 'shaky';
      return 'ok';
    }

    function habitTrend(cur, prev) {
      if (!cur || !prev || cur.rate === null || prev.rate === null || classifyHabit(prev) === 'few' || classifyHabit(prev) === 'sparse') return '';
      const diff = cur.rate - prev.rate;
      return diff >= 10 ? 'up' : diff <= -10 ? 'down' : '';
    }

    // "5분으로", "2회로", "5km로": 마지막 글자에 받침이 있으면(ㄹ 제외) '으로'.
    function withRo(word) {
      const text = String(word);
      const code = text.charCodeAt(text.length - 1) - 0xAC00;
      if (code < 0 || code > 11171) return text + '로';
      const jong = code % 28;
      return text + (jong === 0 || jong === 8 ? '로' : '으로');
    }

    // 주간 점검의 조정 제안(규칙). 흔들리면 작게, 2주 넘게 잘하면 한 단계 올리기.
    function habitSuggestion(routine, cur, prev) {
      const cls = classifyHabit(cur);
      if (cls === 'shaky') {
        if (!isPairRoutine(routine)) return { type: 'set_bad', text: '무엇 때문에 못 하게 되는지 "버릴 습관"으로 적어 볼까요?' };
        if (!routine.min_version) return { type: 'set_min', text: '힘든 날의 최소를 숫자로 정해 볼까요?' };
        const down = scaleMinVersion(routine.min_version, 'down');
        if (down) return { type: 'smaller_min', to: down, text: `최소 ${routine.min_version} → ${withRo(down)} 줄여 볼까요?` };
        if (parseMinVersion(routine.min_version)) return null; // 이미 가장 작다(1)
        return { type: 'smaller_min', text: '최소 버전을 더 작게 해 볼까요?' };
      }
      if (cls === 'good' && classifyHabit(prev) === 'good') {
        if (routine.kind === 'count') {
          const target = (Number(routine.target) || 1) + (Number(routine.step) || 1);
          return { type: 'raise_target', target, text: `2주 넘게 잘 지켰어요. 목표를 ${routine.target} → ${withRo(target + (routine.unit || ''))} 올려 볼까요?` };
        }
        if (routine.min_version) {
          const up = scaleMinVersion(routine.min_version, 'up');
          if (up) return { type: 'raise_min', to: up, text: `2주 넘게 잘 지켰어요. 최소 ${routine.min_version} → ${withRo(up)} 올려 볼까요?` };
          return { type: 'raise_min', text: '2주 넘게 잘 지켰어요. 최소 버전을 한 단계 올려 볼까요?' };
        }
      }
      return null;
    }

    // 점검할 주: 일요일이면 이번 주, 아니면 지난주(월~일).
    function weeklyReviewTarget(today) {
      const r = getWeekRange(today);
      if (parseDate(today).getDay() === 0) return { start: r.start, end: r.end };
      return { start: addDaysStr(r.start, -7), end: addDaysStr(r.start, -1) };
    }

    // 점검 대상 루틴: 보관하지 않았고 그 주가 끝나기 전에 시작한 것.
    function weeklyReviewRoutines(routines, weekEnd) {
      return (routines || []).filter(r => !r.archived_at && (!r.start_date || r.start_date <= weekEnd));
    }

    // 두 번 연속 놓치지 않기: 어제 버릴 습관을 고른 짝 습관 중 오늘 아직 기록하지 않은 것.
    function yesterdaySlippedRoutines(routines, getCheck, isAutoDone, date) {
      const yesterday = addDaysStr(date, -1);
      return (routines || []).filter(r => !r.archived_at && isPairRoutine(r) && isRoutineDue(r, date) && isRoutineDue(r, yesterday)
        && routineDayState(r, getCheck(r.id, yesterday), isAutoDone(r, yesterday)) === 'slipped'
        && ['todo', 'progress'].includes(routineDayState(r, getCheck(r.id, date), isAutoDone(r, date))));
    }

    // ★ v0.6.2 최소 버전은 숫자 + 단위("10분", "5쪽"). routines.min_version 글자 칸에 그대로 저장하고 읽을 때 나눈다.
    // 예전처럼 글로 적은 것("스트레칭 1분")은 나누지 못하므로 글 그대로 둔다(null).
    const MIN_UNITS = ['분', '시간', '회', '쪽', '개'];
    function parseMinVersion(text) {
      const m = String(text || '').trim().match(/^(\d+(?:\.\d+)?)\s*([^\d\s][^\d]{0,9})$/);
      if (!m) return null;
      const amount = Number(m[1]);
      return amount > 0 ? { amount, unit: m[2].trim() } : null;
    }
    function formatMinVersion(amount, unit) {
      const n = Number(amount);
      if (!(n > 0)) return '';
      return `${Math.round(n * 10) / 10}${String(unit || '').trim()}`.slice(0, 60);
    }
    // 줄이기: 반으로(1 아래로는 안 내려감). 올리기: 절반만큼 더하기. 바뀌지 않으면 null.
    function scaleMinVersion(text, dir) {
      const p = parseMinVersion(text);
      if (!p) return null;
      const n = dir === 'down' ? Math.max(1, Math.floor(p.amount / 2)) : p.amount + Math.max(1, Math.round(p.amount * 0.5));
      return n === p.amount ? null : formatMinVersion(n, p.unit);
    }

    // ★ v0.6.2 이름으로 이모지 고르기(규칙). 맞는 게 없으면 ✅.
    const ROUTINE_EMOJI_RULES = [
      [/독서|책|읽기/, '📚'], [/명상|호흡|마음/, '🧘'], [/걷기|산책|걸음|계단/, '🚶'], [/달리기|러닝|조깅/, '🏃'],
      [/운동|헬스|스트레칭|근력|요가|플랭크/, '💪'], [/물|수분/, '💧'], [/약|영양제|비타민/, '💊'],
      [/집중|업무|일하기|공부/, '🎯'], [/일기|글쓰기|기록/, '📝'], [/잠|수면|취침|기상/, '🛏️'], [/청소|정리/, '🧹'], [/기도|감사/, '🙏'], [/기타|피아노|악기|노래/, '🎸'],
    ];
    function pickRoutineEmoji(name) {
      const text = String(name || '');
      const hit = ROUTINE_EMOJI_RULES.find(([re]) => re.test(text));
      return hit ? hit[1] : '✅';
    }

    // ★ v0.6.2 새 습관 예시(누르면 칸이 채워진다). 사용자가 든 예시 그대로.
    const HABIT_TEMPLATES = [
      { emoji: '📚', name: '독서', bad_habit: '웹툰 보기', min_version: '5쪽', time_slot: 'evening' },
      { emoji: '🏃', name: '아침운동', bad_habit: '알람 끄고 다시 눕기', min_version: '5분', time_slot: 'morning' },
      { emoji: '🎯', name: '업무 집중', bad_habit: '걱정만 하고 미루기', min_version: '10분', time_slot: 'late_morning' },
      { emoji: '🚶', name: '점심 걷기', bad_habit: '앉아서 쉬기', min_version: '10분', time_slot: 'lunch' },
    ];

    // 오늘(보고 있는 날짜)의 루틴: 해야 하는 것만, 시간대 순. 오늘이면 지금 시간대부터 보여 주고 지난 시간대는 뒤로.
    function buildTodayRoutineGroups(routines, date, isToday, nowSlot) {
      const due = (routines || []).filter(r => !r.archived_at && isRoutineDue(r, date)).sort(compareRoutines);
      const order = ROUTINE_SLOTS.map(s => s.key);
      let slotOrder = order;
      if (isToday) {
        const nowIndex = routineSlotIndex(nowSlot);
        const timed = order.filter(k => k !== 'anytime');
        slotOrder = [...timed.slice(nowIndex), 'anytime', ...timed.slice(0, nowIndex)];
      }
      return slotOrder.map(key => ({
        key, label: routineSlotLabel(key),
        past: isToday && key !== 'anytime' && routineSlotIndex(key) < routineSlotIndex(nowSlot),
        now: isToday && key === nowSlot,
        items: due.filter(r => (r.time_slot || 'anytime') === key),
      })).filter(g => g.items.length);
    }

    // ★ v0.4.3 홈 칩: 지금·이후·언제든 루틴과 지난 시간대(놓친) 루틴을 나눈다.
    // 새벽 0~5시는 하루가 막 시작된 때라 놓친 것으로 보지 않는다. 지난 날짜는 모두 '지금' 목록.
    function splitHomeRoutines(items, isToday, nowSlot, hour) {
      if (!isToday || hour < 5) return { upcoming: items, missed: [] };
      const nowIndex = routineSlotIndex(nowSlot);
      const isMissed = (r) => { const s = r.time_slot || 'anytime'; return s !== 'anytime' && routineSlotIndex(s) < nowIndex; };
      return { upcoming: items.filter(r => !isMissed(r)), missed: items.filter(isMissed) };
    }

    // "놓친 루틴 3개 · 아침 운동, 영양제" + " +1"
    function homeMissedLabel(missed) {
      const names = missed.slice(0, 2).map(r => r.name).join(', ');
      return { text: `⏰ 놓친 루틴 ${missed.length}개 · ${names}`, more: missed.length > 2 ? `+${missed.length - 2}` : '' };
    }

    // 이번 누름으로 완료가 되는가(횟수 루틴은 목표를 채울 때만).
    function routineTapCompletes(routine, check, state) {
      if (state === 'done' || state === 'skipped') return false;
      return routine.kind !== 'count' || ((check?.value || 0) + (routine.step || 1)) >= routine.target;
    }

    // ★ v0.4.3 홈 칩·루틴 탭 공통: 체크한 항목을 ✓·줄 긋기로 0.7초 보여 준 뒤 0.3초 동안 사라지게 한다.
    // 저장은 누르는 즉시 하고, 이것은 화면 효과만 맡는다. 사라지는 중에 다시 누르면 효과를 멈추고 체크를 취소한다.
    const ROUTINE_LEAVE_HOLD_MS = 700, ROUTINE_LEAVE_FADE_MS = 300;
    function useRoutineLeaving(date) {
      const [leaving, setLeaving] = useState({}); // routine id -> 'hold' | 'fade'
      const timersRef = useRef({});
      const cancel = (id) => {
        (timersRef.current[id] || []).forEach(clearTimeout);
        delete timersRef.current[id];
        setLeaving(p => { if (!(id in p)) return p; const n = { ...p }; delete n[id]; return n; });
      };
      const start = (id) => {
        cancel(id);
        setLeaving(p => ({ ...p, [id]: 'hold' }));
        timersRef.current[id] = [
          setTimeout(() => setLeaving(p => (id in p ? { ...p, [id]: 'fade' } : p)), ROUTINE_LEAVE_HOLD_MS),
          setTimeout(() => cancel(id), ROUTINE_LEAVE_HOLD_MS + ROUTINE_LEAVE_FADE_MS),
        ];
      };
      useEffect(() => () => Object.values(timersRef.current).flat().forEach(clearTimeout), []);
      useEffect(() => { Object.keys(timersRef.current).forEach(cancel); }, [date]);
      // 체크 버튼 대신 부른다: 사라지는 중이면 취소, 이번 누름으로 완료되면 효과 시작.
      const tap = (routine, check, state, onTap) => {
        if (leaving[routine.id]) { cancel(routine.id); onTap(); return; }
        if (routineTapCompletes(routine, check, state)) start(routine.id);
        onTap();
      };
      return { leaving, tap, start, cancel };
    }

    function RoutineCheckButton({ routine, state, value, onTap }) {
      const done = state === 'done', skipped = state === 'skipped', slipped = state === 'slipped';
      return (
        <button type="button" onClick={onTap} aria-label={`${routine.name} ${done ? '완료 취소' : '체크'}`}
          className={`shrink-0 w-9 h-9 rounded-full border-2 flex items-center justify-center text-xs font-bold transition active:scale-95 ${done ? 'bg-emerald-500 border-emerald-500 text-white' : skipped ? 'bg-gray-100 border-gray-200 text-gray-400' : slipped ? 'bg-amber-100 border-amber-300 text-amber-600' : 'bg-white border-emerald-300 text-emerald-600'}`}>
          {done ? '✓' : skipped ? '쉼' : slipped ? '🚫' : routine.kind === 'count' ? `+${routine.step || 1}` : ''}
        </button>
      );
    }

    // ★ v0.6.0 짝 습관 기록 버튼: 했어요 / 조금이라도 / 버릴 습관. 같은 크기로 두고, 고른 것을 다시 누르면 취소된다.
    // 횟수 루틴은 양쪽 모두 횟수(+1)로 센다.
    function PairChoiceBar({ routine, check, state, onChoose }) {
      const status = check?.status;
      const btn = (active, bad) => `flex-1 min-w-0 truncate text-[11px] font-bold px-2 py-1.5 rounded-lg border active:scale-95 ${active
        ? (bad ? 'bg-amber-500 border-amber-500 text-white' : 'bg-emerald-500 border-emerald-500 text-white')
        : (bad ? 'bg-white border-amber-200 text-amber-700' : 'bg-white border-emerald-200 text-emerald-700')}`;
      if (routine.kind === 'count') {
        return (
          <div className="mt-1.5" data-pair-choices>
            <p className="text-[11px] text-gray-400 break-keep">vs 🚫 {routine.bad_habit}</p>
            <div className="flex gap-1.5 mt-1">
              <button type="button" onClick={() => onChoose('done')} className={btn(false)}>✓ +{routine.step || 1}{routine.unit || ''}</button>
              <button type="button" onClick={() => onChoose('slipped')} className={btn((check?.bad_value || 0) > 0, true)}>🚫 +1 ({check?.bad_value || 0}번)</button>
            </div>
          </div>
        );
      }
      const doneActive = state === 'done' && status !== 'mini';
      return (
        <div className="mt-1.5" data-pair-choices>
          <p className="text-[11px] text-gray-400 break-keep">vs 🚫 {routine.bad_habit}</p>
          <div className="flex gap-1.5 mt-1">
            <button type="button" onClick={() => onChoose('done')} aria-pressed={doneActive} className={btn(doneActive)}>✓ 했어요</button>
            <button type="button" onClick={() => onChoose('mini')} aria-pressed={status === 'mini'} className={btn(status === 'mini')}>{routine.min_version ? `◐ 최소 ${routine.min_version}` : '◐ 조금이라도'}</button>
            <button type="button" onClick={() => onChoose('slipped')} aria-pressed={status === 'slipped'} className={btn(status === 'slipped', true)}>🚫 {routine.bad_habit}</button>
          </div>
        </div>
      );
    }

    // ★ v0.6.0 주간 습관 점검(일요일 1분). 최근 2주를 습관별로 보고, 규칙으로 조정 제안을 한다. 전체 점수는 없다.
    function HabitReviewSheet({ routines, getCheck, isAutoDone, target, aiNote, onAskNote, onApply, onDone, onClose }) {
      const [drafts, setDrafts] = useState({});
      const [applied, setApplied] = useState({});
      const [busy, setBusy] = useState(false);
      const [noteState, setNoteState] = useState(aiNote ? 'done' : 'idle'); // ★ v0.6.1 AI 한마디: idle / loading / done / failed
      const md = (s) => `${Number(s.slice(5, 7))}/${Number(s.slice(8))}`;
      const items = weeklyReviewRoutines(routines, target.end).sort(compareRoutines).map(r => {
        const cur = habitWindowSummary(r, getCheck, isAutoDone, target.end, 14);
        const prev = habitWindowSummary(r, getCheck, isAutoDone, addDaysStr(target.end, -14), 14);
        return { r, cur, prev, cls: classifyHabit(cur), trend: habitTrend(cur, prev), sug: habitSuggestion(r, cur, prev) };
      });
      const line = ({ r, cur }) => cur.pair
        ? `기록 ${cur.recorded}번 중 ${cur.done}번 지킴${cur.mini ? ` (그중 ${cur.mini}번은 조금만)` : ''}${cur.slipped ? ` · 🚫 ${r.bad_habit} ${cur.slipped}번` : ''}`
        : `할 날 ${cur.counted}일 중 ${cur.done}일 했어요`;
      const apply = async (x, patch) => {
        setBusy(true);
        const ok = await onApply(x.r, patch);
        setBusy(false);
        if (ok !== false) setApplied(a => ({ ...a, [x.r.id]: true }));
      };
      // 제안은 한 번에 많이 하지 않는다: 가장 흔들리는 두 개(지킨 비율이 낮은 순)와 올려 볼 만한 것만.
      const shakyIds = new Set(items.filter(x => x.cls === 'shaky' && x.sug).sort((a, b) => (a.cur.rate ?? 0) - (b.cur.rate ?? 0)).slice(0, 2).map(x => x.r.id));
      const suggestion = (x) => {
        if (!x.sug || (x.cls === 'shaky' && !shakyIds.has(x.r.id))) return null;
        if (applied[x.r.id]) return <p className="text-[11px] font-bold text-emerald-600 mt-1">✓ 바꿨어요</p>;
        if (x.sug.to) {
          return (
            <div className="mt-1.5 flex items-center gap-2" data-review-suggestion>
              <p className="flex-1 min-w-0 text-[11px] text-gray-600 break-keep">💡 {x.sug.text}</p>
              <button type="button" disabled={busy} onClick={() => apply(x, { min_version: x.sug.to })} className="shrink-0 text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white disabled:opacity-50">{x.sug.type === 'raise_min' ? '올리기' : '줄이기'}</button>
            </div>
          );
        }
        if (x.sug.type === 'set_min') {
          const value = drafts[x.r.id] || '';
          return (
            <div className="mt-1.5 space-y-1.5" data-review-suggestion>
              <p className="text-[11px] text-gray-600 break-keep">💡 {x.sug.text}</p>
              <MinVersionInput value="" onChange={(v) => setDrafts(d => ({ ...d, [x.r.id]: v }))} />
              <button type="button" disabled={busy || !parseMinVersion(value)} onClick={() => apply(x, { min_version: value })}
                className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white disabled:opacity-40">적용</button>
            </div>
          );
        }
        if (x.sug.type === 'raise_target') {
          return (
            <div className="mt-1.5 flex items-center gap-2" data-review-suggestion>
              <p className="flex-1 min-w-0 text-[11px] text-gray-600 break-keep">💡 {x.sug.text}</p>
              <button type="button" disabled={busy} onClick={() => apply(x, { target: x.sug.target })} className="shrink-0 text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white disabled:opacity-50">올리기</button>
            </div>
          );
        }
        const field = x.sug.type === 'set_bad' ? 'bad_habit' : 'min_version';
        const value = drafts[x.r.id] ?? (field === 'min_version' ? (x.r.min_version || '') : '');
        const placeholder = field === 'bad_habit' ? '예: 알람 끄고 다시 눕기' : '예: 1쪽만, 스트레칭 5분';
        return (
          <div className="mt-1.5 space-y-1" data-review-suggestion>
            <p className="text-[11px] text-gray-600 break-keep">💡 {x.sug.text}</p>
            <div className="flex gap-1.5">
              <input value={value} maxLength={60} onChange={e => setDrafts(d => ({ ...d, [x.r.id]: e.target.value }))} placeholder={placeholder}
                aria-label={`${x.r.name} ${field === 'bad_habit' ? '버릴 습관' : '최소 버전'}`} className="flex-1 min-w-0 text-sm bg-white border border-gray-200 rounded-lg px-2 py-1" />
              <button type="button" disabled={busy || !value.trim() || value.trim() === (x.r[field] || '')} onClick={() => apply(x, { [field]: value.trim().slice(0, 60) })}
                className="shrink-0 text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white disabled:opacity-40">적용</button>
            </div>
          </div>
        );
      };
      const groups = [
        ['good', '👍 잘 지켜가는 것', 'bg-emerald-50'],
        ['shaky', '⚠️ 흔들리는 것', 'bg-amber-50'],
        ['sparse', '❔ 기록이 부족한 것', 'bg-gray-50'],
      ];
      const quiet = items.filter(x => x.cls === 'ok' || x.cls === 'few');
      // ★ v0.6.1 점검을 열면 그 주 한마디가 없을 때 한 번만 AI에 요청한다(습관 이름·기록 수만 보냄). 실패해도 점검은 그대로.
      const askedRef = useRef(false);
      useEffect(() => {
        if (aiNote || askedRef.current || !onAskNote) return;
        const habits = items.filter(x => x.cls !== 'few').map(x => ({
          name: x.r.name, bad: x.r.bad_habit || '', min: x.r.min_version || '', cls: x.cls, trend: x.trend,
          counted: x.cur.counted, recorded: x.cur.recorded, done: x.cur.done, mini: x.cur.mini, slipped: x.cur.slipped,
        }));
        if (!habits.length) return;
        askedRef.current = true;
        setNoteState('loading');
        onAskNote(habits).then(ok => setNoteState(ok ? 'done' : 'failed'));
      }, []);
      return (
        <div className="fixed inset-0 z-[70] bg-black/50 flex items-end sm:items-center justify-center" onClick={onClose} data-habit-review>
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[88vh] overflow-y-auto space-y-3" onClick={e => e.stopPropagation()}>
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <h3 className="font-bold text-lg text-gray-800">🔍 습관 점검</h3>
                <p className="text-xs text-gray-500">{md(target.start)}~{md(target.end)} 주 · 최근 2주 기록 기준</p>
              </div>
              <button type="button" onClick={onClose} aria-label="점검 닫기" className="text-gray-400 text-xl font-bold px-2">✕</button>
            </div>
            {(aiNote || noteState === 'loading' || noteState === 'failed') && (
              <div className="bg-indigo-50 rounded-2xl p-3" data-review-ai-note>
                <p className="text-[11px] font-bold text-indigo-600">🤖 이번 주 한마디</p>
                {aiNote
                  ? <p className="text-sm text-indigo-900 leading-snug mt-1 break-keep">{aiNote}</p>
                  : noteState === 'loading'
                    ? <p className="text-xs text-indigo-500 mt-1 animate-pulse">한 주를 정리하는 중이에요...</p>
                    : <p className="text-xs text-gray-500 mt-1">지금은 한마디를 만들지 못했어요. 아래 점검은 그대로 쓸 수 있어요.</p>}
              </div>
            )}
            {groups.map(([cls, title, bg]) => {
              const list = items.filter(x => x.cls === cls);
              if (!list.length) return null;
              return (
                <div key={cls} className={`${bg} rounded-2xl p-3 space-y-2`} data-review-group={cls}>
                  <p className="text-sm font-bold text-gray-700">{title}</p>
                  {list.map(x => (
                    <div key={x.r.id} className="bg-white rounded-xl p-2.5" data-review-item>
                      <p className="text-sm font-bold text-gray-800 break-keep">{x.r.emoji} {x.r.name}
                        {x.trend === 'up' && <span className="ml-1 text-[11px] text-emerald-600">↑ 전 2주보다</span>}
                        {x.trend === 'down' && <span className="ml-1 text-[11px] text-amber-600">↓ 전 2주보다</span>}
                      </p>
                      <p className="text-[11px] text-gray-500 break-keep">{cls === 'sparse' ? (x.cur.pair ? `할 날 ${x.cur.counted}일 중 ${x.cur.recorded}일만 기록했어요` : `할 날 ${x.cur.counted}일 동안 기록이 없어요. 계속 쓰지 않으면 보관해도 돼요`) : line(x)}</p>
                      {suggestion(x)}
                    </div>
                  ))}
                </div>
              );
            })}
            {quiet.length > 0 && <p className="text-[11px] text-gray-400 break-keep">그 밖에 {quiet.map(x => x.r.name).join(', ')}은(는) 무난하거나 아직 할 날이 적어요.</p>}
            {!items.length && <p className="text-sm text-gray-500">점검할 루틴이 없어요.</p>}
            <button type="button" disabled={busy} onClick={onDone} className="w-full py-3 rounded-xl bg-emerald-600 text-white font-bold disabled:opacity-60" data-review-done>점검 끝</button>
          </div>
        </div>
      );
    }

    // 루틴 한 줄: 체크 버튼 + 이름 + 진행 + ⋯ 메뉴(건너뜀·직접 입력·메모·취소)
    // ★ v0.6.0 짝 습관이면 이름 아래에 "했어요 / 조금이라도 / 버릴 습관" 버튼(onChoose).
    function RoutineRow({ routine, check, state, faded, leaving, onTap, onChoose, onSkipToggle, onSetValue, onSetBadValue, onSaveNote, onClear, comeback }) {
      const [menuOpen, setMenuOpen] = useState(false);
      const [noteDraft, setNoteDraft] = useState(check?.note || '');
      const [valueDraft, setValueDraft] = useState(String(check?.value || 0));
      const [badDraft, setBadDraft] = useState(String(check?.bad_value || 0));
      useEffect(() => { setNoteDraft(check?.note || ''); setValueDraft(String(check?.value || 0)); setBadDraft(String(check?.bad_value || 0)); }, [check?.note, check?.value, check?.bad_value]);
      const pair = isPairRoutine(routine);
      const value = check?.value || 0;
      return (
        <div className={`rt-row ${leaving === 'fade' ? 'rt-row-fade' : ''}`} data-routine-row data-leaving={leaving || undefined}><div className="rt-row-inner">
        <div className={`rounded-2xl ${faded && state !== 'done' ? 'opacity-60' : ''}`}>
          <div className="flex items-center gap-3 py-1.5">
            <RoutineCheckButton routine={routine} state={state} value={value} onTap={onTap} />
            <div className="min-w-0 flex-1">
              <p className={`text-sm font-bold break-keep ${state === 'done' ? 'text-gray-400 line-through' : 'text-gray-800'}`}>
                <span className="mr-1">{routine.emoji}</span>{routine.name}
                {routine.time_of_day && <span className="ml-1.5 text-[11px] font-normal text-gray-400">{String(routine.time_of_day).slice(0, 5)}</span>}
              </p>
              {routine.kind === 'count' && (
                <div className="flex items-center gap-2 mt-1">
                  <div className="h-1.5 flex-1 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-emerald-400" style={{ width: `${Math.min(100, value / routine.target * 100)}%` }}></div>
                  </div>
                  <span className="text-[11px] text-gray-500 whitespace-nowrap">{value}/{routine.target}{routine.unit}</span>
                </div>
              )}
              {comeback && <p className="text-[11px] font-bold text-amber-600 mt-0.5 break-keep" data-routine-comeback>↺ 어제는 "{routine.bad_habit}" 쪽이었어요 · 오늘은 조금이라도</p>}
              {pair && onChoose && <PairChoiceBar routine={routine} check={check} state={state} onChoose={onChoose} />}
              {routine.motto && state !== 'done' && <p className="text-[11px] text-gray-400 mt-0.5 break-keep">“{routine.motto}”</p>}
              {check?.note && <p className="text-[11px] text-indigo-500 mt-0.5 break-keep">📝 {check.note}</p>}
              {routine.link_exercise && state === 'done' && !check && <p className="text-[11px] text-emerald-600 mt-0.5">운동 기록으로 자동 완료</p>}
              {routine.link_intake && state === 'done' && !check && <p className="text-[11px] text-violet-600 mt-0.5">복용 체크로 자동 완료</p>}
            </div>
            <button type="button" onClick={() => setMenuOpen(!menuOpen)} aria-label={`${routine.name} 더보기`} className="shrink-0 w-8 h-8 rounded-lg text-gray-400 hover:bg-gray-50 font-bold">⋯</button>
          </div>
          {menuOpen && (
            <div className="ml-12 mb-2 bg-gray-50 rounded-xl p-2.5 space-y-2" data-routine-menu>
              <div className="flex flex-wrap gap-1.5">
                <button type="button" onClick={() => { onSkipToggle(); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-white border border-gray-200 text-gray-600">
                  {state === 'skipped' ? '건너뜀 취소' : '오늘은 건너뛰기(쉬는 날)'}
                </button>
                {(check || state === 'done') && (
                  <button type="button" onClick={() => { onClear(); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-white border border-gray-200 text-gray-600">체크 지우기</button>
                )}
              </div>
              {routine.kind === 'count' && (
                <div className="flex items-center gap-1.5">
                  <input type="number" min="0" inputMode="numeric" value={valueDraft} onChange={e => setValueDraft(e.target.value)}
                    className="w-20 text-sm bg-white border border-gray-200 rounded-lg px-2 py-1" aria-label="횟수 직접 입력" />
                  <span className="text-xs text-gray-500">{routine.unit}</span>
                  <button type="button" onClick={() => { onSetValue(Math.max(0, Math.floor(Number(valueDraft) || 0))); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-emerald-500 text-white">횟수 저장</button>
                </div>
              )}
              {routine.kind === 'count' && pair && onSetBadValue && (
                <div className="flex items-center gap-1.5">
                  <span className="text-xs text-amber-700">🚫</span>
                  <input type="number" min="0" inputMode="numeric" value={badDraft} onChange={e => setBadDraft(e.target.value)}
                    className="w-20 text-sm bg-white border border-gray-200 rounded-lg px-2 py-1" aria-label="버릴 습관 횟수 직접 입력" />
                  <button type="button" onClick={() => { onSetBadValue(Math.max(0, Math.floor(Number(badDraft) || 0))); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-amber-500 text-white">버릴 습관 횟수 저장</button>
                </div>
              )}
              <div className="flex items-center gap-1.5">
                <input type="text" maxLength={300} value={noteDraft} onChange={e => setNoteDraft(e.target.value)} placeholder="메모 (선택)"
                  className="flex-1 min-w-0 text-sm bg-white border border-gray-200 rounded-lg px-2 py-1" aria-label="루틴 메모" />
                <button type="button" onClick={() => { onSaveNote(noteDraft.trim()); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-indigo-500 text-white">메모 저장</button>
              </div>
            </div>
          )}
        </div>
        </div></div>
      );
    }

    // 홈: 오늘의 루틴 카드
    function TodayRoutineCard({ routines, date, isToday, getCheck, isAutoDone, actions, onOpenRoutineTab, onShiftDay }) {
      const [showDone, setShowDone] = useState(false);
      const active = (routines || []).filter(r => !r.archived_at);
      const nowSlot = currentRoutineSlot();
      const groups = buildTodayRoutineGroups(routines, date, isToday, nowSlot);
      const all = groups.flatMap(g => g.items);
      const stateOf = (r) => routineDayState(r, getCheck(r.id, date), isAutoDone(r, date));
      const doneCount = all.filter(r => stateOf(r) === 'done').length;
      const skippedCount = all.filter(r => stateOf(r) === 'skipped').length;
      const { leaving, tap: leaveTap, start: leaveStart, cancel: leaveCancel } = useRoutineLeaving(date); // ★ v0.4.3 체크 효과(홈 칩과 공통)
      const tapRow = (r) => leaveTap(r, getCheck(r.id, date), stateOf(r), () => actions.tap(r, date));
      // ★ v0.6.0 짝 습관 고르기: 아직 기록 전이면 고른 뒤 사라지는 효과. 사라지는 중에 다시 누르면 취소.
      const chooseRow = (r, choice) => {
        if (leaving[r.id]) { leaveCancel(r.id); actions.choose(r, date, choice); return; }
        const state = stateOf(r);
        const open = ['todo', 'progress'].includes(state);
        if (open && (r.kind !== 'count' || choice === 'slipped' || routineTapCompletes(r, getCheck(r.id, date), state))) leaveStart(r.id);
        actions.choose(r, date, choice);
      };
      // ★ v0.6.0 두 번 연속 놓치지 않기: 어제 버릴 습관을 고른 짝 습관은 맨 위에 따로.
      const comeback = yesterdaySlippedRoutines(routines, getCheck, isAutoDone, date).filter(r => !leaving[r.id]);
      const comebackIds = new Set(comeback.map(r => r.id));
      const rowProps = (r) => ({
        routine: r, check: getCheck(r.id, date), state: stateOf(r), leaving: leaving[r.id],
        onTap: isPairRoutine(r) && r.kind !== 'count' ? () => chooseRow(r, 'done') : () => tapRow(r),
        onChoose: (c) => chooseRow(r, c),
        onSkipToggle: () => actions.toggleSkip(r, date), onSetValue: (v) => actions.setValue(r, date, v),
        onSetBadValue: (v) => actions.setBadValue(r, date, v), onSaveNote: (n) => actions.saveNote(r, date, n), onClear: () => actions.clear(r, date),
      });
      // 마친 루틴은 하루 시간 순서(아침 → 자기 전 → 언제든). 사라지는 중인 것은 아직 위 목록에 있다.
      const finished = all.filter(r => ['done', 'skipped', 'slipped'].includes(stateOf(r)) && !leaving[r.id]).sort(compareRoutines);
      return (
        <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100" data-today-routines>
          <div className="flex items-center justify-between gap-2 mb-2">
            <h2 className="font-bold text-gray-800">🌱 {isToday ? '오늘의' : '이 날의'} 루틴 {all.length > 0 && <span className="text-emerald-600">{doneCount}/{all.length - skippedCount}</span>}</h2>
            {onShiftDay ? (
              <div className="flex items-center gap-1 shrink-0" data-routine-day-nav>
                <button type="button" onClick={() => onShiftDay(-1)} aria-label="전날" className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 text-xs">◀</button>
                <span className="text-xs font-bold text-gray-600 whitespace-nowrap">{Number(date.slice(5, 7))}/{Number(date.slice(8))}({ROUTINE_WEEKDAYS[parseDate(date).getDay()]})</span>
                <button type="button" onClick={() => onShiftDay(1)} aria-label="다음날" className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 text-xs">▶</button>
              </div>
            ) : (
              <button type="button" onClick={onOpenRoutineTab} className="text-xs font-bold text-emerald-600 whitespace-nowrap">루틴 관리 →</button>
            )}
          </div>
          {active.length === 0 ? (
            <p className="bg-emerald-50 rounded-2xl p-3 text-sm text-emerald-800">아래 <b>+ 루틴 추가</b>로 첫 루틴을 만들어 보세요.</p>
          ) : all.length === 0 ? (
            <p className="text-sm text-gray-500 bg-gray-50 rounded-2xl p-3">이 날은 할 루틴이 없어요. 쉬는 날이에요 🌿</p>
          ) : (
            <div className="space-y-2">
              {all.length > 0 && finished.length === all.length && (
                <p className="text-sm font-bold text-emerald-700 bg-emerald-50 rounded-2xl p-3">🎉 {isToday ? '오늘' : '이 날'} 루틴을 모두 마쳤어요!</p>
              )}
              {comeback.length > 0 && (
                <div className="bg-amber-50 rounded-2xl px-3 py-1" data-routine-comeback-group>
                  <p className="text-[11px] font-bold text-amber-700 mt-1">↺ 두 번 연속 놓치지 않기</p>
                  {comeback.map(r => <RoutineRow key={r.id} {...rowProps(r)} faded={false} comeback />)}
                </div>
              )}
              {groups.map(group => {
                const open = group.items.filter(r => !comebackIds.has(r.id) && (!['done', 'skipped', 'slipped'].includes(stateOf(r)) || (leaving[r.id] && ['done', 'slipped'].includes(stateOf(r)))));
                if (!open.length) return null;
                return (
                  <div key={group.key}>
                    <p className={`text-[11px] font-bold mb-0.5 ${group.now ? 'text-emerald-600' : 'text-gray-400'}`}>
                      {group.label}{group.now ? ' · 지금' : group.past ? ' · 지난 시간대' : ''}
                    </p>
                    {open.map(r => <RoutineRow key={r.id} {...rowProps(r)} faded={group.past} />)}
                  </div>
                );
              })}
              {finished.length > 0 && (
                <div>
                  <button type="button" onClick={() => setShowDone(!showDone)} className="text-[11px] font-bold text-gray-400">
                    {showDone ? '마친 루틴 접기 ▲' : `마친 루틴 ${finished.length}개 보기 ▼`}
                  </button>
                  {showDone && finished.map(r => (
                    <RoutineRow key={r.id} {...rowProps(r)} leaving={undefined} faded={false}
                      onTap={isPairRoutine(r) && r.kind !== 'count' ? () => actions.choose(r, date, 'done') : () => actions.tap(r, date)}
                      onChoose={(c) => actions.choose(r, date, c)} />
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ★ 홈: 한두 줄짜리 루틴 요약. 지금 할 것 3개까지 칩으로 바로 체크하고, 나머지는 루틴 탭에서.
    function HomeRoutineStrip({ routines, date, isToday, getCheck, isAutoDone, onTap, onChoose, onOpenRoutineTab, reviewDue, onOpenReview }) {
      const { leaving, tap: leaveTap, start: leaveStart, cancel: leaveCancel } = useRoutineLeaving(date); // ★ v0.4.3 체크 효과(루틴 탭과 공통)
      const [pairOpenId, setPairOpenId] = useState(null); // ★ v0.6.0 짝 습관 칩을 누르면 고르는 칸을 연다

      const active = (routines || []).filter(r => !r.archived_at);
      const nowSlot = currentRoutineSlot();
      const all = buildTodayRoutineGroups(routines, date, isToday, nowSlot).flatMap(g => g.items);
      const stateOf = (r) => routineDayState(r, getCheck(r.id, date), isAutoDone(r, date));
      const counted = all.filter(r => stateOf(r) !== 'skipped');
      const done = counted.filter(r => stateOf(r) === 'done').length;
      const isOpen = (r) => !['done', 'skipped', 'slipped'].includes(stateOf(r));
      const open = all.filter(isOpen);
      // ★ v0.6.0 어제 버릴 습관을 고른 짝 습관은 맨 앞에(두 번 연속 놓치지 않기)
      const comebackIds = new Set(yesterdaySlippedRoutines(routines, getCheck, isAutoDone, date).map(r => r.id));
      const visible = all.filter(r => isOpen(r) || (leaving[r.id] && ['done', 'slipped'].includes(stateOf(r))))
        .sort((a, b) => (comebackIds.has(b.id) ? 1 : 0) - (comebackIds.has(a.id) ? 1 : 0));
      const split = splitHomeRoutines(visible, isToday, nowSlot, new Date().getHours());
      const missedMode = !split.upcoming.length && split.missed.length > 0;
      const primary = missedMode ? split.missed : split.upcoming;
      const shown = primary.slice(0, 3);
      const restCount = primary.filter(r => !leaving[r.id]).length - shown.filter(r => !leaving[r.id]).length;
      const missedOpen = missedMode ? [] : split.missed.filter(r => !leaving[r.id]);
      const missedLabel = missedOpen.length ? homeMissedLabel(missedOpen) : null;

      const tapChip = (r) => {
        if (isPairRoutine(r) && !leaving[r.id]) { setPairOpenId(pairOpenId === r.id ? null : r.id); return; }
        leaveTap(r, getCheck(r.id, date), stateOf(r), () => onTap(r, date));
      };
      const choosePair = (r, choice) => {
        setPairOpenId(null);
        if (leaving[r.id]) { leaveCancel(r.id); onChoose(r, date, choice); return; }
        const state = stateOf(r);
        if (['todo', 'progress'].includes(state) && (r.kind !== 'count' || choice === 'slipped' || routineTapCompletes(r, getCheck(r.id, date), state))) leaveStart(r.id);
        onChoose(r, date, choice);
      };
      const pairOpen = shown.find(r => r.id === pairOpenId && !leaving[r.id]);
      const reviewLink = reviewDue ? (
        <button type="button" onClick={onOpenReview} className="w-full flex items-center justify-between mt-2 text-xs font-bold text-emerald-700 bg-emerald-50 rounded-xl px-3 py-2 text-left" data-home-review>
          <span>🔍 {parseDate(date).getDay() === 0 && reviewDue.end === getWeekRange(date).end ? '이번 주' : '지난주'} 습관 점검하기 (1분)</span><span>→</span>
        </button>
      ) : null;

      const box = 'bg-white rounded-3xl px-4 py-3 shadow-sm border border-gray-100';
      if (!active.length) {
        return (
          <button type="button" onClick={onOpenRoutineTab} className={`${box} w-full text-left`} data-home-routines>
            <p className="text-sm text-gray-700"><b className="text-emerald-700">🌱 루틴</b> 꾸준히 하고 싶은 행동을 루틴으로 만들어 보세요 →</p>
            <p className="text-[11px] text-gray-400 mt-0.5">ⓘ 루틴을 쓰지 않으면 ⚙️ 설정에서 끌 수 있어요.</p>
          </button>
        );
      }
      if (!all.length || !visible.length) {
        return (
          <div>
            <button type="button" onClick={onOpenRoutineTab} className={`${box} w-full text-left text-sm font-bold text-gray-700`} data-home-routines>
              {!all.length ? '🌱 이 날은 할 루틴이 없어요 🌿' : <>🌱 {isToday ? '오늘' : '이 날'} 루틴 기록 완료 <span className="text-emerald-600">{done}/{counted.length}</span></>} <span className="text-emerald-600">→</span>
            </button>
            {reviewLink}
          </div>
        );
      }
      return (
        <div className={box} data-home-routines>
          <div className="flex items-center gap-2">
            <span className="text-sm font-bold text-gray-800 whitespace-nowrap">🌱 루틴 <span className="text-emerald-600">{done}/{counted.length}</span></span>
            <div className="h-1.5 flex-1 bg-gray-100 rounded-full overflow-hidden">
              <div className="rt-progress h-full bg-emerald-400 transition-all duration-500" style={{ width: `${counted.length ? done / counted.length * 100 : 0}%` }}></div>
            </div>
            <button type="button" onClick={onOpenRoutineTab} aria-label="루틴 탭으로" className="text-xs font-bold text-emerald-600 whitespace-nowrap">전체 →</button>
          </div>
          {missedMode && <p className="text-[11px] font-bold text-amber-600 mt-1.5" data-home-missed-mode>⏰ 놓친 루틴 마저 하기 {primary.filter(r => !leaving[r.id]).length}개</p>}
          <div className={`flex flex-wrap gap-1.5 ${missedMode ? 'mt-1' : 'mt-2'}`}>
            {shown.map(r => {
              const check = getCheck(r.id, date);
              const phase = leaving[r.id];
              return (
                <button key={r.id} type="button" onClick={() => tapChip(r)} aria-label={phase ? `${r.name} 체크 취소` : `${r.name} 체크`}
                  className={`rt-chip max-w-full overflow-hidden whitespace-nowrap flex items-center gap-1 text-xs font-bold px-2.5 py-1.5 rounded-full border active:scale-95 ${phase ? 'border-emerald-200 bg-emerald-100/60 text-emerald-600/70' : 'border-emerald-200 bg-emerald-50 text-emerald-800'} ${phase === 'fade' ? 'rt-chip-fade' : ''}`}
