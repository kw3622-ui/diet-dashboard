                  data-home-routine-chip data-leaving={phase || undefined}>
                  {phase
                    ? <span className="w-3.5 h-3.5 rounded-full bg-emerald-500 text-white text-[9px] leading-none flex items-center justify-center shrink-0">✓</span>
                    : <span className="w-3.5 h-3.5 rounded-full border-2 border-emerald-400 bg-white shrink-0"></span>}
                  <span className={`truncate ${phase ? 'rt-strike' : ''}`}>{comebackIds.has(r.id) && !phase ? '↺ ' : ''}{r.emoji} {r.name}{isPairRoutine(r) && !phase ? ' ▾' : ''}</span>
                  {r.kind === 'count' && <span className="font-normal text-emerald-600 whitespace-nowrap">{check?.value || 0}/{r.target}</span>}
                </button>
              );
            })}
            {restCount > 0 && (
              <button type="button" onClick={onOpenRoutineTab} className="text-xs font-bold px-2.5 py-1.5 rounded-full bg-gray-100 text-gray-500">+{restCount}</button>
            )}
          </div>
          {pairOpen && (
            <div className="mt-2 bg-gray-50 rounded-xl px-3 py-2" data-home-pair-panel>
              <p className="text-xs font-bold text-gray-700 break-keep">{pairOpen.emoji} {pairOpen.name}{comebackIds.has(pairOpen.id) ? ' · 어제는 버릴 습관 쪽이었어요' : ''}</p>
              <PairChoiceBar routine={pairOpen} check={getCheck(pairOpen.id, date)} state={stateOf(pairOpen)} onChoose={(c) => choosePair(pairOpen, c)} />
            </div>
          )}
          {missedLabel && (
            <button type="button" onClick={onOpenRoutineTab} className="w-full flex items-center gap-1 mt-1.5 text-[11px] text-gray-400 text-left" data-home-missed>
              <span className="truncate min-w-0">{missedLabel.text}</span>
              <span className="shrink-0 whitespace-nowrap">{missedLabel.more ? `${missedLabel.more} ` : ''}→</span>
            </button>
          )}
          {reviewLink}
        </div>
      );
    }

    const ROUTINE_EMOJIS = ['✅', '🧘', '📚', '💪', '🏃', '💧', '💊', '📝', '🙏', '🎯', '🛏️', '🧹', '🌱', '🎸'];

    function emptyRoutineDraft(today) {
      return { name: '', emoji: '✅', kind: 'check', target: 1, step: 1, unit: '', schedule_type: 'daily', weekdays: [], month_days: [], interval_days: 2, start_date: today, time_slot: 'anytime', time_of_day: '', motto: '', link_exercise: false, link_intake: false, bad_habit: '', min_version: '' };
    }

    // ★ v0.6.2 최소 버전 입력: 숫자 + 단위 칩(분·시간·회·쪽·개, 직접). 비우면 저장하지 않는다.
    function MinVersionInput({ value, onChange }) {
      const init = parseMinVersion(value);
      const [amount, setAmount] = useState(init ? String(init.amount) : '');
      const [unit, setUnit] = useState(init ? init.unit : '분');
      const [custom, setCustom] = useState(init ? !MIN_UNITS.includes(init.unit) : false);
      const [legacy] = useState(value && !init ? String(value) : '');
      const emit = (a, u) => onChange(a !== '' && Number(a) > 0 ? formatMinVersion(a, u) : legacy);
      const chip = (active) => `text-xs font-bold px-2.5 py-1.5 rounded-lg border ${active ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-gray-200 text-gray-600'}`;
      return (
        <div data-min-version-input>
          <div className="flex flex-wrap items-center gap-1.5">
            <input type="number" min="0" step="any" inputMode="decimal" value={amount} placeholder="5"
              onChange={e => { setAmount(e.target.value); emit(e.target.value, unit); }}
              aria-label="최소 버전 숫자" className="w-16 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm text-center" />
            {MIN_UNITS.map(u => (
              <button key={u} type="button" className={chip(!custom && unit === u)} onClick={() => { setCustom(false); setUnit(u); emit(amount, u); }}>{u}</button>
            ))}
            <button type="button" className={chip(custom)} onClick={() => { setCustom(true); }}>직접</button>
            {custom && (
              <input value={MIN_UNITS.includes(unit) ? '' : unit} maxLength={8} placeholder="km, 잔"
                onChange={e => { setUnit(e.target.value); emit(amount, e.target.value); }}
                aria-label="최소 버전 단위" className="w-20 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" />
            )}
          </div>
          {legacy && <p className="text-[11px] text-gray-400 mt-1 break-keep">예전에 적은 최소 버전: "{legacy}" · 숫자를 적으면 바뀌어요.</p>}
        </div>
      );
    }

    // 루틴 추가·수정 창
    // ★ v0.6.2 기본은 간단하게: 하고 싶은 습관 · 버릴 습관 · 힘든 날 최소 · 언제. 나머지는 "자세히 설정"에 접어 둔다.
    const SIMPLE_SLOTS = ['morning', 'lunch', 'evening', 'bedtime', 'anytime'];
    function RoutineForm({ initial, today, existingNames = [], onSave, onCancel }) {
      const [d, setD] = useState(() => initial ? {
        ...emptyRoutineDraft(today), ...initial,
        weekdays: (initial.weekdays || []).map(Number), month_days: (initial.month_days || []).map(Number),
        interval_days: initial.interval_days || 2, time_of_day: initial.time_of_day ? String(initial.time_of_day).slice(0, 5) : '',
        bad_habit: initial.bad_habit || '', min_version: initial.min_version || '', motto: initial.motto || '',
      } : emptyRoutineDraft(today));
      const [error, setError] = useState('');
      const [saving, setSaving] = useState(false);
      const [emojiTouched, setEmojiTouched] = useState(Boolean(initial));
      const [minKey, setMinKey] = useState(0); // 예시를 누르면 최소 버전 입력을 새로 그린다
      const [showMore, setShowMore] = useState(() => Boolean(initial) && (initial.kind === 'count' || initial.schedule_type !== 'daily'
        || Boolean(initial.time_of_day) || Boolean(initial.motto) || Boolean(initial.link_exercise) || Boolean(initial.link_intake)
        || ['late_morning', 'afternoon'].includes(initial.time_slot)));
      const set = (patch) => setD(prev => ({ ...prev, ...patch }));
      const toggleIn = (key, value) => setD(prev => ({ ...prev, [key]: prev[key].includes(value) ? prev[key].filter(x => x !== value) : [...prev[key], value] }));
      const chip = (active) => `text-xs font-bold px-2.5 py-1.5 rounded-lg border ${active ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-gray-200 text-gray-600'}`;
      const templates = initial ? [] : HABIT_TEMPLATES.filter(t => !existingNames.includes(t.name));
      const useTemplate = (t) => { set({ name: t.name, bad_habit: t.bad_habit, min_version: t.min_version, time_slot: t.time_slot, emoji: t.emoji }); setEmojiTouched(true); setMinKey(k => k + 1); };
      const slotKeys = SIMPLE_SLOTS.includes(d.time_slot) ? SIMPLE_SLOTS : [...SIMPLE_SLOTS.slice(0, 4), d.time_slot, 'anytime'];
      const submit = async () => {
        const name = d.name.trim();
        if (!name) return setError('하고 싶은 습관을 적어 주세요.');
        if (d.schedule_type === 'weekly' && !d.weekdays.length) return setError('요일을 하나 이상 골라 주세요.');
        if (d.schedule_type === 'monthly' && !d.month_days.length) return setError('날짜를 하나 이상 골라 주세요.');
        const interval = Math.floor(Number(d.interval_days));
        if (d.schedule_type === 'interval' && !(interval >= 2 && interval <= 365)) return setError('간격은 2~365일 사이로 적어 주세요.');
        const target = d.kind === 'count' ? Math.floor(Number(d.target)) : 1;
        const step = d.kind === 'count' ? Math.floor(Number(d.step)) : 1;
        if (d.kind === 'count' && !(target >= 1 && step >= 1)) return setError('목표와 한 번에 올릴 양은 1 이상이어야 해요.');
        if (!d.start_date) return setError('시작일을 골라 주세요.');
        setError(''); setSaving(true);
        const emoji = emojiTouched ? (d.emoji || '✅') : pickRoutineEmoji(name);
        const ok = await onSave({
          name: name.slice(0, 60), emoji: emoji.slice(0, 8), kind: d.kind, target, step, unit: d.kind === 'count' ? d.unit.trim().slice(0, 10) : '',
          schedule_type: d.schedule_type,
          weekdays: d.schedule_type === 'weekly' ? [...d.weekdays].sort() : [],
          month_days: d.schedule_type === 'monthly' ? [...d.month_days].sort((a, b) => a - b) : [],
          interval_days: d.schedule_type === 'interval' ? interval : null,
          start_date: d.start_date, time_slot: d.time_slot, time_of_day: d.time_of_day || null,
          motto: d.motto.trim().slice(0, 100), link_exercise: !!d.link_exercise, link_intake: !!d.link_intake,
          bad_habit: String(d.bad_habit || '').trim().slice(0, 60),
          min_version: String(d.min_version || '').trim().slice(0, 60),
        });
        setSaving(false);
        if (ok === false) setError('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
      };
      return (
        <div className="fixed inset-0 z-[60] bg-black/40 flex items-end sm:items-center justify-center" data-routine-form>

            {templates.length > 0 && (
              <div data-habit-templates>
                <p className="text-[11px] text-gray-400 mb-1">예시를 누르면 채워져요</p>
                <div className="flex flex-wrap gap-1.5">

                    <button key={t.name} type="button" onClick={() => useTemplate(t)} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-100 text-left">
                      {t.emoji} {t.name} <span className="font-normal text-gray-500">vs {t.bad_habit} · 최소 {t.min_version}</span>
                    </button>

              <input value={d.name} onChange={e => set({ name: e.target.value })} maxLength={60} placeholder="예: 독서"

            <div data-routine-min-version>
              <p className="text-xs font-bold text-gray-500 mb-1">◐ 힘든 날 최소 (선택)</p>
              <MinVersionInput key={minKey} value={d.min_version || ''} onChange={(v) => set({ min_version: v })} />
              {!String(d.bad_habit || '').trim() && d.min_version && <p className="text-[11px] text-gray-400 mt-1 break-keep">버릴 습관을 적으면 기록할 때 "최소"를 고를 수 있어요.</p>}
            </div>
            <div>

              <div className="flex flex-wrap gap-1.5">

            {showMore && (

                  </div>
                  {d.kind === 'count' && (
                    <div className="grid grid-cols-3 gap-2 mt-2">
                      <label className="text-[11px] text-gray-500">목표<input type="number" min="1" inputMode="numeric" value={d.target} onChange={e => set({ target: e.target.value })} className="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" /></label>
                      <label className="text-[11px] text-gray-500">단위<input value={d.unit} maxLength={10} onChange={e => set({ unit: e.target.value })} placeholder="개, 쪽, 분" className="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" /></label>
                      <label className="text-[11px] text-gray-500">한 번 누를 때<input type="number" min="1" inputMode="numeric" value={d.step} onChange={e => set({ step: e.target.value })} className="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" /></label>
                    </div>
                  )}
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-500">반복</label>
                  <div className="flex flex-wrap gap-2 mt-1">
                    {[['daily', '매일'], ['weekly', '매주'], ['monthly', '매월'], ['interval', 'n일마다']].map(([k, label]) => (

                      <p className="col-span-7 text-[11px] text-gray-400 mt-1">그 달에 없는 날짜(예: 2월 30일)는 그 달 마지막 날에 해요.</p>
                    </div>

                  {d.schedule_type === 'interval' && (
                    <div className="flex items-center gap-2 mt-2 text-sm text-gray-600">

                  </div>

                  <input value={d.motto} maxLength={100} onChange={e => set({ motto: e.target.value })} placeholder="예: 나는 매일 읽는 사람" className="w-full mt-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm" />

                  <input type="checkbox" checked={d.link_exercise} onChange={e => set({ link_exercise: e.target.checked })} />
                  운동을 기록하면 자동으로 완료 (기록 시각이 이 루틴 시간대일 때, 언제든이면 그날 아무 때나)

            {error && <p className="text-sm text-red-500">{error}</p>}
            <div className="flex gap-2">
              <button type="button" onClick={onCancel} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold">취소</button>
              <button type="button" onClick={submit} disabled={saving} className="flex-1 py-3 rounded-xl bg-emerald-600 text-white font-bold disabled:opacity-60">{saving ? '저장 중...' : '저장'}</button>
            </div>

      );
    }

    const ROUTINE_DOT = { done: 'bg-emerald-500', skipped: 'bg-gray-300', slipped: 'bg-amber-400', missed: 'bg-red-200', today: 'bg-white border-2 border-emerald-400', future: 'bg-white border border-gray-300', none: 'bg-gray-100' };
    const ROUTINE_WEEK_LABELS = ['월', '화', '수', '목', '금', '토', '일'];

    // 루틴 상세: 한 달 달력 + 기록
    function RoutineDetail({ routine, today, getCheck, isAutoDone, stats, onEdit, onArchiveToggle, onDelete, onClose }) {
      const [month, setMonth] = useState(today.slice(0, 7));
      const [confirmDelete, setConfirmDelete] = useState(false);
      const first = parseDate(month + '-01');
      const lastDay = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
      const lead = (first.getDay() + 6) % 7;
      const cells = [...Array(lead).fill(null), ...Array.from({ length: lastDay }, (_, i) => `${month}-${String(i + 1).padStart(2, '0')}`)];
      const shiftMonth = (n) => { const d = parseDate(month + '-01'); d.setMonth(d.getMonth() + n); setMonth(formatDate(d).slice(0, 7)); };
      const cellClass = (date) => {
        if (!isRoutineDue(routine, date)) return 'text-gray-300';
        const s = routineDayState(routine, getCheck(routine.id, date), isAutoDone(routine, date));
        if (s === 'done') return 'bg-emerald-500 text-white font-bold';
        if (s === 'skipped') return 'bg-gray-200 text-gray-500';
        if (s === 'slipped') return 'bg-amber-300 text-white font-bold';
        if (date > today) return 'border border-emerald-200 text-gray-500';
        if (date === today) return 'border-2 border-emerald-400 text-emerald-700 font-bold';
        return 'bg-red-50 text-red-400';
      };
      return (
        <div className="fixed inset-0 z-[60] bg-black/40 flex items-end sm:items-center justify-center" data-routine-detail>
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto space-y-4">
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <h3 className="font-bold text-lg text-gray-800 break-keep">{routine.emoji} {routine.name}</h3>
                <p className="text-xs text-gray-500 mt-0.5">{describeRoutineSchedule(routine)} · {routineSlotLabel(routine.time_slot)}{routine.time_of_day ? ' ' + String(routine.time_of_day).slice(0, 5) : ''}{routine.kind === 'count' ? ` · 목표 ${routine.target}${routine.unit}` : ''}</p>
                {routine.motto && <p className="text-xs text-gray-400 mt-1">“{routine.motto}”</p>}
                {isPairRoutine(routine) && <p className="text-xs text-amber-700 mt-1">vs 🚫 {routine.bad_habit}{routine.min_version ? ` · 최소 버전: ${routine.min_version}` : ''}</p>}
              </div>
              <button type="button" onClick={onClose} className="text-gray-400 text-xl font-bold px-2">✕</button>
            </div>
            <div className="grid grid-cols-4 gap-2 text-center">
              {[['🔥 연속', `${stats.current}일`], ['최고 연속', `${stats.best}일`], ['30일 달성', stats.score === null ? '-' : `${stats.score}%`], ['1년 완료', `${stats.totalDone}회`]].map(([k, v]) => (
                <div key={k} className="bg-gray-50 rounded-xl py-2"><p className="text-[10px] text-gray-500">{k}</p><p className="text-sm font-bold text-gray-800">{v}</p></div>
              ))}
            </div>
            <div>
              <div className="flex items-center justify-between mb-2">
                <button type="button" onClick={() => shiftMonth(-1)} className="px-3 py-1 text-gray-500 font-bold">◀</button>
                <p className="text-sm font-bold text-gray-700">{first.getFullYear()}년 {first.getMonth() + 1}월</p>
                <button type="button" onClick={() => shiftMonth(1)} className="px-3 py-1 text-gray-500 font-bold">▶</button>
              </div>
              <div className="grid grid-cols-7 gap-1 text-center text-[11px]" data-routine-calendar>
                {['월', '화', '수', '목', '금', '토', '일'].map(w => <p key={w} className="text-gray-400 font-bold">{w}</p>)}
                {cells.map((date, i) => date
                  ? <p key={date} className={`aspect-square flex items-center justify-center rounded-lg ${cellClass(date)}`}>{Number(date.slice(8))}</p>
                  : <p key={'b' + i}></p>)}
              </div>
              <p className="text-[10px] text-gray-400 mt-2">초록=완료 · 회색=건너뜀{isPairRoutine(routine) ? ' · 노랑=버릴 습관' : ''} · 분홍={isPairRoutine(routine) ? '기록 없음' : '못 한 날'} · 흐린 숫자=할 날이 아님</p>
            </div>
            <div className="flex gap-2">
              <button type="button" onClick={onEdit} className="flex-1 py-2.5 rounded-xl bg-emerald-50 text-emerald-700 font-bold text-sm">수정</button>
              <button type="button" onClick={onArchiveToggle} className="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">{routine.archived_at ? '다시 쓰기' : '보관(숨기기)'}</button>
              {confirmDelete
                ? <button type="button" onClick={onDelete} className="flex-1 py-2.5 rounded-xl bg-red-500 text-white font-bold text-sm">정말 삭제</button>
                : <button type="button" onClick={() => setConfirmDelete(true)} className="flex-1 py-2.5 rounded-xl bg-red-50 text-red-500 font-bold text-sm">삭제</button>}
            </div>
            {confirmDelete && <p className="text-[11px] text-red-500">삭제하면 이 루틴의 체크 기록도 모두 지워져요. 기록을 남기려면 보관을 써 주세요.</p>}
          </div>
        </div>
      );
    }

    // ★ v0.5.4 쉬는 시간 알림: 안드로이드는 진동, 아이폰은 진동이 안 되므로 짧은 소리도 함께 낸다.
    // 소리는 사용자가 화면을 누른 뒤에만 켜지므로(브라우저 규칙) 세트 체크 때 미리 깨워 둔다.
    let workoutAudioCtx = null;
    const unlockWorkoutAudio = () => {
      try {
        if (!workoutAudioCtx) { const C = window.AudioContext || window.webkitAudioContext; if (C) workoutAudioCtx = new C(); }
        if (workoutAudioCtx && workoutAudioCtx.state === 'suspended') workoutAudioCtx.resume();
      } catch { /* 소리를 못 내도 화면 표시는 그대로 */ }
    };
    // ★ 카운트다운: 끝나기 3·2·1초 전 짧은 "삑", 0초에 길고 높은 "삐–".
    // 쉬는 시간이 시작될 때 소리를 미리 예약해 두어, 다른 탭·화면에 있어도 제때 울린다(±10초·건너뛰기 때는 다시 예약/취소).
    // 블루투스 이어폰이 잠들어 첫소리가 잘리지 않도록, 첫 "삑" 0.6초 전에 거의 들리지 않는 소리로 깨운다.
    const REST_COUNTDOWN_PLAN = [
      { before: 3.6, freq: 440, dur: 0.4, gain: 0.002 }, // 깨우기(거의 안 들림)
      { before: 3, freq: 880, dur: 0.12, gain: 0.2 },
      { before: 2, freq: 880, dur: 0.12, gain: 0.2 },
      { before: 1, freq: 880, dur: 0.12, gain: 0.2 },
      // 0초: 권투 종 "땡땡땡"(사용자 결정 2026-11-25)
      { before: 0, bell: true },
      { before: -0.23, bell: true }, // 2026-11-25 간격 0.3 → 0.18 → 0.23초(사용자 요청)
      { before: -0.46, bell: true },
    ];
    // 권투 종 한 번 치기(소리 파일 없음). 쇠와 쇠가 부딪히는 소리가 나도록 세 가지를 겹친다.
    //  1) 부딪히는 순간의 짧은 금속성 "탁"(높은 대역의 잡음 0.03초)
    //  2) 음 높이가 어긋난 울림 8개(종의 배음 비율) — 사인파만 쓰면 그릇 소리처럼 들려서 2차 버전에서 바꿈
    //  3) 울림마다 두 소리를 조금 어긋나게 겹쳐 "쨍–" 하고 떨리게
    // 2026-11-25: 1차 620Hz → 2차 1100Hz(사인파 4개, "그릇 소리" 의견) → 3차 쇠 종소리(이것)
    const BELL_SOUND_LABEL = '쇠 종소리(3차)';
    const BELL_BASE_HZ = 1100;
    const BELL_PARTIALS = [ // [배음 비율, 크기, 울리는 초]
      [1, 1, 1.6], [1.59, 0.7, 1.3], [2.14, 0.6, 1.1], [2.83, 0.5, 0.9],
      [3.51, 0.38, 0.7], [4.22, 0.3, 0.55], [5.43, 0.22, 0.4], [6.8, 0.15, 0.3],
    ];
    const BELL_SHIMMER_HZ = 2.5;
    let bellNoiseBuffer = null;
    const strikeBell = (ctx, startAt, nodes) => {
      const master = ctx.createGain();
      master.gain.value = 0.22;
      master.connect(ctx.destination);
      // 1) 부딪히는 "탁"
      if (!bellNoiseBuffer || bellNoiseBuffer.sampleRate !== ctx.sampleRate) {
        bellNoiseBuffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.04), ctx.sampleRate);
        const data = bellNoiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const noise = ctx.createBufferSource(); noise.buffer = bellNoiseBuffer;
      const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 5000; band.Q.value = 0.8;
      const hit = ctx.createGain();
      hit.gain.setValueAtTime(1.2, startAt);
      hit.gain.exponentialRampToValueAtTime(0.001, startAt + 0.03);
      noise.connect(band); band.connect(hit); hit.connect(master);
      noise.start(startAt); noise.stop(startAt + 0.04);
      nodes.push(noise);
      // 2)·3) 어긋난 배음 울림, 둘씩 살짝 어긋나게
      BELL_PARTIALS.forEach(([ratio, level, decay]) => {
        [-BELL_SHIMMER_HZ, BELL_SHIMMER_HZ].forEach(detune => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = BELL_BASE_HZ * ratio + detune;
          gain.gain.setValueAtTime(0.0001, startAt);
          gain.gain.exponentialRampToValueAtTime(0.5 * level, startAt + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, startAt + decay);
          osc.connect(gain); gain.connect(master);
          osc.start(startAt); osc.stop(startAt + decay + 0.05);
          nodes.push(osc);
        });
      });
    };
    // ⚙️ 운동 설정의 미리 듣기: 삑·삑·삑 → 땡땡땡을 바로 한 번 들려준다(쉬는 시간 예약과는 따로).
    const previewRestSounds = () => {
      unlockWorkoutAudio();
      const ctx = workoutAudioCtx;
      if (!ctx) return false;
      const untilEnd = 3.2;
      REST_COUNTDOWN_PLAN.forEach(p => {
        const at = ctx.currentTime + untilEnd - p.before;
        try {
          if (p.bell) { strikeBell(ctx, at, []); return; }
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.frequency.value = p.freq; gain.gain.value = p.gain;
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(at); osc.stop(at + p.dur);
        } catch { /* 소리 없음 */ }
      });
      return true;
    };
    let restScheduled = { endsAt: null, nodes: [] };
    const cancelRestSounds = () => {
      restScheduled.nodes.forEach(n => { try { n.stop(); } catch { /* 이미 끝남 */ } });
      restScheduled = { endsAt: null, nodes: [] };
    };
    const scheduleRestSounds = (endsAt) => {
      if (restScheduled.endsAt === endsAt) return;
      cancelRestSounds();
      const ctx = workoutAudioCtx;
      if (!ctx || ctx.state === 'closed') return;
      const untilEnd = (endsAt - Date.now()) / 1000;
      const nodes = [];
      REST_COUNTDOWN_PLAN.forEach(p => {
        const at = untilEnd - p.before;
        if (at < 0) return; // 이미 지난 소리는 건너뛴다
        try {
          if (p.bell) { strikeBell(ctx, ctx.currentTime + at, nodes); return; }
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.frequency.value = p.freq; gain.gain.value = p.gain;
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(ctx.currentTime + at); osc.stop(ctx.currentTime + at + p.dur);
          nodes.push(osc);
        } catch { /* 소리 없음 */ }
      });
      restScheduled = { endsAt, nodes };
    };
    // 끝났을 때: 진동(안드로이드). 소리를 예약하지 못했으면(새로고침 직후 등) 종소리만 바로 낸다.
    const notifyRestDone = (endsAt, soundOn) => {
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch { /* 진동 없음 */ }
      if (!soundOn || restScheduled.endsAt === endsAt) return;
      try {
        const ctx = workoutAudioCtx;
        if (!ctx) return;
        [0, 0.23, 0.46].forEach(t => strikeBell(ctx, ctx.currentTime + t, []));
      } catch { /* 소리 없음 */ }
    };
    const formatClock = (sec) => { const s = Math.max(0, Math.round(sec)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

    // ★ v0.5.5 종목 작은 그림(40px): 평소엔 시작 자세 한 장, 그림을 누르면 시작·끝 자세를 0.8초마다 번갈아(다시 누르면 멈춤).
    // 화면에 보일 때만 받는다(loading="lazy"). 그림이 없거나 못 받으면 장비 아이콘으로 대신한다.
    const EQUIPMENT_ICONS = { barbell: '🏋️', smith: '🏋️', dumbbell: '💪', kettlebell: '🔔', machine: '⚙️', cable: '🔗', bodyweight: '🧍', pullup_bar: '🤸', parallel_bars: '🤸', band: '➰', ab_wheel: '🛞', cardio_machine: '🏃', none: '🏃' };
    const THUMB_FRAME_MS = 800;
    function ExerciseThumb({ entry, library, size = 40 }) {
      const [playing, setPlaying] = useState(false);
      const [frame, setFrame] = useState(0);
      const [failed, setFailed] = useState(false);
      useEffect(() => {
        if (!playing) return;
        const id = setInterval(() => setFrame(f => (f + 1) % 2), THUMB_FRAME_MS);
        return () => clearInterval(id);
      }, [playing]);
      const box = { width: size, height: size };
      if (!entry?.image || !library?.imageBase || failed) {
        return <span className="shrink-0 rounded-lg bg-gray-100 flex items-center justify-center text-lg" style={box} aria-hidden="true" data-exercise-thumb="icon">{EQUIPMENT_ICONS[entry?.equipment] || '🏋️'}</span>;
      }
      const toggle = (e) => { e.stopPropagation(); setPlaying(p => { if (p) setFrame(0); return !p; }); };
      return (
        <button type="button" onClick={toggle} aria-label={`${entry.name} 동작 ${playing ? '멈추기' : '보기'}`} data-exercise-thumb={playing ? 'playing' : 'still'}
          className={`shrink-0 rounded-lg overflow-hidden bg-gray-100 ${playing ? 'ring-2 ring-green-500' : ''}`} style={box}>
          <img src={`${library.imageBase}${entry.image}/${frame}.jpg`} alt="" loading="lazy" width={size} height={size}
            className="w-full h-full object-cover" onError={() => setFailed(true)} />
        </button>
      );
    }

    const COACH_COMMENT_TIMEOUT_MS = 15000; // ★ v0.5.6 코치 한마디를 기다리는 최대 시간(진행 화면에서 기다리므로 운동을 막지 않음)
    const groupLabelOf = (g) => SHORTCUT_GROUPS.find(x => x.key === g)?.label || g;

    // ★ v0.5.4 운동 중 띠: 다른 탭에 있을 때 위에 보여주고 누르면 운동 탭으로 돌아간다.
    function WorkoutBanner({ session, onOpen }) {
      const [now, setNow] = useState(Date.now());
      useEffect(() => { const id = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(id); }, []);
      const elapsed = session.startedAt ? (now - Date.parse(session.startedAt)) / 1000 : 0;
      const restLeft = session.rest?.endsAt ? (session.rest.endsAt - now) / 1000 : 0;
      return (
        <button type="button" onClick={onOpen} data-workout-banner
          className="w-full mb-3 flex items-center justify-between gap-2 bg-green-600 text-white rounded-xl px-3 py-2 text-sm font-bold">
          <span>🏋️ {session.stage === 'pick' ? '운동 준비 중' : session.editLogId ? '운동 기록 고치는 중' : `운동 중 · ${Math.floor(elapsed / 60)}분`}{restLeft > 0 ? ` · 쉬는 시간 ${formatClock(restLeft)}` : ''}</span>
          <span className="text-xs bg-white/20 rounded-lg px-2 py-1 whitespace-nowrap">돌아가기 ›</span>
        </button>
      );
    }

    // ★ v0.5.4 헬스 기록 도우미: 종목 고르기(pick) → 진행(run) → 끝내기(finish)
    function WorkoutSession({ session, setSession, library, index, byKey, places, onSavePlaces, allLogs, onShowInfo, onSaveLog, checkDuplicate, loadYesterday }) {
      const [now, setNow] = useState(Date.now());
      const [yesterday, setYesterday] = useState(null); // ★ v0.5.5 { alcohol, lateNight }
      const [recoGroupsOpen, setRecoGroupsOpen] = useState(false);
      const [talkText, setTalkText] = useState(''); // ★ v0.5.6 한 줄 입력
      const [talkBusy, setTalkBusy] = useState(false);
      const [talkError, setTalkError] = useState('');
      useEffect(() => {
        if (session.stage !== 'pick' || !loadYesterday) return;
        let alive = true;
        loadYesterday().then(y => { if (alive) setYesterday(y); }).catch(() => { if (alive) setYesterday({}); });
        return () => { alive = false; };
      }, [session.stage]);
      const [editing, setEditing] = useState(null); // { item, set }
      const [removing, setRemoving] = useState(null); // 빼기 메뉴를 연 종목 순서
      const [restEditing, setRestEditing] = useState(null); // 쉬는 시간을 고치는 종목 순서
      const [alternatives, setAlternatives] = useState(null); // { part, keys }
      const [searchOpen, setSearchOpen] = useState(false);
      const [query, setQuery] = useState('');
      const [undo, setUndo] = useState(null); // { key, place } 장소 목록 자동 추가 되돌리기
      const [confirmCancel, setConfirmCancel] = useState(false);
      const [duplicates, setDuplicates] = useState(0);
      const [saving, setSaving] = useState(false);
      useEffect(() => { const id = setInterval(() => setNow(Date.now()), 500); return () => clearInterval(id); }, []);
      useEffect(() => { if (!undo) return; const id = setTimeout(() => setUndo(null), 6000); return () => clearTimeout(id); }, [undo]);
      useEffect(() => {
        if (session.stage !== 'finish') return;
        let alive = true;
        checkDuplicate(session.date, session.editLogId).then(n => { if (alive) setDuplicates(n); }).catch(() => {});
        return () => { alive = false; };
      }, [session.stage]);

      const history = React.useMemo(() => exerciseSetHistory(allLogs || [], index), [allLogs, index]);
      // ★ v0.5.5 오늘의 추천(규칙). 1분 단위로만 다시 계산한다.
      const reco = session.reco || { minutes: RECO_DEFAULT_MINUTES, condition: 'normal', groups: null, supplement: true };
      const nowMinute = Math.floor(now / 60000);
      const today = (() => { const d = new Date(nowMinute * 60000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
      const recommendation = React.useMemo(() => allLogs && yesterday ? buildRecommendation({
        logs: allLogs, index, places, location: session.location, minutes: reco.minutes, condition: reco.condition,
        groups: reco.groups, yesterday, nowMs: nowMinute * 60000, today, avoid: reco.avoid || [],
      }) : null, [allLogs, index, places, session.location, reco.minutes, reco.condition, (reco.groups || []).join(), (reco.avoid || []).join(), yesterday, nowMinute]);
      const placeKeys = places[session.location] || [];
      const sessionKeys = (session.items || []).map(i => i.key);
      const update = (fn) => setSession(s => fn(s));
      const updateItem = (idx, fn) => update(s => ({ ...s, items: s.items.map((it, i) => i === idx ? fn(it) : it) }));
      const updateSet = (idx, setIdx, patch) => updateItem(idx, it => {
        const sets = it.sets.map((st, j) => j === setIdx ? { ...st, ...patch } : st);
        // 처음 하는 종목: 첫 값을 아직 비어 있는 아래 세트에 복사한다.
        const edited = sets[setIdx];
        if (setHasValue(it, edited)) {
          for (let j = setIdx + 1; j < sets.length; j++) {
            if (!setHasValue(it, sets[j]) && !sets[j].done) sets[j] = { ...sets[j], weight: edited.weight, reps: edited.reps, seconds: edited.seconds };
          }
        }
        return { ...it, sets };
      });
      const sameForRest = (idx, setIdx) => updateItem(idx, it => {
        const src = it.sets[setIdx];
        return { ...it, sets: it.sets.map((st, j) => j > setIdx && !st.done ? { ...st, weight: src.weight, reps: src.reps, seconds: src.seconds } : st) };
      });
      const startRest = (item) => update(s => ({ ...s, rest: { endsAt: Date.now() + item.restSec * 1000, total: item.restSec, notified: false } }));
      // 쉬는 중 ±10초(이번 한 번만). 줄여서 남은 시간이 없으면 지금 끝난 것으로 한다.
      const adjustRest = (deltaSec) => update(s => {
        if (!s.rest) return s;
        const endsAt = Math.max(Date.now(), s.rest.endsAt + deltaSec * 1000);
        return { ...s, rest: { ...s.rest, endsAt, total: Math.max(10, s.rest.total + deltaSec), notified: false } };
      });
      // 종목별 쉬는 시간: 장소 설정에 기억하고, 오늘 세션의 같은 종목에도 바로 반영한다. null이면 기본값으로.
      const setItemRest = (item, sec) => {
        const restByKey = { ...(places.restByKey || {}) };
        if (sec == null) delete restByKey[item.key]; else restByKey[item.key] = sec;
        const nextPlaces = { ...places, restByKey };
        onSavePlaces(nextPlaces);
        const value = sec ?? restSecondsFor(entryFor(item.key) || { key: item.key }, nextPlaces);
        update(s => ({ ...s, items: s.items.map(it => it.key === item.key ? { ...it, restSec: value } : it) }));
      };
      const soundOn = restSoundOn(places);
      const toggleSound = () => {
        unlockWorkoutAudio();
        const rest = { ...(places.rest || {}) };
        if (soundOn) rest.sound = false; else delete rest.sound;
        onSavePlaces({ ...places, rest });
      };
      const toggleDone = (idx, setIdx) => {
        const item = session.items[idx];
        const st = item.sets[setIdx];
        if (!setHasValue(item, st)) { setEditing({ item: idx, set: setIdx }); return; }
        unlockWorkoutAudio();
        updateSet(idx, setIdx, { done: !st.done });
        if (!st.done) startRest(item);
      };
      const entryFor = (key) => byKey.get(key);
      const lastLine = (key) => {
        const entry = entryFor(key);
        const last = entry ? pickLastSets(history, entry, session.location) : null;
        if (!last) return '처음';
        const item = { input: exerciseInputKind(entry) };
        return `${Number(last.date.slice(5, 7))}/${Number(last.date.slice(8, 10))} · ${last.sets.map(s => formatSessionSet(item, s)).filter(Boolean).join(', ')}`;
      };
      const addToPlace = async (key) => {
        if (placeKeys.includes(key)) return;
        const ok = await onSavePlaces({ ...places, [session.location]: [...placeKeys, key] });
        if (ok) setUndo({ key, place: session.location });
      };
      const undoAdd = async () => {
        if (!undo) return;
        await onSavePlaces({ ...places, [undo.place]: (places[undo.place] || []).filter(k => k !== undo.key) });
        setUndo(null);
      };
      const addExercise = (key) => {
        const entry = entryFor(key);
        if (!entry) return;
        if (session.stage === 'pick') update(s => ({ ...s, picked: [...(s.picked || []), key] }));
        else update(s => ({ ...s, items: [...s.items, makeSessionItem(entry, plannedSetsFrom(history, entry, s.location), places)] }));
        addToPlace(key);
        setSearchOpen(false); setQuery(''); setAlternatives(null);
      };
      const nameButton = (key, name) => {
        const entry = entryFor(key);
        return entry && !entry.custom ? (
          <button type="button" onClick={() => onShowInfo(entry)} data-exercise-name
            className="font-bold text-green-800 underline decoration-dotted underline-offset-2 text-left">{name} ⓘ</button>
        ) : <span className="font-bold text-gray-800">{name}</span>;
      };
      const searchPanel = (
        <div className="bg-white rounded-3xl p-4 shadow-sm" data-session-search>
          <div className="flex gap-2 mb-3">
            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="종목 이름 (예: 레그 컬, 케틀)" autoFocus
              className="flex-1 min-w-0 border border-gray-200 rounded-xl px-3 py-2 text-sm" />
            <button type="button" onClick={() => { setSearchOpen(false); setQuery(''); }} className="text-sm font-bold text-gray-500 px-2">닫기</button>
          </div>
          <div className="space-y-2 max-h-72 overflow-y-auto">
            {searchExerciseLibrary(library, query, [...sessionKeys, ...(session.picked || [])]).slice(0, 30).map(e => (
              <div key={e.key} className="flex items-center justify-between gap-2 text-sm" data-session-search-result={e.key}>
                <ExerciseThumb entry={e} library={library} />
                <span className="min-w-0 flex-1">{nameButton(e.key, e.name)}<span className="text-[11px] text-gray-400 ml-1.5">{shortTargetLabels(e).join('·')} · {library.equipmentLabels?.[e.equipment]}</span></span>
                <button type="button" onClick={() => addExercise(e.key)} className="shrink-0 text-xs font-bold text-white bg-green-600 px-2.5 py-1.5 rounded-lg">넣기</button>
              </div>
            ))}
          </div>
          <p className="text-[11px] text-gray-400 mt-2">{WORKOUT_PLACE_LABELS[session.location]} 목록에 없는 종목은 넣으면 목록에도 추가돼요.</p>
        </div>
      );
      const undoToast = undo && (
        <div className="fixed left-1/2 -translate-x-1/2 bottom-28 z-50 bg-gray-900 text-white text-sm rounded-xl px-4 py-2.5 flex items-center gap-3 shadow-xl" data-undo-toast>
          <span>{WORKOUT_PLACE_LABELS[undo.place]} 목록에 추가했어요</span>
          <button type="button" onClick={undoAdd} className="font-bold text-green-300">되돌리기</button>
        </div>
      );
      const cancelBox = confirmCancel ? (
        <div className="bg-red-50 rounded-2xl p-3 flex items-center justify-between gap-2" data-cancel-confirm>
          <span className="text-sm font-bold text-red-700">{session.editLogId ? '고친 내용을 버릴까요?' : '기록하지 않고 끝낼까요?'}</span>
          <span className="flex gap-1.5 shrink-0">
            <button type="button" onClick={() => setSession(null)} className="text-xs font-bold text-white bg-red-500 px-2.5 py-1.5 rounded-lg">네</button>
            <button type="button" onClick={() => setConfirmCancel(false)} className="text-xs font-bold text-gray-600 bg-white px-2.5 py-1.5 rounded-lg">아니오</button>
          </span>
        </div>
      ) : (
        <button type="button" onClick={() => setConfirmCancel(true)} className="w-full text-sm font-bold text-gray-400 py-2">{session.editLogId ? '고치기 취소' : '운동 취소'}</button>
      );

      // ── 1. 종목 고르기
      if (session.stage === 'pick') {
        const picked = session.picked || [];
        const toggle = (key) => update(s => ({ ...s, picked: (s.picked || []).includes(key) ? s.picked.filter(k => k !== key) : [...(s.picked || []), key] }));
        const shortcuts = recentWorkoutShortcuts(allLogs || [], index);
        const setReco = (patch) => update(s => ({ ...s, reco: { ...(s.reco || reco), ...patch } }));
        const recoItems = recommendation ? [...recommendation.items, ...(reco.supplement !== false && recommendation.supplement ? [recommendation.supplement] : [])] : [];
        const startFromReco = () => {
          const d = new Date();
          const items = recoItems.map(r => {
            const entry = entryFor(r.key);
            if (!entry) return null;
            const last = pickLastSets(history, entry, session.location);
            const base = makeSessionItem(entry, last, places);
            return { ...base, sets: r.sets.map(x => ({ ...emptySet(), weight: x.weight ?? null, reps: x.reps ?? null, seconds: x.seconds ?? null })), change: r.change, reason: r.reason, supplement: !!r.supplement };
          }).filter(Boolean);
          setSession(s => ({
            ...s, stage: 'run', startedAt: d.toISOString(),
            date: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
            time: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`,
            items,
            plan: {
              groups: recommendation.groups, auto: !reco.groups, minutes: reco.minutes, condition: reco.condition,
              alcohol: recommendation.alcohol, items: recoItems.map(r => ({ key: r.key, change: r.change, reason: r.reason })),
              ...(recommendation.avoid?.length ? { avoid: recommendation.avoid } : {}),
              ...(reco.text ? { text: reco.text } : {}),
            },
          }));
          try { localStorage.setItem('workoutLastPlace', session.location); } catch { /* 기억 못 해도 동작 */ }
          window.scrollTo(0, 0);
          requestCoachComment();
        };
        // ★ v0.5.6 코치 한마디: [이대로 시작] 때 한 번만. 계획을 바꾸지 않고 풀어 주기만 한다. 실패하거나 느리면 없이 진행.
        const requestCoachComment = async () => {
          const startedPlanItems = recoItems.map(r => {
            const entry = entryFor(r.key);
            const item = { input: exerciseInputKind(entry) };
            // AI가 "80kg×15"를 15세트로 읽지 않게 "80kg 15회"처럼 풀고 세트 수를 따로 적는다.
            const setWords = r.sets.map(x => item.input === 'hold' ? (x.seconds != null ? `${x.seconds}초` : '')
              : item.input === 'reps' ? (x.reps != null ? `${x.weight ? x.weight + 'kg ' : ''}${x.reps}회` : '')
              : (x.weight != null && x.reps != null ? `${x.weight}kg ${x.reps}회` : '')).filter(Boolean);
            const setsText = `${r.sets.length}세트${setWords.length ? ': ' + setWords.join(' / ') : ''}`;
            return { name: entry?.name || r.key, sets: setsText, reason: r.reason };
          });
          const plan = {
            place: session.location, minutes: reco.minutes, condition: reco.condition, groups: recommendation.groups, auto: !reco.groups,
            avoid: recommendation.avoid || [], alcohol: recommendation.alcohol, lateNight: recommendation.lateNight, cardio: recommendation.cardio,
            text: reco.text || '', items: startedPlanItems,
            status: recommendation.status.map(st => ({ label: st.label, days: st.days, ready: st.ready })),
          };
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), COACH_COMMENT_TIMEOUT_MS);
          try {
            const res = await callAI('workoutCoach', { mode: 'comment', plan }, controller.signal);
            const comment = String(res?.comment || '').trim().slice(0, 300);
            if (comment) setSession(s => s && s.plan ? { ...s, plan: { ...s.plan, comment } } : s);
          } catch { /* 한마디 없이 운동은 그대로 */ } finally { clearTimeout(timer); }
        };
        // ★ v0.5.6 한 줄 입력: 규칙으로 먼저 읽고, 하나도 못 읽으면 AI에게 묻는다. 결과는 버튼 값에만 반영한다.
        const applyTalk = async () => {
          const text = talkText.trim().slice(0, 100);
          if (!text) { setTalkError('한 줄로 적어 주세요. 예: 피곤해서 30분만'); return; }
          setTalkError('');
          let parsed = parseWorkoutText(text);
          let source = 'rule';
          if (!parsed.matched) {
            setTalkBusy(true);
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), COACH_COMMENT_TIMEOUT_MS);
            try {
              const res = await callAI('workoutCoach', { mode: 'parse', text }, controller.signal);
              parsed = { groups: [], avoid: [], ...(res?.parsed || {}) };
              source = 'ai';
            } catch { parsed = null; } finally { clearTimeout(timer); setTalkBusy(false); }
          }
          const has = parsed && (parsed.minutes != null || parsed.condition || parsed.place || parsed.groups?.length || parsed.avoid?.length);
          if (!has) { setTalkError('알아듣지 못했어요. 아래 버튼으로 골라 주세요.'); return; }
          update(s => {
            const cur = s.reco || reco;
            const next = { ...cur, text, talk: { text, source, parsed, before: { minutes: cur.minutes, condition: cur.condition, groups: cur.groups ?? null, avoid: cur.avoid || [], location: s.location } } };
            if (parsed.minutes != null) next.minutes = parsed.minutes;
            if (parsed.condition) next.condition = parsed.condition;
            if (parsed.groups?.length) next.groups = parsed.groups;
            next.avoid = parsed.avoid || [];
            if (next.groups) next.groups = next.groups.filter(g => !next.avoid.includes(g));
            if (next.groups && !next.groups.length) next.groups = null;
            return { ...s, location: parsed.place || s.location, reco: next };
          });
          setTalkText('');
        };
        const undoTalk = () => update(s => {
          const cur = s.reco || reco;
          const b = cur.talk?.before;
          if (!b) return s;
          const { talk, text, ...rest } = cur;
          return { ...s, location: b.location, reco: { ...rest, minutes: b.minutes, condition: b.condition, groups: b.groups, avoid: b.avoid } };
        });
        const talkChips = (() => {
          const p = reco.talk?.parsed;
          if (!p) return [];
          const chips = [];
          if (p.minutes != null) chips.push(`${p.minutes}분`);
          if (p.condition) chips.push({ tired: '피곤', normal: '보통', good: '좋음' }[p.condition]);
          if (p.place) chips.push(WORKOUT_PLACE_LABELS[p.place]);
          (p.groups || []).forEach(g => chips.push(groupLabelOf(g)));
          (p.avoid || []).forEach(g => chips.push(`${groupLabelOf(g)} 빼기`));
          return chips;
        })();
        const groupLabel = groupLabelOf;
        const changeMark = { up: '↑', hold: '=', down: '↓', new: '·' };
        const recoCard = (
          <div className="bg-gradient-to-br from-green-50 to-emerald-50 border border-green-200 rounded-3xl p-4 space-y-3" data-reco-card>
            <h3 className="font-extrabold text-green-900">오늘의 추천</h3>
            <div data-talk>
              <div className="flex gap-1.5">
                <input value={talkText} onChange={e => { setTalkText(e.target.value); if (talkError) setTalkError(''); }} maxLength={100}
                  onKeyDown={e => { if (e.key === 'Enter') applyTalk(); }} placeholder="한 줄로 말하기 (예: 피곤해서 30분만, 어깨 좀 아파)"
                  className="flex-1 min-w-0 border border-green-200 rounded-xl px-3 py-2 text-sm bg-white" data-talk-input />
                <button type="button" disabled={talkBusy} onClick={applyTalk} data-talk-apply
                  className="shrink-0 px-3 py-2 rounded-xl bg-green-600 text-white text-sm font-bold disabled:opacity-50">{talkBusy ? '듣는 중' : '적용'}</button>
              </div>
              {talkError && <p className="text-[11px] text-red-600 mt-1" data-talk-error>{talkError}</p>}
              {talkChips.length > 0 && (
                <div className="flex flex-wrap items-center gap-1 mt-1.5" data-talk-chips>
                  <span className="text-[11px] text-gray-500">"{reco.talk.text}" →</span>
                  {talkChips.map(c => <span key={c} className="text-[11px] font-bold bg-white text-green-800 border border-green-200 px-2 py-0.5 rounded-lg">{c}</span>)}
                  {reco.talk.source === 'ai' && <span className="text-[11px] text-gray-400">(AI가 읽음)</span>}
                  <button type="button" onClick={undoTalk} className="text-[11px] font-bold text-gray-500 underline" data-talk-undo>✕ 되돌리기</button>
                </div>
              )}
            </div>
            {recommendation?.avoid?.length > 0 && <p className="text-xs bg-red-50 text-red-800 rounded-xl px-3 py-2" data-reco-avoid>{recommendation.avoid.map(groupLabelOf).join('·')} 운동은 뺐어요. 아프면 무리하지 마세요.</p>}
            {!recommendation && <p className="text-sm text-green-700 animate-pulse">기록을 보고 계산하는 중이에요.</p>}
            {recommendation && (
              <>
                {recommendation.alcohol && <p className="text-xs bg-amber-100 text-amber-900 rounded-xl px-3 py-2" data-reco-alcohol>🍺 어제 음주 기록이 있어요 → 무게는 올리지 않고 세트를 1개씩 줄였어요.</p>}
                {recommendation.restSuggest && <p className="text-xs bg-blue-50 text-blue-900 rounded-xl px-3 py-2" data-reco-rest>3일 연속 운동했어요. 오늘은 쉬거나 걷기 30분도 좋아요. 그래도 한다면 아래처럼 가볍게.</p>}
                <div data-reco-status>
                  <p className="text-[11px] font-bold text-gray-500 mb-1">부위 상태</p>
                  <div className="flex flex-wrap gap-1">
                    {recommendation.status.map(st => (
                      <span key={st.key} className={`text-[11px] font-bold px-2 py-1 rounded-lg ${st.ready ? 'bg-white text-green-800 border border-green-200' : 'bg-gray-100 text-gray-500'}`}>
                        {st.ready ? '●' : '◐'} {st.label} {st.days == null ? '기록 없음' : st.days === 0 ? '오늘' : st.days === 1 ? '어제' : `${st.days}일 전`}
                      </span>
                    ))}
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-1.5">
                  <span className="text-sm font-bold text-gray-800">추천: {recommendation.groups.map(groupLabel).join(' + ')}</span>
                  <span className="text-[11px] text-gray-500">{reco.groups ? '(직접 고름)' : '(가장 오래 쉰 부위)'}</span>
                  <button type="button" onClick={() => setRecoGroupsOpen(!recoGroupsOpen)} className="text-[11px] font-bold text-green-700 underline">부위 바꾸기</button>
                  {reco.groups && <button type="button" onClick={() => setReco({ groups: null })} className="text-[11px] font-bold text-gray-500 underline">자동으로</button>}
                </div>
                {recoGroupsOpen && (
                  <div className="flex flex-wrap gap-1" data-reco-groups>
                    {SHORTCUT_GROUPS.map(g => {
                      const on = recommendation.groups.includes(g.key);
                      return <button key={g.key} type="button" data-reco-group={g.key}
                        onClick={() => { const cur = recommendation.groups; const next = on ? cur.filter(x => x !== g.key) : [...cur, g.key]; setReco({ groups: next.length ? next : null }); }}
                        className={`text-xs font-bold px-2 py-1 rounded-lg border ${on ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-600 border-gray-200'}`}>{g.label}</button>;
                    })}
                    {recommendation.fullBodyCandidate && <button type="button" onClick={() => setReco({ groups: ['chest', 'back', 'legs', 'shoulder'] })} className="text-xs font-bold px-2 py-1 rounded-lg border bg-white text-gray-600 border-gray-200">전신</button>}
                  </div>
                )}
                <div className="grid grid-cols-2 gap-1.5">
                  <div className="flex gap-1" data-reco-minutes>
                    <button type="button" disabled={reco.minutes <= RECO_MIN_MINUTES} onClick={() => setReco({ minutes: Math.max(RECO_MIN_MINUTES, reco.minutes - RECO_MINUTES_STEP) })} data-reco-minus
                      className="px-2 py-1.5 text-xs font-bold rounded-lg bg-white text-gray-700 disabled:opacity-40">−10</button>
                    <span className="flex-1 py-1.5 text-center text-sm font-extrabold text-green-800" data-reco-minute-value>{reco.minutes}분</span>
                    <button type="button" disabled={reco.minutes >= RECO_MAX_MINUTES} onClick={() => setReco({ minutes: Math.min(RECO_MAX_MINUTES, reco.minutes + RECO_MINUTES_STEP) })} data-reco-plus
                      className="px-2 py-1.5 text-xs font-bold rounded-lg bg-white text-gray-700 disabled:opacity-40">+10</button>
                  </div>
                  <div className="flex gap-1" data-reco-condition>
                    {[['tired', '피곤'], ['normal', '보통'], ['good', '좋음']].map(([v, label]) => <button key={v} type="button" onClick={() => setReco({ condition: v })} data-reco-cond={v}
                      className={`flex-1 py-1.5 text-xs font-bold rounded-lg ${reco.condition === v ? 'bg-green-600 text-white' : 'bg-white text-gray-600'}`}>{label}</button>)}
                  </div>
                </div>
                {recoItems.length === 0 && <p className="text-xs text-gray-500">{WORKOUT_PLACE_LABELS[session.location]} 목록에 이 부위 종목이 없어요. 부위를 바꾸거나 아래에서 직접 고르세요.</p>}
                <div className="space-y-1.5" data-reco-items>
                  {recoItems.map(r => {
                    const entry = entryFor(r.key);
                    const item = { input: exerciseInputKind(entry) };
                    const setsText = r.sets.map(x => formatSessionSet(item, x)).filter(Boolean);
                    return (
                      <div key={r.key} className={`bg-white rounded-xl px-3 py-2 flex gap-2 items-start ${r.supplement ? 'border border-dashed border-amber-300' : ''}`} data-reco-item={r.key} data-reco-change={r.change}>
                        <ExerciseThumb entry={entry} library={library} />
                        <div className="min-w-0 flex-1">
                        <div className="flex items-baseline justify-between gap-2 text-sm">
                          <span className="min-w-0">{r.supplement ? <span className="text-[11px] font-bold text-amber-700 mr-1">+ 보충</span> : null}{nameButton(r.key, entry?.name || r.key)}</span>
                          <span className={`text-xs font-extrabold shrink-0 ${r.change === 'up' ? 'text-green-700' : r.change === 'down' ? 'text-blue-600' : 'text-gray-400'}`}>{changeMark[r.change]}</span>
                        </div>
                        <p className="text-[11px] text-gray-600">{setsText.length ? setsText.join(', ') : `${r.sets.length}세트 · 첫 세트에 입력`}</p>
                        <p className="text-[11px] text-gray-400">{r.reason}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {recommendation.supplement && (
                  <label className="flex items-center gap-2 text-[11px] text-gray-600">
                    <input type="checkbox" checked={reco.supplement !== false} onChange={e => setReco({ supplement: e.target.checked })} /> 편식 보충 1종목 넣기
                  </label>
                )}
                {recommendation.lateNight && <p className="text-[11px] text-gray-600" data-reco-latenight>🌃 어제 야식이 있었어요. 끝나고 걷기나 트레드밀 10분은 어때요? (선택)</p>}
                <p className="text-[11px] text-gray-600" data-reco-cardio>🏃 이번 주 유산소 {recommendation.cardio.minutes}/{recommendation.cardio.goal}분{recommendation.cardio.minutes < recommendation.cardio.goal ? ` · 끝나고 트레드밀 ${Math.min(30, Math.max(10, Math.round((recommendation.cardio.goal - recommendation.cardio.minutes) / 10) * 10))}분 어때요?` : ' · 목표 달성!'}</p>
                <button type="button" disabled={!recoItems.length} onClick={startFromReco} data-reco-start
                  className="w-full py-3 rounded-2xl bg-green-600 text-white font-bold disabled:opacity-50">이대로 시작 · {recoItems.length}종목 · 약 {recommendation.minutesPlanned}분</button>
              </>
            )}
          </div>
        );
        const mdLabel = (d) => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`;
        const shortcutButton = (id, keys, text, wide) => {
          const on = keys.every(k => picked.includes(k));
          return (
            <button key={id} type="button" data-shortcut={id}
              onClick={() => update(s => ({ ...s, picked: on ? (s.picked || []).filter(k => !keys.includes(k)) : [...new Set([...(s.picked || []), ...keys])] }))}
              className={`${wide ? 'col-span-2' : ''} text-left rounded-xl px-3 py-2 border ${on ? 'bg-green-50 border-green-300 text-green-800' : 'bg-gray-50 border-transparent text-gray-700'}`}>
              {text(on)}
            </button>
          );
        };
        const listKeys = [...new Set([...placeKeys, ...picked])];
        const start = () => {
          const d = new Date();
          setSession(s => ({
            ...s, stage: 'run', startedAt: d.toISOString(),
            date: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
            time: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`,
            items: (s.picked || []).map(k => entryFor(k)).filter(Boolean).map(e => makeSessionItem(e, plannedSetsFrom(history, e, s.location), places)),
          }));
          try { localStorage.setItem('workoutLastPlace', session.location); } catch { /* 기억 못 해도 동작 */ }
          window.scrollTo(0, 0);
        };
        return (
          <div className="p-4 space-y-4 animate-fade-in pb-32" data-workout-pick>
            <div className="bg-white rounded-3xl p-5 shadow-sm">
              <h2 className="font-bold text-lg text-gray-800 mb-3">🏋️ 어디서 운동하나요?</h2>
              <div className="grid grid-cols-2 gap-1 bg-gray-50 p-1 rounded-xl">
                {['company', 'apartment'].map(p => (
                  <button key={p} type="button" onClick={() => update(s => ({ ...s, location: p }))} data-pick-place={p}
                    className={`py-2 text-sm font-bold rounded-lg ${session.location === p ? 'bg-green-600 text-white' : 'text-gray-500'}`}>{WORKOUT_PLACE_LABELS[p]}</button>
                ))}
              </div>
            </div>
            {recoCard}
            {(shortcuts.parts.length > 0 || shortcuts.full) && (
              <div className="bg-white rounded-3xl p-4 shadow-sm" data-recent-sessions>
                <h3 className="font-bold text-gray-800">최근 운동 그대로</h3>
                <p className="text-[11px] text-gray-400 mb-2">부위를 여러 개 누르면 합쳐져요(예: 등 + 이두). 무게는 종목마다 가장 최근 기록으로 채워요.</p>
                <div className="grid grid-cols-2 gap-1.5">
                  {shortcuts.parts.map(p => shortcutButton(p.key, p.keys, on => (
                    <>
                      <span className="block text-sm font-bold">{on ? '✓ ' : ''}{p.label}</span>
                      <span className="block text-[11px] text-gray-400">{mdLabel(p.date)} · {p.keys.length}종목</span>
                    </>
                  )))}
                  {shortcuts.full && shortcutButton('full', shortcuts.full.keys, on => (
                    <>
                      <span className="block text-sm font-bold">{on ? '✓ ' : ''}전신</span>
                      <span className="block text-[11px] text-gray-400">{mdLabel(shortcuts.full.date)} · {shortcuts.full.parts.join('·')} {shortcuts.full.keys.length}종목</span>
                    </>
                  ), true)}
                </div>
              </div>
            )}
            <div className="bg-white rounded-3xl p-4 shadow-sm space-y-2" data-pick-list>
              <h3 className="font-bold text-gray-800">{WORKOUT_PLACE_LABELS[session.location]} 종목에서 고르기</h3>
              {listKeys.length === 0 && <p className="text-sm text-gray-400 py-2">{WORKOUT_PLACE_LABELS[session.location]} 목록이 비어 있어요. 아래에서 종목을 찾아 넣으세요.</p>}
              {groupExercisesByPart(listKeys, k => entryFor(k)).map(g => (
                <div key={g.key} data-pick-group={g.key}>
                  <p className="text-xs font-bold text-gray-500 mt-2 mb-1">{g.label}</p>
                  <div className="space-y-1">
                    {g.items.map(key => {
                      const on = picked.includes(key);
                      return (
                        <div key={key} className={`flex items-center gap-2 rounded-xl px-2 py-1.5 ${on ? 'bg-green-50' : ''}`} data-pick-row={key}>
                          <button type="button" onClick={() => toggle(key)} aria-label={`${placeExerciseName(key, byKey)} ${on ? '빼기' : '고르기'}`}
                            className={`w-6 h-6 shrink-0 rounded-md border-2 flex items-center justify-center text-xs font-bold ${on ? 'bg-green-600 border-green-600 text-white' : 'border-gray-300 text-transparent'}`}>✓</button>
                          <ExerciseThumb entry={entryFor(key)} library={library} />
                          <span className="min-w-0 flex-1 text-sm">
                            {nameButton(key, placeExerciseName(key, byKey))}
                            <span className="block text-[11px] text-gray-400 truncate">{placeKeys.includes(key) ? '' : <span className="text-amber-600 font-bold">목록에 없음 · </span>}{lastLine(key)}</span>
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
            {searchOpen ? searchPanel : (
              <button type="button" onClick={() => setSearchOpen(true)} className="w-full py-3 rounded-2xl bg-white border border-gray-200 text-gray-600 font-bold text-sm">+ 목록에 없는 종목 찾기</button>
            )}
            {cancelBox}
            {/* 직접 고른 종목이 있을 때만 아래에 띄운다(없을 때는 추천 카드의 [이대로 시작]을 가리지 않게) */}
            {picked.length > 0 && (
              <div className="fixed left-0 right-0 bottom-[calc(env(safe-area-inset-bottom)+140px)] z-30 px-4">
                <button type="button" onClick={start} data-session-start
                  className="w-full max-w-lg mx-auto block py-3.5 rounded-2xl bg-green-600 text-white font-bold shadow-xl">
                  직접 고른 {picked.length}종목으로 시작
                </button>
              </div>
            )}
            {undoToast}
          </div>
        );
      }

      // ── 3. 끝내기
      if (session.stage === 'finish') {
        const endMs = session.editLogId && session.editEndedAt ? Date.parse(session.editEndedAt) : Date.now();
        const row = buildWorkoutLog(session, endMs);
        const unchecked = session.items.reduce((n, it) => n + it.sets.filter(s => !s.done && setHasValue(it, s)).length, 0);
        const save = async () => { setSaving(true); await onSaveLog(session); setSaving(false); };
        return (
          <div className="p-4 space-y-4 animate-fade-in" data-workout-finish>
            <div className="bg-white rounded-3xl p-5 shadow-sm">
              <h2 className="font-bold text-lg text-gray-800 mb-1">{row.food_name}</h2>
              <p className="text-sm text-green-700 font-bold mb-3">{row.analysis.replace(/ · (쉬웠어요|적당했어요|힘들었어요)$/, '')}</p>
              <div className="space-y-1">
                {row.ingredients.map((line, i) => <p key={i} className="text-xs text-gray-600 leading-relaxed">{line}</p>)}
              </div>
            </div>
            {unchecked > 0 && (
              <div className="bg-amber-50 rounded-2xl p-3 text-sm text-amber-900" data-unchecked>
                <p className="font-bold mb-2">체크하지 않은 세트 {unchecked}개는 저장되지 않아요.</p>
                <button type="button" onClick={() => update(s => ({ ...s, items: s.items.map(it => ({ ...it, sets: it.sets.map(st => setHasValue(it, st) ? { ...st, done: true } : st) })) }))}
                  className="text-xs font-bold bg-white border border-amber-200 px-2.5 py-1.5 rounded-lg">모두 했음으로 표시</button>
              </div>
            )}
            <div className="bg-white rounded-3xl p-4 shadow-sm">
              <h3 className="font-bold text-gray-800 mb-2">오늘 운동은 어땠나요?</h3>
              <div className="grid grid-cols-3 gap-2">
                {[['easy', '쉬웠어요'], ['ok', '적당'], ['hard', '힘들었어요']].map(([v, label]) => (
                  <button key={v} type="button" onClick={() => update(s => ({ ...s, rating: s.rating === v ? null : v }))} data-rating={v}
                    className={`py-2.5 rounded-xl text-sm font-bold border ${session.rating === v ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-600 border-gray-200'}`}>{label}</button>
                ))}
              </div>
            </div>
            {duplicates > 0 && !session.editLogId && (
              <p className="bg-blue-50 rounded-2xl p-3 text-sm text-blue-900" data-duplicate-warning>오늘 운동 기록이 이미 {duplicates}개 있어요. 같은 운동을 캡처로도 올렸다면 하나는 지워 주세요. 저장하면 따로 추가돼요.</p>
            )}
            <button type="button" disabled={saving || !row.ingredients.length} onClick={save} data-session-save
              className="w-full py-3.5 rounded-2xl bg-green-600 text-white font-bold disabled:opacity-50">
              {saving ? '저장 중' : !row.ingredients.length ? '저장할 세트가 없어요' : (session.editLogId ? '고친 내용 저장' : (duplicates > 0 ? '따로 저장' : '기록 저장'))}
            </button>
            <button type="button" onClick={() => update(s => ({ ...s, stage: 'run' }))} className="w-full py-3 rounded-2xl bg-white border border-gray-200 text-gray-600 font-bold text-sm">← 계속하기</button>
          </div>
        );
      }

      // ── 2. 진행
      const elapsed = session.startedAt ? (now - Date.parse(session.startedAt)) / 1000 : 0;
      const restLeft = session.rest?.endsAt ? (session.rest.endsAt - now) / 1000 : 0;
      const doneCount = session.items.reduce((n, it) => n + it.sets.filter(s => s.done).length, 0);
      const totalCount = session.items.reduce((n, it) => n + it.sets.length, 0);
      const removeItem = (idx, forever) => {
        const item = session.items[idx];
        update(s => ({ ...s, items: s.items.filter((_, i) => i !== idx), skippedToday: forever ? (s.skippedToday || []) : [...(s.skippedToday || []), item.key] }));
        if (forever) onSavePlaces({ ...places, [session.location]: placeKeys.filter(k => k !== item.key) });
        setRemoving(null); setEditing(null);
        const part = String(item.targets?.[0] || '').split('.')[0];
        const skip = new Set([...sessionKeys, ...(session.skippedToday || []), item.key]);
        const keys = placeKeys.filter(k => !skip.has(k) && String(entryFor(k)?.targets?.[0] || '').split('.')[0] === part).slice(0, 3);
        setAlternatives({ part: EXERCISE_PARTS.find(p => p.key === part)?.label || '', keys });
      };
      const move = (idx, dir) => update(s => {
        const items = [...s.items]; const j = idx + dir;
        if (j < 0 || j >= items.length) return s;
        [items[idx], items[j]] = [items[j], items[idx]];
        return { ...s, items };
      });
      const stepper = (label, value, step, unit, onChange) => (
        <div className="flex items-center gap-1.5">
          <span className="text-xs text-gray-500 w-8 shrink-0">{label}</span>
          <button type="button" onClick={() => onChange(Math.max(0, roundWeight((Number(value) || 0) - step)))} className="w-11 h-10 rounded-lg bg-gray-100 font-bold text-gray-700">−{step}</button>
          <input type="number" inputMode="decimal" value={value ?? ''} onChange={e => onChange(e.target.value === '' ? null : Math.max(0, Number(e.target.value)))}
            className="w-16 h-10 text-center border border-gray-200 rounded-lg font-bold" />
          <button type="button" onClick={() => onChange(roundWeight((Number(value) || 0) + step))} className="w-11 h-10 rounded-lg bg-gray-100 font-bold text-gray-700">+{step}</button>
          <span className="text-xs text-gray-500">{unit}</span>
        </div>
      );
      return (
        <div className={`p-4 space-y-3 animate-fade-in ${restLeft > 0 ? 'pb-28' : 'pb-8'}`} data-workout-run>
          {session.plan?.comment && (
            <div className="bg-green-50 border border-green-200 rounded-2xl px-4 py-3 text-sm text-green-900 leading-relaxed" data-coach-comment>🗣 {session.plan.comment}</div>
          )}
          <div className="bg-white rounded-2xl shadow-sm px-4 py-2.5" data-run-status>
            <div className="flex items-center justify-between text-sm">
              <span className="font-bold text-gray-800">{session.editLogId ? '✏️ 기록 고치기' : `⏱ ${formatClock(elapsed)}`} · {WORKOUT_PLACE_LABELS[session.location]}</span>
              <span className="flex items-center gap-2">
                <button type="button" onClick={toggleSound} data-sound-toggle aria-label={soundOn ? '카운트다운 소리 끄기' : '카운트다운 소리 켜기'}
                  className={`text-xs font-bold px-2 py-1 rounded-lg ${soundOn ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-400'}`}>{soundOn ? '🔔' : '🔕'}</button>
                <span className="text-xs font-bold text-green-700">세트 {doneCount}/{totalCount}</span>
              </span>
            </div>
            {restLeft > 0 && (
              // 쉬는 시간은 화면을 내려도 보이도록 아래쪽에 띄운다(+ 버튼 위).
              <div className="fixed left-3 right-3 bottom-[calc(env(safe-area-inset-bottom)+136px)] z-40 max-w-lg mx-auto bg-white rounded-2xl shadow-xl border border-green-100 px-3 py-2.5 flex items-center gap-2" data-rest-timer>
                <span className="text-xs font-bold text-gray-500 shrink-0">쉬는 시간</span>
                <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                  <div className="h-full bg-green-500 transition-all" style={{ width: `${Math.min(100, (restLeft / (session.rest.total || 60)) * 100)}%` }}></div>
                </div>
                <span className="text-sm font-extrabold text-green-700 w-12 text-right">{formatClock(restLeft)}</span>
                <button type="button" onClick={() => adjustRest(-10)} data-rest-minus className="text-xs font-bold text-gray-600 bg-gray-100 px-2 py-1 rounded-lg">−10초</button>
                <button type="button" onClick={() => adjustRest(10)} data-rest-plus className="text-xs font-bold text-gray-600 bg-gray-100 px-2 py-1 rounded-lg">+10초</button>
                <button type="button" onClick={() => update(s => ({ ...s, rest: null }))} className="text-xs font-bold text-gray-600 bg-gray-100 px-2 py-1 rounded-lg">건너뛰기</button>
              </div>
            )}
          </div>
          {alternatives && (
            <div className="bg-amber-50 rounded-2xl p-3" data-alternatives>
              <div className="flex items-center justify-between mb-1.5">
                <p className="text-xs font-bold text-amber-900">{alternatives.keys.length ? `대신 할 ${alternatives.part} 운동` : `${WORKOUT_PLACE_LABELS[session.location]} 목록에 다른 ${alternatives.part} 운동이 없어요`}</p>
                <button type="button" onClick={() => setAlternatives(null)} className="text-xs text-amber-700 font-bold">닫기</button>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {alternatives.keys.map(k => (
                  <button key={k} type="button" onClick={() => addExercise(k)} className="text-xs font-bold text-amber-900 bg-white border border-amber-200 px-2 py-1 rounded-lg">+ {placeExerciseName(k, byKey)}</button>
                ))}
                <button type="button" onClick={() => { setAlternatives(null); setSearchOpen(true); }} className="text-xs font-bold text-gray-600 bg-white border border-gray-200 px-2 py-1 rounded-lg">찾기</button>
              </div>
            </div>
          )}
          {session.items.map((item, idx) => (
            <div key={item.key + idx} className="bg-white rounded-3xl p-4 shadow-sm" data-session-item={item.key}>
              <div className="flex items-start justify-between gap-2 mb-2">
                <div className="min-w-0 text-sm">
                  {item.supplement ? <span className="text-[11px] font-bold text-amber-700 mr-1">+ 보충</span> : null}{nameButton(item.key, item.name)}
                  {item.reason && <span className={`block text-[11px] font-bold ${item.change === 'up' ? 'text-green-700' : item.change === 'down' ? 'text-blue-600' : 'text-gray-500'}`} data-item-reason>{{ up: '↑ ', hold: '= ', down: '↓ ', new: '' }[item.change] || ''}{item.reason}</span>}
                  <span className="block text-[11px] text-gray-400">
                    {item.equipment === 'dumbbell' ? '한 손 무게 · ' : ''}{item.last ? `지난번 ${Number(item.last.date.slice(5, 7))}/${Number(item.last.date.slice(8, 10))}` : (session.editLogId ? '' : '처음 · 첫 세트를 입력하면 아래로 복사돼요')}
                  </span>
                  <button type="button" onClick={() => setRestEditing(restEditing === idx ? null : idx)} data-rest-label
                    className="text-[11px] font-bold text-green-700 underline decoration-dotted underline-offset-2">
                    쉬는 시간 {item.restSec}초{places.restByKey?.[item.key] ? ' · 직접 정함' : ''}
                  </button>
                </div>
                <div className="flex gap-1 shrink-0">
                  <button type="button" onClick={() => move(idx, -1)} aria-label="위로" className="w-7 h-7 rounded-lg bg-gray-50 text-gray-500 text-xs">↑</button>
                  <button type="button" onClick={() => move(idx, 1)} aria-label="아래로" className="w-7 h-7 rounded-lg bg-gray-50 text-gray-500 text-xs">↓</button>
                  <button type="button" onClick={() => setRemoving(removing === idx ? null : idx)} className="h-7 px-2 rounded-lg bg-gray-50 text-gray-500 text-xs font-bold">빼기</button>
                </div>
              </div>
              {restEditing === idx && (
                <div className="bg-green-50 rounded-xl p-2.5 mb-2" data-rest-chooser>
                  <p className="text-[11px] text-green-800 mb-1.5">이 종목의 쉬는 시간(다음에도 기억해요)</p>
                  <div className="flex flex-wrap items-center gap-1.5">
                    <button type="button" onClick={() => setItemRest(item, Math.max(REST_MIN_SEC, item.restSec - 10))} className="text-xs font-bold bg-white px-2 py-1.5 rounded-lg border border-green-200">−10</button>
                    {[45, 60, 80, 90, 120].map(sec => (
                      <button key={sec} type="button" onClick={() => setItemRest(item, sec)} data-rest-choice={sec}
                        className={`text-xs font-bold px-2 py-1.5 rounded-lg border ${item.restSec === sec ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-700 border-green-200'}`}>{sec}초</button>
                    ))}
                    <button type="button" onClick={() => setItemRest(item, Math.min(REST_MAX_SEC, item.restSec + 10))} className="text-xs font-bold bg-white px-2 py-1.5 rounded-lg border border-green-200">+10</button>
                    {places.restByKey?.[item.key] && <button type="button" onClick={() => setItemRest(item, null)} className="text-xs font-bold text-gray-500 px-2 py-1.5">기본값으로</button>}
                  </div>
                </div>
              )}
              {removing === idx && (
                <div className="flex flex-wrap gap-1.5 mb-2" data-remove-menu>
                  <button type="button" onClick={() => removeItem(idx, false)} className="text-xs font-bold bg-gray-100 text-gray-700 px-2.5 py-1.5 rounded-lg">오늘만 없어요</button>
                  {!session.editLogId && <button type="button" onClick={() => removeItem(idx, true)} className="text-xs font-bold bg-red-50 text-red-600 px-2.5 py-1.5 rounded-lg">이제 없어요 ({WORKOUT_PLACE_LABELS[session.location]} 목록에서 빼기)</button>}
                  <button type="button" onClick={() => setRemoving(null)} className="text-xs font-bold text-gray-400 px-2 py-1.5">취소</button>
                </div>
              )}
              <div className="space-y-1.5">
                {item.sets.map((st, j) => {
                  const isEditing = editing && editing.item === idx && editing.set === j;
                  const text = formatSessionSet(item, st);
                  return (
                    <div key={j} data-session-set={j}>
                      <div className={`flex items-center gap-2 rounded-xl px-2 py-1.5 ${st.done ? 'bg-green-50' : 'bg-gray-50'}`}>
                        <span className="w-5 text-xs font-bold text-gray-400 text-center">{j + 1}</span>
                        <button type="button" onClick={() => setEditing(isEditing ? null : { item: idx, set: j })} data-set-value
                          className={`flex-1 text-left font-bold ${text ? 'text-gray-800' : 'text-gray-400'}`}>
                          {text || '입력'}{st.failed ? <span className="ml-1.5 text-[11px] text-red-500">실패</span> : null}
                        </button>
                        <button type="button" onClick={() => toggleDone(idx, j)} aria-label={`${j + 1}세트 ${st.done ? '취소' : '완료'}`} data-set-done={st.done ? 'yes' : 'no'}
                          className={`w-10 h-10 rounded-full border-2 flex items-center justify-center text-lg font-bold ${st.done ? 'bg-green-600 border-green-600 text-white' : 'border-gray-300 text-gray-300'}`}>✓</button>
                      </div>
                      {isEditing && (
                        <div className="mt-1.5 mb-2 bg-gray-50 rounded-xl p-3 space-y-2" data-set-editor>
                          {item.input !== 'hold' && (item.input === 'weight' || item.key === 'weighted-pull-up') && stepper('무게', st.weight, WEIGHT_STEP, 'kg', v => updateSet(idx, j, { weight: v }))}
                          {item.input !== 'hold' && stepper('횟수', st.reps, 1, '회', v => updateSet(idx, j, { reps: v == null ? null : Math.round(v) }))}
                          {item.input === 'hold' && stepper('시간', st.seconds, 5, '초', v => updateSet(idx, j, { seconds: v == null ? null : Math.round(v) }))}
                          <div className="flex flex-wrap gap-1.5 pt-1">
                            <button type="button" onClick={() => updateSet(idx, j, { failed: !st.failed })}
                              className={`text-xs font-bold px-2.5 py-1.5 rounded-lg border ${st.failed ? 'bg-red-50 text-red-600 border-red-200' : 'bg-white text-gray-600 border-gray-200'}`}>{st.failed ? '✓ ' : ''}실패(목표 못 채움)</button>
                            {j < item.sets.length - 1 && <button type="button" onClick={() => sameForRest(idx, j)} className="text-xs font-bold px-2.5 py-1.5 rounded-lg bg-white text-gray-600 border border-gray-200">남은 세트도 같게</button>}
                            <button type="button" onClick={() => { setEditing(null); if (!st.done && setHasValue(item, st)) toggleDone(idx, j); }}
                              className="text-xs font-bold px-2.5 py-1.5 rounded-lg bg-green-600 text-white">{st.done ? '닫기' : '했어요 ✓'}</button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div className="flex gap-2 mt-2">
                <button type="button" onClick={() => updateItem(idx, it => { const lastSet = it.sets[it.sets.length - 1] || emptySet(); return { ...it, sets: [...it.sets, { ...emptySet(), weight: lastSet.weight, reps: lastSet.reps, seconds: lastSet.seconds }] }; })}
                  className="text-xs font-bold text-green-700 bg-green-50 px-2.5 py-1.5 rounded-lg">+ 세트</button>
                {item.sets.length > 1 && !item.sets[item.sets.length - 1].done && (
                  <button type="button" onClick={() => updateItem(idx, it => ({ ...it, sets: it.sets.slice(0, -1) }))} className="text-xs font-bold text-gray-500 bg-gray-50 px-2.5 py-1.5 rounded-lg">− 세트</button>
                )}
              </div>
            </div>
          ))}
          {session.items.length === 0 && <p className="text-sm text-gray-400 text-center py-4">종목이 없어요. 아래에서 넣어 주세요.</p>}
          {searchOpen ? searchPanel : (
            <button type="button" onClick={() => setSearchOpen(true)} className="w-full py-3 rounded-2xl bg-white border border-gray-200 text-gray-600 font-bold text-sm" data-add-exercise>+ 종목 넣기</button>
          )}
          <button type="button" onClick={() => { setEditing(null); update(s => ({ ...s, stage: 'finish', rest: null })); window.scrollTo(0, 0); }} data-session-finish
            className="w-full py-3.5 rounded-2xl bg-green-600 text-white font-bold">{session.editLogId ? '다 고쳤어요' : '운동 끝내기'}</button>
          {cancelBox}
          {undoToast}
        </div>
      );
    }

    // ★ v0.5.2 운동 탭: 지금은 장소 설정(처음 설정, 회사·아파트 종목, 집 장비). 코치는 다음 시험판에서.
    function WorkoutTab({ exerciseLib, places, onSave, loadRecords, onShowInfo, session, setSession, onSaveLog, checkDuplicate, loadYesterday }) {
      // ★ v0.5.3 직접 추가한 종목도 사전처럼 쓴다(부위 묶음·빈 부위·검색·기록 이름 찾기).
      const hasCustom = Object.keys(places?.customExercises || {}).length > 0;
      const library = hasCustom ? mergeCustomLibrary(exerciseLib?.library, places) : (exerciseLib?.library || null);
      const index = hasCustom && library ? buildExerciseIndex(library) : (exerciseLib?.index || null);
      const byKey = new Map((library?.exercises || []).map(e => [e.key, e]));
      const [view, setView] = useState('main'); // main | setup | company | apartment | home | discover
      const [allLogs, setAllLogs] = useState(null); // 기록에서 찾은 새 운동용 내 운동 기록
      const [draft, setDraft] = useState(null); // 추가 중인 새 운동 { key, name, targets, equipment, place }
      useEffect(() => {
        let alive = true;
        loadRecords().then(logs => { if (alive) setAllLogs(logs); }).catch(() => { if (alive) setAllLogs([]); });
        return () => { alive = false; };
      }, []);
      const [records, setRecords] = useState(null);
      const [recordsError, setRecordsError] = useState(false);
      const [choices, setChoices] = useState({});
      const [homeEq, setHomeEq] = useState([]);
      const [saving, setSaving] = useState(false);
      const [query, setQuery] = useState('');
      const [adding, setAdding] = useState(false);
      const [partFilter, setPartFilter] = useState(null); // 빈 부위 안내에서 고른 세부 부위('core.obliques')
      const [collapsed, setCollapsed] = useState(() => new Set()); // 접은 부위 묶음 ('company:chest')
      const [settingsOpen, setSettingsOpen] = useState(false); // ★ v0.5.4 운동 설정(쉬는 시간·소리)
      const current = places || emptyWorkoutPlaces();
      const setupDone = current.setupDone;

      const save = async (next) => {
        setSaving(true);
        const ok = await onSave(next);
        setSaving(false);
        return ok;
      };
