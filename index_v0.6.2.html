              )}
            </div>
          )}

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-3 py-2 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-40" data-bottom-nav>
            <div className={`max-w-lg mx-auto grid ${showRoutines ? 'grid-cols-5' : 'grid-cols-4'} items-center`}>
              <button aria-label="홈 화면" onClick={() => { if(activeTab === 'home') setCurrentDate(formatDate(new Date())); else setActiveTab('home'); }} className={`flex flex-col items-center py-2 min-w-0 transition ${activeTab === 'home' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
                <span className="text-xl mb-0.5">🏠</span>
                <span className="text-[11px] font-bold whitespace-nowrap">홈</span>
              </button>
              {showRoutines && (
              <button aria-label="루틴 화면" onClick={() => setActiveTab('routine')} className={`flex flex-col items-center py-2 min-w-0 transition ${activeTab === 'routine' ? 'text-emerald-600' : 'text-gray-400 hover:text-gray-600'}`}>
                <span className="text-xl mb-0.5">🌱</span>
                <span className="text-[11px] font-bold whitespace-nowrap">루틴</span>
              </button>
              )}
              <button aria-label="운동 화면" onClick={() => setActiveTab('workout')} className={`flex flex-col items-center py-2 min-w-0 transition ${activeTab === 'workout' ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`} data-workout-nav>
                <span className="text-xl mb-0.5">🏋️</span>
                <span className="text-[11px] font-bold whitespace-nowrap">운동</span>
              </button>
              <button aria-label="건강 현황 화면" onClick={() => setActiveTab('status')} className={`flex flex-col items-center py-2 min-w-0 transition ${activeTab === 'status' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
                <span className="text-xl mb-0.5">📊</span>
                <span className="text-[11px] font-bold whitespace-nowrap">현황</span>
              </button>
              <button aria-label="건강분석 화면" onClick={() => setActiveTab('analysis')} className={`flex flex-col items-center py-2 min-w-0 transition ${activeTab === 'analysis' ? 'text-indigo-600' : 'text-gray-400 hover:text-gray-600'}`}>
                <span className="text-xl mb-0.5">🧭</span>
                <span className="text-[11px] font-bold whitespace-nowrap">건강분석</span>
              </button>
            </div>
          </div>

          <button
            type="button" aria-label="새 기록 추가" onClick={() => setIsMenuOpen(!isMenuOpen)}
            className={`fixed bottom-[calc(env(safe-area-inset-bottom)+72px)] left-1/2 -translate-x-1/2 w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl border-4 border-white flex items-center justify-center text-3xl z-40 transition-transform ${isMenuOpen ? 'rotate-45 bg-gray-700' : 'hover:scale-105 active:scale-95'}`}
          >+</button>

          {isMenuOpen && (
            <>
              <div className="fixed inset-0 bg-black/20 z-30" onClick={() => setIsMenuOpen(false)}></div>
              <div className="fixed bottom-36 left-1/2 -translate-x-1/2 flex flex-col gap-3 z-40 animate-fade-in-up w-64">
                <button onClick={openBiometricsDraft} className="flex justify-center items-center gap-3 bg-red-50 text-red-600 px-5 py-3 rounded-full shadow-xl border border-red-200 font-bold whitespace-nowrap hover:bg-red-100 transition">
                  <span>🩺 생체 수치 직접 입력</span>
                </button>
                <button onClick={openTextDraft} className="flex justify-center items-center gap-3 bg-white px-5 py-3 rounded-full shadow-xl border border-gray-100 text-gray-700 font-bold whitespace-nowrap hover:bg-gray-50 transition">
                  <span>✍️ 식단/운동 한 줄 기록</span>
                </button>
                <label className="flex justify-center items-center gap-3 bg-white px-5 py-3 rounded-full shadow-xl border border-gray-100 text-gray-700 font-bold whitespace-nowrap cursor-pointer hover:bg-gray-50 transition">
                  <span>🖼️ 갤러리 (최대 5장)</span>
                  <input type="file" accept="image/*" multiple className="hidden" onChange={(e) => handleFileSelect(e, false)} />
                </label>
                <label className="flex justify-center items-center gap-3 bg-blue-600 text-white px-5 py-3 rounded-full shadow-xl border border-blue-500 font-bold whitespace-nowrap cursor-pointer hover:bg-blue-700 transition">
                  <span>📷 지금 촬영 (AI 분석)</span>
                  <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleFileSelect(e, true)} />
                </label>
              </div>
            </>
          )}

          {draft.isOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 touch-none">
              <form onSubmit={(e) => { e.preventDefault(); handleUploadConfirm(); }} className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar pointer-events-auto">
                <h2 className="text-xl font-bold text-gray-800 mb-1">
                  {draft.isEditMode ? '✏️ 기록 수정' : getDraftTitle(draft.category, draft.type)}
                </h2>

                {!draft.isEditMode && draft.type !== 'biometrics' && (
                  <div className="mb-5">
                    <p className="text-xs font-bold text-gray-500 mb-2.5">기록 방법을 선택하세요</p>
                    <div className="grid grid-cols-3 gap-2" data-record-methods>
                    <button type="button" aria-label="한 줄 기록 선택" onClick={() => setDraft(prev => ({...prev, type: 'text', data: [], isCamera: false, timeAutoMessage: prev.entrySource === 'todayTable' ? prev.timeAutoMessage : ''}))}
                      className={`relative min-h-[68px] rounded-2xl border-2 flex flex-col items-center justify-center gap-0.5 active:scale-95 transition ${draft.type === 'text' ? 'bg-blue-600 border-blue-600 text-white shadow-md ring-2 ring-blue-100' : 'bg-blue-50 border-blue-100 text-blue-700'}`}>
                      <span className="text-xl leading-none">✍️</span>
                      <span className="whitespace-nowrap text-xs font-black">한 줄{draft.type === 'text' ? ' ✓' : ''}</span>
                      <span className={`whitespace-nowrap text-[10px] font-medium ${draft.type === 'text' ? 'text-blue-100' : 'text-blue-500'}`}>직접 입력</span>
                    </button>
                    <label role="button" tabIndex="0" aria-label="사진 촬영 선택" className={`relative min-h-[68px] rounded-2xl border-2 flex flex-col items-center justify-center gap-0.5 text-center cursor-pointer active:scale-95 transition ${draft.type === 'image' && draft.isCamera ? 'bg-violet-600 border-violet-600 text-white shadow-md ring-2 ring-violet-100' : 'bg-violet-50 border-violet-100 text-violet-700'}`}>
                      <span className="text-xl leading-none">📷</span>
                      <span className="whitespace-nowrap text-xs font-black">촬영{draft.type === 'image' && draft.isCamera ? ' ✓' : ''}</span>
                      <span className={`whitespace-nowrap text-[10px] font-medium ${draft.type === 'image' && draft.isCamera ? 'text-violet-100' : 'text-violet-500'}`}>지금 촬영</span>
                      <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleFileSelect(e, true, true)} />
                    </label>
                    <label role="button" tabIndex="0" aria-label="앨범 사진 선택" className={`relative min-h-[68px] rounded-2xl border-2 flex flex-col items-center justify-center gap-0.5 text-center cursor-pointer active:scale-95 transition ${draft.type === 'image' && !draft.isCamera ? 'bg-teal-600 border-teal-600 text-white shadow-md ring-2 ring-teal-100' : 'bg-teal-50 border-teal-100 text-teal-700'}`}>
                      <span className="text-xl leading-none">🖼️</span>
                      <span className="whitespace-nowrap text-xs font-black">앨범{draft.type === 'image' && !draft.isCamera ? ' ✓' : ''}</span>
                      <span className={`whitespace-nowrap text-[10px] font-medium ${draft.type === 'image' && !draft.isCamera ? 'text-teal-100' : 'text-teal-500'}`}>최대 5장</span>
                      <input type="file" accept="image/*" multiple className="hidden" onChange={(e) => handleFileSelect(e, false, true)} />
                    </label>
                    </div>
                  </div>
                )}

                <div className="mb-6 flex gap-3">
                  <div className="flex-1">
                    <label className="text-sm font-bold text-gray-600 mb-2 block">날짜 지정</label>
                    <input type="date" value={draft.editDate} onClick={openDateTimePicker} onChange={e => setDraft({...draft, editDate: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 text-sm" />
                  </div>
                  <div className="flex-1">
                    <label className="text-sm font-bold text-gray-600 mb-2 block">시간 지정</label>
                    {draft.isCamera && !draft.isEditMode ? (
                      <div className="w-full bg-gray-100 border border-gray-200 rounded-xl p-3 text-gray-500 font-medium text-center text-sm cursor-not-allowed">{draft.editTime} (자동)</div>
                    ) : (
                      <input type="time" value={draft.editTime} onClick={openDateTimePicker} onChange={e => setDraft({...draft, editTime: e.target.value, timeAutoMessage: '', timeConfirmed: false})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 text-sm" />
                    )}
                  </div>
                </div>

                {draft.timeAutoMessage && (
                  <p className="-mt-3 mb-4 text-xs leading-relaxed text-blue-700 bg-blue-50 border border-blue-100 rounded-xl px-3 py-2.5" data-time-auto-message>{draft.timeAutoMessage}</p>
                )}

                {draftMealTimeWarning && !draft.timeConfirmed && (
                  <div className="-mt-2 mb-5 bg-amber-50 border border-amber-200 rounded-2xl p-3" data-meal-time-warning>
                    <p className="text-xs font-bold leading-relaxed text-amber-900">⏰ {draftMealTimeWarning.message}</p>
                    <div className="grid grid-cols-2 gap-2 mt-2.5">
                      {!draft.isCamera ? (
                        <button type="button" onClick={() => { setDraft(prev => ({...prev, editTime: draftMealTimeWarning.anchorTime, timeAutoMessage: `${draftMealTimeWarning.label} 기준 시각인 ${draftMealTimeWarning.anchorTime}로 변경했어요.`, timeConfirmed: false})); setSysError(''); }}
                          className="whitespace-nowrap text-[11px] font-bold py-2 rounded-lg bg-white text-amber-800 border border-amber-200">{draftMealTimeWarning.anchorTime}로 변경</button>
                      ) : <span />}
                      <button type="button" onClick={() => { setDraft(prev => ({...prev, timeConfirmed: true})); setSysError(''); }}
                        className="whitespace-nowrap text-[11px] font-bold py-2 rounded-lg bg-amber-600 text-white">{draft.editTime} 사용</button>
                    </div>
                  </div>
                )}

                {draft.type !== 'biometrics' && (
                  <div className="mb-6">
                    <label className="text-sm font-bold text-gray-600 mb-2 block">무엇을 하셨나요?</label>
                    <div className="flex flex-wrap gap-2">
                      {defaultCategories.filter(c => c !== '생체기록').map(cat => (
                        <button type="button" key={cat} onClick={() => setDraft({...draft, category: cat, timeConfirmed: false})} className={`px-4 py-2 rounded-full text-sm font-bold transition ${draft.category === cat ? (cat === '운동' ? 'bg-green-500 text-white' : (cat === SUPPLEMENT_CATEGORY ? 'bg-violet-600 text-white' : 'bg-blue-600 text-white')) : 'bg-gray-100 text-gray-600'}`}>
                          {cat === '운동' ? '🏃‍♂️ ' : (cat === SUPPLEMENT_CATEGORY ? '💊 ' : '')}{cat}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {draft.type === 'biometrics' && (
                  <div className="mb-6 space-y-4">
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">수축기 (최고혈압)</label>
                        <input type="number" placeholder="예: 120" value={draft.bp_sys} onChange={e => setDraft({...draft, bp_sys: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-red-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">이완기 (최저혈압)</label>
                        <input type="number" placeholder="예: 80" value={draft.bp_dia} onChange={e => setDraft({...draft, bp_dia: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 text-base" />
                      </div>
                    </div>
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">맥박 (bpm)</label>
                        <input type="number" placeholder="예: 70" value={draft.pulse} onChange={e => setDraft({...draft, pulse: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-pink-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">공복 혈당 (mg/dL)</label>
                        <input type="number" placeholder="예: 95" value={draft.sugar} onChange={e => setDraft({...draft, sugar: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-green-500 text-base" />
                      </div>
                    </div>
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">체중 (kg)</label>
                        <input type="number" step="0.1" placeholder="예: 68.5" value={draft.weight} onChange={e => setDraft({...draft, weight: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-purple-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">수면 시간 (시간)</label>
                        <input type="number" step="0.5" placeholder="예: 7" value={draft.sleep_hours} onChange={e => setDraft({...draft, sleep_hours: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-indigo-500 text-base" />
                      </div>
                    </div>
                  </div>
                )}

                {draft.type === 'image' && draft.data && draft.data.length > 0 && (
                  <div className="mb-5">
                    <div className="flex gap-2 mb-3 overflow-x-auto no-scrollbar">
                      {draft.data.map((src, i) => (
                        <img key={i} src={src} onClick={() => setLightboxImage(src)} className="w-32 h-32 object-cover rounded-2xl bg-gray-100 shrink-0 border border-gray-200 cursor-pointer active:opacity-80 transition" />
                      ))}
                    </div>
                    <input type="text" placeholder={draft.category === '운동' ? "추가 메모 (예: 스쿼트 50개 추가함)" : (draft.category === SUPPLEMENT_CATEGORY ? "추가 메모 (예: 아침 식후에 먹음)" : "추가 메모 (예: 밥은 반 공기만 먹음)")} value={draft.memo} onChange={e => setDraft({...draft, memo: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 outline-none focus:border-blue-500 text-sm" />
                  </div>
                )}

                {draft.type === 'text' && (
                  <div className="mb-5">
                    {draft.category !== '운동' && frequentFoods.length > 0 && (
                      <div className="mb-2.5">
                        <label className="text-xs font-bold text-gray-400 mb-1.5 block">🍽️ 자주 먹는 음식 (탭해서 추가, 양은 직접 입력)</label>
                        <div className="flex flex-wrap justify-center gap-1.5">
                          {frequentFoods.map(name => (
                            <button type="button" key={name} onClick={() => insertFrequentFood(name)}
                              className="shrink-0 whitespace-nowrap px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-600 border border-blue-100 hover:bg-blue-100 active:scale-95 transition">
                              {name}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                    <textarea
                      ref={naturalTextRef}
                      placeholder={draft.category === '운동' ? "예: 런닝머신 30분 뛰었어" : (draft.category === SUPPLEMENT_CATEGORY ? "예: 발효효소 1포, 유산균 1캡슐 (포장 사진을 올리면 기능성 문구도 읽어요)" : "예: 아침으로 사과 반 개 먹었어")}
                      value={draft.naturalText} onChange={e => setDraft({...draft, naturalText: e.target.value})} onBlur={handleInputBlur}
                      onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleUploadConfirm(); } }}
                      className="w-full bg-gray-50 border border-gray-200 p-4 rounded-2xl outline-none focus:border-blue-500 h-24 resize-none text-base leading-relaxed"
                    />
                  </div>
                )}

                <div className="flex gap-3">
                  <button type="button" onClick={() => { setDraft({isOpen: false}); nudgeViewportRepaint(); }} className="flex-1 py-4 rounded-xl font-bold bg-gray-100 text-gray-600">취소</button>
                  <button type="submit" className={`flex-1 py-4 rounded-xl font-bold text-white shadow-md ${draft.type === 'biometrics' ? 'bg-red-500' : (draft.category === '운동' ? 'bg-green-500' : 'bg-blue-600')}`}>
                    {draft.isEditMode ? '수정 및 코칭받기 🔄' : '기록 및 코칭받기 🚀'}
                  </button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
