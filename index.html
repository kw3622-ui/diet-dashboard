<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =====================================================================
    // ★ Supabase 설정 (구글 앱스스크립트 + 시트 + 드라이브를 대체)
    // =====================================================================
    const SUPABASE_URL = 'https://nppkwxwzbyhfwsmdudge.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wcGt3eHd6YnloZndzbWR1ZGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTQ4OTYsImV4cCI6MjEwMzgzMDg5Nn0.QhIoiK5G7jC_VU9hrVpXNVw3AD8NdlmVq-1jgkR5kh4';
    const FUNCTIONS_URL = SUPABASE_URL + '/functions/v1/diet-ai';
    const EMAIL_DOMAIN = '@dietapp.local'; // 계정명만으로 가입/로그인하기 위한 내부용 더미 이메일 도메인
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ★ v0.3.7 본인 섭취량 버튼. 서버(diet-ai_v0.0.12.ts)의 PORTION_SHARES와 같아야 한다.
    const PORTION_SHARES = [0.5, 1, 1.5, 2];
    const portionShareLabel = (share) => share === 0.5 ? '반 인분' : share >= 2 ? '2인분 이상' : `${share}인분`;

    // logs 테이블 행 -> 기존 화면 코드가 기대하는 모양으로 변환
    const mapLogRow = (row) => ({
      id: row.id,
      date: row.log_date,
      time: String(row.log_time || '').slice(0, 5),
      category: row.category,
      foodName: row.food_name,
      ingredients: row.ingredients || [],
      analysis: row.analysis,
      imageUrl: (row.image_urls || []).join(','),
      rawInput: JSON.stringify(row.raw_input || {}),
      isAlcohol: !!row.is_alcohol,
      followupQuestion: row.followup_question || null,
      followupAnswer: row.followup_answer || null,
      exerciseMeta: row.exercise_meta || row.exerciseMeta || null,
      portionCheck: row.portion_check || row.portionCheck || null,
      healthTags: (row.food_health_tags || row.healthTags || []).map(tag => ({
        foodIndex: tag.food_index ?? tag.foodIndex ?? 0,
        foodName: tag.food_name ?? tag.foodName ?? '',
        tagKey: tag.tag_key ?? tag.tagKey ?? '',
        tagLabel: tag.tag_label ?? tag.tagLabel ?? '',
        diseaseKey: tag.disease_key ?? tag.diseaseKey ?? 'general',
        polarity: tag.polarity || 'neutral',
        confidence: Number(tag.confidence ?? 0),
        evidence: tag.evidence || '',
      })),
    });

    // ★ v0.3.6 운동 부위 균형. 서버 diet-ai_v0.0.11.ts의 computeExerciseBalance와 같은 규칙:
    // 큰 부위는 최근 30일, 세부 부위 비중은 전체 기록, 최근 2일 안에 한 부위는 추천에서 제외.
    const EXERCISE_PARTS = [
      { key: 'chest', label: '가슴', subs: [['upper_chest', '윗가슴'], ['mid_chest', '중간가슴'], ['lower_chest', '밑가슴']] },
      { key: 'back', label: '등', subs: [['lat', '넓이'], ['mid_back', '두께'], ['lower_back', '허리']] },
      { key: 'shoulder', label: '어깨', subs: [['front_delt', '전면'], ['side_delt', '측면'], ['rear_delt', '후면']] },
      { key: 'arm', label: '팔', subs: [['biceps', '이두'], ['triceps', '삼두']] },
      { key: 'legs', label: '하체', subs: [['quads', '앞허벅지'], ['hamstrings', '뒷허벅지'], ['glutes', '엉덩이'], ['calves', '종아리']] },
      { key: 'core', label: '코어', subs: [['abs', '복부'], ['obliques', '옆구리']] },
    ];
    const RECOMMENDABLE_EXERCISE_PARTS = ['chest', 'back', 'shoulder', 'legs'];
    const EXERCISE_BALANCE_DAYS = 30;
    const EXERCISE_RECOVERY_DAYS = 2;
    const EXERCISE_CARDIO_DAYS_TARGET = 8;
    const EXERCISE_SUB_MIN_SESSIONS = 3;

    const computeExerciseBalance = (rows, referenceDate) => {
      const shift = (dateStr, delta) => { const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + delta); return formatDate(d); };
      const windowStart = shift(referenceDate, -(EXERCISE_BALANCE_DAYS - 1));
      const recoveryStart = shift(referenceDate, -EXERCISE_RECOVERY_DAYS);
      const parts = Object.fromEntries(EXERCISE_PARTS.map(p => [p.key, { dates: new Set(), last: null, recent: false, sessions: 0, subs: {} }]));
      const cardioDates = new Set();
      let cardioMinutes = 0, classifiedLogs = 0;

      rows.forEach(row => {
        const date = row.log_date;
        const inWindow = date >= windowStart && date <= referenceDate;
        const partsInLog = new Set();
        const subsInLog = {};
        let known = false;
        (row.exercise_meta?.items || []).forEach(item => {
          if (item?.kind === 'cardio') {
            known = true;
            if (inWindow) { cardioDates.add(date); if (Number(item.minutes) > 0) cardioMinutes += Number(item.minutes); }
          }
          (item?.targets || []).forEach(target => {
            const [part, sub] = String(target).split('.');
            if (!parts[part]) return;
            known = true;
            partsInLog.add(part);
            if (sub) (subsInLog[part] = subsInLog[part] || new Set()).add(sub);
          });
        });
        if (known) classifiedLogs += 1;
        partsInLog.forEach(part => {
          const p = parts[part];
          if (inWindow) p.dates.add(date);
          if (!p.last || date > p.last) p.last = date;
          if (date >= recoveryStart && date <= referenceDate) p.recent = true;
        });
        Object.entries(subsInLog).forEach(([part, subs]) => {
          const p = parts[part];
          p.sessions += 1;
          subs.forEach(sub => {
            const s = p.subs[sub] = p.subs[sub] || { count: 0, last: '' };
            s.count += 1;
            if (date > s.last) s.last = date;
          });
        });
      });

      const daysAgo = (date) => date ? Math.round((parseDate(referenceDate) - parseDate(date)) / 86400000) : null;
      const summary = EXERCISE_PARTS.map(def => {
        const p = parts[def.key];
        const subs = def.subs.map(([sub, label]) => ({ sub, label, count: p.subs[sub]?.count || 0, last: p.subs[sub]?.last || '' }));
        let lacking = null;
        if (p.sessions >= EXERCISE_SUB_MIN_SESSIONS) {
          const max = Math.max(...subs.map(s => s.count));
          lacking = subs
            .filter(s => s.count <= Math.floor(p.sessions * 0.2) && max - s.count >= 2)
            .sort((a, b) => a.count - b.count || a.last.localeCompare(b.last))[0] || null;
        }
        return { ...def, days: p.dates.size, lastDate: p.last, daysAgo: daysAgo(p.last), recent: p.recent, sessions: p.sessions, subs, lacking };
      });
      const recommendOrder = summary
        .filter(p => RECOMMENDABLE_EXERCISE_PARTS.includes(p.key) && !p.recent)
        .sort((a, b) => a.days - b.days || (a.lastDate || '').localeCompare(b.lastDate || ''));
      return {
        referenceDate, classifiedLogs, summary,
        recommended: recommendOrder[0] || null,
        cardioDays: cardioDates.size, cardioMinutes, cardioNeeded: cardioDates.size < EXERCISE_CARDIO_DAYS_TARGET,
      };
    };

    // ★ v0.3.8 항목별 근거(entries)도 함께 모아 카드에서 펼쳐 볼 수 있게 한다.
    const summarizeHealthTags = (items) => {
      const groups = new Map();
      (items || []).forEach(item => (item.healthTags || []).forEach(tag => {
        if (!tag.tagLabel || !['helpful', 'caution'].includes(tag.polarity)) return;
        const key = `${tag.diseaseKey}:${tag.polarity}`;
        const current = groups.get(key) || { key, label: tag.tagLabel, polarity: tag.polarity, count: 0, foods: new Set(), entries: [] };
        current.count += 1;
        if (tag.foodName) current.foods.add(tag.foodName);
        current.entries.push({ logId: item.id, date: item.date, time: item.time, category: item.category, foodName: tag.foodName || item.foodName || '', evidence: tag.evidence || '' });
        groups.set(key, current);
      }));
      groups.forEach(group => group.entries.sort((a, b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)));
      return [...groups.values()].sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
    };

    const conditionKeyForLabel = (label) => {
      const text = String(label || '').trim();
      const known = [
        ['gout', ['통풍']], ['hypertension', ['고혈압', '혈압']], ['diabetes', ['당뇨', '혈당']],
        ['dyslipidemia', ['고지혈증', '이상지질혈증', '콜레스테롤']], ['kidney', ['신장', '콩팥']], ['liver', ['지방간', '간질환', '간 건강']]
      ];
      const found = known.find(([, words]) => words.some(word => text.includes(word)));
      return found ? found[0] : text.toLocaleLowerCase('ko-KR').replace(/\s+/g, '').slice(0, 80);
    };

    const parseProfileConditions = (value) => {
      const text = String(value || '').trim();
      if (!text) return [];
      const pieces = text.split(/[,/·;\n]+/).map(item => item.trim()).filter(Boolean);
      if (pieces.length > 1) return [...new Map(pieces.map(label => [conditionKeyForLabel(label), label])).values()];
      const known = [
        ['통풍', ['통풍']], ['고혈압', ['고혈압']], ['혈당', ['당뇨', '혈당']],
        ['고지혈증', ['고지혈증', '이상지질혈증', '콜레스테롤']], ['신장', ['신장', '콩팥']], ['지방간', ['지방간', '간질환']]
      ];
      const matched = known.filter(([, words]) => words.some(word => text.includes(word))).map(([label]) => label);
      return matched.length > 1 ? matched : [text];
    };

    const mapConditionReport = (row) => ({
      id: row.id,
      conditionKey: row.condition_key ?? row.conditionKey ?? '',
      conditionLabel: row.condition_label ?? row.conditionLabel ?? '',
      windowStart: row.window_start ?? row.windowStart ?? '',
      windowEnd: row.window_end ?? row.windowEnd ?? '',
      status: row.status || 'insufficient',
      reportData: row.report_data ?? row.reportData ?? {},
      snapshot: row.snapshot || {},
      createdAt: row.created_at ?? row.createdAt ?? new Date().toISOString(),
      previousCreatedAt: row.previousCreatedAt || null,
    });

    // 페이지를 처음 열 때, 기기 시계가 서버 시각보다 살짝 느린 경우 방금 발급된 로그인 토큰이
    // "미래에 발급된 것"처럼 보여 PostgREST가 요청을 거부하는 경우가 있음 ("JWT issued at future").
    // 새로고침하면 사라지는 일시적인 현상이라, 이 에러를 감지하면 잠깐 기다렸다가 조용히 한 번 재시도한다.
    const isClockSkewAuthError = (msg) => !!msg && /jwt issued at future/i.test(msg);
    const withAuthRetry = async (queryFn) => {
      let result = await queryFn();
      if (result.error && isClockSkewAuthError(result.error.message)) {
        await new Promise((resolve) => setTimeout(resolve, 1500));
        result = await queryFn();
      }
      return result;
    };

    // Gemini 호출은 API 키를 숨기기 위해 Supabase Edge Function(diet-ai)을 통해서만 수행
    const callAI = async (action, payload, signal) => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error('로그인이 필요합니다.');
      const res = await fetch(FUNCTIONS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ action, payload }),
        signal,
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data && data.error) || 'AI 요청에 실패했습니다.');
      return data;
    };

    const translateAuthError = (msg) => {
      if (!msg) return '오류가 발생했습니다.';
      if (msg.includes('already registered') || msg.includes('already exists') || msg.includes('duplicate')) return '이미 사용 중인 계정명입니다.';
      if (msg.includes('Invalid login credentials')) return '계정명 또는 비밀번호가 올바르지 않습니다.';
      if (msg.includes('Password should be at least') || msg.includes('at least 6')) return '비밀번호는 6자 이상이어야 합니다.';
      return msg;
    };

    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const fileName = file.name ? file.name.toLowerCase() : '';
        if (fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic') {
          reject(new Error("아이폰의 HEIC(고효율) 사진은 카메라로 직접 찍거나 화면 캡처 후 올려주세요!"));
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            let width = img.width, height = img.height;
            if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.onerror = () => reject(new Error("이미지 처리 실패"));
          img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error("파일 읽기 실패"));
      });
    };

    // v0.0.1: 글자 영역을 눌러도 날짜/시간 선택창을 즉시 연다.
    // 기본 클릭 동작은 막지 않아 기존 선택 아이콘과 미지원 브라우저 동작을 유지한다.
    const openDateTimePicker = (event) => {
      const input = event.currentTarget;
      if (typeof input.showPicker !== 'function') return;
      try {
        input.showPicker();
      } catch (error) {
        // 브라우저가 선택창 호출을 제한하면 기본 입력 동작을 유지한다.
      }
    };

    const formatDate = (d) => { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

    // ★ 백업/내보내기용 CSV 필드 이스케이프 (콤마·따옴표·줄바꿈 포함 시 큰따옴표로 감싸고 내부 따옴표는 두 번씩)
    const escapeCsvField = (val) => {
      const str = val === null || val === undefined ? '' : String(val);
      if (/[",\n\r]/.test(str)) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    };

    const parseDate = (dateStr) => {
      if (!dateStr) return new Date();
      if (dateStr.includes('T')) return new Date(dateStr);
      const [y, m, d] = dateStr.split('-');
      return new Date(y, m - 1, d);
    };

    const getDayStr = (dateStr) => {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return days[parseDate(dateStr).getDay()];
    };

    const getKoreanWeekLabel = (dateStr) => {
      const d = parseDate(dateStr);
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const date = d.getDate();
      const firstDay = new Date(year, month - 1, 1).getDay();
      const week = Math.ceil((date + firstDay) / 7);

      const weekNames = ['첫', '둘', '셋', '넷', '다섯', '여섯'];
      const weekName = weekNames[week - 1] || week;

      return `${year}년 ${month}월 ${weekName}째주`;
    };

    const getWeekString = (dateStr) => {
      const d = parseDate(dateStr);
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    };

    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };

    const getDefaultCategoryByTime = () => {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 11) return '아침식사';
      if (hour >= 11 && hour < 15) return '점심식사';
      if (hour >= 15 && hour < 17) return '간식';
      if (hour >= 17 && hour < 21) return '저녁식사';
      return '야식';
    };

    // ★ [버그수정] 안드로이드 크롬에서 카메라/갤러리(네이티브 파일 선택) 앱을 다녀오면
    // 브라우저가 내부적으로 들고 있는 뷰포트 치수가 갱신되지 않아 터치 좌표가 실제 화면과 어긋나는 현상 방지용.
    // 모달이 닫혀 body 스크롤이 풀린 직후(overflow: unset 반영 이후) 스크롤을 1px 움직였다 되돌려서
    // 브라우저가 레이아웃/뷰포트를 강제로 다시 계산하도록 만든다.
    const nudgeViewportRepaint = () => {
      setTimeout(() => {
        const y = window.scrollY;
        window.scrollTo(window.scrollX, y + 1);
        requestAnimationFrame(() => window.scrollTo(window.scrollX, y));
      }, 80);
    };

    const getWeekRange = (dateStr) => {
      const d = parseDate(dateStr);
      const day = d.getDay();
      const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
      const start = new Date(d); start.setDate(diffToMonday);
      const end = new Date(start); end.setDate(start.getDate() + 6);
      return { start: formatDate(start), end: formatDate(end), label: getKoreanWeekLabel(dateStr) };
    };

    const getMonthRange = (dateStr) => {
      const d = parseDate(dateStr);
      const start = new Date(d.getFullYear(), d.getMonth(), 1);
      const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      return { start: formatDate(start), end: formatDate(end), label: `${d.getFullYear()}년 ${d.getMonth() + 1}월` };
    };

    const defaultCategories = ['아침식사', '점심식사', '저녁식사', '간식', '야식', '운동'];
    const mealSlotDefinitions = [
      { key: 'breakfast', category: '아침식사', label: '아침', icon: '🌅', anchorTime: '08:00', minTime: '05:00', maxTime: '11:30' },
      { key: 'lunch', category: '점심식사', label: '점심', icon: '☀️', anchorTime: '13:00', minTime: '10:30', maxTime: '16:30' },
      { key: 'dinner', category: '저녁식사', label: '저녁', icon: '🌙', anchorTime: '19:00', minTime: '16:00', maxTime: '23:30' },
    ];
    const mealSlotByCategory = Object.fromEntries(mealSlotDefinitions.map(slot => [slot.category, slot.key]));
    const mealSlotByCategoryDetail = Object.fromEntries(mealSlotDefinitions.map(slot => [slot.category, slot]));
    const timeToMinutes = (value) => {
      const [hour, minute] = String(value || '').split(':').map(Number);
      return Number.isFinite(hour) && Number.isFinite(minute) ? hour * 60 + minute : null;
    };
    const isTimeWithinMealRange = (category, time) => {
      const slot = mealSlotByCategoryDetail[category];
      const value = timeToMinutes(time);
      if (!slot || value === null) return true;
      return value >= timeToMinutes(slot.minTime) && value <= timeToMinutes(slot.maxTime);
    };
    const getMealTimeWarning = (category, time) => {
      const slot = mealSlotByCategoryDetail[category];
      if (!slot || !time || isTimeWithinMealRange(category, time)) return null;
      return {
        ...slot,
        message: `${slot.label} 식사 시간이 ${time}로 되어 있습니다. 이 시간이 맞는지 확인해주세요.`
      };
    };
    const getDraftTitle = (category, type) => {
      if (type === 'biometrics') return '🩺 생체 기록';
      const titles = {
        '아침식사': '🌅 아침 기록',
        '점심식사': '☀️ 점심 기록',
        '저녁식사': '🌙 저녁 기록',
        '간식': '🍪 간식 기록',
        '야식': '🌃 야식 기록',
        '운동': '🏃 운동 기록',
      };
      return titles[category] || '📝 건강 기록';
    };
    const getRecordTimeLabel = (category) => category === '운동' ? '운동 시작 시각' : (category === '생체기록' ? '측정 시각' : '섭취 시각');

    // 음주 기록이 없는 날을 금주로 계산한다. 오늘은 포함하고 미래 날짜는 제외한다.
    function getAlcoholGoalProgress(start, end, today, logs, periodTarget) {
      if (!start || !end || start > end) return { days: 0, alcoholFree: 0, target: 0 };
      const dayNumber = (date) => Date.parse(date + 'T00:00:00Z') / 86400000;
      const periodDays = dayNumber(end) - dayNumber(start) + 1;
      const until = end < today ? end : today;
      const days = Math.max(0, dayNumber(until) - dayNumber(start) + 1);
      const alcoholDays = new Set(logs.filter(log =>
        log.isAlcohol && log.date >= start && log.date <= until
      ).map(log => log.date)).size;
      const goal = Number(periodTarget) || 0;
      return {
        days,
        alcoholFree: Math.max(0, days - alcoholDays),
        target: goal
      };
    }

    function averageBiometrics(rows) {
      const sums = { bpSys: 0, bpDia: 0, sugar: 0, weight: 0, sleep: 0 };
      const counts = { bpSys: 0, bpDia: 0, sugar: 0, weight: 0, sleep: 0 };
      const fields = { bpSys: 'bp_sys', bpDia: 'bp_dia', sugar: 'sugar', weight: 'weight', sleep: 'sleep_hours' };

      rows.forEach(row => {
        let raw = row.raw_input ?? row.rawInput ?? {};
        if (typeof raw === 'string') {
          try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
        }
        const bio = raw.biometrics || {};
        Object.entries(fields).forEach(([key, field]) => {
          const rawValue = bio[field];
          const value = Number(rawValue);
          if (rawValue !== null && rawValue !== undefined && rawValue !== '' && Number.isFinite(value) && value > 0) {
            sums[key] += value;
            counts[key]++;
          }
        });
      });

      const averages = {};
      Object.keys(fields).forEach(key => {
        averages[key] = counts[key] ? sums[key] / counts[key] : null;
      });
      ['bpSys', 'bpDia', 'sugar'].forEach(key => {
        if (averages[key] !== null) averages[key] = Math.round(averages[key]);
      });
      return averages;
    }

    function buildLatestBiometrics(rows) {
      const fields = ['bp_sys', 'bp_dia', 'sugar', 'weight', 'sleep_hours', 'pulse'];
      const latest = {};
      const dates = {};

      (rows || []).forEach(row => {
        let raw = row.raw_input ?? row.rawInput ?? {};
        if (typeof raw === 'string') {
          try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
        }
        const bio = raw.biometrics || {};
        fields.forEach(field => {
          const rawValue = bio[field];
          const value = Number(rawValue);
          if (latest[field] === undefined && rawValue !== null && rawValue !== undefined && rawValue !== '' && Number.isFinite(value) && value > 0) {
            latest[field] = value;
            dates[field] = row.log_date ?? row.date ?? null;
          }
        });
        if (dates.bp === undefined && Number(bio.bp_sys) > 0 && Number(bio.bp_dia) > 0) {
          dates.bp = row.log_date ?? row.date ?? null;
        }
      });

      return Object.keys(latest).length ? { ...latest, dates } : null;
    }

    // 오늘의 기록표는 AI가 만든 foodName 제목 대신 실제 음식 목록을 우선 표시한다.
    // 화면 폭에 맞는 만큼(최대 4개)만 보여주고, 나머지는 "외 N개"로 요약한다.
    function getRecordedFoodNames(log) {
      const names = (Array.isArray(log?.ingredients) ? log.ingredients : [])
        .map(item => String(item || '').split('(')[0].trim())
        .filter(Boolean);
      if (names.length) return names;
      let raw = log?.rawInput || {};
      if (typeof raw === 'string') {
        try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
      }
      const original = String(raw?.naturalText || raw?.memo || '').trim();
      return original ? [original] : (log?.foodName ? [String(log.foodName)] : []);
    }

    // ★ v0.3.10 기록을 다시 쓸 때 입력창에 넣을 글. 사용자가 쓴 원문을 우선하고,
    // 사진 기록은 AI가 정리한 음식 목록(+메모)을 글로 바꾼다.
    function getCopyText(log) {
      let raw = log?.rawInput || {};
      if (typeof raw === 'string') {
        try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
      }
      const text = String(raw?.naturalText || '').trim();
      const memo = String(raw?.memo || '').trim();
      if (text && raw?.type !== 'image') return memo ? `${text} (${memo})` : text;
      const names = (Array.isArray(log?.ingredients) ? log.ingredients : [])
        .map(item => String(item || '').split('(')[0].trim()).filter(Boolean).join(', ') || String(log?.foodName || '');
      return memo ? `${names} (${memo})` : names;
    }

    // 최근 기록(기준일 이전)을 날짜별로 합치고, 같은 내용은 하나로 묶어 최신순 limit개를 돌려준다.
    function buildRecentMealChoices(logs, referenceDate, limit = 3) {
      const byDate = new Map();
      (logs || []).filter(log => log.date < referenceDate).forEach(log => {
        const text = getCopyText(log);
        if (!text) return;
        byDate.set(log.date, [...(byDate.get(log.date) || []), { time: log.time || '', text }]);
      });
      const seen = new Set();
      const choices = [];
      [...byDate.entries()].sort((a, b) => b[0].localeCompare(a[0])).forEach(([date, items]) => {
        const text = items.sort((a, b) => a.time.localeCompare(b.time)).map(item => item.text).join(', ');
        const key = text.replace(/\s+/g, '').toLowerCase();
        if (choices.length >= limit || seen.has(key)) return;
        seen.add(key);
        const daysAgo = Math.round((parseDate(referenceDate) - parseDate(date)) / 86400000);
        choices.push({ date, text, label: daysAgo === 1 ? '어제' : daysAgo === 2 ? '그저께' : `${Number(date.slice(5, 7))}/${Number(date.slice(8, 10))}` });
      });
      return choices;
    }

    // ★ v0.3.10 저장 중 AI 오류·새로고침이 나도 입력 내용을 잃지 않도록 이 기기에 임시 보관한다.
    // ★ v0.3.12 AI가 잠깐 바쁘거나(서버가 다시 시도해도 실패) 인터넷이 잠깐 끊긴 오류. 새로고침해도 나아지지 않으므로
    // 새로고침 대신 안내하고 같은 요청을 다시 보낼 수 있게 한다. 로그인·권한·저장 오류는 기존처럼 새로고침한다.
    function isTemporaryAiError(err) {
      if (err?.name === 'AbortError') return false;
      const message = String(err?.message || err || '');
      return /^AI 분석 실패|AI 응답이 비어|AI 응답 포맷|Failed to fetch|NetworkError|Load failed|network error/i.test(message);
    }

    // ★ v0.3.13 일시 오류의 종류에 맞는 안내 문구. 원문은 "오류 전문 보기"로 따로 보여준다.
    function temporaryAiMessage(detail) {
      const text = String(detail || '');
      if (/HTTP 429|RESOURCE_EXHAUSTED|quota/i.test(text)) return 'AI 무료 사용 한도에 걸렸어요. 분당 한도라면 1분쯤 뒤에, 하루 한도라면 내일 다시 시도해 주세요.';
      if (/Failed to fetch|NetworkError|Load failed|network error/i.test(text)) return '인터넷 연결이 잠깐 끊겼어요. 연결을 확인하고 다시 시도해 주세요.';
      return 'AI가 잠시 바빠요. 잠시 후 다시 시도해 주세요.';
    }

    // ★ v0.3.12 오류로 새로고침될 때 보던 화면(탭·날짜·주간/월간)과 쓰던 질문을 잠깐 보관했다가 되살린다.
    // 10분이 지난 값은 쓰지 않는다(다음 날 앱을 열면 지금처럼 홈의 오늘에서 시작).
    const VIEW_STATE_KEY = 'viewStateBeforeReload';
    const VIEW_STATE_MAX_AGE_MS = 10 * 60 * 1000;
    function takeSavedViewState() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(VIEW_STATE_KEY) || 'null');
        sessionStorage.removeItem(VIEW_STATE_KEY);
        if (!saved || !(Date.now() - saved.savedAt < VIEW_STATE_MAX_AGE_MS)) return null;
        return {
          activeTab: ['home', 'routine', 'status', 'analysis'].includes(saved.activeTab) ? saved.activeTab : null,
          currentDate: /^\d{4}-\d{2}-\d{2}$/.test(saved.currentDate || '') ? saved.currentDate : null,
          statsMode: ['week', 'month'].includes(saved.statsMode) ? saved.statsMode : null,
          longTermDrafts: saved.longTermDrafts && typeof saved.longTermDrafts === 'object' ? saved.longTermDrafts : {},
          followupDraft: typeof saved.followupDraft === 'string' ? saved.followupDraft.slice(0, 300) : '',
          openFollowupId: saved.openFollowupId || null,
        };
      } catch (error) { return null; }
    }

    const PENDING_ENTRY_KEY = 'pendingEntry';
    function savePendingEntry(entry) {
      try { localStorage.setItem(PENDING_ENTRY_KEY, JSON.stringify(entry)); return; } catch (error) { /* 사진 때문에 용량 초과일 수 있음 */ }
      try {
        const photos = entry.payload.base64Images || [];
        localStorage.setItem(PENDING_ENTRY_KEY, JSON.stringify({ ...entry, payload: { ...entry.payload, base64Images: [] }, photosDropped: photos.length > 0 }));
      } catch (error) { /* 보관하지 못해도 저장은 진행한다 */ }
    }
    function readPendingEntry(userId) {
      try {
        const entry = JSON.parse(localStorage.getItem(PENDING_ENTRY_KEY) || 'null');
        return entry && entry.payload && entry.userId === userId ? entry : null;
      } catch (error) { return null; }
    }
    function clearPendingEntry() {
      try { localStorage.removeItem(PENDING_ENTRY_KEY); } catch (error) { /* 무시 */ }
    }

    function MealRecordSummary({ matches }) {
      const lineRef = useRef(null);
      const allFoods = [...new Set((matches || []).flatMap(getRecordedFoodNames))];
      const [visibleCount, setVisibleCount] = useState(Math.min(4, Math.max(1, allFoods.length)));
      const firstTime = matches?.[0]?.time || '';
      const extraRecords = Math.max(0, (matches?.length || 0) - 1);
      const makeText = (count) => {
        const shown = allFoods.slice(0, count);
        const hidden = Math.max(0, allFoods.length - shown.length);
        return `${firstTime}${shown.length ? ` ${shown.join(' · ')}` : ''}${hidden ? ` 외 ${hidden}개` : ''}${extraRecords ? ` · +${extraRecords}회` : ''}`;
      };

      useEffect(() => {
        const node = lineRef.current;
        if (!node) return;
        const fit = () => {
          const style = getComputedStyle(node);
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          context.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
          const width = node.clientWidth;
          let count = Math.min(4, Math.max(1, allFoods.length));
          while (count > 1 && context.measureText(makeText(count)).width > width) count--;
          setVisibleCount(count);
        };
        fit();
        const observer = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(fit) : null;
        observer?.observe(node);
        window.addEventListener('resize', fit);
        return () => { observer?.disconnect(); window.removeEventListener('resize', fit); };
      }, [firstTime, extraRecords, allFoods.join('|')]);

      const fullText = `${firstTime} ${allFoods.join(' · ')}${extraRecords ? ` · 추가 기록 ${extraRecords}회` : ''}`.trim();
      return <p ref={lineRef} title={fullText} aria-label={fullText} className="text-xs text-gray-500 whitespace-nowrap overflow-hidden text-ellipsis">{makeText(visibleCount)}</p>;
    }

    // ★ v0.4.0 루틴(생활 습관). DB: routines, routine_checks (본인 것만). AI는 쓰지 않는다.
    const ROUTINE_SLOTS = [
      { key: 'morning', label: '아침', start: 5 },
      { key: 'late_morning', label: '오전', start: 9 },
      { key: 'lunch', label: '점심', start: 11 },
      { key: 'afternoon', label: '오후', start: 14 },
      { key: 'evening', label: '저녁', start: 18 },
      { key: 'bedtime', label: '자기 전', start: 21 },
      { key: 'anytime', label: '언제든', start: null },
    ];
    const ROUTINE_WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const ROUTINE_LOOKBACK_DAYS = 365;
    const routineSlotLabel = (key) => (ROUTINE_SLOTS.find(s => s.key === key) || ROUTINE_SLOTS[6]).label;
    const routineSlotIndex = (key) => Math.max(0, ROUTINE_SLOTS.findIndex(s => s.key === key));

    // 지금 시각이 속한 시간대(새벽 0~5시는 '자기 전'으로 본다).
    function currentRoutineSlot(now = new Date()) {
      const hour = now.getHours();
      if (hour < 5) return 'bedtime';
      let current = 'morning';
      ROUTINE_SLOTS.forEach(slot => { if (slot.start !== null && hour >= slot.start) current = slot.key; });
      return current;
    }

    function routineDaysBetween(fromDate, toDate) {
      return Math.round((parseDate(toDate) - parseDate(fromDate)) / 86400000);
    }

    function routineArchivedDate(routine) {
      return routine?.archived_at ? formatDate(new Date(routine.archived_at)) : null;
    }

    // 그 날짜에 해야 하는 루틴인가. 매월의 없는 날짜(예: 2월 31일)는 그 달 말일로 처리한다.
    function isRoutineDue(routine, date) {
      if (!routine || !date) return false;
      if (routine.start_date && date < routine.start_date) return false;
      const archived = routineArchivedDate(routine);
      if (archived && date > archived) return false;
      const d = parseDate(date);
      switch (routine.schedule_type) {
        case 'daily': return true;
        case 'weekly': return (routine.weekdays || []).map(Number).includes(d.getDay());
        case 'monthly': {
          const day = d.getDate();
          const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
          const days = (routine.month_days || []).map(Number);
          return days.includes(day) || (day === lastDay && days.some(x => x > lastDay));
        }
        case 'interval': {
          const n = Math.max(1, Number(routine.interval_days) || 1);
          const diff = routineDaysBetween(routine.start_date || date, date);
          return diff >= 0 && diff % n === 0;
        }
        default: return false;
      }
    }

    // done(완료) / skipped(건너뜀) / progress(횟수형 진행 중) / todo(아직). 운동 연결 루틴은 운동 기록이 있으면 완료.
    function routineDayState(routine, check, exerciseDone) {
      if (check?.status === 'skipped') return 'skipped';
      if (check?.status === 'done') return 'done';
      if (routine.kind === 'count' && (check?.value || 0) >= routine.target) return 'done';
      if (routine.link_exercise && exerciseDone) return 'done';
      if (routine.kind === 'count' && (check?.value || 0) > 0) return 'progress';
      return 'todo';
    }

    function describeRoutineSchedule(routine) {
      switch (routine.schedule_type) {
        case 'daily': return '매일';
        case 'weekly': return '매주 ' + [...(routine.weekdays || [])].map(Number).sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => ROUTINE_WEEKDAYS[d]).join('·');
        case 'monthly': return '매월 ' + [...(routine.month_days || [])].map(Number).sort((a, b) => a - b).join('·') + '일';
        case 'interval': return `${routine.interval_days}일마다`;
        default: return '';
      }
    }

    // 같은 시간대 안에서는 정확한 시간을 적은 것부터 이른 순, 그다음 내가 정한 순서.
    function compareRoutines(a, b) {
      return routineSlotIndex(a.time_slot) - routineSlotIndex(b.time_slot)
        || (a.time_of_day ? 0 : 1) - (b.time_of_day ? 0 : 1)
        || String(a.time_of_day || '').localeCompare(String(b.time_of_day || ''))
        || (a.sort_order || 0) - (b.sort_order || 0)
        || String(a.created_at || '').localeCompare(String(b.created_at || ''));
    }

    // 연속 일수·최고 연속·최근 30일 달성률·이번 주(월~일) 진행. 건너뛴 날은 연속을 끊지 않고 계산에서 뺀다.
    // 오늘 아직 안 한 루틴은 연속을 끊지 않는다(어제까지로 센다). 달성률·이번 주 진행에는 오늘 할 것도 포함한다.
    function computeRoutineStats(routine, getCheck, isExerciseDay, today, lookbackDays = ROUTINE_LOOKBACK_DAYS) {
      const first = parseDate(today);
      first.setDate(first.getDate() - lookbackDays);
      const startDate = routine.start_date && routine.start_date > formatDate(first) ? routine.start_date : formatDate(first);
      const days = [];
      for (let d = parseDate(startDate); formatDate(d) <= today; d.setDate(d.getDate() + 1)) {
        const date = formatDate(d);
        if (!isRoutineDue(routine, date)) continue;
        days.push({ date, state: routineDayState(routine, getCheck(routine.id, date), isExerciseDay(date)) });
      }
      let current = 0;
      for (let i = days.length - 1; i >= 0; i--) {
        const { date, state } = days[i];
        if (state === 'done') current++;
        else if (state === 'skipped') continue;
        else if (date === today) continue;
        else break;
      }
      let best = 0, run = 0, totalDone = 0;
      days.forEach(({ date, state }) => {
        if (state === 'done') { run++; totalDone++; best = Math.max(best, run); }
        else if (state !== 'skipped' && date !== today) run = 0;
      });
      const since30 = parseDate(today); since30.setDate(since30.getDate() - 29);
      const window = days.filter(d => d.date >= formatDate(since30) && d.state !== 'skipped');
      const score = window.length ? Math.round(window.filter(d => d.state === 'done').length / window.length * 100) : null;
      // 이번 주 월~일: 할 날이 아님(none) / 앞으로(future) / 오늘 아직(today) / 못 함(missed) / 완료 / 건너뜀
      const range = getWeekRange(today);
      const week = [];
      for (let d = parseDate(range.start); formatDate(d) <= range.end; d.setDate(d.getDate() + 1)) {
        const date = formatDate(d);
        if (!isRoutineDue(routine, date)) { week.push({ date, state: 'none' }); continue; }
        if (date > today) { week.push({ date, state: getCheck(routine.id, date)?.status === 'skipped' ? 'skipped' : 'future' }); continue; }
        const state = routineDayState(routine, getCheck(routine.id, date), isExerciseDay(date));
        week.push({ date, state: state === 'done' || state === 'skipped' ? state : date === today ? 'today' : 'missed' });
      }
      const weekDue = week.filter(x => x.state !== 'none' && x.state !== 'skipped').length;
      const weekDone = week.filter(x => x.state === 'done').length;
      // 이번 주에 할 날이 없으면(매월·n일마다) 다음 할 날을 알려 준다.
      let nextDue = null;
      if (!weekDue && !routine.archived_at) {
        const d = parseDate(today);
        for (let i = 0; i < 400; i++) {
          d.setDate(d.getDate() + 1);
          if (isRoutineDue(routine, formatDate(d))) { nextDue = formatDate(d); break; }
        }
      }
      return { current, best, score, totalDone, week, weekDue, weekDone, nextDue };
    }

    // 오늘(보고 있는 날짜)의 루틴: 해야 하는 것만, 시간대 순. 오늘이면 지금 시간대부터 보여 주고 지난 시간대는 뒤로.
    function buildTodayRoutineGroups(routines, date, isToday, nowSlot) {
      const due = (routines || []).filter(r => !r.archived_at && isRoutineDue(r, date)).sort(compareRoutines);
      const order = ROUTINE_SLOTS.map(s => s.key);
      let slotOrder = order;
      if (isToday) {
        const nowIndex = routineSlotIndex(nowSlot);
        const timed = order.filter(k => k !== 'anytime');
        slotOrder = [...timed.slice(nowIndex), 'anytime', ...timed.slice(0, nowIndex)];
      }
      return slotOrder.map(key => ({
        key, label: routineSlotLabel(key),
        past: isToday && key !== 'anytime' && routineSlotIndex(key) < routineSlotIndex(nowSlot),
        now: isToday && key === nowSlot,
        items: due.filter(r => (r.time_slot || 'anytime') === key),
      })).filter(g => g.items.length);
    }

    function RoutineCheckButton({ routine, state, value, onTap }) {
      const done = state === 'done', skipped = state === 'skipped';
      return (
        <button type="button" onClick={onTap} aria-label={`${routine.name} ${done ? '완료 취소' : '체크'}`}
          className={`shrink-0 w-9 h-9 rounded-full border-2 flex items-center justify-center text-xs font-bold transition active:scale-95 ${done ? 'bg-emerald-500 border-emerald-500 text-white' : skipped ? 'bg-gray-100 border-gray-200 text-gray-400' : 'bg-white border-emerald-300 text-emerald-600'}`}>
          {done ? '✓' : skipped ? '쉼' : routine.kind === 'count' ? `+${routine.step || 1}` : ''}
        </button>
      );
    }

    // 루틴 한 줄: 체크 버튼 + 이름 + 진행 + ⋯ 메뉴(건너뜀·직접 입력·메모·취소)
    function RoutineRow({ routine, check, state, faded, onTap, onSkipToggle, onSetValue, onSaveNote, onClear }) {
      const [menuOpen, setMenuOpen] = useState(false);
      const [noteDraft, setNoteDraft] = useState(check?.note || '');
      const [valueDraft, setValueDraft] = useState(String(check?.value || 0));
      useEffect(() => { setNoteDraft(check?.note || ''); setValueDraft(String(check?.value || 0)); }, [check?.note, check?.value]);
      const value = check?.value || 0;
      return (
        <div className={`rounded-2xl ${faded && state !== 'done' ? 'opacity-60' : ''}`} data-routine-row>
          <div className="flex items-center gap-3 py-1.5">
            <RoutineCheckButton routine={routine} state={state} value={value} onTap={onTap} />
            <div className="min-w-0 flex-1">
              <p className={`text-sm font-bold break-keep ${state === 'done' ? 'text-gray-400 line-through' : 'text-gray-800'}`}>
                <span className="mr-1">{routine.emoji}</span>{routine.name}
                {routine.time_of_day && <span className="ml-1.5 text-[11px] font-normal text-gray-400">{String(routine.time_of_day).slice(0, 5)}</span>}
              </p>
              {routine.kind === 'count' && (
                <div className="flex items-center gap-2 mt-1">
                  <div className="h-1.5 flex-1 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-emerald-400" style={{ width: `${Math.min(100, value / routine.target * 100)}%` }}></div>
                  </div>
                  <span className="text-[11px] text-gray-500 whitespace-nowrap">{value}/{routine.target}{routine.unit}</span>
                </div>
              )}
              {routine.motto && state !== 'done' && <p className="text-[11px] text-gray-400 mt-0.5 break-keep">“{routine.motto}”</p>}
              {check?.note && <p className="text-[11px] text-indigo-500 mt-0.5 break-keep">📝 {check.note}</p>}
              {routine.link_exercise && state === 'done' && !check && <p className="text-[11px] text-emerald-600 mt-0.5">운동 기록으로 자동 완료</p>}
            </div>
            <button type="button" onClick={() => setMenuOpen(!menuOpen)} aria-label={`${routine.name} 더보기`} className="shrink-0 w-8 h-8 rounded-lg text-gray-400 hover:bg-gray-50 font-bold">⋯</button>
          </div>
          {menuOpen && (
            <div className="ml-12 mb-2 bg-gray-50 rounded-xl p-2.5 space-y-2" data-routine-menu>
              <div className="flex flex-wrap gap-1.5">
                <button type="button" onClick={() => { onSkipToggle(); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-white border border-gray-200 text-gray-600">
                  {state === 'skipped' ? '건너뜀 취소' : '오늘은 건너뛰기(쉬는 날)'}
                </button>
                {(check || state === 'done') && (
                  <button type="button" onClick={() => { onClear(); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-white border border-gray-200 text-gray-600">체크 지우기</button>
                )}
              </div>
              {routine.kind === 'count' && (
                <div className="flex items-center gap-1.5">
                  <input type="number" min="0" inputMode="numeric" value={valueDraft} onChange={e => setValueDraft(e.target.value)}
                    className="w-20 text-sm bg-white border border-gray-200 rounded-lg px-2 py-1" aria-label="횟수 직접 입력" />
                  <span className="text-xs text-gray-500">{routine.unit}</span>
                  <button type="button" onClick={() => { onSetValue(Math.max(0, Math.floor(Number(valueDraft) || 0))); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-emerald-500 text-white">횟수 저장</button>
                </div>
              )}
              <div className="flex items-center gap-1.5">
                <input type="text" maxLength={300} value={noteDraft} onChange={e => setNoteDraft(e.target.value)} placeholder="메모 (선택)"
                  className="flex-1 min-w-0 text-sm bg-white border border-gray-200 rounded-lg px-2 py-1" aria-label="루틴 메모" />
                <button type="button" onClick={() => { onSaveNote(noteDraft.trim()); setMenuOpen(false); }} className="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-indigo-500 text-white">메모 저장</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 홈: 오늘의 루틴 카드
    function TodayRoutineCard({ routines, date, isToday, getCheck, isExerciseDay, actions, onOpenRoutineTab, onShiftDay }) {
      const [showDone, setShowDone] = useState(false);
      const active = (routines || []).filter(r => !r.archived_at);
      const nowSlot = currentRoutineSlot();
      const groups = buildTodayRoutineGroups(routines, date, isToday, nowSlot);
      const all = groups.flatMap(g => g.items);
      const stateOf = (r) => routineDayState(r, getCheck(r.id, date), isExerciseDay(date));
      const doneCount = all.filter(r => stateOf(r) === 'done').length;
      const skippedCount = all.filter(r => stateOf(r) === 'skipped').length;
      const finished = all.filter(r => ['done', 'skipped'].includes(stateOf(r)));
      return (
        <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100" data-today-routines>
          <div className="flex items-center justify-between gap-2 mb-2">
            <h2 className="font-bold text-gray-800">🌱 {isToday ? '오늘의' : '이 날의'} 루틴 {all.length > 0 && <span className="text-emerald-600">{doneCount}/{all.length - skippedCount}</span>}</h2>
            {onShiftDay ? (
              <div className="flex items-center gap-1 shrink-0" data-routine-day-nav>
                <button type="button" onClick={() => onShiftDay(-1)} aria-label="전날" className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 text-xs">◀</button>
                <span className="text-xs font-bold text-gray-600 whitespace-nowrap">{Number(date.slice(5, 7))}/{Number(date.slice(8))}({ROUTINE_WEEKDAYS[parseDate(date).getDay()]})</span>
                <button type="button" onClick={() => onShiftDay(1)} aria-label="다음날" className="w-7 h-7 rounded-lg bg-gray-100 text-gray-500 text-xs">▶</button>
              </div>
            ) : (
              <button type="button" onClick={onOpenRoutineTab} className="text-xs font-bold text-emerald-600 whitespace-nowrap">루틴 관리 →</button>
            )}
          </div>
          {active.length === 0 ? (
            <p className="bg-emerald-50 rounded-2xl p-3 text-sm text-emerald-800">아래 <b>+ 루틴 추가</b>로 첫 루틴을 만들어 보세요.</p>
          ) : all.length === 0 ? (
            <p className="text-sm text-gray-500 bg-gray-50 rounded-2xl p-3">이 날은 할 루틴이 없어요. 쉬는 날이에요 🌿</p>
          ) : (
            <div className="space-y-2">
              {all.length > 0 && finished.length === all.length && (
                <p className="text-sm font-bold text-emerald-700 bg-emerald-50 rounded-2xl p-3">🎉 {isToday ? '오늘' : '이 날'} 루틴을 모두 마쳤어요!</p>
              )}
              {groups.map(group => {
                const open = group.items.filter(r => !['done', 'skipped'].includes(stateOf(r)));
                if (!open.length) return null;
                return (
                  <div key={group.key}>
                    <p className={`text-[11px] font-bold mb-0.5 ${group.now ? 'text-emerald-600' : 'text-gray-400'}`}>
                      {group.label}{group.now ? ' · 지금' : group.past ? ' · 지난 시간대' : ''}
                    </p>
                    {open.map(r => (
                      <RoutineRow key={r.id} routine={r} check={getCheck(r.id, date)} state={stateOf(r)} faded={group.past}
                        onTap={() => actions.tap(r, date)} onSkipToggle={() => actions.toggleSkip(r, date)}
                        onSetValue={(v) => actions.setValue(r, date, v)} onSaveNote={(n) => actions.saveNote(r, date, n)} onClear={() => actions.clear(r, date)} />
                    ))}
                  </div>
                );
              })}
              {finished.length > 0 && (
                <div>
                  <button type="button" onClick={() => setShowDone(!showDone)} className="text-[11px] font-bold text-gray-400">
                    {showDone ? '마친 루틴 접기 ▲' : `마친 루틴 ${finished.length}개 보기 ▼`}
                  </button>
                  {showDone && finished.map(r => (
                    <RoutineRow key={r.id} routine={r} check={getCheck(r.id, date)} state={stateOf(r)} faded={false}
                      onTap={() => actions.tap(r, date)} onSkipToggle={() => actions.toggleSkip(r, date)}
                      onSetValue={(v) => actions.setValue(r, date, v)} onSaveNote={(n) => actions.saveNote(r, date, n)} onClear={() => actions.clear(r, date)} />
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ★ 홈: 한두 줄짜리 루틴 요약. 지금 할 것 3개까지 칩으로 바로 체크하고, 나머지는 루틴 탭에서.
    function HomeRoutineStrip({ routines, date, isToday, getCheck, isExerciseDay, onTap, onOpenRoutineTab }) {
      const active = (routines || []).filter(r => !r.archived_at);
      const all = buildTodayRoutineGroups(routines, date, isToday, currentRoutineSlot()).flatMap(g => g.items);
      const stateOf = (r) => routineDayState(r, getCheck(r.id, date), isExerciseDay(date));
      const counted = all.filter(r => stateOf(r) !== 'skipped');
      const done = counted.filter(r => stateOf(r) === 'done').length;
      const open = all.filter(r => !['done', 'skipped'].includes(stateOf(r)));
      const shown = open.slice(0, 3);
      const box = 'bg-white rounded-3xl px-4 py-3 shadow-sm border border-gray-100';
      if (!active.length) {
        return (
          <button type="button" onClick={onOpenRoutineTab} className={`${box} w-full text-left`} data-home-routines>
            <p className="text-sm text-gray-700"><b className="text-emerald-700">🌱 루틴</b> 꾸준히 하고 싶은 행동을 루틴으로 만들어 보세요 →</p>
            <p className="text-[11px] text-gray-400 mt-0.5">ⓘ 루틴을 쓰지 않으면 ⚙️ 설정에서 끌 수 있어요.</p>
          </button>
        );
      }
      if (!all.length || !open.length) {
        return (
          <button type="button" onClick={onOpenRoutineTab} className={`${box} w-full text-left text-sm font-bold text-gray-700`} data-home-routines>
            {!all.length ? '🌱 이 날은 할 루틴이 없어요 🌿' : <>🌱 {isToday ? '오늘' : '이 날'} 루틴 완료 🎉 <span className="text-emerald-600">{done}/{counted.length}</span></>} <span className="text-emerald-600">→</span>
          </button>
        );
      }
      return (
        <div className={box} data-home-routines>
          <div className="flex items-center gap-2">
            <span className="text-sm font-bold text-gray-800 whitespace-nowrap">🌱 루틴 <span className="text-emerald-600">{done}/{counted.length}</span></span>
            <div className="h-1.5 flex-1 bg-gray-100 rounded-full overflow-hidden">
              <div className="h-full bg-emerald-400" style={{ width: `${counted.length ? done / counted.length * 100 : 0}%` }}></div>
            </div>
            <button type="button" onClick={onOpenRoutineTab} aria-label="루틴 탭으로" className="text-xs font-bold text-emerald-600 whitespace-nowrap">전체 →</button>
          </div>
          <div className="flex flex-wrap gap-1.5 mt-2">
            {shown.map(r => {
              const check = getCheck(r.id, date);
              return (
                <button key={r.id} type="button" onClick={() => onTap(r, date)} aria-label={`${r.name} 체크`}
                  className="max-w-full flex items-center gap-1 text-xs font-bold px-2.5 py-1.5 rounded-full border border-emerald-200 bg-emerald-50 text-emerald-800 active:scale-95" data-home-routine-chip>
                  <span className="w-3.5 h-3.5 rounded-full border-2 border-emerald-400 bg-white shrink-0"></span>
                  <span className="truncate">{r.emoji} {r.name}</span>
                  {r.kind === 'count' && <span className="font-normal text-emerald-600 whitespace-nowrap">{check?.value || 0}/{r.target}</span>}
                </button>
              );
            })}
            {open.length > shown.length && (
              <button type="button" onClick={onOpenRoutineTab} className="text-xs font-bold px-2.5 py-1.5 rounded-full bg-gray-100 text-gray-500">+{open.length - shown.length}</button>
            )}
          </div>
        </div>
      );
    }

    const ROUTINE_EMOJIS = ['✅', '🧘', '📚', '💪', '🏃', '💧', '💊', '📝', '🙏', '🎯', '🛏️', '🧹', '🌱', '🎸'];

    function emptyRoutineDraft(today) {
      return { name: '', emoji: '✅', kind: 'check', target: 1, step: 1, unit: '', schedule_type: 'daily', weekdays: [], month_days: [], interval_days: 2, start_date: today, time_slot: 'anytime', time_of_day: '', motto: '', link_exercise: false };
    }

    // 루틴 추가·수정 창
    function RoutineForm({ initial, today, onSave, onCancel }) {
      const [d, setD] = useState(() => initial ? {
        ...emptyRoutineDraft(today), ...initial,
        weekdays: (initial.weekdays || []).map(Number), month_days: (initial.month_days || []).map(Number),
        interval_days: initial.interval_days || 2, time_of_day: initial.time_of_day ? String(initial.time_of_day).slice(0, 5) : '',
      } : emptyRoutineDraft(today));
      const [error, setError] = useState('');
      const [saving, setSaving] = useState(false);
      const set = (patch) => setD(prev => ({ ...prev, ...patch }));
      const toggleIn = (key, value) => setD(prev => ({ ...prev, [key]: prev[key].includes(value) ? prev[key].filter(x => x !== value) : [...prev[key], value] }));
      const chip = (active) => `text-xs font-bold px-2.5 py-1.5 rounded-lg border ${active ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-gray-200 text-gray-600'}`;
      const submit = async () => {
        const name = d.name.trim();
        if (!name) return setError('루틴 이름을 적어 주세요.');
        if (d.schedule_type === 'weekly' && !d.weekdays.length) return setError('요일을 하나 이상 골라 주세요.');
        if (d.schedule_type === 'monthly' && !d.month_days.length) return setError('날짜를 하나 이상 골라 주세요.');
        const interval = Math.floor(Number(d.interval_days));
        if (d.schedule_type === 'interval' && !(interval >= 2 && interval <= 365)) return setError('간격은 2~365일 사이로 적어 주세요.');
        const target = d.kind === 'count' ? Math.floor(Number(d.target)) : 1;
        const step = d.kind === 'count' ? Math.floor(Number(d.step)) : 1;
        if (d.kind === 'count' && !(target >= 1 && step >= 1)) return setError('목표와 한 번에 올릴 양은 1 이상이어야 해요.');
        if (!d.start_date) return setError('시작일을 골라 주세요.');
        setError(''); setSaving(true);
        const ok = await onSave({
          name: name.slice(0, 60), emoji: (d.emoji || '✅').slice(0, 8), kind: d.kind, target, step, unit: d.kind === 'count' ? d.unit.trim().slice(0, 10) : '',
          schedule_type: d.schedule_type,
          weekdays: d.schedule_type === 'weekly' ? [...d.weekdays].sort() : [],
          month_days: d.schedule_type === 'monthly' ? [...d.month_days].sort((a, b) => a - b) : [],
          interval_days: d.schedule_type === 'interval' ? interval : null,
          start_date: d.start_date, time_slot: d.time_slot, time_of_day: d.time_of_day || null,
          motto: d.motto.trim().slice(0, 100), link_exercise: !!d.link_exercise,
        });
        setSaving(false);
        if (ok === false) setError('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
      };
      return (
        <div className="fixed inset-0 z-[60] bg-black/40 flex items-end sm:items-center justify-center" data-routine-form>
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto space-y-4">
            <h3 className="font-bold text-lg text-gray-800">{initial ? '루틴 수정' : '새 루틴'}</h3>
            <div>
              <label className="text-xs font-bold text-gray-500">이름</label>
              <div className="flex gap-2 mt-1">
                <input value={d.emoji} onChange={e => set({ emoji: e.target.value })} maxLength={8} aria-label="이모지" className="w-12 text-center text-lg bg-gray-50 border border-gray-200 rounded-xl" />
                <input value={d.name} onChange={e => set({ name: e.target.value })} maxLength={60} placeholder="예: 명상 10분" className="flex-1 min-w-0 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm" />
              </div>
              <div className="flex flex-wrap gap-1 mt-2">
                {ROUTINE_EMOJIS.map(e => <button key={e} type="button" onClick={() => set({ emoji: e })} className={`w-8 h-8 rounded-lg text-base ${d.emoji === e ? 'bg-emerald-100' : 'bg-gray-50'}`}>{e}</button>)}
              </div>
            </div>
            <div>
              <label className="text-xs font-bold text-gray-500">종류</label>
              <div className="flex gap-2 mt-1">
                <button type="button" className={chip(d.kind === 'check')} onClick={() => set({ kind: 'check' })}>했다 / 안 했다</button>
                <button type="button" className={chip(d.kind === 'count')} onClick={() => set({ kind: 'count', target: d.target > 1 ? d.target : 10 })}>횟수·양</button>
              </div>
              {d.kind === 'count' && (
                <div className="grid grid-cols-3 gap-2 mt-2">
                  <label className="text-[11px] text-gray-500">목표<input type="number" min="1" inputMode="numeric" value={d.target} onChange={e => set({ target: e.target.value })} className="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" /></label>
                  <label className="text-[11px] text-gray-500">단위<input value={d.unit} maxLength={10} onChange={e => set({ unit: e.target.value })} placeholder="개, 쪽, 분" className="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" /></label>
                  <label className="text-[11px] text-gray-500">한 번 누를 때<input type="number" min="1" inputMode="numeric" value={d.step} onChange={e => set({ step: e.target.value })} className="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" /></label>
                </div>
              )}
            </div>
            <div>
              <label className="text-xs font-bold text-gray-500">반복</label>
              <div className="flex flex-wrap gap-2 mt-1">
                {[['daily', '매일'], ['weekly', '매주'], ['monthly', '매월'], ['interval', 'n일마다']].map(([k, label]) => (
                  <button key={k} type="button" className={chip(d.schedule_type === k)} onClick={() => set({ schedule_type: k })}>{label}</button>
                ))}
              </div>
              {d.schedule_type === 'weekly' && (
                <div className="flex gap-1 mt-2">
                  {[1, 2, 3, 4, 5, 6, 0].map(w => <button key={w} type="button" className={`flex-1 ${chip(d.weekdays.includes(w))}`} onClick={() => toggleIn('weekdays', w)}>{ROUTINE_WEEKDAYS[w]}</button>)}
                </div>
              )}
              {d.schedule_type === 'monthly' && (
                <div className="grid grid-cols-7 gap-1 mt-2">
                  {Array.from({ length: 31 }, (_, i) => i + 1).map(n => <button key={n} type="button" className={`text-xs font-bold py-1.5 rounded-lg border ${d.month_days.includes(n) ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-gray-200 text-gray-600'}`} onClick={() => toggleIn('month_days', n)}>{n}</button>)}
                  <p className="col-span-7 text-[11px] text-gray-400 mt-1">그 달에 없는 날짜(예: 2월 30일)는 그 달 마지막 날에 해요.</p>
                </div>
              )}
              {d.schedule_type === 'interval' && (
                <div className="flex items-center gap-2 mt-2 text-sm text-gray-600">
                  <input type="number" min="2" max="365" inputMode="numeric" value={d.interval_days} onChange={e => set({ interval_days: e.target.value })} className="w-20 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5" aria-label="며칠마다" />
                  <span>일마다 (시작일 기준)</span>
                </div>
              )}
              <label className="flex items-center gap-2 mt-2 text-xs text-gray-500">시작일
                <input type="date" value={d.start_date} onChange={e => set({ start_date: e.target.value })} className="bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 text-sm" />
              </label>
            </div>
            <div>
              <label className="text-xs font-bold text-gray-500">시간대</label>
              <div className="flex flex-wrap gap-1.5 mt-1">
                {ROUTINE_SLOTS.map(s => <button key={s.key} type="button" className={chip(d.time_slot === s.key)} onClick={() => set({ time_slot: s.key })}>{s.label}</button>)}
              </div>
              <label className="flex items-center gap-2 mt-2 text-xs text-gray-500">정확한 시간(선택)
                <input type="time" value={d.time_of_day} onChange={e => set({ time_of_day: e.target.value })} className="bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 text-sm" />
                {d.time_of_day && <button type="button" onClick={() => set({ time_of_day: '' })} className="text-[11px] text-gray-400">지우기</button>}
              </label>
            </div>
            <div>
              <label className="text-xs font-bold text-gray-500">다짐 한 줄 (선택)</label>
              <input value={d.motto} maxLength={100} onChange={e => set({ motto: e.target.value })} placeholder="예: 흔들리지 않는 하루를 위해" className="w-full mt-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm" />
            </div>
            <label className="flex items-center gap-2 text-sm text-gray-600">
              <input type="checkbox" checked={d.link_exercise} onChange={e => set({ link_exercise: e.target.checked })} />
              그날 운동을 기록하면 자동으로 완료
            </label>
            {error && <p className="text-sm text-red-500">{error}</p>}
            <div className="flex gap-2">
              <button type="button" onClick={onCancel} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold">취소</button>
              <button type="button" onClick={submit} disabled={saving} className="flex-1 py-3 rounded-xl bg-emerald-600 text-white font-bold disabled:opacity-60">{saving ? '저장 중...' : '저장'}</button>
            </div>
          </div>
        </div>
      );
    }

    const ROUTINE_DOT = { done: 'bg-emerald-500', skipped: 'bg-gray-300', missed: 'bg-red-200', today: 'bg-white border-2 border-emerald-400', future: 'bg-white border border-gray-300', none: 'bg-gray-100' };
    const ROUTINE_WEEK_LABELS = ['월', '화', '수', '목', '금', '토', '일'];

    // 루틴 상세: 한 달 달력 + 기록
    function RoutineDetail({ routine, today, getCheck, isExerciseDay, stats, onEdit, onArchiveToggle, onDelete, onClose }) {
      const [month, setMonth] = useState(today.slice(0, 7));
      const [confirmDelete, setConfirmDelete] = useState(false);
      const first = parseDate(month + '-01');
      const lastDay = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
      const lead = (first.getDay() + 6) % 7;
      const cells = [...Array(lead).fill(null), ...Array.from({ length: lastDay }, (_, i) => `${month}-${String(i + 1).padStart(2, '0')}`)];
      const shiftMonth = (n) => { const d = parseDate(month + '-01'); d.setMonth(d.getMonth() + n); setMonth(formatDate(d).slice(0, 7)); };
      const cellClass = (date) => {
        if (!isRoutineDue(routine, date)) return 'text-gray-300';
        const s = routineDayState(routine, getCheck(routine.id, date), isExerciseDay(date));
        if (s === 'done') return 'bg-emerald-500 text-white font-bold';
        if (s === 'skipped') return 'bg-gray-200 text-gray-500';
        if (date > today) return 'border border-emerald-200 text-gray-500';
        if (date === today) return 'border-2 border-emerald-400 text-emerald-700 font-bold';
        return 'bg-red-50 text-red-400';
      };
      return (
        <div className="fixed inset-0 z-[60] bg-black/40 flex items-end sm:items-center justify-center" data-routine-detail>
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto space-y-4">
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <h3 className="font-bold text-lg text-gray-800 break-keep">{routine.emoji} {routine.name}</h3>
                <p className="text-xs text-gray-500 mt-0.5">{describeRoutineSchedule(routine)} · {routineSlotLabel(routine.time_slot)}{routine.time_of_day ? ' ' + String(routine.time_of_day).slice(0, 5) : ''}{routine.kind === 'count' ? ` · 목표 ${routine.target}${routine.unit}` : ''}</p>
                {routine.motto && <p className="text-xs text-gray-400 mt-1">“{routine.motto}”</p>}
              </div>
              <button type="button" onClick={onClose} className="text-gray-400 text-xl font-bold px-2">✕</button>
            </div>
            <div className="grid grid-cols-4 gap-2 text-center">
              {[['🔥 연속', `${stats.current}일`], ['최고 연속', `${stats.best}일`], ['30일 달성', stats.score === null ? '-' : `${stats.score}%`], ['1년 완료', `${stats.totalDone}회`]].map(([k, v]) => (
                <div key={k} className="bg-gray-50 rounded-xl py-2"><p className="text-[10px] text-gray-500">{k}</p><p className="text-sm font-bold text-gray-800">{v}</p></div>
              ))}
            </div>
            <div>
              <div className="flex items-center justify-between mb-2">
                <button type="button" onClick={() => shiftMonth(-1)} className="px-3 py-1 text-gray-500 font-bold">◀</button>
                <p className="text-sm font-bold text-gray-700">{first.getFullYear()}년 {first.getMonth() + 1}월</p>
                <button type="button" onClick={() => shiftMonth(1)} className="px-3 py-1 text-gray-500 font-bold">▶</button>
              </div>
              <div className="grid grid-cols-7 gap-1 text-center text-[11px]" data-routine-calendar>
                {['월', '화', '수', '목', '금', '토', '일'].map(w => <p key={w} className="text-gray-400 font-bold">{w}</p>)}
                {cells.map((date, i) => date
                  ? <p key={date} className={`aspect-square flex items-center justify-center rounded-lg ${cellClass(date)}`}>{Number(date.slice(8))}</p>
                  : <p key={'b' + i}></p>)}
              </div>
              <p className="text-[10px] text-gray-400 mt-2">초록=완료 · 회색=건너뜀 · 분홍=못 한 날 · 흐린 숫자=할 날이 아님</p>
            </div>
            <div className="flex gap-2">
              <button type="button" onClick={onEdit} className="flex-1 py-2.5 rounded-xl bg-emerald-50 text-emerald-700 font-bold text-sm">수정</button>
              <button type="button" onClick={onArchiveToggle} className="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">{routine.archived_at ? '다시 쓰기' : '보관(숨기기)'}</button>
              {confirmDelete
                ? <button type="button" onClick={onDelete} className="flex-1 py-2.5 rounded-xl bg-red-500 text-white font-bold text-sm">정말 삭제</button>
                : <button type="button" onClick={() => setConfirmDelete(true)} className="flex-1 py-2.5 rounded-xl bg-red-50 text-red-500 font-bold text-sm">삭제</button>}
            </div>
            {confirmDelete && <p className="text-[11px] text-red-500">삭제하면 이 루틴의 체크 기록도 모두 지워져요. 기록을 남기려면 보관을 써 주세요.</p>}
          </div>
        </div>
      );
    }

    // 루틴 탭
    function RoutineTab({ routines, today, getCheck, isExerciseDay, actions, onSave, onArchiveToggle, onDelete, onMove, loading }) {
      const [formFor, setFormFor] = useState(null); // null | 'new' | routine
      const [viewDate, setViewDate] = useState(today);
      const [detailId, setDetailId] = useState(null);
      const [showArchived, setShowArchived] = useState(false);
      const [reorder, setReorder] = useState(false);
      const active = (routines || []).filter(r => !r.archived_at).sort(compareRoutines);
      const archived = (routines || []).filter(r => r.archived_at);
      const statsOf = (r) => computeRoutineStats(r, getCheck, isExerciseDay, today);
      const detail = (routines || []).find(r => r.id === detailId);
      const row = (r) => {
        const st = statsOf(r);
        return (
          <div key={r.id} className="bg-white rounded-2xl p-3 border border-gray-100 flex items-center gap-3" data-routine-list-item>
            <button type="button" onClick={() => setDetailId(r.id)} className="flex-1 min-w-0 text-left">
              <p className="text-sm font-bold text-gray-800 break-keep">{r.emoji} {r.name}</p>
              <p className="text-[11px] text-gray-400">{describeRoutineSchedule(r)} · {routineSlotLabel(r.time_slot)}{r.time_of_day ? ' ' + String(r.time_of_day).slice(0, 5) : ''}</p>
              <div className="flex flex-wrap items-center gap-x-1.5 gap-y-1 mt-1.5" data-routine-week>
                <span className="text-[10px] text-gray-400">이번 주</span>
                {st.week.map((x, i) => (
                  <span key={x.date} className="flex flex-col items-center gap-0.5">
                    <span className={`w-2.5 h-2.5 rounded-full ${ROUTINE_DOT[x.state]}`}></span>
                    <span className="text-[9px] leading-none text-gray-400">{ROUTINE_WEEK_LABELS[i]}</span>
                  </span>
                ))}
                <span className="text-[11px] font-bold text-gray-600 ml-1">
                  {st.weekDue ? `${st.weekDone}/${st.weekDue}` : st.nextDue ? `이번 주 없음 · 다음 ${Number(st.nextDue.slice(5, 7))}/${Number(st.nextDue.slice(8))}` : '이번 주 없음'}
                </span>
              </div>
              <div className="flex items-center gap-2 mt-1">
                {st.current > 0 && <span className="text-[11px] font-bold text-orange-500">🔥 {st.current}일 연속</span>}
                <span className="text-[11px] text-gray-500">{st.score === null ? '' : `최근 30일 ${st.score}%`}</span>
              </div>
            </button>
            {reorder && !r.archived_at && (
              <div className="flex flex-col gap-1 shrink-0">
                <button type="button" onClick={() => onMove(r, -1)} className="w-8 h-7 rounded-lg bg-gray-100 text-gray-500 text-xs">▲</button>
                <button type="button" onClick={() => onMove(r, 1)} className="w-8 h-7 rounded-lg bg-gray-100 text-gray-500 text-xs">▼</button>
              </div>
            )}
          </div>
        );
      };
      return (
        <div className="space-y-4 animate-fade-in" data-routine-tab>
          <TodayRoutineCard routines={routines} date={viewDate} isToday={viewDate === today} getCheck={getCheck} isExerciseDay={isExerciseDay} actions={actions}
            onShiftDay={(n) => { const d = parseDate(viewDate); d.setDate(d.getDate() + n); setViewDate(formatDate(d)); }} />
          <div className="flex items-center justify-between">
            <h3 className="font-bold text-gray-800">내 루틴 {active.length}개</h3>
            <div className="flex gap-2">
              {active.length > 1 && <button type="button" onClick={() => setReorder(!reorder)} className="text-xs font-bold px-3 py-2 rounded-xl bg-gray-100 text-gray-600">{reorder ? '순서 완료' : '순서 바꾸기'}</button>}
              <button type="button" onClick={() => setFormFor('new')} className="text-xs font-bold px-3 py-2 rounded-xl bg-emerald-600 text-white">+ 루틴 추가</button>
            </div>
          </div>
          {loading ? <p className="text-sm text-gray-400">불러오는 중...</p> : active.length === 0 ? (
            <div className="bg-emerald-50 rounded-2xl p-4 text-sm text-emerald-800 leading-relaxed">
              아직 루틴이 없어요. 명상, 공부, 운동, 마음다짐처럼 꾸준히 하고 싶은 행동을 추가해 보세요.
            </div>
          ) : <div className="space-y-2">{active.map(row)}</div>}
          {reorder && <p className="text-[11px] text-gray-400">같은 시간대 안에서, 정확한 시간을 적지 않은 루틴끼리의 순서가 바뀝니다.</p>}
          {archived.length > 0 && (
            <div>
              <button type="button" onClick={() => setShowArchived(!showArchived)} className="text-xs font-bold text-gray-400">{showArchived ? '보관한 루틴 접기 ▲' : `보관한 루틴 ${archived.length}개 ▼`}</button>
              {showArchived && <div className="space-y-2 mt-2 opacity-70">{archived.map(row)}</div>}
            </div>
          )}
          {formFor && (
            <RoutineForm initial={formFor === 'new' ? null : formFor} today={today}
              onCancel={() => setFormFor(null)}
              onSave={async (data) => { const ok = await onSave(formFor === 'new' ? null : formFor, data); if (ok !== false) setFormFor(null); return ok; }} />
          )}
          {detail && !formFor && (
            <RoutineDetail routine={detail} today={today} getCheck={getCheck} isExerciseDay={isExerciseDay} stats={statsOf(detail)}
              onClose={() => setDetailId(null)} onEdit={() => setFormFor(detail)}
              onArchiveToggle={async () => { await onArchiveToggle(detail); setDetailId(null); }}
              onDelete={async () => { await onDelete(detail); setDetailId(null); }} />
          )}
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(undefined); // undefined = 확인 중, null = 비로그인, 객체 = 로그인됨
      const [profile, setProfile] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      // 홈, 수치 중심의 현황, 해석 중심의 건강분석을 하단 메뉴에서 바로 구분한다.
      const [restoredView] = useState(takeSavedViewState);
      const [activeTab, setActiveTab] = useState(restoredView?.activeTab || 'home');
      const [currentDate, setCurrentDate] = useState(restoredView?.currentDate || formatDate(new Date()));
      const [activeRange, setActiveRange] = useState({ start: '', end: '', label: '' });

      const [logs, setLogs] = useState([]);
      const [mealStatuses, setMealStatuses] = useState({});
      const [mealStatusSaving, setMealStatusSaving] = useState(null);
      const [periodLogs, setPeriodLogs] = useState([]);
      const [periodGrades, setPeriodGrades] = useState([]); // ★ 일별 평가등급 추이 그래프용 (daily_reports)
      const [periodGoal, setPeriodGoal] = useState(null);
      const [periodGoalLoading, setPeriodGoalLoading] = useState(false);
      const [periodGoalSaving, setPeriodGoalSaving] = useState(false);
      const [isPeriodGoalOpen, setIsPeriodGoalOpen] = useState(false);
      const periodGoalPromptedRef = useRef(new Set());

      const [isFetching, setIsFetching] = useState(true);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [sysError, setSysError] = useState("");
      const [sysNotice, setSysNotice] = useState("");
      // ★ v0.3.10 최근 아침 기록 후보, 저장되지 않은 기록
      const [recentBreakfasts, setRecentBreakfasts] = useState([]);
      const [isRecentMealOpen, setIsRecentMealOpen] = useState(false);
      const [pendingEntry, setPendingEntry] = useState(null);

      const [reanalyzingId, setReanalyzingId] = useState(null);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [customCategory, setCustomCategory] = useState("");
      const [isCompressing, setIsCompressing] = useState(false);
      const [lightboxImage, setLightboxImage] = useState(null); // ★ 타임라인 사진을 탭해서 원본 크기로 볼 때 사용
      // ★ 저장 직후 사용자가 스크롤하지 않고 방금 받은 AI 피드백을 확인하는 팝업
      const [feedbackPopupLog, setFeedbackPopupLog] = useState(null);

      // ★ 사진/한줄기록 분석에 대한 후속 질문 (기록당 1회) — 어느 기록의 입력창이 열려있는지, 입력값, 제출 중 여부
      const [openFollowupId, setOpenFollowupId] = useState(restoredView?.openFollowupId || null);
      const [followupDraft, setFollowupDraft] = useState(restoredView?.followupDraft || '');
      const [submittingFollowupId, setSubmittingFollowupId] = useState(null);
      const [submittingPortionId, setSubmittingPortionId] = useState(null);
      const [editingPortionId, setEditingPortionId] = useState(null);

      // ★ 홈/통계 화면 좌우 스와이프로 전날·다음날(또는 전주·다음주/전월·다음월) 이동
      const touchStartRef = useRef(null);
      const SWIPE_MIN_DISTANCE = 60;
      const handleContentTouchStart = (e) => {
        // 사진 미리보기/그래프처럼 자체적으로 가로 스크롤되는 영역에서 시작된 터치는 날짜 스와이프로 취급하지 않음
        if (e.target.closest && e.target.closest('.overflow-x-auto')) { touchStartRef.current = null; return; }
        const t = e.touches[0];
        touchStartRef.current = { x: t.clientX, y: t.clientY };
      };
      const handleContentTouchEnd = (e) => {
        if (!touchStartRef.current) return;
        if ((activeTab === 'analysis' && analysisView === 'longterm') || activeTab === 'routine') { touchStartRef.current = null; return; }
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartRef.current.x;
        const dy = t.clientY - touchStartRef.current.y;
        touchStartRef.current = null;
        if (Math.abs(dx) < SWIPE_MIN_DISTANCE) return; // 너무 짧은 움직임은 무시
        if (Math.abs(dx) < Math.abs(dy) * 1.5) return; // 세로 스크롤과 헷갈리는 대각선 움직임은 무시
        if (dx < 0) changeDate(1); // 왼쪽으로 스와이프 -> 다음날/다음주/다음달
        else changeDate(-1); // 오른쪽으로 스와이프 -> 전날/전주/전달
      };

      // ★ AI 호출 취소/지연 안내용 — 진행 중인 fetch를 중단할 수 있는 컨트롤러와, 로딩이 시작된 이후 경과 초
      const abortControllerRef = useRef(null);
      const [loadingElapsed, setLoadingElapsed] = useState(0);

      const [statsMode, setStatsMode] = useState(restoredView?.statsMode || 'week');
      // ★ v0.3.8 건강분석 안의 탭: period(기간 분석) / longterm(장기 분석). 마지막 선택을 기억한다.
      const [analysisView, setAnalysisView] = useState(() => {
        try { return localStorage.getItem('analysisView') === 'longterm' ? 'longterm' : 'period'; } catch { return 'period'; }
      });
      useEffect(() => {
        try { localStorage.setItem('analysisView', analysisView); } catch { /* 저장 안 돼도 동작에는 문제 없음 */ }
      }, [analysisView]);
      const isLongTermView = activeTab === 'analysis' && analysisView === 'longterm';
      // 장기 분석과 루틴 탭에는 날짜·주간/월간 선택이 없다.
      const hidesDateNav = isLongTermView || activeTab === 'routine';
      // ★ 루틴 기능 사용(계정 설정, 기본 켜짐). 끄면 홈 루틴 칸과 루틴 탭이 사라진다.
      const showRoutines = profile?.showRoutines !== false;
      const [showRoutineHelp, setShowRoutineHelp] = useState(false);
      const PAGE_TITLES = {
        home: { icon: '📋', label: '하루 기록', circle: 'bg-blue-100' },
        routine: { icon: '🌱', label: '루틴', circle: 'bg-emerald-100' },
        status: { icon: '📊', label: '건강 현황', circle: 'bg-sky-100' },
        analysis: { icon: '🧭', label: '건강분석', circle: 'bg-indigo-100' },
      };
      const pageTitle = PAGE_TITLES[activeTab] || PAGE_TITLES.home;
      useEffect(() => {
        if (profile && !showRoutines && activeTab === 'routine') setActiveTab('home');
      }, [profile, showRoutines, activeTab]);
      const [openTagGroup, setOpenTagGroup] = useState(null);
      const [showAllTagGroups, setShowAllTagGroups] = useState(false);
      const [aiReport, setAiReport] = useState("");
      const [isGeneratingReport, setIsGeneratingReport] = useState(false);

      const [dailyReport, setDailyReport] = useState(null);
      const [isGeneratingDaily, setIsGeneratingDaily] = useState(false);

      // ★ v0.3.6 현황 화면의 부위별 운동 균형 카드
      const [exerciseBalance, setExerciseBalance] = useState(null);
      const [unclassifiedExerciseCount, setUnclassifiedExerciseCount] = useState(0);
      const [isClassifyingExercises, setIsClassifyingExercises] = useState(false);

      // ★ 설정에 적은 기저질환마다 최근 60일 생활습관 분석 이력을 별도로 보관
      const [conditionReports, setConditionReports] = useState([]);
      const [selectedCondition, setSelectedCondition] = useState('');
      const [isGeneratingConditionReport, setIsGeneratingConditionReport] = useState(false);
      // ★ v0.3.9 장기 분석 탭의 습관 분석(하루 1회)
      const [habitReport, setHabitReport] = useState(null);
      const [habitRecordCount, setHabitRecordCount] = useState(null);
      const [isGeneratingHabit, setIsGeneratingHabit] = useState(false);
      const [showHabitDetail, setShowHabitDetail] = useState(false);
      // ★ v0.3.11 장기 분석 질문. 키는 "habit:<분석 id>" / "condition:<분석 id>"
      const [longTermFollowups, setLongTermFollowups] = useState({});
      const [longTermDrafts, setLongTermDrafts] = useState(restoredView?.longTermDrafts || {});
      // ★ v0.3.12 AI 일시 오류 안내 { message, retry }
      const [aiBusy, setAiBusy] = useState(null);
      const [showAiDetail, setShowAiDetail] = useState(false);
      const [askingLongTermKey, setAskingLongTermKey] = useState(null);
      const conditionLabels = parseProfileConditions(profile?.disease || '');

      const [authMode, setAuthMode] = useState('login');
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [accountError, setAccountError] = useState('');
      const [accountSaving, setAccountSaving] = useState(false);
      const [isExporting, setIsExporting] = useState(false);

      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [memberList, setMemberList] = useState([]);
      const [isLoadingMembers, setIsLoadingMembers] = useState(false);
      const [memberActionId, setMemberActionId] = useState(null);
      const [deleteMemberConfirmId, setDeleteMemberConfirmId] = useState(null);

      const [draft, setDraft] = useState({
        isOpen: false, isEditMode: false, editLogId: null, editDate: '', editTime: '',
        type: '', data: [], naturalText: '', memo: '', category: '점심식사', isCamera: false,
        entrySource: 'general', timeAutoMessage: '', timeConfirmed: false,
        bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '', existingFoodName: '', existingIngredients: []
      });

      // ★ 자주 먹는 음식 (최근 30일 기록 기준 빈도순, 입력창 위 칩으로 표시)
      const [frequentFoods, setFrequentFoods] = useState([]);

      // ★ 목표 달성 현황용 가장 최근 생체 수치
      const [latestBiometrics, setLatestBiometrics] = useState(null);
      const naturalTextRef = useRef(null);

      const wakeLockRef = useRef(null);

      useEffect(() => {
        if (draft.isOpen || feedbackPopupLog || isPeriodGoalOpen) document.body.style.overflow = 'hidden';
        else document.body.style.overflow = 'unset';
        return () => { document.body.style.overflow = 'unset'; };
      }, [draft.isOpen, feedbackPopupLog, isPeriodGoalOpen]);

      const handleInputBlur = () => {
        setTimeout(() => window.scrollTo(window.scrollX, window.scrollY), 10);
      };

      useEffect(() => {
        const requestWakeLock = async () => {
          try { if ('wakeLock' in navigator) wakeLockRef.current = await navigator.wakeLock.request('screen'); }
          catch (err) { }
        };
        const releaseWakeLock = async () => {
          if (wakeLockRef.current !== null) { await wakeLockRef.current.release(); wakeLockRef.current = null; }
        };
        if (isAnalyzing || reanalyzingId || isGeneratingReport || isGeneratingDaily || isGeneratingConditionReport || isGeneratingHabit || isCompressing) requestWakeLock();
