                  {habitReport.report_date} 분석 · 기록 {habitReport.record_count}건 · {habitReport.window_start} ~ {habitReport.window_end}
                </p>
                <p className="text-sm text-gray-700 leading-relaxed break-keep">{report.summary}</p>
                {report.goodHabits?.length > 0 && (
                  <div className="space-y-2">
                    <p className="text-xs font-bold text-emerald-700">자리 잡은 좋은 습관</p>
                    {report.goodHabits.map(item => renderHabit(item, true))}
                  </div>
                )}
                {report.badHabits?.length > 0 && (
                  <div className="space-y-2">
                    <p className="text-xs font-bold text-amber-800">계속되는 주의 습관</p>
                    {report.badHabits.map(item => renderHabit(item, false))}
                  </div>
                )}
                {report.advice?.length > 0 && (
                  <div className="bg-indigo-50 rounded-2xl p-3 space-y-1">
                    {report.advice.map((a, i) => <p key={i} className="text-xs text-indigo-900 leading-snug break-keep">💡 {a}</p>)}
                  </div>
                )}
                <p className="text-[10px] text-gray-400">* 표시는 그 달의 일부 기간만 포함된 숫자예요.</p>

                <button type="button" onClick={() => setShowHabitDetail(!showHabitDetail)} className="text-xs font-bold text-gray-500">
                  {showHabitDetail ? '월별 지표 접기 ▲' : '월별 지표 자세히 보기 ▼'}
                </button>
                {showHabitDetail && (
                  <div className="overflow-x-auto -mx-1" data-habit-detail>
                    <table className="text-[11px] text-gray-600 min-w-full">
                      <thead>
                        <tr className="text-gray-400">
                          <th className="text-left font-bold py-1 pr-2 whitespace-nowrap">지표</th>
                          {detailMonths.map(m => <th key={m.month} className="font-bold py-1 px-1.5 whitespace-nowrap">{Number(m.month.slice(5))}월{m.partial ? '*' : ''}</th>)}
                        </tr>
                      </thead>
                      <tbody>
                        <tr className="border-t border-gray-100">
                          <td className="py-1 pr-2 whitespace-nowrap">기록한 날</td>
                          {detailMonths.map(m => <td key={m.month} className="py-1 px-1.5 text-center">{m.recordedDays}</td>)}
                        </tr>
                        {detailKeys.map(key => (
                          <tr key={key} className="border-t border-gray-100">
                            <td className="py-1 pr-2 whitespace-nowrap">{snapshot.metrics[key].label}</td>
                            {detailMonths.map(m => {
                              const v = m.values?.[key];
                              return <td key={m.month} className="py-1 px-1.5 text-center">{v === null || v === undefined ? '-' : v}</td>;
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
                {renderLongTermQuestions('habit', habitReport.id, '예: 야식을 줄이려면 뭐부터 하면 좋을까요?')}
              </div>
            ) : (
              <div className="bg-gray-50 rounded-2xl p-4 text-sm text-gray-500 leading-relaxed">
                {notEnough
                  ? `기록이 30건 이상 쌓이면 분석할 수 있어요. (현재 ${habitRecordCount}건)`
                  : '아직 습관 분석을 하지 않았어요. 아래 버튼을 누르면 전체 기록을 분석해요.'}
              </div>

                    <label className="text-sm font-bold text-gray-600 mb-2 block">무엇을 하셨나요?</label>
                    <div className="flex flex-wrap gap-2">
                      {defaultCategories.filter(c => c !== '생체기록').map(cat => (
                        <button type="button" key={cat} onClick={() => setDraft({...draft, category: cat, timeConfirmed: false})} className={`px-4 py-2 rounded-full text-sm font-bold transition ${draft.category === cat ? (cat === '운동' ? 'bg-green-500 text-white' : 'bg-blue-600 text-white') : 'bg-gray-100 text-gray-600'}`}>
                          {cat === '운동' ? '🏃‍♂️ ' : ''}{cat}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {draft.type === 'biometrics' && (
                  <div className="mb-6 space-y-4">
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">수축기 (최고혈압)</label>
                        <input type="number" placeholder="예: 120" value={draft.bp_sys} onChange={e => setDraft({...draft, bp_sys: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-red-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">이완기 (최저혈압)</label>
                        <input type="number" placeholder="예: 80" value={draft.bp_dia} onChange={e => setDraft({...draft, bp_dia: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 text-base" />
                      </div>
                    </div>
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">맥박 (bpm)</label>
                        <input type="number" placeholder="예: 70" value={draft.pulse} onChange={e => setDraft({...draft, pulse: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-pink-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">공복 혈당 (mg/dL)</label>
                        <input type="number" placeholder="예: 95" value={draft.sugar} onChange={e => setDraft({...draft, sugar: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-green-500 text-base" />
                      </div>
                    </div>
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">체중 (kg)</label>
                        <input type="number" step="0.1" placeholder="예: 68.5" value={draft.weight} onChange={e => setDraft({...draft, weight: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-purple-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">수면 시간 (시간)</label>
                        <input type="number" step="0.5" placeholder="예: 7" value={draft.sleep_hours} onChange={e => setDraft({...draft, sleep_hours: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-indigo-500 text-base" />
                      </div>
                    </div>
                  </div>
                )}

                {draft.type === 'image' && draft.data && draft.data.length > 0 && (
                  <div className="mb-5">
                    <div className="flex gap-2 mb-3 overflow-x-auto no-scrollbar">
                      {draft.data.map((src, i) => (
                        <img key={i} src={src} onClick={() => setLightboxImage(src)} className="w-32 h-32 object-cover rounded-2xl bg-gray-100 shrink-0 border border-gray-200 cursor-pointer active:opacity-80 transition" />
                      ))}
                    </div>
                    <input type="text" placeholder={draft.category === '운동' ? "추가 메모 (예: 스쿼트 50개 추가함)" : "추가 메모 (예: 밥은 반 공기만 먹음)"} value={draft.memo} onChange={e => setDraft({...draft, memo: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 outline-none focus:border-blue-500 text-sm" />
                  </div>
                )}

                {draft.type === 'text' && (
                  <div className="mb-5">
                    {draft.category !== '운동' && frequentFoods.length > 0 && (
                      <div className="mb-2.5">
                        <label className="text-xs font-bold text-gray-400 mb-1.5 block">🍽️ 자주 먹는 음식 (탭해서 추가, 양은 직접 입력)</label>
                        <div className="flex flex-wrap justify-center gap-1.5">
                          {frequentFoods.map(name => (
                            <button type="button" key={name} onClick={() => insertFrequentFood(name)}
                              className="shrink-0 whitespace-nowrap px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-600 border border-blue-100 hover:bg-blue-100 active:scale-95 transition">
                              {name}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                    <textarea
                      ref={naturalTextRef}
                      placeholder={draft.category === '운동' ? "예: 런닝머신 30분 뛰었어" : "예: 아침으로 사과 반 개 먹었어"}
                      value={draft.naturalText} onChange={e => setDraft({...draft, naturalText: e.target.value})} onBlur={handleInputBlur}
                      onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleUploadConfirm(); } }}
                      className="w-full bg-gray-50 border border-gray-200 p-4 rounded-2xl outline-none focus:border-blue-500 h-24 resize-none text-base leading-relaxed"
                    />
                  </div>
                )}

                <div className="flex gap-3">
                  <button type="button" onClick={() => { setDraft({isOpen: false}); nudgeViewportRepaint(); }} className="flex-1 py-4 rounded-xl font-bold bg-gray-100 text-gray-600">취소</button>
                  <button type="submit" className={`flex-1 py-4 rounded-xl font-bold text-white shadow-md ${draft.type === 'biometrics' ? 'bg-red-500' : (draft.category === '운동' ? 'bg-green-500' : 'bg-blue-600')}`}>
                    {draft.isEditMode ? '수정 및 코칭받기 🔄' : '기록 및 코칭받기 🚀'}
                  </button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
