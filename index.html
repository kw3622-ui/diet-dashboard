        else releaseWakeLock();
      }, [isAnalyzing, reanalyzingId, isGeneratingReport, isGeneratingDaily, isGeneratingConditionReport, isGeneratingHabit, isCompressing]);

      // ★ AI 응답 대기 시간 카운트 — 30초 넘게 걸리면 로딩 화면에 "계속 기다리기/취소" 안내를 띄우기 위함
      useEffect(() => {
        const isAiLoading = isAnalyzing || !!reanalyzingId || isGeneratingReport || isGeneratingDaily || isGeneratingConditionReport || isGeneratingHabit;
        if (!isAiLoading) { setLoadingElapsed(0); return; }
        setLoadingElapsed(0);
        const timer = setInterval(() => setLoadingElapsed(prev => prev + 1), 1000);
        return () => clearInterval(timer);
      }, [isAnalyzing, reanalyzingId, isGeneratingReport, isGeneratingDaily, isGeneratingConditionReport, isGeneratingHabit]);

      // ★ 로그인 세션 확인 + 유지 (한 번 로그인하면 계속 로그인 상태 유지)
      useEffect(() => {
        sb.auth.getSession().then(({ data }) => setSession(data.session));
        const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
        return () => sub.subscription.unsubscribe();
      }, []);

      // ★ 세션이 있으면 profiles 테이블에서 내 프로필 로드 (기존 localStorage 'dietProfile' 대체)
      useEffect(() => {
        if (!session) { setProfile(null); return; }
        withAuthRetry(() => sb.from('profiles').select('*').eq('id', session.user.id).single()).then(({ data, error }) => {
          if (!error && data) {
            setProfile({
              username: data.username, height: data.height, weight: data.weight, age: data.age,
              gender: data.gender, disease: data.disease || '', aiMode: data.ai_mode || 'normal',
              isApproved: !!data.is_approved, isAdmin: !!data.is_admin,
              goalExerciseWeekly: data.goal_exercise_weekly, goalAlcoholFreeWeekly: data.goal_alcohol_free_weekly,
              goalWeightKg: data.goal_weight_kg, goalBpSysMax: data.goal_bp_sys_max, goalBpDiaMax: data.goal_bp_dia_max,
              goalSugarMax: data.goal_sugar_max,
              showRoutines: data.show_routines !== false
            });
          }
        });
      }, [session]);

      // ★ 자주 먹는 음식 계산 (최근 30일, 운동/생체기록 제외, 빈도순 상위 20개)
      // food_name은 AI가 매번 새로 지어내는 "메인 타이틀"이라 그대로 쓰면 안 되고,
      // 실제 개별 음식명은 ingredients 배열에 "음식명(재료들)" 형태로 들어있어 그 앞부분만 추출한다.
      const fetchFrequentFoods = async () => {
        const since = new Date(); since.setDate(since.getDate() - 30);
        const { data, error } = await sb.from('logs').select('ingredients, category').gte('log_date', formatDate(since));
        if (error || !data) return;
        const counts = {};
        data.forEach(row => {
          if (row.category === '운동' || row.category === '생체기록') return;
          (row.ingredients || []).forEach(item => {
            const raw = String(item || '');
            const name = (raw.includes('(') ? raw.slice(0, raw.indexOf('(')) : raw).trim();
            if (!name) return;
            counts[name] = (counts[name] || 0) + 1;
          });
        });
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([name]) => name);
        setFrequentFoods(sorted);
      };

      useEffect(() => {
        if (!session) { setFrequentFoods([]); return; }
        fetchFrequentFoods();
      }, [session]);

      // ★ 목표 달성 현황 계산용 데이터 (가장 최근 생체 수치)
      const fetchGoalStats = async () => {
        const rows = [];
        for (let offset = 0; offset < 100000; offset += 1000) {
          const { data, error } = await sb.from('logs').select('log_date, log_time, raw_input')
            .eq('category', '생체기록').order('log_date', { ascending: false }).order('log_time', { ascending: false })
            .range(offset, offset + 999);
          if (error || !data?.length) break;
          rows.push(...data);
          const latest = buildLatestBiometrics(rows);
          if (['bp_sys', 'bp_dia', 'sugar', 'weight'].every(field => latest?.[field] !== undefined) || data.length < 1000) break;
        }
        setLatestBiometrics(buildLatestBiometrics(rows));
      };

      useEffect(() => {
        if (!session) { setLatestBiometrics(null); return; }
        fetchGoalStats();
      }, [session]);

      // ★ 자주 먹는 음식 칩을 탭하면 입력창 끝에 이름만 삽입 (수량은 직접 이어서 입력)
      const insertFrequentFood = (name) => {
        setDraft(prev => {
          const trimmed = (prev.naturalText || '').trimEnd();
          const needsComma = trimmed.length > 0;
          const next = needsComma ? `${trimmed}, ${name} ` : `${name} `;
          return { ...prev, naturalText: next };
        });
        setTimeout(() => {
          if (naturalTextRef.current) {
            naturalTextRef.current.focus();
            const len = naturalTextRef.current.value.length;
            naturalTextRef.current.setSelectionRange(len, len);
          }
        }, 0);
      };

      useEffect(() => {
        if (!session) return;
        if (activeTab === 'home') {
          fetchLogs(currentDate);
        } else if (activeTab !== 'routine') {
          const range = statsMode === 'week' ? getWeekRange(currentDate) : getMonthRange(currentDate);
          setActiveRange(range);
          fetchPeriodLogs(range.start, range.end);
          fetchPeriodGoal(range, statsMode, activeTab === 'status');
          if (activeTab === 'status') fetchExerciseBalance(range.end);
        }
      }, [currentDate, activeTab, session, statsMode]);

      // ★ 운동 부위 균형: 선택한 기간의 마지막 날(오늘 이후면 오늘)을 기준으로 계산한다.
      // 세부 부위는 전체 기록을 보므로 기준일까지의 운동 기록을 모두 불러온다.
      const fetchExerciseBalance = async (rangeEnd) => {
        const today = formatDate(new Date());
        const referenceDate = rangeEnd && rangeEnd < today ? rangeEnd : today;
        const rows = [];
        for (let offset = 0; offset < 20000; offset += 1000) {
          const { data, error } = await withAuthRetry(() => sb.from('logs').select('log_date, exercise_meta')
            .eq('category', '운동').lte('log_date', referenceDate).not('exercise_meta', 'is', null)
            .order('log_date', { ascending: true }).range(offset, offset + 999));
          if (error) { setExerciseBalance(null); return; } // 보조 카드라 실패해도 화면 전체를 새로고침하지 않는다
          rows.push(...(data || []));
          if (!data || data.length < 1000) break;
        }
        const { count } = await sb.from('logs').select('id', { count: 'exact', head: true })
          .eq('category', '운동').is('exercise_meta', null);
        setUnclassifiedExerciseCount(count || 0);
        setExerciseBalance(computeExerciseBalance(rows, referenceDate));
      };

      // ★ 예전 운동 기록 분류: 서버가 40건씩 처리하므로 남은 기록이 없을 때까지 반복한다.
      const handleClassifyExercises = async () => {
        if (isClassifyingExercises) return;
        setIsClassifyingExercises(true);
        try {
          for (let round = 0; round < 25; round++) {
            const res = await callAI('classifyExercises', {});
            setUnclassifiedExerciseCount(res.remaining || 0);
            if (!res.remaining || !res.processed) break;
          }
          await fetchExerciseBalance(activeRange.end);
        } catch (err) {
          handleAiFailure(err, handleClassifyExercises);
        } finally {
          setIsClassifyingExercises(false);
        }
      };

      const fetchHabitReport = async () => {
        if (!session) return;
        const [latest, count] = await Promise.all([
          withAuthRetry(() => sb.from('habit_reports').select('*').order('created_at', { ascending: false }).limit(1)),
          withAuthRetry(() => sb.from('logs').select('id', { count: 'exact', head: true })),
        ]);
        if (latest.error) { setHabitReport(null); return; } // 카드만 비우고 페이지는 그대로 둔다
        setHabitReport((latest.data || [])[0] || null);
        setHabitRecordCount(count.error ? null : count.count);
      };

      useEffect(() => {
        if (session && activeTab === 'analysis' && analysisView === 'longterm') fetchHabitReport();
      }, [session, activeTab, analysisView]);

      const handleGenerateHabitReport = () => {
        if (isGeneratingHabit) return;
        setIsGeneratingHabit(true);
        const controller = new AbortController();
        abortControllerRef.current = controller;
        const timeoutId = setTimeout(() => {
          controller.abort();
          setIsGeneratingHabit(false);
          showAiBusy(AI_SLOW_MESSAGE, AI_SLOW_DETAIL, handleGenerateHabitReport);
        }, 90000);
        (async () => {
          try {
            const res = await callAI('habitReport', {}, controller.signal);
            clearTimeout(timeoutId);
            setHabitReport(res);
            setShowHabitDetail(false);
          } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') return;
            // 하루 1회 제한·기록 부족은 예상된 안내라 새로고침하지 않는다.
            if (/하루 1회|건 이상 쌓이면/.test(err.message || '')) showNotice(err.message);
            else handleAiFailure(err, handleGenerateHabitReport);
          } finally {
            setIsGeneratingHabit(false);
          }
        })();
      };

      const fetchConditionReports = async () => {
        if (!session) return;
        const { data, error } = await withAuthRetry(() =>
          sb.from('condition_reports').select('*').order('created_at', { ascending: false }).limit(50)
        );
        if (error) return reportFatalError(error);
        setConditionReports((data || []).map(mapConditionReport));
      };

      useEffect(() => {
        if (!conditionLabels.length) {
          setSelectedCondition('');
          setConditionReports([]);
          return;
        }
        if (!conditionLabels.includes(selectedCondition)) setSelectedCondition(conditionLabels[0]);
        if (session && activeTab === 'analysis' && analysisView === 'longterm') fetchConditionReports();
      }, [session, activeTab, analysisView, profile?.disease]);

      const fetchMealStatuses = async (date) => {
        const { data, error } = await withAuthRetry(() =>
          sb.from('meal_statuses').select('meal_slot, status').eq('status_date', date)
        );
        if (error) throw error;
        setMealStatuses(Object.fromEntries((data || []).map(row => [row.meal_slot, row.status])));
      };

      const fetchLogs = async (date) => {
        setIsFetching(true); setDailyReport(null);
        setMealStatuses({});
        const [{ data, error }, statusResult] = await Promise.all([
          withAuthRetry(() => sb.from('logs').select('*, food_health_tags(food_index,food_name,tag_key,tag_label,disease_key,polarity,confidence,evidence)').eq('log_date', date).order('log_time', { ascending: false })),
          fetchMealStatuses(date).then(() => null).catch(error => error),
        ]);
        if (error) reportFatalError(error); else setLogs((data || []).map(mapLogRow));
        if (statusResult) reportFatalError(statusResult);
        setIsFetching(false);
        const { data: dr } = await sb.from('daily_reports').select('*').eq('report_date', date).maybeSingle();
        if (dr) setDailyReport({ grade: dr.grade, comment: dr.comment });
      };

      const toggleMealSkipped = async (slotKey) => {
        if (!session || mealStatusSaving) return;
        const previous = { ...mealStatuses };
        const shouldClear = mealStatuses[slotKey] === 'skipped';
        setMealStatusSaving(slotKey);
        setMealStatuses(current => {
          const next = { ...current };
          if (shouldClear) delete next[slotKey]; else next[slotKey] = 'skipped';
          return next;
        });
        try {
          const query = shouldClear
            ? sb.from('meal_statuses').delete().eq('user_id', session.user.id).eq('status_date', currentDate).eq('meal_slot', slotKey)
            : sb.from('meal_statuses').upsert({
                user_id: session.user.id, status_date: currentDate, meal_slot: slotKey,
                status: 'skipped', confirmed_at: new Date().toISOString(), updated_at: new Date().toISOString(),
              }, { onConflict: 'user_id,status_date,meal_slot' });
          const { error } = await query;
          if (error) throw error;
          showNotice(shouldClear ? '미기록 상태로 되돌렸습니다.' : '안 먹음으로 기록했습니다.');
        } catch (error) {
          setMealStatuses(previous);
          reportFatalError(error);
        } finally {
          setMealStatusSaving(null);
        }
      };

      const clearMealStatusForCategory = async (category, date) => {
        const slotKey = mealSlotByCategory[category];
        if (!slotKey || !session) return;
        const { error } = await sb.from('meal_statuses').delete()
          .eq('user_id', session.user.id).eq('status_date', date).eq('meal_slot', slotKey);
        if (error) throw error;
        if (date === currentDate) setMealStatuses(current => {
          const next = { ...current }; delete next[slotKey]; return next;
        });
      };

      const fetchPeriodLogs = async (startStr, endStr) => {
        setIsFetching(true); setAiReport("");
        const { data, error } = await withAuthRetry(() =>
          sb.from('logs').select('*, food_health_tags(food_index,food_name,tag_key,tag_label,disease_key,polarity,confidence,evidence)').gte('log_date', startStr).lte('log_date', endStr).order('log_date', { ascending: false }).order('log_time', { ascending: false })
        );
        if (error) reportFatalError(error); else setPeriodLogs((data || []).map(mapLogRow));
        setIsFetching(false);
        const { data: pr } = await sb.from('period_reports').select('*').eq('period_start', startStr).eq('is_month', statsMode === 'month').maybeSingle();
        if (pr) setAiReport(pr.report_text);
        const { data: grades } = await sb.from('daily_reports').select('report_date, grade').gte('report_date', startStr).lte('report_date', endStr).order('report_date', { ascending: true });
        setPeriodGrades(grades || []);
      };

      const fetchPeriodGoal = async (range, mode, shouldPrompt = false) => {
        if (!session || !range?.start) return;
        setPeriodGoalLoading(true);
        const { data, error } = await withAuthRetry(() => sb.from('period_goals').select('*')
          .eq('period_type', mode).eq('period_start', range.start).maybeSingle());
        if (error) {
          reportFatalError(error);
          setPeriodGoal(null);
        } else {
          setPeriodGoal(data || null);
          const key = `${mode}:${range.start}`;
          const today = formatDate(new Date());
          const isCurrentPeriod = today >= range.start && today <= range.end;
          if (shouldPrompt && !data && isCurrentPeriod && !periodGoalPromptedRef.current.has(key)) {
            periodGoalPromptedRef.current.add(key);
            setIsPeriodGoalOpen(true);
          }
        }
        setPeriodGoalLoading(false);
      };

      const periodGoalDefaults = () => {
        const days = activeRange.start && activeRange.end
          ? Math.round((parseDate(activeRange.end) - parseDate(activeRange.start)) / 86400000) + 1 : 7;
        const monthlyFactor = statsMode === 'month' ? days / 7 : 1;
        return {
          exercise_target: profile?.goalExerciseWeekly ? Math.round(profile.goalExerciseWeekly * monthlyFactor) : '',
          alcohol_free_target: profile?.goalAlcoholFreeWeekly ? Math.min(days, Math.round(profile.goalAlcoholFreeWeekly * monthlyFactor)) : '',
          weight_target: profile?.goalWeightKg || '',
          bp_sys_target: profile?.goalBpSysMax || '',
          bp_dia_target: profile?.goalBpDiaMax || '',
          sugar_target: profile?.goalSugarMax || '',
        };
      };

      const savePeriodGoal = async (event) => {
        event.preventDefault();
        if (!session || periodGoalSaving) return;
        const form = new FormData(event.currentTarget);
        const numberOrNull = (name) => {
          const value = String(form.get(name) || '').trim();
          return value === '' ? null : Number(value);
        };
        const payload = {
          user_id: session.user.id, period_type: statsMode, period_start: activeRange.start,
          period_end: activeRange.end, status: 'active',
          exercise_target: numberOrNull('exerciseTarget'),
          alcohol_free_target: numberOrNull('alcoholFreeTarget'),
          weight_target: numberOrNull('weightTarget'),
          bp_sys_target: numberOrNull('bpSysTarget'),
          bp_dia_target: numberOrNull('bpDiaTarget'),
          sugar_target: numberOrNull('sugarTarget'),
          updated_at: new Date().toISOString(),
        };
        const values = [payload.exercise_target, payload.alcohol_free_target, payload.weight_target, payload.bp_sys_target, payload.bp_dia_target, payload.sugar_target];
        if (values.every(value => value === null)) {
          setSysError('목표를 하나 이상 입력하거나 설정 안 함을 선택해주세요.');
          return;
        }
        const periodDays = Math.round((parseDate(activeRange.end) - parseDate(activeRange.start)) / 86400000) + 1;
        if (payload.alcohol_free_target !== null && (!Number.isInteger(payload.alcohol_free_target) || payload.alcohol_free_target < 0 || payload.alcohol_free_target > periodDays)) {
          setSysError(`금주 목표는 0~${periodDays}일의 정수로 입력해주세요.`); return;
        }
        if (payload.exercise_target !== null && (!Number.isInteger(payload.exercise_target) || payload.exercise_target < 0 || payload.exercise_target > 200)) {
          setSysError('운동 목표는 0~200회의 정수로 입력해주세요.'); return;
        }
        setPeriodGoalSaving(true);
        const { data, error } = await sb.from('period_goals').upsert(payload, { onConflict: 'user_id,period_type,period_start' }).select().single();
        setPeriodGoalSaving(false);
        if (error) return reportFatalError(error);
        setPeriodGoal(data); setIsPeriodGoalOpen(false); showNotice(`${statsMode === 'month' ? '월간' : '주간'} 목표를 저장했습니다.`);
      };

      const skipPeriodGoal = async () => {
        if (!session || periodGoalSaving) return;
        setPeriodGoalSaving(true);
        const payload = {
          user_id: session.user.id, period_type: statsMode, period_start: activeRange.start,
          period_end: activeRange.end, status: 'skipped', exercise_target: null,
          alcohol_free_target: null, weight_target: null, bp_sys_target: null,
          bp_dia_target: null, sugar_target: null, updated_at: new Date().toISOString(),
        };
        const { data, error } = await sb.from('period_goals').upsert(payload, { onConflict: 'user_id,period_type,period_start' }).select().single();
        setPeriodGoalSaving(false);
        if (error) return reportFatalError(error);
        setPeriodGoal(data); setIsPeriodGoalOpen(false); showNotice('이 기간은 목표를 설정하지 않기로 저장했습니다.');
      };

      const changeDate = (direction) => {
        const d = parseDate(currentDate);
        if (activeTab === 'home') {
          d.setDate(d.getDate() + direction);
        } else {
          if (statsMode === 'week') d.setDate(d.getDate() + (direction * 7));
          else if (statsMode === 'month') d.setMonth(d.getMonth() + direction);
        }
        setCurrentDate(formatDate(d));
      };

      const handleDatePick = (e) => {
        if (!e.target.value) return;
        let val = e.target.value;
        if (val.includes('-W')) {
          const [year, week] = val.split('-W');
          const d = new Date(Date.UTC(year, 0, 1 + (Number(week) - 1) * 7));
          setCurrentDate(d.toISOString().split('T')[0]);
        } else if (activeTab !== 'home' && statsMode === 'month') {
          setCurrentDate(val + '-01');
        } else {
          setCurrentDate(val);
        }
      };

      // ★ 짧게 떴다 사라지는 성공 안내 배너
      // ★ v0.4.0 루틴. 체크는 "루틴id|날짜" 키로 보관한다.
      const [routines, setRoutines] = useState([]);
      const [routineChecks, setRoutineChecks] = useState({});
      const [routineExerciseDates, setRoutineExerciseDates] = useState(() => new Set());
      const [routinesLoading, setRoutinesLoading] = useState(false);
      const routineKey = (routineId, date) => `${routineId}|${date}`;
      const getRoutineCheck = (routineId, date) => routineChecks[routineKey(routineId, date)] || null;
      const isRoutineExerciseDay = (date) => routineExerciseDates.has(date) || (date === currentDate && logs.some(l => l.category === '운동'));

      const fetchRoutineData = async () => {
        if (!session) return;
        setRoutinesLoading(true);
        const since = parseDate(formatDate(new Date()));
        since.setDate(since.getDate() - ROUTINE_LOOKBACK_DAYS);
        const sinceStr = formatDate(since);
        const pageAll = async (build) => {
          const rows = [];
          for (let from = 0; from < 20000; from += 1000) {
            const { data, error } = await withAuthRetry(() => build(from, from + 999));
            if (error) throw error;
            rows.push(...(data || []));
            if (!data || data.length < 1000) break;
          }
          return rows;
        };
        try {
          const [routineRows, checkRows, exerciseRows] = await Promise.all([
            pageAll((a, b) => sb.from('routines').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true }).range(a, b)),
            pageAll((a, b) => sb.from('routine_checks').select('*').gte('check_date', sinceStr).order('check_date', { ascending: true }).range(a, b)),
            pageAll((a, b) => sb.from('logs').select('log_date').eq('category', '운동').gte('log_date', sinceStr).order('log_date', { ascending: true }).range(a, b)),
          ]);
          setRoutines(routineRows);
          setRoutineChecks(Object.fromEntries(checkRows.map(c => [routineKey(c.routine_id, c.check_date), c])));
          setRoutineExerciseDates(new Set(exerciseRows.map(r => r.log_date)));
        } catch (err) {
          console.error(err); // 루틴만 비워 두고 다른 화면은 그대로 쓴다
        } finally {
          setRoutinesLoading(false);
        }
      };

      useEffect(() => { if (session) fetchRoutineData(); }, [session]);

      const ROUTINE_SAVE_FAILED = '루틴을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.';

      // 체크 저장(화면 먼저 바꾸고, 실패하면 되돌린다)
      const putRoutineCheck = async (routine, date, fields) => {
        const key = routineKey(routine.id, date);
        const prev = routineChecks[key] || null;
        const row = {
          user_id: session.user.id, routine_id: routine.id, check_date: date,
          status: prev?.status || 'progress', value: prev?.value || 0, note: prev?.note || '',
          ...fields, updated_at: new Date().toISOString(),
        };
        setRoutineChecks(p => ({ ...p, [key]: row }));
        const { data, error } = await sb.from('routine_checks').upsert(row, { onConflict: 'routine_id,check_date' }).select().single();
        if (error) {
          setRoutineChecks(p => { const n = { ...p }; if (prev) n[key] = prev; else delete n[key]; return n; });
          showNotice(ROUTINE_SAVE_FAILED);
          return;
        }
        setRoutineChecks(p => ({ ...p, [key]: data }));
      };

      const deleteRoutineCheck = async (routine, date) => {
        const key = routineKey(routine.id, date);
        const prev = routineChecks[key] || null;
        if (!prev) return;
        setRoutineChecks(p => { const n = { ...p }; delete n[key]; return n; });
        const { error } = await sb.from('routine_checks').delete().eq('routine_id', routine.id).eq('check_date', date);
        if (error) { setRoutineChecks(p => ({ ...p, [key]: prev })); showNotice(ROUTINE_SAVE_FAILED); }
      };

      // 완료를 되돌릴 때 메모가 있으면 메모는 남긴다.
      const undoRoutineCheck = (routine, date) => {
        const check = getRoutineCheck(routine.id, date);
        if (check?.note) return putRoutineCheck(routine, date, { status: 'progress', value: 0 });
        return deleteRoutineCheck(routine, date);
      };

      const routineActions = {
        tap: (routine, date) => {
          const check = getRoutineCheck(routine.id, date);
          const state = routineDayState(routine, check, isRoutineExerciseDay(date));
          if (state === 'done' && !check) { showNotice('운동 기록으로 자동 완료된 루틴이에요. 쉬는 날이면 ⋯에서 건너뛰기를 고르세요.'); return; }
          if (state === 'done' || state === 'skipped') return undoRoutineCheck(routine, date);
          if (routine.kind === 'count') {
            const value = (check?.value || 0) + (routine.step || 1);
            return putRoutineCheck(routine, date, { value, status: value >= routine.target ? 'done' : 'progress' });
          }
          return putRoutineCheck(routine, date, { status: 'done' });
        },
        toggleSkip: (routine, date) => {
          const check = getRoutineCheck(routine.id, date);
          if (check?.status === 'skipped') return undoRoutineCheck(routine, date);
          return putRoutineCheck(routine, date, { status: 'skipped' });
        },
        setValue: (routine, date, value) => putRoutineCheck(routine, date, { value, status: value >= routine.target ? 'done' : 'progress' }),
        saveNote: (routine, date, note) => {
          const check = getRoutineCheck(routine.id, date);
          if (!check && !note) return;
          if (!note && check && check.status === 'progress' && !check.value) return deleteRoutineCheck(routine, date);
          return putRoutineCheck(routine, date, { note });
        },
        clear: (routine, date) => deleteRoutineCheck(routine, date),
      };

      const saveRoutine = async (existing, data) => {
        if (existing) {
          const { data: row, error } = await sb.from('routines').update({ ...data, updated_at: new Date().toISOString() }).eq('id', existing.id).select().single();
          if (error) { showNotice(ROUTINE_SAVE_FAILED); return false; }
          setRoutines(p => p.map(r => r.id === row.id ? row : r));
          return true;
        }
        const sortOrder = routines.reduce((m, r) => Math.max(m, r.sort_order || 0), 0) + 10;
        const { data: row, error } = await sb.from('routines').insert({ ...data, user_id: session.user.id, sort_order: sortOrder }).select().single();
        if (error) { showNotice(ROUTINE_SAVE_FAILED); return false; }
        setRoutines(p => [...p, row]);
        showNotice(`"${row.name}" 루틴을 추가했어요.`);
        return true;
      };

      const toggleRoutineArchive = async (routine) => {
        const archived_at = routine.archived_at ? null : new Date().toISOString();
        const { data: row, error } = await sb.from('routines').update({ archived_at, updated_at: new Date().toISOString() }).eq('id', routine.id).select().single();
        if (error) { showNotice(ROUTINE_SAVE_FAILED); return; }
        setRoutines(p => p.map(r => r.id === row.id ? row : r));
      };

      const deleteRoutine = async (routine) => {
        const { error } = await sb.from('routines').delete().eq('id', routine.id);
        if (error) { showNotice(ROUTINE_SAVE_FAILED); return; }
        setRoutines(p => p.filter(r => r.id !== routine.id));
        setRoutineChecks(p => Object.fromEntries(Object.entries(p).filter(([k]) => !k.startsWith(routine.id + '|'))));
      };

      // 순서는 같은 시간대 안, 정확한 시간이 없는 루틴끼리만 바꾼다.
      const moveRoutine = async (routine, direction) => {
        if (routine.time_of_day) { showNotice('정확한 시간이 있는 루틴은 시간 순서대로 보여요.'); return; }
        const group = routines.filter(r => !r.archived_at && !r.time_of_day && (r.time_slot || 'anytime') === (routine.time_slot || 'anytime')).sort(compareRoutines);
        const i = group.findIndex(r => r.id === routine.id), j = i + direction;
        if (i < 0 || j < 0 || j >= group.length) return;
        [group[i], group[j]] = [group[j], group[i]];
        const updates = group.map((r, index) => ({ ...r, sort_order: (index + 1) * 10 }));
        const prev = routines;
        setRoutines(p => p.map(r => updates.find(u => u.id === r.id) || r));
        const results = await Promise.all(updates.map(u => sb.from('routines').update({ sort_order: u.sort_order }).eq('id', u.id)));
        if (results.some(r => r.error)) { setRoutines(prev); showNotice(ROUTINE_SAVE_FAILED); }
      };

      const showNotice = (msg) => {
        setSysNotice(msg);
        setTimeout(() => setSysNotice(""), 2500);
      };

      // ★ 서버/네트워크에서 실제로 발생한 에러 처리 전용 — 새로고침하면 대부분 해결되는 경험적 사실에 따라
      // 안내 문구를 띄운 뒤 자동으로 새로고침한다. (단순 입력 안내는 새로고침이 필요 없으니 그대로 setSysError를 쓴다)
      // 새로고침으로도 안 고쳐지는 문제라면 계속 새로고침을 반복하지 않도록, 최근 30초 안에 이미
      // 자동 새로고침을 했다면 이번엔 건너뛰고 메시지만 보여준다.
      const AUTO_REFRESH_KEY = 'dietapp_last_auto_refresh';
      const AUTO_REFRESH_COOLDOWN_MS = 30000;
      const reportFatalError = (errOrMsg) => {
        console.error(errOrMsg);
        let lastRefresh = 0;
        try { lastRefresh = Number(sessionStorage.getItem(AUTO_REFRESH_KEY)) || 0; } catch (e) {}
        const now = Date.now();
        if (now - lastRefresh > AUTO_REFRESH_COOLDOWN_MS) {
          setSysError('일시적인 문제가 발생했어요. 잠시 후 새로고침할게요...');
          try { sessionStorage.setItem(AUTO_REFRESH_KEY, String(now)); } catch (e) {}
          try {
            sessionStorage.setItem(VIEW_STATE_KEY, JSON.stringify({
              activeTab, currentDate, statsMode, longTermDrafts, followupDraft, openFollowupId, savedAt: Date.now(),
            }));
          } catch (e) { /* 보관하지 못해도 새로고침은 진행 */ }
          setTimeout(() => { window.location.reload(); }, 2000);
        } else {
          setSysError('문제가 계속되고 있어요. 화면을 새로고침해주세요.');
        }
      };

      // ★ v0.3.12 AI 요청 실패 처리: 일시 오류면 안내 + 다시 시도, 아니면 기존처럼 새로고침
      const AI_SLOW_MESSAGE = 'AI 응답이 늦어지고 있어요. 잠시 후 다시 시도해 주세요.';
      const AI_SLOW_DETAIL = '90초 안에 서버 응답이 없어 요청을 멈췄어요. (요청 시간 초과)';
      const showAiBusy = (message, detail, retry) => {
        setShowAiDetail(false);
        setAiBusy({ message, detail: String(detail || ''), at: new Date().toLocaleString('ko-KR'), retry: retry || null });
      };
      const handleAiFailure = (err, retry) => {
        if (isTemporaryAiError(err)) {
          const detail = String(err?.message || err || '');
          showAiBusy(temporaryAiMessage(detail), detail, retry);
          return;
        }
        reportFatalError(err);
      };

      // ★ 계정 정보 저장 (프로필 + 계정명 + 비밀번호, 기존 SettingsForm 대체)
      const saveProfile = async (e) => {
        e.preventDefault();
        setAccountError(''); setAccountSaving(true);
        const fd = new FormData(e.target);
        const newUsername = (fd.get('username') || '').trim();
        const newPassword = fd.get('newPassword') || '';
        try {
          const weeklyAlcoholGoalText = String(fd.get('goalAlcoholFreeWeekly') || '').trim();
          const weeklyAlcoholGoal = weeklyAlcoholGoalText === '' ? null : Number(weeklyAlcoholGoalText);
          if (weeklyAlcoholGoal !== null && (!Number.isInteger(weeklyAlcoholGoal) || weeklyAlcoholGoal < 0 || weeklyAlcoholGoal > 7)) {
            throw new Error('주간 금주 목표는 0~7일의 정수로 입력해주세요.');
          }
          const { error: pErr } = await sb.from('profiles').update({
            height: fd.get('height') ? Number(fd.get('height')) : null,
            weight: fd.get('weight') ? Number(fd.get('weight')) : null,
            age: fd.get('age') ? Number(fd.get('age')) : null,
            gender: fd.get('gender'),
            disease: fd.get('disease') || '',
            ai_mode: fd.get('aiMode') || 'normal',
            goal_exercise_weekly: fd.get('goalExerciseWeekly') ? Number(fd.get('goalExerciseWeekly')) : null,
            goal_alcohol_free_weekly: weeklyAlcoholGoal,
            goal_weight_kg: fd.get('goalWeightKg') ? Number(fd.get('goalWeightKg')) : null,
            goal_bp_sys_max: fd.get('goalBpSysMax') ? Number(fd.get('goalBpSysMax')) : null,
            goal_bp_dia_max: fd.get('goalBpDiaMax') ? Number(fd.get('goalBpDiaMax')) : null,
            goal_sugar_max: fd.get('goalSugarMax') ? Number(fd.get('goalSugarMax')) : null,
            show_routines: fd.get('showRoutines') === 'on',
          }).eq('id', session.user.id);
          if (pErr) throw pErr;

          if (newUsername && newUsername !== profile.username) {
            const { error: uErr } = await sb.from('profiles').update({ username: newUsername }).eq('id', session.user.id);
            if (uErr) throw new Error('이미 사용 중인 계정명입니다.');
            const { error: eErr } = await sb.auth.updateUser({ email: newUsername + EMAIL_DOMAIN });
            if (eErr) throw eErr;
          }

          if (newPassword) {
            if (newPassword.length < 6) throw new Error('비밀번호는 6자 이상이어야 합니다.');
            const { error: pwErr } = await sb.auth.updateUser({ password: newPassword });
            if (pwErr) throw pwErr;
          }

          // ★ [버그수정] 화면 상태를 직접 조립하지 않고 서버에서 최신 프로필을 다시 읽어와 반영
          // (isApproved/isAdmin 같은 필드가 누락되어 승인 대기 화면으로 잘못 튕기는 문제 방지)
          const { data: freshProfile, error: refetchErr } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
          if (!refetchErr && freshProfile) {
            setProfile({
              username: freshProfile.username, height: freshProfile.height, weight: freshProfile.weight, age: freshProfile.age,
              gender: freshProfile.gender, disease: freshProfile.disease || '', aiMode: freshProfile.ai_mode || 'normal',
              isApproved: !!freshProfile.is_approved, isAdmin: !!freshProfile.is_admin,
              goalExerciseWeekly: freshProfile.goal_exercise_weekly, goalAlcoholFreeWeekly: freshProfile.goal_alcohol_free_weekly,
              goalWeightKg: freshProfile.goal_weight_kg, goalBpSysMax: freshProfile.goal_bp_sys_max, goalBpDiaMax: freshProfile.goal_bp_dia_max,
              goalSugarMax: freshProfile.goal_sugar_max,
              showRoutines: freshProfile.show_routines !== false
            });
          }
          setIsSettingsOpen(false);
          showNotice('✅ 수정했습니다.');
        } catch (err) {
          setAccountError(translateAuthError(err.message));
        } finally {
          setAccountSaving(false);
        }
      };

      const handleLogout = async () => { await sb.auth.signOut(); setIsSettingsOpen(false); };

      // ★ 데이터 백업/내보내기 (CSV 다운로드) — 로그인한 본인의 전체 기록을 하나의 CSV 파일로 내려받음
      const handleExportCsv = async () => {
        setIsExporting(true);
        setAccountError('');
        try {
          const { data, error } = await withAuthRetry(() =>
            sb.from('logs').select('*').order('log_date', { ascending: true }).order('log_time', { ascending: true })
          );
          if (error) throw error;
          if (!data || data.length === 0) {
            setAccountError('내보낼 기록이 없습니다.');
            return;
          }
          const headers = ['날짜', '시간', '카테고리', '제목', '내용', '메모', 'AI 분석', '음주여부', '혈압(수축기)', '혈압(이완기)', '맥박', '혈당', '체중(kg)', '수면시간(h)'];
          const rows = data.map(row => {
            const raw = row.raw_input || {};
            const bio = raw.biometrics || {};
            return [
              row.log_date,
              String(row.log_time || '').slice(0, 5),
              row.category,
              row.food_name || '',
              (row.ingredients || []).join(' / '),
              raw.memo || '',
              row.analysis || '',
              row.is_alcohol ? 'Y' : 'N',
              bio.bp_sys ?? '',
              bio.bp_dia ?? '',
              bio.pulse ?? '',
              bio.sugar ?? '',
              bio.weight ?? '',
              bio.sleep_hours ?? '',
            ];
          });
          const csvBody = [headers, ...rows].map(r => r.map(escapeCsvField).join(',')).join('\r\n');
          const csvContent = '﻿' + csvBody; // Excel에서 한글 깨짐 방지용 UTF-8 BOM
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `식단기록_백업_${formatDate(new Date())}.csv`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showNotice('✅ CSV 파일을 내려받았습니다.');
        } catch (err) {
          setAccountError('내보내기 중 오류가 발생했습니다: ' + (err.message || err));
        } finally {
          setIsExporting(false);
        }
      };

      // ★ 관리자 전용: 전체 회원 목록 불러오기 (is_admin RLS 정책 덕분에 본인 외 행도 조회 가능)
      const loadMembers = async () => {
        setIsLoadingMembers(true);
        const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
        if (error) reportFatalError(error); else setMemberList(data || []);
        setIsLoadingMembers(false);
      };

      // ★ 관리자 전용: 회원별 사용 현황 (기록 개수/활동일수/마지막 기록일만 — 실제 기록 내용은 절대 포함되지 않음)
      // admin_user_activity_stats()는 SECURITY DEFINER 함수 내부에서 is_admin()을 다시 확인하므로,
      // 관리자가 아니면 항상 빈 배열이 돌아온다.
      const [memberStats, setMemberStats] = useState({});
      const loadMemberStats = async () => {
        const { data, error } = await sb.rpc('admin_user_activity_stats');
        if (!error && data) {
          const map = {};
          data.forEach(row => { map[row.user_id] = row; });
          setMemberStats(map);
        }
      };

      useEffect(() => {
        if (isAdminOpen) { loadMembers(); loadMemberStats(); }
      }, [isAdminOpen]);

      // ★ 관리자 전용: 승인/차단 토글
      const toggleMemberApproval = async (member) => {
        setMemberActionId(member.id);
        const { error } = await sb.from('profiles').update({ is_approved: !member.is_approved }).eq('id', member.id);
        if (error) reportFatalError(error);
        else setMemberList(prev => prev.map(m => m.id === member.id ? { ...m, is_approved: !m.is_approved } : m));
        setMemberActionId(null);
      };

      // ★ 관리자 전용: 회원 삭제 (계정 + 프로필 + 기록 + 사진까지 서버에서 완전 삭제)
      const handleDeleteMember = async (member) => {
        setMemberActionId(member.id);
        setDeleteMemberConfirmId(null);
        try {
          await callAI('deleteUser', { targetUserId: member.id });
          setMemberList(prev => prev.filter(m => m.id !== member.id));
          showNotice(`🗑️ ${member.username}님 계정을 삭제했습니다.`);
        } catch (err) {
          reportFatalError(err);
        } finally {
          setMemberActionId(null);
        }
      };

      // ★ 로그인 / 회원가입
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError(''); setAuthLoading(true);
        const fd = new FormData(e.target);
        const username = (fd.get('username') || '').trim();
        const password = fd.get('password') || '';
        if (!username || !password) { setAuthError('계정명과 비밀번호를 입력해주세요.'); setAuthLoading(false); return; }
        try {
          if (authMode === 'signup') {
            const { error } = await sb.auth.signUp({
              email: username + EMAIL_DOMAIN,
              password,
              options: {
                data: {
                  username,
                  height: fd.get('height') ? Number(fd.get('height')) : null,
                  weight: fd.get('weight') ? Number(fd.get('weight')) : null,
                  age: fd.get('age') ? Number(fd.get('age')) : null,
                  gender: fd.get('gender') || 'male',
                  disease: fd.get('disease') || '',
                  aiMode: fd.get('aiMode') || 'normal',
                }
              }
            });
            if (error) throw error;
          } else {
            const { error } = await sb.auth.signInWithPassword({ email: username + EMAIL_DOMAIN, password });
            if (error) throw error;
          }
        } catch (err) {
          setAuthError(translateAuthError(err.message));
        } finally {
          setAuthLoading(false);
        }
      };

      const handleFileSelect = (e, isCamera = false, preserveDraft = false) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        if (!isCamera && files.length > 5) { setSysError("사진은 최대 5장까지만 업로드할 수 있습니다."); }
        const selectedFiles = files.slice(0, 5);

        setIsMenuOpen(false); setIsCompressing(true);
        setTimeout(async () => {
          try {
            const base64Arr = await Promise.all(selectedFiles.map(f => compressImage(f)));
            if (preserveDraft) {
              setDraft(prev => ({
                ...prev, isOpen: true, isEditMode: false, type: 'image', data: base64Arr,
                isCamera,
                editTime: isCamera ? getCurrentTimeStr() : prev.editTime,
                timeAutoMessage: isCamera ? '촬영 기록은 촬영한 현재 시각으로 저장됩니다.' : prev.timeAutoMessage,
                timeConfirmed: false
              }));
            } else {
              setDraft({
                  isOpen: true, isEditMode: false, type: 'image', data: base64Arr,
                  naturalText: '', memo: '', category: getDefaultCategoryByTime(),
                  editDate: currentDate, editTime: getCurrentTimeStr(), isCamera: isCamera,
                  entrySource: 'general', timeAutoMessage: isCamera ? '촬영 기록은 촬영한 현재 시각으로 저장됩니다.' : '', timeConfirmed: false,
                  bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '', existingFoodName: '', existingIngredients: []
              });
            }
          } catch (err) { setSysError(err.message); } finally { setIsCompressing(false); e.target.value = ''; }
        }, 100);
      };

      const openTextDraft = () => {
        setIsMenuOpen(false);
        setDraft({ isOpen: true, isEditMode: false, type: 'text', data: [], naturalText: '', memo: '', category: getDefaultCategoryByTime(), editDate: currentDate, editTime: getCurrentTimeStr(), isCamera: false, entrySource: 'general', timeAutoMessage: '', timeConfirmed: false, bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '', existingFoodName: '', existingIngredients: [] });
      };

      // 오늘의 기록표에서 시작하면 해당 식사의 시간대 안에서는 현재 시각을,
      // 범위를 벗어나거나 과거 날짜이면 식사별 기준 시각을 제안한다.
      const openMealDraft = (slot, prefillText = '') => {
        const isToday = currentDate === formatDate(new Date());
        const nowTime = getCurrentTimeStr();
        const useCurrentTime = isToday && isTimeWithinMealRange(slot.category, nowTime);
        const suggestedTime = useCurrentTime ? nowTime : slot.anchorTime;
        setIsMenuOpen(false);
        setDraft({
          isOpen: true, isEditMode: false, editLogId: null,
          type: 'text', data: [], naturalText: prefillText, memo: '', category: slot.category,
          editDate: currentDate, editTime: suggestedTime,
          isCamera: false, bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '',
          entrySource: 'todayTable',
          timeAutoMessage: useCurrentTime ? '' : `${slot.label} 기준 시각인 ${slot.anchorTime}로 설정했어요. 실제 식사 시각에 맞게 바꿀 수 있습니다.`,
          timeConfirmed: false,
          existingFoodName: '', existingIngredients: []
        });
      };

      // 기록표 제목의 간식/운동 버튼은 현재 시각을 유지하는 일반 기록창을 연다.
      const openQuickDraft = (category) => {
        setIsMenuOpen(false);
        setDraft({
          isOpen: true, isEditMode: false, editLogId: null,
          type: 'text', data: [], naturalText: '', memo: '', category,
          editDate: currentDate, editTime: getCurrentTimeStr(), isCamera: false,
          entrySource: 'headerAction', timeAutoMessage: '', timeConfirmed: false,
          bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '',
          existingFoodName: '', existingIngredients: []
        });
      };

      const openBiometricsDraft = () => {
        setIsMenuOpen(false);
        setDraft({ isOpen: true, isEditMode: false, type: 'biometrics', data: [], naturalText: '', memo: '', category: '생체기록', editDate: currentDate, editTime: getCurrentTimeStr(), isCamera: false, entrySource: 'general', timeAutoMessage: '', timeConfirmed: false, bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '', existingFoodName: '', existingIngredients: [] });
      };

      // ★ v0.3.10 기록 카드의 복사: 내가 쓴 글과 끼니 종류를 오늘 지금 시각의 새 기록으로 연다(사진은 글로).
      const handleCopyClick = (log) => {
        const isCustom = !defaultCategories.includes(log.category);
        setDraft({
          isOpen: true, isEditMode: false, editLogId: null,
          type: 'text', data: [], naturalText: getCopyText(log), memo: '', category: isCustom ? '직접입력' : log.category,
          editDate: formatDate(new Date()), editTime: getCurrentTimeStr(), isCamera: false,
          entrySource: 'copy', timeAutoMessage: '복사한 기록이에요. 날짜와 시간은 오늘 지금으로 바꿨어요.', timeConfirmed: false,
          bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '',
          existingFoodName: '', existingIngredients: []
        });
        if (isCustom) setCustomCategory(log.category);
        setIsMenuOpen(false);
      };

      const fetchRecentBreakfasts = async (date) => {
        const since = parseDate(date);
        since.setDate(since.getDate() - 14);
        const { data, error } = await withAuthRetry(() => sb.from('logs')
          .select('id, log_date, log_time, category, food_name, ingredients, raw_input, image_urls')
          .eq('category', '아침식사').gte('log_date', formatDate(since)).lt('log_date', date)
          .order('log_date', { ascending: false }).order('log_time', { ascending: true }));
        // 후보를 못 불러오면 버튼만 숨긴다(기록 화면은 그대로).
        setRecentBreakfasts(error ? [] : buildRecentMealChoices((data || []).map(mapLogRow), date));
      };

      useEffect(() => {
        setIsRecentMealOpen(false);
        if (session && activeTab === 'home') fetchRecentBreakfasts(currentDate);
      }, [session, activeTab, currentDate]);

      useEffect(() => {
        setPendingEntry(session ? readPendingEntry(session.user?.id) : null);
      }, [session]);

      const restorePendingEntry = () => {
        if (!pendingEntry) return;
        const p = pendingEntry.payload;
        const isCustom = p.category !== '생체기록' && !defaultCategories.includes(p.category);
        const bio = p.biometrics || {};
        setDraft({
          isOpen: true, isEditMode: !!pendingEntry.isEdit, editLogId: pendingEntry.editId || null,
          type: p.type || 'text', data: p.base64Images || [], naturalText: p.naturalText || '', memo: p.memo || '',
          category: isCustom ? '직접입력' : p.category, editDate: p.date, editTime: p.time, isCamera: false,
          entrySource: pendingEntry.isEdit ? 'edit' : 'pending', timeAutoMessage: '', timeConfirmed: false,
          bp_sys: bio.bp_sys ?? '', bp_dia: bio.bp_dia ?? '', pulse: bio.pulse ?? '', sugar: bio.sugar ?? '',
          weight: bio.weight ?? '', sleep_hours: bio.sleep_hours ?? '',
          existingFoodName: p.existingFoodName || '', existingIngredients: p.existingIngredients || []
        });
        if (isCustom) setCustomCategory(p.category);
        setIsMenuOpen(false);
      };

      const retryPendingEntry = () => {
        if (!pendingEntry) return;
        const entry = pendingEntry;
        setPendingEntry(null);
        submitEntry(entry);
      };

      const discardPendingEntry = () => {
        clearPendingEntry();
        setPendingEntry(null);
      };

      const handleEditClick = (log) => {
        let parsedRaw = { type: 'text', naturalText: log.foodName, memo: '', biometrics: null };
        try {
          if (log.rawInput && log.rawInput.startsWith('{')) parsedRaw = JSON.parse(log.rawInput);
          else if (log.imageUrl) parsedRaw = { type: 'image', memo: log.rawInput || '' };
        } catch (e) {}
        const isCustom = !defaultCategories.includes(log.category) && log.category !== '생체기록';
        const fallbackText = parsedRaw.naturalText || log.foodName;
        const images = log.imageUrl ? log.imageUrl.split(',') : [];

        setDraft({
          isOpen: true, isEditMode: true, editLogId: log.id, editDate: log.date, editTime: log.time,
          type: parsedRaw.type || (log.imageUrl ? 'image' : 'text'), data: images,
          naturalText: fallbackText, memo: parsedRaw.memo || '', category: isCustom ? '직접입력' : log.category, isCamera: false,
          entrySource: 'edit', timeAutoMessage: '', timeConfirmed: false,
          bp_sys: parsedRaw.biometrics?.bp_sys || '', bp_dia: parsedRaw.biometrics?.bp_dia || '', pulse: parsedRaw.biometrics?.pulse || '', sugar: parsedRaw.biometrics?.sugar || '',
          weight: parsedRaw.biometrics?.weight || '', sleep_hours: parsedRaw.biometrics?.sleep_hours || '',
          existingFoodName: log.foodName, existingIngredients: log.ingredients
        });
        if (isCustom) setCustomCategory(log.category);
        setIsMenuOpen(false);
      };

      // ★ 기록 저장/재분석 (구글 앱스스크립트 대신 Supabase Edge Function 호출)
      // ★ AI 응답을 기다리다가 사용자가 직접 취소하는 경우 — 실제 진행 중인 요청을 중단하고 로딩 상태를 정리
      const handleCancelLoading = () => {
        if (abortControllerRef.current) abortControllerRef.current.abort();
        setIsAnalyzing(false);
        setReanalyzingId(null);
        setIsGeneratingReport(false);
        setIsGeneratingDaily(false);
        setIsGeneratingConditionReport(false);
        setIsGeneratingHabit(false);
        setSysError("");
        showNotice('요청을 취소했습니다.');
      };

      // ★ 사진/한줄기록 분석 결과에 대한 후속 질문 (기록당 1회, 서버에서도 재확인함)
      const handleAskFollowup = async (logId) => {
        const q = followupDraft.trim();
        if (!q) return;
        setSubmittingFollowupId(logId);
        try {
          const res = await callAI('followupQuestion', { id: logId, question: q, disease: profile?.disease || '', aiMode: profile?.aiMode || 'normal' });
          const applyAnswer = (item) => item.id === logId ? { ...item, followupQuestion: res.question, followupAnswer: res.answer } : item;
          setLogs(prev => prev.map(applyAnswer));
          setPeriodLogs(prev => prev.map(applyAnswer));
          setOpenFollowupId(null);
          setFollowupDraft('');
        } catch (err) {
          handleAiFailure(err, () => handleAskFollowup(logId)); // 쓴 질문은 그대로 남는다
        } finally {
          setSubmittingFollowupId(null);
        }
      };

      // ★ v0.3.7 여러 인분을 나눠 먹은 기록의 본인 섭취량 (후속 질문 1회 제한과 별개)
      const handleAnswerPortion = async (logId, share) => {
        setSubmittingPortionId(logId);
        try {
          const res = await callAI('answerPortion', { id: logId, share });
          const apply = (item) => item && item.id === logId ? { ...item, ...res } : item;
          setLogs(prev => prev.map(apply));
          setPeriodLogs(prev => prev.map(apply));
          setFeedbackPopupLog(prev => apply(prev));
          setEditingPortionId(null);
          if (res.foodName) fetchGoalStats();
        } catch (err) {
          handleAiFailure(err, () => handleAnswerPortion(logId, share));
        } finally {
          setSubmittingPortionId(null);
        }
      };

      const renderPortionCheck = (log) => {
        const check = log.portionCheck;
        if (!check || !Array.isArray(check.dishes) || check.dishes.length === 0) return null;
        const busy = submittingPortionId === log.id;
        if (check.share != null && editingPortionId !== log.id) {
          return (
            <div className="mt-2 flex items-center justify-between gap-2 bg-gray-50 rounded-xl px-3 py-2" data-portion-check>
              <p className="text-xs text-gray-600 min-w-0">🍽️ 본인 섭취량: <span className="font-bold text-gray-800">{portionShareLabel(check.share)}</span> 기준으로 분석했어요</p>
              <button type="button" onClick={() => setEditingPortionId(log.id)} className="text-xs font-bold text-blue-500 whitespace-nowrap shrink-0">바꾸기</button>
            </div>
          );
        }
        return (
          <div className="mt-2 bg-amber-50 border border-amber-100 rounded-xl p-3" data-portion-check>
            <p className="text-xs text-amber-900 leading-snug break-keep mb-2">
              🍽️ {check.dishes.join(', ')} 중 본인은 대략 몇 인분쯤 드셨나요? 고르시면 그 양으로 다시 분석해요.
            </p>
            <div className="grid grid-cols-4 gap-1.5">
              {PORTION_SHARES.map(share => (
                <button key={share} type="button" disabled={busy} onClick={() => handleAnswerPortion(log.id, share)}
                  className={`text-xs font-bold py-2 rounded-lg border disabled:opacity-60 ${check.share === share ? 'bg-amber-500 border-amber-500 text-white' : 'bg-white border-amber-200 text-amber-800'}`}>
                  {portionShareLabel(share)}
                </button>
              ))}
            </div>
            {busy && <p className="text-[11px] text-amber-700 mt-2">다시 분석 중...</p>}
            {!busy && check.share != null && (
              <button type="button" onClick={() => setEditingPortionId(null)} className="text-[11px] font-bold text-gray-500 mt-2">취소</button>
            )}
          </div>
        );
      };

      const handleUploadConfirm = () => {
        if (draft.type === 'text' && !draft.naturalText.trim()) return setSysError("내용을 입력해주세요!");
        if (draft.type === 'biometrics' && !draft.bp_sys && !draft.bp_dia && !draft.pulse && !draft.sugar && !draft.weight && !draft.sleep_hours) return setSysError("최소 하나 이상의 수치를 입력해주세요!");

        const finalCategory = draft.type === 'biometrics' ? '생체기록' : (draft.category === '직접입력' ? (customCategory || '기타') : draft.category);
        const mealTimeWarning = getMealTimeWarning(finalCategory, draft.editTime);
        if (mealTimeWarning && !draft.timeConfirmed) {
          setSysError('식사 시간이 평소 시간대와 크게 다릅니다. 기록창에서 시간을 확인해주세요.');
          return;
        }

        const payload = {
          type: draft.type, base64Images: Array.isArray(draft.data) ? draft.data : [draft.data].filter(Boolean),
          naturalText: draft.naturalText, memo: draft.memo, date: draft.editDate, time: draft.editTime, category: finalCategory,
          biometrics: draft.type === 'biometrics' ? { bp_sys: draft.bp_sys ? Number(draft.bp_sys) : null, bp_dia: draft.bp_dia ? Number(draft.bp_dia) : null, pulse: draft.pulse ? Number(draft.pulse) : null, sugar: draft.sugar ? Number(draft.sugar) : null, weight: draft.weight ? Number(draft.weight) : null, sleep_hours: draft.sleep_hours ? Number(draft.sleep_hours) : null } : null,
          disease: profile?.disease || '',
          aiMode: profile?.aiMode || 'normal',
          existingFoodName: draft.existingFoodName, existingIngredients: draft.existingIngredients
        };
        const entry = { userId: session?.user?.id || null, payload, isEdit: !!draft.isEditMode, editId: draft.editLogId || null, finalCategory, savedAt: new Date().toISOString() };
        savePendingEntry(entry);
        setPendingEntry(null);

        setDraft({ isOpen: false, isEditMode: false, type: '', data: [], naturalText: '', memo: '', category: '', entrySource: 'general', timeAutoMessage: '', timeConfirmed: false, bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '', existingFoodName: '', existingIngredients: [] });
        setSysError("");
        nudgeViewportRepaint(); // ★ [버그수정] 메인화면 복귀 직후 터치 좌표 어긋남 방지
        submitEntry(entry);
      };

      // ★ v0.3.10 실제 저장 요청. 실패하면 보관해 둔 입력을 "저장되지 않은 기록"으로 다시 보여준다.
      const submitEntry = (entry) => {
        const { payload, isEdit, editId, finalCategory } = entry;
        const controller = new AbortController();
        abortControllerRef.current = controller;

        // ★ 사용자가 직접 취소하지 않아도, 요청이 지나치게 오래 걸리면(90초) 안전장치로 강제 중단
        const timeoutId = setTimeout(() => {
          controller.abort();
          if (isEdit) setReanalyzingId(null); else setIsAnalyzing(false);
          showAiBusy('AI 응답이 늦어 저장하지 못했어요. 홈 맨 위 "저장되지 않은 기록"에서 다시 시도해 주세요.', AI_SLOW_DETAIL, null);
        }, 90000);

        (async () => {
          try {
            if (isEdit) {
              setReanalyzingId(editId);
              const newData = await callAI('reanalyze', { id: editId, ...payload }, controller.signal);
              clearTimeout(timeoutId);
              clearPendingEntry();
              if (newData.date !== currentDate && activeTab === 'home') setLogs(prev => prev.filter(item => item.id !== editId));
              else setLogs(prev => prev.map(item => item.id === editId ? { ...item, ...newData } : item));
              setFeedbackPopupLog(newData);
              await clearMealStatusForCategory(finalCategory, newData.date);
              setReanalyzingId(null);
              if (finalCategory !== '운동' && finalCategory !== '생체기록') fetchFrequentFoods();
              fetchGoalStats();
            } else {
              setIsAnalyzing(true);
              const newLog = await callAI('analyze', payload, controller.signal);
              clearTimeout(timeoutId);
              clearPendingEntry();
              if (newLog.date === currentDate && activeTab === 'home') setLogs(prev => [newLog, ...prev]);
              setFeedbackPopupLog(newLog);
              await clearMealStatusForCategory(finalCategory, newLog.date);
              setIsAnalyzing(false);
              if (finalCategory !== '운동' && finalCategory !== '생체기록') fetchFrequentFoods();
              fetchGoalStats();
            }
            if (activeTab !== 'home') await fetchPeriodLogs(activeRange.start, activeRange.end);
          } catch (err) {
            clearTimeout(timeoutId);
            setPendingEntry(readPendingEntry(entry.userId));
            if (err.name === 'AbortError') return; // 사용자가 취소했거나 위 안전장치로 중단된 경우 — 상태는 이미 정리됨
            if (isTemporaryAiError(err)) {
              const detail = String(err?.message || err || '');
              showAiBusy(`${temporaryAiMessage(detail)} 입력한 기록은 홈 맨 위 "저장되지 않은 기록"에 있어요.`, detail, null);
              if (activeTab !== 'home') setActiveTab('home');
            } else {
              reportFatalError(err);
            }
            if (isEdit) setReanalyzingId(null); else setIsAnalyzing(false);
          }
        })();
      };

      // ★ 기록 삭제 (본인 스토리지 폴더의 이미지까지 함께 정리)
      const executeDelete = async (id) => {
        const prevLogs = [...logs]; setLogs(logs.filter(log => log.id !== id));
        setDeleteConfirmId(null);
        try {
          const target = prevLogs.find(l => l.id === id);
          if (target && target.imageUrl) {
            const marker = '/diet-images/';
            const paths = target.imageUrl.split(',').filter(Boolean).map(url => {
              const idx = url.indexOf(marker);
              return idx >= 0 ? url.slice(idx + marker.length) : null;
            }).filter(Boolean);
            if (paths.length) await sb.storage.from('diet-images').remove(paths);
          }
          const { error } = await sb.from('logs').delete().eq('id', id);
          if (error) throw error;
        } catch (err) {
          reportFatalError(err); setLogs(prevLogs);
        }
      };

      const handleGeneratePeriodReport = () => {
        if(periodLogs.length === 0) return setSysError("분석할 기록이 없습니다.");
        setIsGeneratingReport(true);
        const controller = new AbortController();
        abortControllerRef.current = controller;
        // ★ 사용자가 직접 취소하지 않아도, 요청이 지나치게 오래 걸리면(90초) 안전장치로 강제 중단
        const timeoutId = setTimeout(() => {
          controller.abort();
          setIsGeneratingReport(false);
          showAiBusy(AI_SLOW_MESSAGE, AI_SLOW_DETAIL, handleGeneratePeriodReport);
        }, 90000);

        let summaryData = "";
        if (statsMode === 'month') {
           const avgBio = averageBiometrics(periodLogs.filter(l => l.category === '생체기록'));
           const foods = periodLogs.filter(l => l.category !== '생체기록' && l.category !== '운동').map(l => l.foodName).join(', ');
           const exercises = periodLogs.filter(l => l.category === '운동').map(l => l.foodName).join(', ');

           summaryData = `[${activeRange.label} 패턴 압축 데이터]\n- 해당 기간 주요 식단: ${foods || '없음'}\n- 해당 기간 주요 운동: ${exercises || '없음'}\n- 평균 혈압: ${avgBio.bpSys ?? '기록없음'} / ${avgBio.bpDia ?? '기록없음'}\n- 평균 혈당: ${avgBio.sugar ?? '기록없음'}\n- 평균 체중: ${avgBio.weight !== null ? avgBio.weight.toFixed(1) + 'kg' : '기록없음'}\n- 평균 수면 시간: ${avgBio.sleep !== null ? avgBio.sleep.toFixed(1) + '시간' : '기록없음'}\n위 압축 데이터를 바탕으로 전반적인 생활 패턴의 장점과 개선점을 의학/영양학적으로 코칭해주세요.`;
        } else {
           let summaryLines = periodLogs.map(l => {
             if (l.category === '생체기록') return `[${l.date} ${l.time}] 생체: ${Array.isArray(l.ingredients) ? l.ingredients.join(', ') : l.ingredients}`;
             return `[${l.date} ${l.time}] [${l.category}] ${l.foodName}: ${Array.isArray(l.ingredients) ? l.ingredients.join(', ') : l.ingredients}`;
           });
           summaryData = `[${activeRange.label} 전체 내역 (시간순)]\n` + summaryLines.join('\n');
        }

        (async () => {
          try {
            // 기간 목표와 달성 현황은 Edge Function이 로그인 사용자의 DB 기록에서 직접 확인한다.
            const res = await callAI('periodReport', { periodStart: activeRange.start, summaryData, isMonth: statsMode === 'month', disease: profile?.disease, aiMode: profile?.aiMode || 'normal' }, controller.signal);
            clearTimeout(timeoutId); setAiReport(res); setIsGeneratingReport(false);
          } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') return;
            handleAiFailure(err, handleGeneratePeriodReport); setIsGeneratingReport(false);
          }
        })();
      };

      const handleGenerateConditionReport = () => {
        if (!selectedCondition || isGeneratingConditionReport) return;
        setIsGeneratingConditionReport(true);
        const controller = new AbortController();
        abortControllerRef.current = controller;
        const timeoutId = setTimeout(() => {
          controller.abort();
          setIsGeneratingConditionReport(false);
          showAiBusy(AI_SLOW_MESSAGE, AI_SLOW_DETAIL, handleGenerateConditionReport);
        }, 90000);

        (async () => {
          try {
            const res = await callAI('conditionReport', { conditionLabel: selectedCondition }, controller.signal);
            clearTimeout(timeoutId);
            const mapped = mapConditionReport(res);
            setConditionReports(prev => [mapped, ...prev]);
            setIsGeneratingConditionReport(false);
          } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') return;
            handleAiFailure(err, handleGenerateConditionReport);
            setIsGeneratingConditionReport(false);
          }
        })();
      };

      const handleGenerateDailyReport = () => {
        if(logs.length === 0) return setSysError("분석할 기록이 없습니다. 먼저 기록해주세요.");
        setIsGeneratingDaily(true);
        const controller = new AbortController();
        abortControllerRef.current = controller;
        // ★ 사용자가 직접 취소하지 않아도, 요청이 지나치게 오래 걸리면(90초) 안전장치로 강제 중단
        const timeoutId = setTimeout(() => {
          controller.abort();
          setIsGeneratingDaily(false);
          showAiBusy(AI_SLOW_MESSAGE, AI_SLOW_DETAIL, handleGenerateDailyReport);
        }, 90000);

        let summaryLines = logs.map(l => {
          if (l.category === '생체기록') return `[${l.time}] 생체: ${Array.isArray(l.ingredients) ? l.ingredients.join(', ') : l.ingredients}`;
          return `[${l.time}] [${l.category}] ${l.foodName}: ${Array.isArray(l.ingredients) ? l.ingredients.join(', ') : l.ingredients}`;
        });
        const summaryData = `기록 내역 (시간순):\n` + summaryLines.join('\n');

        (async () => {
          try {
            const res = await callAI('dailyReport', { date: currentDate, summaryData, disease: profile?.disease, aiMode: profile?.aiMode || 'normal' }, controller.signal);
            clearTimeout(timeoutId); setDailyReport(res); setIsGeneratingDaily(false);
          } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') return;
            handleAiFailure(err, handleGenerateDailyReport); setIsGeneratingDaily(false);
          }
        })();
      };

      // ★ 마크다운 리포트 예쁘게 렌더링하는 함수 (카드형 UI)
      const renderReportHtml = (text) => {
        if (!text) return null;
        const sections = text.split('##').filter(s => s.trim() !== '');

        return sections.map((section, idx) => {
          const lines = section.trim().split('\n');
          const title = lines[0].replace(/\*\*/g, '').trim();
          const contentLines = lines.slice(1).join('\n').trim();

          const renderContent = (contentStr) => {
             const parts = contentStr.split(/(\*\*.*?\*\*)/g);
             return parts.map((part, i) => {
               if (part.startsWith('**') && part.endsWith('**')) {
                 return <strong key={i} className="text-blue-700 font-extrabold">{part.slice(2, -2)}</strong>;
               }
               return <span key={i}>{part}</span>;
             });
          };

          return (
            <div key={idx} className="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-gray-100">
              <h4 className="text-lg font-extrabold text-gray-800 mb-3 border-b-2 border-gray-100 pb-2 flex items-center gap-2">
                {title}
              </h4>
              <div className="text-gray-600 leading-relaxed text-[15px] whitespace-pre-wrap break-keep">
                {renderContent(contentLines)}
              </div>
            </div>
          );
        });
      };

      const getGradeColor = (grade) => {
        if(grade === 'A') return 'bg-blue-500'; if(grade === 'B') return 'bg-green-500'; if(grade === 'C') return 'bg-yellow-500'; if(grade === 'D') return 'bg-orange-500'; return 'bg-red-500';
      };

      const getDaysArray = () => {
        if (!activeRange.start || !activeRange.end) return [];
        const start = parseDate(activeRange.start);
        const end = parseDate(activeRange.end);
        const diffTime = Math.abs(end - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        return Array.from({length: diffDays});
      };

      const getChartDays = () => {
        if (statsMode === 'week') {
          return getDaysArray().map((_, i) => {
            const d = parseDate(activeRange.start); d.setDate(d.getDate() + i); return formatDate(d);
          });
        } else {
          const bioDates = new Set();
          periodLogs.forEach(l => {
            try {
              if (l.category === '생체기록') {
                const raw = JSON.parse(l.rawInput);
                if (raw.biometrics?.bp_sys || raw.biometrics?.bp_dia || raw.biometrics?.sugar || raw.biometrics?.weight || raw.biometrics?.sleep_hours) bioDates.add(l.date);
              }
            } catch(e) {}
          });
          return Array.from(bioDates).sort();
        }
      };

      const chartDays = getChartDays();

      // ★ 생체 트렌드: 실제 기록과 기준선을 포함한 자동 세로축을 사용한다.
      // 최소 범위를 보장해 작은 차이를 과장하지 않고, 위쪽에는 상시 수치 라벨 공간을 남긴다.
      const validBioValue = (value) => {
        const number = Number(value);
        return value !== null && value !== undefined && value !== '' && Number.isFinite(number) && number >= 0 ? number : null;
      };
      const getBioSeries = (field) => chartDays.map(dateStr => {
        const dayLogs = periodLogs.filter(l => l.date === dateStr && l.category === '생체기록');
        let sum = 0, count = 0;
        dayLogs.forEach(l => {
          try {
            const raw = JSON.parse(l.rawInput);
            const value = validBioValue(raw.biometrics?.[field]);
            if (value !== null) { sum += value; count++; }
          } catch(e) {}
        });
        return { dateStr, avg: count ? sum / count : null };
      });
      const bpSeries = chartDays.map(dateStr => {
        const dayLogs = periodLogs.filter(l => l.date === dateStr && l.category === '생체기록');
        let sysSum = 0, diaSum = 0, count = 0;
        dayLogs.forEach(l => {
          try {
            const raw = JSON.parse(l.rawInput);
            const sys = validBioValue(raw.biometrics?.bp_sys);
            const dia = validBioValue(raw.biometrics?.bp_dia);
            if (sys !== null && dia !== null) { sysSum += sys; diaSum += dia; count++; }
          } catch(e) {}
        });
        return { dateStr, sys: count ? Math.round(sysSum / count) : null, dia: count ? Math.round(diaSum / count) : null, count };
      });
      const sugarSeries = getBioSeries('sugar').map(item => ({...item, avg: item.avg !== null ? Math.round(item.avg) : null}));
      const weightSeries = getBioSeries('weight');
      const sleepSeries = getBioSeries('sleep_hours');

      const makeAdaptiveScale = (values, references, minimumSpan) => {
        const all = [...values, ...references].map(Number).filter(v => Number.isFinite(v) && v >= 0);
        if (all.length === 0) return { lo: 0, hi: minimumSpan, position: () => 92 };
        const min = Math.min(...all), max = Math.max(...all);
        const span = Math.max(minimumSpan, (max - min) * 1.25 || minimumSpan);
        const center = (min + max) / 2;
        let lo = center - span / 2, hi = center + span / 2;
        if (lo < 0) { hi -= lo; lo = 0; }
        return {
          lo, hi,
          position: value => Math.max(16, Math.min(92, ((hi - Number(value)) / (hi - lo)) * 100))
        };
      };

      // 가까운 값의 배지가 겹치지 않도록 날짜별로 위·아래 위치를 엇갈리게 한다.
      // 그래프 경계에 가까우면 카드 밖이나 날짜 영역으로 밀리지 않는 방향으로 자동 전환한다.
      const getTrendLabelTop = (position, index) => {
        if (position <= 28) return `calc(${position}% + ${index % 2 === 0 ? 6 : 36}px)`;
        if (position >= 72) return `calc(${position}% - ${index % 2 === 0 ? 18 : 48}px)`;
        return index % 2 === 0 ? `calc(${position}% - 20px)` : `calc(${position}% + 10px)`;
      };

      const activePeriodGoal = periodGoal?.status === 'active' ? periodGoal : null;
      const bpValues = bpSeries.flatMap(item => item.sys !== null ? [item.sys, item.dia] : []);
      const sugarValues = sugarSeries.map(item => item.avg).filter(v => v !== null);
      const weightValues = weightSeries.map(w => w.avg).filter(v => v !== null);
      const sleepValues = sleepSeries.map(item => item.avg).filter(v => v !== null);
      const bpScale = makeAdaptiveScale(bpValues, [80, 120, activePeriodGoal?.bp_sys_target, activePeriodGoal?.bp_dia_target].filter(Boolean), 60);
      const sugarScale = makeAdaptiveScale(sugarValues, [100, 126, activePeriodGoal?.sugar_target].filter(Boolean), 40);
      const weightScale = makeAdaptiveScale(weightValues, [activePeriodGoal?.weight_target].filter(Boolean), 4);
      const sleepScale = makeAdaptiveScale(sleepValues, [7], 4);
      const weightLo = weightScale.lo;
      const weightHi = weightScale.hi;

      // ★ 음주/야식 캘린더(월간)용 날짜 셀 계산 (앞쪽 빈 칸 포함, 요일 정렬)
      const getMonthCalendarCells = () => {
        if (!activeRange.start || !activeRange.end) return [];
        const startD = parseDate(activeRange.start);
        const endD = parseDate(activeRange.end);
        const firstWeekday = startD.getDay();
        const totalDays = endD.getDate();
        const cells = [];
        for (let i = 0; i < firstWeekday; i++) cells.push(null);
        for (let day = 1; day <= totalDays; day++) {
          cells.push(formatDate(new Date(startD.getFullYear(), startD.getMonth(), day)));
        }
        return cells;
      };
      const monthCalendarCells = statsMode === 'month' ? getMonthCalendarCells() : [];

      // ★ 일별 평가등급 추이 그래프용 날짜 목록 (주간: 7일 전체, 월간: 등급 기록이 있는 날만)
      const gradeChartDays = statsMode === 'week'
        ? getDaysArray().map((_, i) => { const d = parseDate(activeRange.start); d.setDate(d.getDate() + i); return formatDate(d); })
        : periodGrades.map(g => g.report_date);
      const gradeRank = { A: 5, B: 4, C: 3, D: 2, F: 1 };

      const alcoholGoal = getAlcoholGoalProgress(
        activeRange.start, activeRange.end, formatDate(new Date()),
        periodLogs, periodGoal?.status === 'active' ? periodGoal.alcohol_free_target : 0
      );

      const exerciseDaysThisPeriod = new Set(periodLogs.filter(l => l.category === '운동').map(l => l.date)).size;
      const periodDaysCount = activeRange.start && activeRange.end
        ? Math.round((parseDate(activeRange.end) - parseDate(activeRange.start)) / 86400000) + 1
        : 7;
      const exerciseGoalTarget = periodGoal?.status === 'active' ? Number(periodGoal.exercise_target) || 0 : 0;

      const selectedConditionKey = conditionKeyForLabel(selectedCondition);
      const selectedConditionHistory = conditionReports.filter(report => report.conditionKey === selectedConditionKey);
      const latestConditionReport = selectedConditionHistory[0] || null;
      const latestConditionData = latestConditionReport?.reportData || null;

      // ★ v0.3.11 장기 분석 결과에 대한 질문. 서버(diet-ai longTermQuestion)와 DB도 2회로 제한한다.
      const LONG_TERM_QUESTION_LIMIT = 2;
      useEffect(() => {
        const shown = [['habit', habitReport?.id], ['condition', latestConditionReport?.id]].filter(([, id]) => id);
        if (!session || !isLongTermView || !shown.length) return;
        (async () => {
          const { data, error } = await withAuthRetry(() => sb.from('long_term_followups')
            .select('*').in('report_id', shown.map(([, id]) => id)).order('seq', { ascending: true }));
          if (error) return; // 질문 목록만 못 보여줄 뿐 화면은 그대로
          setLongTermFollowups(prev => {
            const next = { ...prev };
            shown.forEach(([kind, id]) => {
              next[`${kind}:${id}`] = (data || []).filter(row => row.report_kind === kind && row.report_id === id);
            });
            return next;
          });
        })();
      }, [session, isLongTermView, habitReport?.id, latestConditionReport?.id]);

      const handleAskLongTerm = async (kind, reportId) => {
        const key = `${kind}:${reportId}`;
        const question = String(longTermDrafts[key] || '').trim();
        if (!question || askingLongTermKey) return;
        setAskingLongTermKey(key);
        try {
          const row = await callAI('longTermQuestion', { kind, reportId, question });
          setLongTermFollowups(prev => ({ ...prev, [key]: [...(prev[key] || []), row] }));
          setLongTermDrafts(prev => ({ ...prev, [key]: '' }));
        } catch (err) {
          // 2회를 다 쓴 경우는 예상된 안내라 새로고침하지 않는다.
          if (/회까지 할 수 있어요/.test(err.message || '')) showNotice(err.message);
          else handleAiFailure(err, () => handleAskLongTerm(kind, reportId)); // 쓴 질문은 그대로 남는다
        } finally {
          setAskingLongTermKey(null);
        }
      };

      const renderLongTermQuestions = (kind, reportId, placeholder) => {
        if (!reportId) return null;
        const key = `${kind}:${reportId}`;
        const rows = longTermFollowups[key] || [];
        const left = Math.max(0, LONG_TERM_QUESTION_LIMIT - rows.length);
        const busy = askingLongTermKey === key;
        const draftText = longTermDrafts[key] || '';
        return (
          <div className="mt-3 space-y-2" data-long-term-questions={kind}>
            {rows.map(row => (
              <div key={row.id || row.seq} className="bg-indigo-50 rounded-xl p-3">
                <p className="text-xs font-bold text-indigo-500 mb-1 break-keep">🤔 {row.question}</p>
                <p className="text-sm text-indigo-800 whitespace-pre-wrap leading-snug break-keep">{row.answer}</p>
              </div>
            ))}
            {left > 0 ? (
              <div className="flex flex-col gap-2">
                <p className="text-xs font-bold text-gray-600">🤔 이 분석에 대해 더 물어보기 <span className="font-normal text-gray-400">({LONG_TERM_QUESTION_LIMIT}회 중 {left}회 남음)</span></p>
                <textarea
                  value={draftText}
                  onChange={e => { const value = e.target.value; setLongTermDrafts(prev => ({ ...prev, [key]: value })); }}
                  placeholder={placeholder}
                  rows={2}
                  maxLength={300}
                  className="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500 resize-none"
                />
                <button type="button" disabled={busy || !draftText.trim()} onClick={() => handleAskLongTerm(kind, reportId)}
                  className="bg-indigo-600 text-white text-xs font-bold py-2 rounded-lg disabled:opacity-60">
                  {busy ? '답변을 만드는 중...' : '질문하기'}
                </button>
              </div>
            ) : (
              <p className="text-[11px] text-gray-400 leading-relaxed">이 분석에 대한 질문 {LONG_TERM_QUESTION_LIMIT}회를 모두 사용했어요. 다시 분석하면 새로 물어볼 수 있어요.</p>
            )}
          </div>
        );
      };
      const conditionStatusMeta = {
        improving: { label: '좋아지는 흐름', color: 'bg-emerald-100 text-emerald-700' },
        stable: { label: '비슷한 흐름', color: 'bg-blue-100 text-blue-700' },
        needs_attention: { label: '주의가 필요해요', color: 'bg-amber-100 text-amber-800' },
        insufficient: { label: '기록이 더 필요해요', color: 'bg-gray-100 text-gray-600' },
      };

      const hasAnyGoal = !!(activePeriodGoal && [activePeriodGoal.exercise_target, activePeriodGoal.alcohol_free_target,
        activePeriodGoal.weight_target, activePeriodGoal.bp_sys_target, activePeriodGoal.bp_dia_target,
        activePeriodGoal.sugar_target].some(value => Number(value) > 0));

      const openLogDate = (date) => {
        setOpenTagGroup(null);
        setCurrentDate(date);
        setActiveTab('home');
        window.scrollTo(0, 0);
      };

      // ★ v0.3.9 습관 지표의 월별 흐름. 숫자는 모두 서버(diet-ai habitReport)가 센 값이다.
      const habitTrendBadge = (snapshot, key) => {
        const metric = snapshot?.metrics?.[key];
        const direction = snapshot?.trends?.[key]?.direction;
        if (!metric || !direction || direction === 'insufficient') return null;
        if (direction === 'flat') return <span className="text-[10px] font-bold text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">최근 비슷함</span>;
        if (!metric.good) return <span className="text-[10px] font-bold text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">최근 {direction === 'up' ? '늘어남' : '줄어듦'}</span>;
        const better = metric.good === direction;
        return <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${better ? 'text-emerald-700 bg-emerald-100' : 'text-amber-800 bg-amber-100'}`}>최근 {better ? '좋아지는 중' : '나빠지는 중'}</span>;
      };

      const habitSeries = (snapshot, key, monthsShown = 4) => (snapshot?.months || []).slice(-monthsShown).map(m => {
        const value = m.values?.[key];
        return `${Number(m.month.slice(5))}월 ${value === null || value === undefined ? '-' : value}${m.partial ? '*' : ''}`;
      }).join(' · ');

      const HabitReportCard = () => {
        const today = formatDate(new Date());
        const report = habitReport?.report_data || null;
        const snapshot = habitReport?.snapshot || null;
        const analyzedToday = habitReport?.report_date === today;
        const notEnough = habitRecordCount !== null && habitRecordCount < 30;
        const detailKeys = snapshot ? Object.keys(snapshot.metrics || {}) : [];
        const detailMonths = (snapshot?.months || []).slice(-6);
        const renderHabit = (item, good) => (
          <div key={item.metric} className={`rounded-2xl px-3 py-2.5 border ${good ? 'bg-emerald-50 border-emerald-100' : 'bg-amber-50 border-amber-100'}`}>
            <div className="flex items-start justify-between gap-2">
              <span className={`text-sm font-bold break-keep ${good ? 'text-emerald-800' : 'text-amber-900'}`}>{good ? '✓' : '!'} {item.title}</span>
              <span className="shrink-0">{habitTrendBadge(snapshot, item.metric)}</span>
            </div>
            <p className="text-[11px] text-gray-500 mt-1">{snapshot?.metrics?.[item.metric]?.label}: {habitSeries(snapshot, item.metric)}</p>
            {item.detail && <p className="text-xs text-gray-700 leading-snug mt-1 break-keep">{item.detail}</p>}
          </div>
        );
        return (
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100" data-habit-report>
            <div className="mb-3">
              <h3 className="font-bold text-gray-800">🌱 내 습관 분석</h3>
              <p className="text-xs text-gray-500 mt-1 leading-relaxed">쌓인 기록 전체(최근 12개월까지)에서 꾸준히 이어지는 좋은 습관과 계속되는 습관을 찾아요.</p>
            </div>

            {report ? (
              <div className="space-y-3">
                <p className="text-[11px] text-gray-400">
