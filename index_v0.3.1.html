    function getAlcoholGoalProgress(start, end, today, logs, periodTarget) {

    function averageBiometrics(rows) {
      const sums = { bpSys: 0, bpDia: 0, sugar: 0, weight: 0, sleep: 0 };
      const counts = { bpSys: 0, bpDia: 0, sugar: 0, weight: 0, sleep: 0 };
      const fields = { bpSys: 'bp_sys', bpDia: 'bp_dia', sugar: 'sugar', weight: 'weight', sleep: 'sleep_hours' };

        let raw = row.raw_input ?? row.rawInput ?? {};
        if (typeof raw === 'string') {
          try { raw = JSON.parse(raw); } catch (error) { raw = {}; }
        }
        const bio = raw.biometrics || {};
        Object.entries(fields).forEach(([key, field]) => {
          const rawValue = bio[field];
          const value = Number(rawValue);
          if (rawValue !== null && rawValue !== undefined && rawValue !== '' && Number.isFinite(value) && value > 0) {
            sums[key] += value;
            counts[key]++;
          }
        });
      });

      const averages = {};
      Object.keys(fields).forEach(key => {
        averages[key] = counts[key] ? sums[key] / counts[key] : null;
      });
      ['bpSys', 'bpDia', 'sugar'].forEach(key => {
        if (averages[key] !== null) averages[key] = Math.round(averages[key]);

      const firstTime = matches?.[0]?.time || '';
      const extraRecords = Math.max(0, (matches?.length || 0) - 1);
      const makeText = (count) => {
        const shown = allFoods.slice(0, count);
        const hidden = Math.max(0, allFoods.length - shown.length);
        return `${firstTime}${shown.length ? ` ${shown.join(' · ')}` : ''}${hidden ? ` 외 ${hidden}개` : ''}${extraRecords ? ` · +${extraRecords}회` : ''}`;

        const node = lineRef.current;
        if (!node) return;
        const fit = () => {
          const style = getComputedStyle(node);
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          context.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
          const width = node.clientWidth;
          let count = Math.min(4, Math.max(1, allFoods.length));
          while (count > 1 && context.measureText(makeText(count)).width > width) count--;
          setVisibleCount(count);
        };
        fit();
        const observer = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(fit) : null;
        observer?.observe(node);
        window.addEventListener('resize', fit);
        return () => { observer?.disconnect(); window.removeEventListener('resize', fit); };
      }, [firstTime, extraRecords, allFoods.join('|')]);

      const fullText = `${firstTime} ${allFoods.join(' · ')}${extraRecords ? ` · 추가 기록 ${extraRecords}회` : ''}`.trim();
      return <p ref={lineRef} title={fullText} aria-label={fullText} className="text-xs text-gray-500 whitespace-nowrap overflow-hidden text-ellipsis">{makeText(visibleCount)}</p>;

      const [mealStatusSaving, setMealStatusSaving] = useState(null);
      const [periodLogs, setPeriodLogs] = useState([]);
      const [periodGrades, setPeriodGrades] = useState([]); // ★ 일별 평가등급 추이 그래프용 (daily_reports)
      const [periodGoal, setPeriodGoal] = useState(null);
      const [periodGoalLoading, setPeriodGoalLoading] = useState(false);
      const [periodGoalSaving, setPeriodGoalSaving] = useState(false);
      const [isPeriodGoalOpen, setIsPeriodGoalOpen] = useState(false);
      const periodGoalPromptedRef = useRef(new Set());

      const [isFetching, setIsFetching] = useState(true);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [sysError, setSysError] = useState("");
      const [sysNotice, setSysNotice] = useState("");

      const [reanalyzingId, setReanalyzingId] = useState(null);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [customCategory, setCustomCategory] = useState("");
      const [isCompressing, setIsCompressing] = useState(false);
      const [lightboxImage, setLightboxImage] = useState(null); // ★ 타임라인 사진을 탭해서 원본 크기로 볼 때 사용
      // ★ 저장 직후 사용자가 스크롤하지 않고 방금 받은 AI 피드백을 확인하는 팝업
      const [feedbackPopupLog, setFeedbackPopupLog] = useState(null);

      // ★ 사진/한줄기록 분석에 대한 후속 질문 (기록당 1회) — 어느 기록의 입력창이 열려있는지, 입력값, 제출 중 여부
      const [openFollowupId, setOpenFollowupId] = useState(null);
      const [followupDraft, setFollowupDraft] = useState('');
      const [submittingFollowupId, setSubmittingFollowupId] = useState(null);

      // ★ 홈/통계 화면 좌우 스와이프로 전날·다음날(또는 전주·다음주/전월·다음월) 이동
      const touchStartRef = useRef(null);
      const SWIPE_MIN_DISTANCE = 60;
      const handleContentTouchStart = (e) => {
        // 사진 미리보기/그래프처럼 자체적으로 가로 스크롤되는 영역에서 시작된 터치는 날짜 스와이프로 취급하지 않음
        if (e.target.closest && e.target.closest('.overflow-x-auto')) { touchStartRef.current = null; return; }
        const t = e.touches[0];
        touchStartRef.current = { x: t.clientX, y: t.clientY };
      };
      const handleContentTouchEnd = (e) => {
        if (!touchStartRef.current) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartRef.current.x;
        const dy = t.clientY - touchStartRef.current.y;
        touchStartRef.current = null;
        if (Math.abs(dx) < SWIPE_MIN_DISTANCE) return; // 너무 짧은 움직임은 무시
        if (Math.abs(dx) < Math.abs(dy) * 1.5) return; // 세로 스크롤과 헷갈리는 대각선 움직임은 무시
        if (dx < 0) changeDate(1); // 왼쪽으로 스와이프 -> 다음날/다음주/다음달
        else changeDate(-1); // 오른쪽으로 스와이프 -> 전날/전주/전달
      };

      // ★ AI 호출 취소/지연 안내용 — 진행 중인 fetch를 중단할 수 있는 컨트롤러와, 로딩이 시작된 이후 경과 초
      const abortControllerRef = useRef(null);
      const [loadingElapsed, setLoadingElapsed] = useState(0);

      const [statsMode, setStatsMode] = useState('week');
      const [aiReport, setAiReport] = useState("");
      const [isGeneratingReport, setIsGeneratingReport] = useState(false);

      const [dailyReport, setDailyReport] = useState(null);
      const [isGeneratingDaily, setIsGeneratingDaily] = useState(false);

      // ★ 설정에 적은 기저질환마다 최근 60일 생활습관 분석 이력을 별도로 보관
      const [conditionReports, setConditionReports] = useState([]);
      const [selectedCondition, setSelectedCondition] = useState('');
      const [isGeneratingConditionReport, setIsGeneratingConditionReport] = useState(false);
      const conditionLabels = parseProfileConditions(profile?.disease || '');

      const [authMode, setAuthMode] = useState('login');
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [accountError, setAccountError] = useState('');
      const [accountSaving, setAccountSaving] = useState(false);
      const [isExporting, setIsExporting] = useState(false);

      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [memberList, setMemberList] = useState([]);
      const [isLoadingMembers, setIsLoadingMembers] = useState(false);
      const [memberActionId, setMemberActionId] = useState(null);
      const [deleteMemberConfirmId, setDeleteMemberConfirmId] = useState(null);

      const [draft, setDraft] = useState({
        isOpen: false, isEditMode: false, editLogId: null, editDate: '', editTime: '',
        type: '', data: [], naturalText: '', memo: '', category: '점심식사', isCamera: false,
        bp_sys: '', bp_dia: '', pulse: '', sugar: '', weight: '', sleep_hours: '', existingFoodName: '', existingIngredients: []
      });

      // ★ 자주 먹는 음식 (최근 30일 기록 기준 빈도순, 입력창 위 칩으로 표시)
      const [frequentFoods, setFrequentFoods] = useState([]);

      // ★ 목표 달성 현황용 가장 최근 생체 수치
      const [latestBiometrics, setLatestBiometrics] = useState(null);
      const naturalTextRef = useRef(null);

      const wakeLockRef = useRef(null);

      useEffect(() => {
        if (draft.isOpen || feedbackPopupLog || isPeriodGoalOpen) document.body.style.overflow = 'hidden';
        else document.body.style.overflow = 'unset';
        return () => { document.body.style.overflow = 'unset'; };
      }, [draft.isOpen, feedbackPopupLog, isPeriodGoalOpen]);

      const handleInputBlur = () => {
        setTimeout(() => window.scrollTo(window.scrollX, window.scrollY), 10);
      };

      useEffect(() => {
        const requestWakeLock = async () => {
          try { if ('wakeLock' in navigator) wakeLockRef.current = await navigator.wakeLock.request('screen'); }
          catch (err) { }
        };
        const releaseWakeLock = async () => {
          if (wakeLockRef.current !== null) { await wakeLockRef.current.release(); wakeLockRef.current = null; }
        };
        if (isAnalyzing || reanalyzingId || isGeneratingReport || isGeneratingDaily || isGeneratingConditionReport || isCompressing) requestWakeLock();
        else releaseWakeLock();
      }, [isAnalyzing, reanalyzingId, isGeneratingReport, isGeneratingDaily, isGeneratingConditionReport, isCompressing]);

      // ★ AI 응답 대기 시간 카운트 — 30초 넘게 걸리면 로딩 화면에 "계속 기다리기/취소" 안내를 띄우기 위함
      useEffect(() => {
        const isAiLoading = isAnalyzing || !!reanalyzingId || isGeneratingReport || isGeneratingDaily || isGeneratingConditionReport;
        if (!isAiLoading) { setLoadingElapsed(0); return; }
        setLoadingElapsed(0);
        const timer = setInterval(() => setLoadingElapsed(prev => prev + 1), 1000);
        return () => clearInterval(timer);
      }, [isAnalyzing, reanalyzingId, isGeneratingReport, isGeneratingDaily, isGeneratingConditionReport]);

      // ★ 로그인 세션 확인 + 유지 (한 번 로그인하면 계속 로그인 상태 유지)
      useEffect(() => {
        sb.auth.getSession().then(({ data }) => setSession(data.session));
        const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
        return () => sub.subscription.unsubscribe();
      }, []);

      // ★ 세션이 있으면 profiles 테이블에서 내 프로필 로드 (기존 localStorage 'dietProfile' 대체)
      useEffect(() => {
        if (!session) { setProfile(null); return; }
        withAuthRetry(() => sb.from('profiles').select('*').eq('id', session.user.id).single()).then(({ data, error }) => {
          if (!error && data) {
            setProfile({
              username: data.username, height: data.height, weight: data.weight, age: data.age,
              gender: data.gender, disease: data.disease || '', aiMode: data.ai_mode || 'normal',
              isApproved: !!data.is_approved, isAdmin: !!data.is_admin,
              goalExerciseWeekly: data.goal_exercise_weekly, goalAlcoholFreeWeekly: data.goal_alcohol_free_weekly,
              goalWeightKg: data.goal_weight_kg, goalBpSysMax: data.goal_bp_sys_max, goalBpDiaMax: data.goal_bp_dia_max,
              goalSugarMax: data.goal_sugar_max
            });
          }
        });
      }, [session]);

      // ★ 자주 먹는 음식 계산 (최근 30일, 운동/생체기록 제외, 빈도순 상위 20개)
      // food_name은 AI가 매번 새로 지어내는 "메인 타이틀"이라 그대로 쓰면 안 되고,
      // 실제 개별 음식명은 ingredients 배열에 "음식명(재료들)" 형태로 들어있어 그 앞부분만 추출한다.
      const fetchFrequentFoods = async () => {
        const since = new Date(); since.setDate(since.getDate() - 30);
        const { data, error } = await sb.from('logs').select('ingredients, category').gte('log_date', formatDate(since));
        if (error || !data) return;
        const counts = {};
        data.forEach(row => {
          if (row.category === '운동' || row.category === '생체기록') return;
          (row.ingredients || []).forEach(item => {
            const raw = String(item || '');
            const name = (raw.includes('(') ? raw.slice(0, raw.indexOf('(')) : raw).trim();
            if (!name) return;
            counts[name] = (counts[name] || 0) + 1;
          });
        });
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([name]) => name);
        setFrequentFoods(sorted);
      };

      useEffect(() => {
        if (!session) { setFrequentFoods([]); return; }
        fetchFrequentFoods();
      }, [session]);

      // ★ 목표 달성 현황 계산용 데이터 (가장 최근 생체 수치)
      const fetchGoalStats = async () => {
        const rows = [];
        for (let offset = 0; offset < 100000; offset += 1000) {
          const { data, error } = await sb.from('logs').select('log_date, log_time, raw_input')
            .eq('category', '생체기록').order('log_date', { ascending: false }).order('log_time', { ascending: false })
            .range(offset, offset + 999);
          if (error || !data?.length) break;
          rows.push(...data);
          const latest = buildLatestBiometrics(rows);
          if (['bp_sys', 'bp_dia', 'sugar', 'weight'].every(field => latest?.[field] !== undefined) || data.length < 1000) break;
        }
        setLatestBiometrics(buildLatestBiometrics(rows));
      };

      useEffect(() => {
        if (!session) { setLatestBiometrics(null); return; }
        fetchGoalStats();
      }, [session]);

      // ★ 자주 먹는 음식 칩을 탭하면 입력창 끝에 이름만 삽입 (수량은 직접 이어서 입력)
      const insertFrequentFood = (name) => {
        setDraft(prev => {
          const trimmed = (prev.naturalText || '').trimEnd();
          const needsComma = trimmed.length > 0;
          const next = needsComma ? `${trimmed}, ${name} ` : `${name} `;
          return { ...prev, naturalText: next };
        });
        setTimeout(() => {
          if (naturalTextRef.current) {
            naturalTextRef.current.focus();
            const len = naturalTextRef.current.value.length;
            naturalTextRef.current.setSelectionRange(len, len);
          }
        }, 0);
      };

      useEffect(() => {
        if (!session) return;
        if (activeTab === 'home') {
          fetchLogs(currentDate);
        } else if (activeTab === 'stats') {
          const range = statsMode === 'week' ? getWeekRange(currentDate) : getMonthRange(currentDate);
          setActiveRange(range);
          fetchPeriodLogs(range.start, range.end);
          fetchPeriodGoal(range, statsMode);
        }
      }, [currentDate, activeTab, session, statsMode]);

      const fetchConditionReports = async () => {
        if (!session) return;
        const { data, error } = await withAuthRetry(() =>
          sb.from('condition_reports').select('*').order('created_at', { ascending: false }).limit(50)
        );
        if (error) return reportFatalError(error);
        setConditionReports((data || []).map(mapConditionReport));
      };

      useEffect(() => {
        if (!conditionLabels.length) {
          setSelectedCondition('');
          setConditionReports([]);
          return;
        }
        if (!conditionLabels.includes(selectedCondition)) setSelectedCondition(conditionLabels[0]);
        if (session && activeTab === 'stats') fetchConditionReports();
      }, [session, activeTab, profile?.disease]);

      const fetchMealStatuses = async (date) => {
        const { data, error } = await withAuthRetry(() =>
          sb.from('meal_statuses').select('meal_slot, status').eq('status_date', date)
        );
        if (error) throw error;
        setMealStatuses(Object.fromEntries((data || []).map(row => [row.meal_slot, row.status])));
      };

      const fetchLogs = async (date) => {
        setIsFetching(true); setDailyReport(null);
        setMealStatuses({});
        const [{ data, error }, statusResult] = await Promise.all([
          withAuthRetry(() => sb.from('logs').select('*, food_health_tags(food_index,food_name,tag_key,tag_label,disease_key,polarity,confidence,evidence)').eq('log_date', date).order('log_time', { ascending: false })),
          fetchMealStatuses(date).then(() => null).catch(error => error),
        ]);
        if (error) reportFatalError(error); else setLogs((data || []).map(mapLogRow));
        if (statusResult) reportFatalError(statusResult);
        setIsFetching(false);
        const { data: dr } = await sb.from('daily_reports').select('*').eq('report_date', date).maybeSingle();
        if (dr) setDailyReport({ grade: dr.grade, comment: dr.comment });
      };

      const toggleMealSkipped = async (slotKey) => {
        if (!session || mealStatusSaving) return;
        const previous = { ...mealStatuses };
        const shouldClear = mealStatuses[slotKey] === 'skipped';
        setMealStatusSaving(slotKey);
        setMealStatuses(current => {
          const next = { ...current };
          if (shouldClear) delete next[slotKey]; else next[slotKey] = 'skipped';
          return next;
        });
        try {
          const query = shouldClear
            ? sb.from('meal_statuses').delete().eq('user_id', session.user.id).eq('status_date', currentDate).eq('meal_slot', slotKey)
            : sb.from('meal_statuses').upsert({
                user_id: session.user.id, status_date: currentDate, meal_slot: slotKey,
                status: 'skipped', confirmed_at: new Date().toISOString(), updated_at: new Date().toISOString(),
              }, { onConflict: 'user_id,status_date,meal_slot' });
          const { error } = await query;
          if (error) throw error;
          showNotice(shouldClear ? '미기록 상태로 되돌렸습니다.' : '안 먹음으로 기록했습니다.');
        } catch (error) {
          setMealStatuses(previous);
          reportFatalError(error);
        } finally {
          setMealStatusSaving(null);
        }
      };

      const clearMealStatusForCategory = async (category, date) => {
        const slotKey = mealSlotByCategory[category];
        if (!slotKey || !session) return;
        const { error } = await sb.from('meal_statuses').delete()
          .eq('user_id', session.user.id).eq('status_date', date).eq('meal_slot', slotKey);
        if (error) throw error;
        if (date === currentDate) setMealStatuses(current => {
          const next = { ...current }; delete next[slotKey]; return next;
        });
      };

      const fetchPeriodLogs = async (startStr, endStr) => {
        setIsFetching(true); setAiReport("");
        const { data, error } = await withAuthRetry(() =>
          sb.from('logs').select('*, food_health_tags(food_index,food_name,tag_key,tag_label,disease_key,polarity,confidence,evidence)').gte('log_date', startStr).lte('log_date', endStr).order('log_date', { ascending: false }).order('log_time', { ascending: false })
        );
        if (error) reportFatalError(error); else setPeriodLogs((data || []).map(mapLogRow));
        setIsFetching(false);
        const { data: pr } = await sb.from('period_reports').select('*').eq('period_start', startStr).eq('is_month', statsMode === 'month').maybeSingle();
        if (pr) setAiReport(pr.report_text);
        const { data: grades } = await sb.from('daily_reports').select('report_date, grade').gte('report_date', startStr).lte('report_date', endStr).order('report_date', { ascending: true });
        setPeriodGrades(grades || []);
      };

      const fetchPeriodGoal = async (range, mode) => {
        if (!session || !range?.start) return;
        setPeriodGoalLoading(true);
        const { data, error } = await withAuthRetry(() => sb.from('period_goals').select('*')
          .eq('period_type', mode).eq('period_start', range.start).maybeSingle());
        if (error) {
          reportFatalError(error);
          setPeriodGoal(null);
        } else {
          setPeriodGoal(data || null);
          const key = `${mode}:${range.start}`;
          const today = formatDate(new Date());
          const isCurrentPeriod = today >= range.start && today <= range.end;
          if (!data && isCurrentPeriod && !periodGoalPromptedRef.current.has(key)) {
            periodGoalPromptedRef.current.add(key);
            setIsPeriodGoalOpen(true);
          }
        }
        setPeriodGoalLoading(false);
      };

      const periodGoalDefaults = () => {
        const days = activeRange.start && activeRange.end
          ? Math.round((parseDate(activeRange.end) - parseDate(activeRange.start)) / 86400000) + 1 : 7;
        const monthlyFactor = statsMode === 'month' ? days / 7 : 1;
        return {
          exercise_target: profile?.goalExerciseWeekly ? Math.round(profile.goalExerciseWeekly * monthlyFactor) : '',
          alcohol_free_target: profile?.goalAlcoholFreeWeekly ? Math.min(days, Math.round(profile.goalAlcoholFreeWeekly * monthlyFactor)) : '',
          weight_target: profile?.goalWeightKg || '',
          bp_sys_target: profile?.goalBpSysMax || '',
          bp_dia_target: profile?.goalBpDiaMax || '',
          sugar_target: profile?.goalSugarMax || '',
        };
      };

      const savePeriodGoal = async (event) => {
        event.preventDefault();
        if (!session || periodGoalSaving) return;
        const form = new FormData(event.currentTarget);
        const numberOrNull = (name) => {
          const value = String(form.get(name) || '').trim();
          return value === '' ? null : Number(value);
        };
        const payload = {
          user_id: session.user.id, period_type: statsMode, period_start: activeRange.start,
          period_end: activeRange.end, status: 'active',
          exercise_target: numberOrNull('exerciseTarget'),
          alcohol_free_target: numberOrNull('alcoholFreeTarget'),
          weight_target: numberOrNull('weightTarget'),
          bp_sys_target: numberOrNull('bpSysTarget'),
          bp_dia_target: numberOrNull('bpDiaTarget'),
          sugar_target: numberOrNull('sugarTarget'),
          updated_at: new Date().toISOString(),
        };
        const values = [payload.exercise_target, payload.alcohol_free_target, payload.weight_target, payload.bp_sys_target, payload.bp_dia_target, payload.sugar_target];
        if (values.every(value => value === null)) {
          setSysError('목표를 하나 이상 입력하거나 설정 안 함을 선택해주세요.');
          return;
        }
        const periodDays = Math.round((parseDate(activeRange.end) - parseDate(activeRange.start)) / 86400000) + 1;
        if (payload.alcohol_free_target !== null && (!Number.isInteger(payload.alcohol_free_target) || payload.alcohol_free_target < 0 || payload.alcohol_free_target > periodDays)) {
          setSysError(`금주 목표는 0~${periodDays}일의 정수로 입력해주세요.`); return;
        }
        if (payload.exercise_target !== null && (!Number.isInteger(payload.exercise_target) || payload.exercise_target < 0 || payload.exercise_target > 200)) {
          setSysError('운동 목표는 0~200회의 정수로 입력해주세요.'); return;
        }
        setPeriodGoalSaving(true);
        const { data, error } = await sb.from('period_goals').upsert(payload, { onConflict: 'user_id,period_type,period_start' }).select().single();
        setPeriodGoalSaving(false);
        if (error) return reportFatalError(error);
        setPeriodGoal(data); setIsPeriodGoalOpen(false); showNotice(`${statsMode === 'month' ? '월간' : '주간'} 목표를 저장했습니다.`);
      };

      const skipPeriodGoal = async () => {
        if (!session || periodGoalSaving) return;
        setPeriodGoalSaving(true);
        const payload = {
          user_id: session.user.id, period_type: statsMode, period_start: activeRange.start,
          period_end: activeRange.end, status: 'skipped', exercise_target: null,
          alcohol_free_target: null, weight_target: null, bp_sys_target: null,
          bp_dia_target: null, sugar_target: null, updated_at: new Date().toISOString(),
        };
        const { data, error } = await sb.from('period_goals').upsert(payload, { onConflict: 'user_id,period_type,period_start' }).select().single();
        setPeriodGoalSaving(false);
        if (error) return reportFatalError(error);
        setPeriodGoal(data); setIsPeriodGoalOpen(false); showNotice('이 기간은 목표를 설정하지 않기로 저장했습니다.');
      };

      const changeDate = (direction) => {
        const d = parseDate(currentDate);
        if (activeTab === 'home') {
          d.setDate(d.getDate() + direction);
        } else if (activeTab === 'stats') {
          if (statsMode === 'week') d.setDate(d.getDate() + (direction * 7));
          else if (statsMode === 'month') d.setMonth(d.getMonth() + direction);
        }
        setCurrentDate(formatDate(d));
      };

      const handleDatePick = (e) => {
        if (!e.target.value) return;
        let val = e.target.value;
        if (val.includes('-W')) {
          const [year, week] = val.split('-W');
          const d = new Date(Date.UTC(year, 0, 1 + (Number(week) - 1) * 7));
          setCurrentDate(d.toISOString().split('T')[0]);
        } else if (activeTab === 'stats' && statsMode === 'month') {
          setCurrentDate(val + '-01');
        } else {
          setCurrentDate(val);
        }
      };

      // ★ 짧게 떴다 사라지는 성공 안내 배너
      const showNotice = (msg) => {
        setSysNotice(msg);
        setTimeout(() => setSysNotice(""), 2500);

          </div>

          {isPeriodGoalOpen && activeRange.start && (
            <div className="fixed inset-0 z-[118] bg-black/55 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setIsPeriodGoalOpen(false)} data-period-goal-modal>
              <div key={`${statsMode}-${activeRange.start}-${periodGoal?.updated_at || 'new'}`} className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[88vh] overflow-y-auto no-scrollbar p-5 pb-safe" onClick={(event) => event.stopPropagation()}>
                <div className="flex items-start justify-between gap-3 mb-4">
                  <div>
                    <p className="text-xs font-bold text-blue-600 mb-1">🎯 {statsMode === 'month' ? '월간' : '주간'} 목표 설정</p>
                    <h2 className="text-lg font-bold text-gray-900 break-keep">{activeRange.label}</h2>
                    <p className="text-xs text-gray-500 mt-1 leading-relaxed">설정의 기본 목표를 불러왔습니다. 이번 기간에 맞게 바꿀 수 있어요.</p>
                  </div>
                  <button type="button" aria-label="목표 설정 닫기" onClick={() => setIsPeriodGoalOpen(false)} className="w-9 h-9 shrink-0 rounded-full bg-gray-100 text-gray-500 font-bold">✕</button>
                </div>

                <form onSubmit={savePeriodGoal} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <label className="block min-w-0">
                      <span className="text-xs font-bold text-gray-600 block mb-1.5">운동 목표(회)</span>
                      <input name="exerciseTarget" type="number" min="0" max="200" step="1" defaultValue={displayedPeriodGoalDefaults.exercise_target ?? ''} placeholder="예: 3" className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                    </label>
                    <label className="block min-w-0">
                      <span className="text-xs font-bold text-gray-600 block mb-1.5">금주 목표(일)</span>
                      <input name="alcoholFreeTarget" type="number" min="0" max={periodDaysCount} step="1" defaultValue={displayedPeriodGoalDefaults.alcohol_free_target ?? ''} placeholder={`0~${periodDaysCount}`} className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                    </label>
                    <label className="block min-w-0">
                      <span className="text-xs font-bold text-gray-600 block mb-1.5">목표 체중(kg)</span>
                      <input name="weightTarget" type="number" min="20" max="400" step="0.1" defaultValue={displayedPeriodGoalDefaults.weight_target ?? ''} placeholder="예: 72" className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                    </label>
                    <label className="block min-w-0">
                      <span className="text-xs font-bold text-gray-600 block mb-1.5">공복혈당 상한</span>
                      <input name="sugarTarget" type="number" min="40" max="500" step="1" defaultValue={displayedPeriodGoalDefaults.sugar_target ?? ''} placeholder="예: 100" className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                    </label>
                    <label className="block min-w-0">
                      <span className="text-xs font-bold text-gray-600 block mb-1.5">수축기 혈압 상한</span>
                      <input name="bpSysTarget" type="number" min="60" max="300" step="1" defaultValue={displayedPeriodGoalDefaults.bp_sys_target ?? ''} placeholder="예: 120" className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                    </label>
                    <label className="block min-w-0">
                      <span className="text-xs font-bold text-gray-600 block mb-1.5">이완기 혈압 상한</span>
                      <input name="bpDiaTarget" type="number" min="30" max="200" step="1" defaultValue={displayedPeriodGoalDefaults.bp_dia_target ?? ''} placeholder="예: 80" className="w-full border p-3 rounded-xl bg-gray-50 outline-none text-sm" />
                    </label>
                  </div>
                  <p className="text-[11px] text-gray-400 leading-relaxed">빈 항목은 이번 기간의 목표에서 제외됩니다. `설정 안 함`을 저장하면 이 기간에는 다시 묻지 않습니다.</p>
                  <div className="grid grid-cols-2 gap-2">
                    <button type="button" onClick={skipPeriodGoal} disabled={periodGoalSaving} className="w-full bg-gray-100 text-gray-600 font-bold py-3.5 rounded-xl disabled:opacity-60">설정 안 함</button>
                    <button type="submit" disabled={periodGoalSaving} className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl disabled:opacity-60">{periodGoalSaving ? '저장 중...' : '목표 저장'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {sysError && (
             <div className="fixed top-5 left-5 right-5 bg-red-600 text-white p-4 rounded-2xl shadow-xl z-[100] flex justify-between items-center">
               <span className="text-sm font-medium">{sysError}</span>
               <button onClick={()=>setSysError("")} className="ml-4 font-bold text-lg">✕</button>
             </div>
          )}

          {sysNotice && (
             <div className="fixed top-5 left-5 right-5 bg-green-600 text-white p-4 rounded-2xl shadow-xl z-[100] flex justify-between items-center animate-fade-in">
               <span className="text-sm font-medium">{sysNotice}</span>
               <button onClick={()=>setSysNotice("")} className="ml-4 font-bold text-lg">✕</button>
             </div>
          )}

          {isCompressing && (
            <div className="fixed inset-0 z-[100] bg-black/60 flex flex-col items-center justify-center text-white">
              <div className="loader border-4 border-white border-t-transparent w-12 h-12 mb-4"></div>
              <p className="font-bold">사진 최적화 중...</p>
            </div>
          )}

          {/* ★ 타임라인/업로드 미리보기 사진을 탭했을 때 원본 크기로 보여주는 라이트박스 */}
          {lightboxImage && (
            <div
              className="fixed inset-0 z-[120] bg-black/90 flex items-center justify-center p-4"
              onClick={() => setLightboxImage(null)}
            >
              <button
                type="button"
                onClick={() => setLightboxImage(null)}
                className="absolute top-5 right-5 text-white bg-white/10 hover:bg-white/20 w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold"
              >
                ✕
              </button>
              <img
                src={lightboxImage}
                onClick={(e) => e.stopPropagation()}
                className="max-w-full max-h-full object-contain rounded-xl"
              />
            </div>
          )}

          {/* ★ 기록을 저장하거나 수정한 직후 보여주는 AI 피드백 팝업 */}
          {feedbackPopupLog && (
            <div
              className="fixed inset-0 z-[115] bg-black/55 flex items-end sm:items-center justify-center p-0 sm:p-4"
              onClick={() => setFeedbackPopupLog(null)}
              data-feedback-popup
            >
              <div
                className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[82vh] overflow-y-auto no-scrollbar p-5 pb-safe"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-start justify-between gap-3 mb-4">
                  <div className="min-w-0">
                    <p className="text-xs font-bold text-blue-600 mb-1 whitespace-nowrap">✨ 방금 기록한 내용의 AI 피드백</p>
                    <h2 className="text-lg font-bold text-gray-900 leading-snug break-keep">{feedbackPopupLog.foodName}</h2>
                    <p className="text-xs text-gray-400 mt-1 whitespace-nowrap">{feedbackPopupLog.category} · {getRecordTimeLabel(feedbackPopupLog.category)} {feedbackPopupLog.time}</p>
                  </div>
                  <button
                    type="button"
                    aria-label="피드백 닫기"
                    onClick={() => setFeedbackPopupLog(null)}
                    className="w-9 h-9 shrink-0 rounded-full bg-gray-100 text-gray-500 font-bold"
                  >✕</button>
                </div>

                {feedbackPopupLog.healthTags?.length > 0 && (
                  <div className="space-y-2 mb-4" data-feedback-health-tags>
                    {feedbackPopupLog.healthTags.slice(0, 2).map((tag, index) => (
                      <div
                        key={`${tag.tagKey}-${index}`}
                        className={`w-full text-sm font-bold px-3 py-2.5 rounded-xl border leading-snug ${tag.polarity === 'helpful' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-amber-50 border-amber-200 text-amber-800'}`}
                      >
                        {tag.polarity === 'helpful' ? '✓' : '!'} {tag.tagLabel}{tag.foodName ? ` · ${tag.foodName}` : ''}
                      </div>
                    ))}
                  </div>
                )}

                <div className="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-4">
                  <p className="text-sm text-blue-900 leading-relaxed whitespace-pre-wrap break-keep">{feedbackPopupLog.analysis}</p>
                </div>

                <button
                  type="button"
                  onClick={() => setFeedbackPopupLog(null)}
                  className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl active:scale-[0.99] transition"
                >확인</button>
              </div>
            </div>
          )}

          {(isAnalyzing || reanalyzingId || isGeneratingReport || isGeneratingDaily || isGeneratingConditionReport) && (
            <div className="fixed inset-0 z-[100] bg-black/70 flex flex-col items-center justify-center text-white backdrop-blur-sm touch-none px-6">
              <div className="loader border-4 border-white border-t-transparent w-16 h-16 mb-6"></div>
              <p className="text-xl font-bold animate-pulse text-center">
                {isGeneratingReport ? '🤖 AI가 거시적 데이터를 분석 중입니다...' :
                 isGeneratingDaily ? '🤖 AI가 하루 총평을 작성 중입니다...' :
                 isGeneratingConditionReport ? '🧭 최근 2개월 생활습관을 분석 중입니다...' :
                 '🤖 AI가 꼼꼼하게 분석 중입니다...'}
              </p>
              {loadingElapsed < 30 ? (
                <p className="text-sm mt-2 text-gray-300">화면을 끄지 말고 잠시만 기다려주세요</p>
              ) : (
                <div className="mt-5 flex flex-col items-center gap-3">
                  <p className="text-sm text-yellow-300 text-center leading-relaxed">시간이 오래 걸리고 있어요.<br/>계속 기다리거나 취소할 수 있어요.</p>
                  <button type="button" onClick={handleCancelLoading} className="bg-white/10 border border-white/40 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-white/20 active:scale-95 transition">취소하기</button>
                </div>
              )}
            </div>
          )}

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-2 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-40">
            <div className="max-w-lg mx-auto flex justify-between items-center relative">
              <button onClick={() => { if(activeTab === 'home') setCurrentDate(formatDate(new Date())); else setActiveTab('home'); }} className={`flex flex-col items-center p-2 flex-1 transition ${activeTab === 'home' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
                <span className="text-2xl mb-1">🏠</span>
                <span className="text-xs font-bold">홈</span>
              </button>
              <div className="flex-1 flex justify-center relative">
                <button onClick={() => setIsMenuOpen(!isMenuOpen)} className={`absolute -top-8 w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center text-3xl transition-transform ${isMenuOpen ? 'rotate-45 bg-gray-700' : 'hover:scale-105 active:scale-95'}`}>+</button>
              </div>
              <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center p-2 flex-1 transition ${activeTab === 'stats' ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
                <span className="text-2xl mb-1">📊</span>
                <span className="text-xs font-bold">통계</span>
              </button>
            </div>
          </div>

          {isMenuOpen && (
            <>
              <div className="fixed inset-0 bg-black/20 z-30" onClick={() => setIsMenuOpen(false)}></div>
              <div className="fixed bottom-24 left-1/2 -translate-x-1/2 flex flex-col gap-3 z-40 animate-fade-in-up w-64">
                <button onClick={openBiometricsDraft} className="flex justify-center items-center gap-3 bg-red-50 text-red-600 px-5 py-3 rounded-full shadow-xl border border-red-200 font-bold whitespace-nowrap hover:bg-red-100 transition">
                  <span>🩺 생체 수치 직접 입력</span>
                </button>
                <button onClick={openTextDraft} className="flex justify-center items-center gap-3 bg-white px-5 py-3 rounded-full shadow-xl border border-gray-100 text-gray-700 font-bold whitespace-nowrap hover:bg-gray-50 transition">
                  <span>✍️ 식단/운동 한 줄 기록</span>
                </button>
                <label className="flex justify-center items-center gap-3 bg-white px-5 py-3 rounded-full shadow-xl border border-gray-100 text-gray-700 font-bold whitespace-nowrap cursor-pointer hover:bg-gray-50 transition">
                  <span>🖼️ 갤러리 (최대 5장)</span>
                  <input type="file" accept="image/*" multiple className="hidden" onChange={(e) => handleFileSelect(e, false)} />
                </label>
                <label className="flex justify-center items-center gap-3 bg-blue-600 text-white px-5 py-3 rounded-full shadow-xl border border-blue-500 font-bold whitespace-nowrap cursor-pointer hover:bg-blue-700 transition">
                  <span>📷 지금 촬영 (AI 분석)</span>
                  <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleFileSelect(e, true)} />
                </label>
              </div>
            </>
          )}

          {draft.isOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 touch-none">
              <form onSubmit={(e) => { e.preventDefault(); handleUploadConfirm(); }} className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar pointer-events-auto">
                <h2 className="text-xl font-bold text-gray-800 mb-5">
                  {draft.isEditMode ? '✏️ 기록 수정' : (draft.type === 'biometrics' ? '🩺 생체 기록' : (draft.type === 'image' ? '📸 사진 기록' : '✍️ 한 줄 기록'))}
                </h2>

                <div className="mb-6 flex gap-3">
                  <div className="flex-1">
                    <label className="text-sm font-bold text-gray-600 mb-2 block">날짜 지정</label>
                    <input type="date" value={draft.editDate} onClick={openDateTimePicker} onChange={e => setDraft({...draft, editDate: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 text-sm" />
                  </div>
                  <div className="flex-1">
                    <label className="text-sm font-bold text-gray-600 mb-2 block">시간 지정</label>
                    {draft.isCamera && !draft.isEditMode ? (
                      <div className="w-full bg-gray-100 border border-gray-200 rounded-xl p-3 text-gray-500 font-medium text-center text-sm cursor-not-allowed">{draft.editTime} (자동)</div>
                    ) : (
                      <input type="time" value={draft.editTime} onClick={openDateTimePicker} onChange={e => setDraft({...draft, editTime: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 text-sm" />
                    )}
                  </div>
                </div>

                {draft.type !== 'biometrics' && (
                  <div className="mb-6">
                    <label className="text-sm font-bold text-gray-600 mb-2 block">무엇을 하셨나요?</label>
                    <div className="flex flex-wrap gap-2">
                      {defaultCategories.filter(c => c !== '생체기록').map(cat => (
                        <button type="button" key={cat} onClick={() => setDraft({...draft, category: cat})} className={`px-4 py-2 rounded-full text-sm font-bold transition ${draft.category === cat ? (cat === '운동' ? 'bg-green-500 text-white' : 'bg-blue-600 text-white') : 'bg-gray-100 text-gray-600'}`}>
                          {cat === '운동' ? '🏃‍♂️ ' : ''}{cat}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {draft.type === 'biometrics' && (
                  <div className="mb-6 space-y-4">
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">수축기 (최고혈압)</label>
                        <input type="number" placeholder="예: 120" value={draft.bp_sys} onChange={e => setDraft({...draft, bp_sys: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-red-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">이완기 (최저혈압)</label>
                        <input type="number" placeholder="예: 80" value={draft.bp_dia} onChange={e => setDraft({...draft, bp_dia: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-blue-500 text-base" />
                      </div>
                    </div>
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">맥박 (bpm)</label>
                        <input type="number" placeholder="예: 70" value={draft.pulse} onChange={e => setDraft({...draft, pulse: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-pink-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">공복 혈당 (mg/dL)</label>
                        <input type="number" placeholder="예: 95" value={draft.sugar} onChange={e => setDraft({...draft, sugar: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-green-500 text-base" />
                      </div>
                    </div>
                    <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">체중 (kg)</label>
                        <input type="number" step="0.1" placeholder="예: 68.5" value={draft.weight} onChange={e => setDraft({...draft, weight: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-purple-500 text-base" />
                      </div>
                      <div className="flex-1">
                        <label className="text-sm font-bold text-gray-600 mb-1 block">수면 시간 (시간)</label>
                        <input type="number" step="0.5" placeholder="예: 7" value={draft.sleep_hours} onChange={e => setDraft({...draft, sleep_hours: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-indigo-500 text-base" />
                      </div>
                    </div>
                  </div>
                )}

                {draft.type === 'image' && draft.data && draft.data.length > 0 && (
                  <div className="mb-5">
                    <div className="flex gap-2 mb-3 overflow-x-auto no-scrollbar">
                      {draft.data.map((src, i) => (
                        <img key={i} src={src} onClick={() => setLightboxImage(src)} className="w-32 h-32 object-cover rounded-2xl bg-gray-100 shrink-0 border border-gray-200 cursor-pointer active:opacity-80 transition" />
                      ))}
                    </div>
                    <input type="text" placeholder={draft.category === '운동' ? "추가 메모 (예: 스쿼트 50개 추가함)" : "추가 메모 (예: 밥은 반 공기만 먹음)"} value={draft.memo} onChange={e => setDraft({...draft, memo: e.target.value})} onBlur={handleInputBlur} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 outline-none focus:border-blue-500 text-sm" />
                  </div>
                )}

                {draft.type === 'text' && (
                  <div className="mb-5">
                    {draft.category !== '운동' && frequentFoods.length > 0 && (
                      <div className="mb-2.5">
                        <label className="text-xs font-bold text-gray-400 mb-1.5 block">🍽️ 자주 먹는 음식 (탭해서 추가, 양은 직접 입력)</label>
                        <div className="flex flex-wrap justify-center gap-1.5">
                          {frequentFoods.map(name => (
                            <button type="button" key={name} onClick={() => insertFrequentFood(name)}
                              className="shrink-0 whitespace-nowrap px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-600 border border-blue-100 hover:bg-blue-100 active:scale-95 transition">
                              {name}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                    <textarea
                      ref={naturalTextRef}
                      placeholder={draft.category === '운동' ? "예: 런닝머신 30분 뛰었어" : "예: 아침으로 사과 반 개 먹었어"}
                      value={draft.naturalText} onChange={e => setDraft({...draft, naturalText: e.target.value})} onBlur={handleInputBlur}
                      onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleUploadConfirm(); } }}
                      className="w-full bg-gray-50 border border-gray-200 p-4 rounded-2xl outline-none focus:border-blue-500 h-24 resize-none text-base leading-relaxed"
                    />
                  </div>
                )}

                <div className="flex gap-3">
                  <button type="button" onClick={() => { setDraft({isOpen: false}); nudgeViewportRepaint(); }} className="flex-1 py-4 rounded-xl font-bold bg-gray-100 text-gray-600">취소</button>
                  <button type="submit" className={`flex-1 py-4 rounded-xl font-bold text-white shadow-md ${draft.type === 'biometrics' ? 'bg-red-500' : (draft.category === '운동' ? 'bg-green-500' : 'bg-blue-600')}`}>
                    {draft.isEditMode ? '수정 및 코칭받기 🔄' : '기록 및 코칭받기 🚀'}
                  </button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
